<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MetalWar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D6DCE2; --panel:#EDF0F3; --panel-2:#E2E7EC; --line:#B9C3CC;
  --text:#1D2731; --muted:#5B6874;
  --amber:#C47B0E; --cyan:#0C8BA3; --rust:#B24A2C; --ok:#3F8A4E;
  --faction:#F2A93B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161D25; --panel:#202A34; --panel-2:#1A232C; --line:#34414E;
    --text:#E4DED1; --muted:#93A0AC;
    --amber:#F2A93B; --cyan:#5FD4E8; --rust:#E0694A; --ok:#7BC98A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161D25; --panel:#202A34; --panel-2:#1A232C; --line:#34414E;
  --text:#E4DED1; --muted:#93A0AC;
  --amber:#F2A93B; --cyan:#5FD4E8; --rust:#E0694A; --ok:#7BC98A;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.screen{flex:1;min-height:0;position:relative}
.screen[hidden]{display:none}

/* ---- игровой экран ---- */
.game{background:#141B22;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:8px;right:108px;top:8px;color:#E4DED1;pointer-events:none}
.hud-card{background:rgba(20,27,34,.82);border:1px solid #34414E;border-radius:12px;padding:7px 10px}
.hud-top{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.hud-top b{font:14px 'Russo One',sans-serif}
.hud-top .nm{overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:4px;background:#34414E;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;transition:width .2s}
.bar.hp i{background:#7BC98A}
.bar.cp{position:relative;height:9px;margin-top:5px}
.bar.cp i{background:linear-gradient(90deg,#C4901C,#F2C14B)}
.bar.cp span{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;font-weight:700;color:#1B232C;letter-spacing:.3px}
.cell,.slot .ic,.li .ic,.cslot{position:relative}
.enc{position:absolute;left:3px;top:2px;font:10px 'Russo One',sans-serif;font-style:normal;color:#F2C14B;text-shadow:0 1px 2px #000,0 0 3px #000;z-index:1}
/* заточка */
.enchbox{display:flex;flex-direction:column;align-items:center;gap:6px;background:radial-gradient(70% 90% at 50% 20%,rgba(242,193,75,.14),transparent 70%),var(--panel-2);border-radius:14px;padding:14px}
.ench-item{width:92px;height:92px;border-radius:16px;background:#141B22;border:2px solid;display:grid;place-items:center;position:relative}
.ench-item svg{width:70px;height:70px}
.ench-item .enc{font-size:14px;left:6px;top:4px}
.ench-item.flash{animation:encFlash .9s ease-out}
.ench-item.ok{box-shadow:0 0 0 3px #7BC98A,0 0 30px #7BC98A}
.ench-item.fail{box-shadow:0 0 0 3px #E0694A,0 0 30px #E0694A;animation:encShake .5s}
.ench-item.broken{opacity:.25;filter:grayscale(1)}
@keyframes encFlash{0%{filter:brightness(1)}40%{filter:brightness(2.4)}100%{filter:brightness(1)}}
@keyframes encShake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ench-lv{font:22px 'Russo One',sans-serif}
.ench-lv b{color:#F2C14B}
.ench-chance{font-size:14px}
.ench-chance b{font:18px 'Russo One',sans-serif}
.ench-stats{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:12px;width:100%}
.ench-stats div{background:var(--panel);border-radius:10px;padding:7px;text-align:center}
.ench-stats small{display:block;color:var(--muted);font-size:10px}
.sphs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sph{border:2px solid var(--line);background:var(--panel-2);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.sph[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.sph .sph-top{display:flex;align-items:center;gap:8px}
.sph svg{width:36px;height:36px}
.sph b{font-size:13px}
.sph small{font-size:11px;color:var(--muted);line-height:1.3}
.sph em{font-style:normal;font-size:12px;font-weight:700}
.ench-res{min-height:22px;text-align:center;font:15px 'Russo One',sans-serif}
.ench-table{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.ench-table div{background:var(--panel-2);border-radius:8px;padding:5px 2px;text-align:center;font-size:11px}
.ench-table div.cur{outline:2px solid #F2C14B}
.ench-table b{display:block;font-size:12px}.bar.xp{height:4px}.bar.xp i{background:#5FD4E8}
.bar.xp i.held{background:#F2C14B;animation:xpHeld 1.4s ease-in-out infinite}
@keyframes xpHeld{50%{opacity:.45}}
.hud-res{display:flex;gap:10px;font-size:12px;margin-top:5px;opacity:.9}
.side{position:absolute;left:8px;top:calc(var(--hb, 120px) + 6px);display:flex;flex-direction:column;gap:6px}
.side button{background:rgba(20,27,34,.82);border:1px solid #34414E;color:#E4DED1;border-radius:10px;padding:6px 10px;font-size:12px;text-align:left}
.side .pk-btn{border-color:#6A3A3A;color:#E08A7A;font-weight:600}
.side .pk-btn[aria-pressed="true"]{background:rgba(120,24,24,.9);border-color:#FF5A4A;color:#fff;box-shadow:0 0 10px rgba(255,70,50,.55)}
.side .pk-btn[hidden]{display:none}
.loc-name{position:absolute;right:8px;top:103px;width:96px;text-align:center;color:#E4DED1;font-size:11px;opacity:.8;pointer-events:none}
.zone-tag{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);color:#E4DED1;font:20px 'Russo One',sans-serif;opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 2px 8px #000;text-align:center;white-space:nowrap}
.zone-tag small{display:block;font:13px Rubik,sans-serif;opacity:.8}
.zone-tag.show{opacity:1}
.talk{position:absolute;left:calc(50% - 22px);top:calc(var(--hb, 120px) + 8px);transform:translateX(-50%);max-width:calc(100% - 214px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;border:1px solid var(--faction);background:rgba(20,27,34,.9);color:#E4DED1;border-radius:12px;padding:10px 18px;font:14px 'Russo One',sans-serif;box-shadow:0 0 18px rgba(242,169,59,.25);white-space:nowrap}
.talk[hidden]{display:none}
/* ---- джойстик: всегда на экране ---- */
.joy{position:absolute;left:14px;bottom:60px;width:calc(128px*var(--js,1));height:calc(128px*var(--js,1));opacity:var(--ja,.66);touch-action:none;z-index:2}
.joy-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(40,70,110,.25) 0 45%,rgba(20,40,70,.55) 70%,rgba(15,25,40,.35) 100%);border:2px solid rgba(110,170,230,.55);box-shadow:0 0 18px rgba(80,150,230,.35),inset 0 0 22px rgba(80,150,230,.25)}
.joy-ring::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px solid rgba(110,170,230,.3)}
.ja{position:absolute;width:0;height:0;border:8px solid transparent}
.ja.up{left:50%;top:6%;margin-left:-8px;border-bottom:11px solid rgba(160,200,240,.85);border-top:0}
.ja.dn{left:50%;bottom:6%;margin-left:-8px;border-top:11px solid rgba(160,200,240,.85);border-bottom:0}
.ja.lf{top:50%;left:6%;margin-top:-8px;border-right:11px solid rgba(160,200,240,.85);border-left:0}
.ja.rt{top:50%;right:6%;margin-top:-8px;border-left:11px solid rgba(160,200,240,.85);border-right:0}
.jd{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;background:rgba(110,170,230,.9);transform:rotate(var(--a)) translateY(calc(-60px*var(--js,1))) rotate(45deg)}
.joy-knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E6F2FF 0,#8BB8E8 22%,#3F72B5 60%,#1E3F6E 100%);border:2px solid rgba(200,225,255,.8);box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 14px rgba(90,160,240,.5);transition:transform .08s}
.joy.active .joy-knob{transition:none}
.emo-btn{position:absolute;left:14px;bottom:200px;width:46px;height:46px;border-radius:50%;border:2px solid #C9A36A;background:radial-gradient(circle at 40% 35%,#3A2E1C,#16120C);color:#F2C14B;display:grid;place-items:center;z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.emo-btn svg{width:26px;height:26px}
.skills{position:absolute;right:8px;bottom:12px;width:220px;height:236px}
.sk{position:absolute;border-radius:50%;border:2px solid rgba(228,222,209,.35);background:rgba(20,27,34,.75);color:#E4DED1;font:11px 'Russo One',sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none;padding:0}
.sk.main{right:0;bottom:0;width:90px;height:90px;border-color:var(--faction);font-size:13px}
.sk.c0{right:100px;bottom:0;width:56px;height:56px}
.sk.c1{right:94px;bottom:64px;width:56px;height:56px}
.sk.c2{right:54px;bottom:118px;width:56px;height:56px}
.sk.c3{right:0;bottom:128px;width:56px;height:56px}
.sk.mini{width:44px;height:44px;font-size:9px}
.sk.kit{right:164px;bottom:6px}
.sk.auto{right:66px;bottom:188px}
.sk.auto.locked{opacity:.55}
.sk.auto.locked::after{content:"🔒";position:absolute;right:-4px;top:-6px;font-size:11px;line-height:1;filter:drop-shadow(0 1px 1px #000)}
.sk svg{width:28px;height:28px;position:relative}
.sk.c0,.sk.c1,.sk.c2,.sk.c3{padding:0;border:0;background:none;overflow:visible;border-radius:14px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.sk .skart{position:absolute;inset:0;width:100%;height:100%}
.sk .cdc{position:absolute;inset:3px;border-radius:11px;background:conic-gradient(rgba(8,11,15,.74) calc(var(--p,0)*1%), transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font:18px 'Russo One',sans-serif;color:#fff;text-shadow:0 1px 4px #000,0 0 2px #000}
.sk.ready{animation:none}
.sk.pop{animation:skpop .45s ease-out}
@keyframes skpop{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.14);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}
.sk.c0:active,.sk.c1:active,.sk.c2:active,.sk.c3:active{transform:scale(.92)}
/* окно классов */
.clscard{border:2px solid var(--line);background:var(--panel-2);border-radius:16px;padding:14px;margin-bottom:12px}
.clshead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.clshead h3{margin:0;font:20px 'Russo One',sans-serif}
.clshead span{color:var(--muted);font-size:13px}
.cbar{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.cbar span{color:var(--muted);text-align:right}
.cbar i{height:8px;border-radius:4px;background:var(--panel);overflow:hidden}
.cbar i b{display:block;height:100%;border-radius:4px}
.cbar em{font-style:normal;font-weight:700}
.clsskills{display:grid;gap:8px;margin:12px 0}
.clsskill{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.clsskill .ic{width:54px;height:54px;flex:none}
.clsskill .ic svg{width:54px;height:54px}
.clsskill b{display:block;font-size:14px}
.clsskill small{display:block;color:var(--muted);font-size:13px}
.clsskill em{font-style:normal;font-size:12px;color:var(--cyan)}
.clsbtn{background:rgba(242,169,59,.14);border-color:rgba(242,169,59,.6);color:var(--amber);font-weight:700}
.clsbtn:disabled{opacity:.6;cursor:default}
.clsline{display:flex;align-items:center;gap:10px}
.clsline b{font:17px 'Russo One',sans-serif}
.clsline small{display:block;color:var(--muted);font-size:12px}
.clsline .act{margin-left:auto}
.sk .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;transform:scaleY(0)}
.sk span{position:relative;line-height:1.15;text-align:center}
.sk.on{background:var(--faction);color:#1B232C}
.death{position:absolute;inset:0;display:none;place-items:center;background:rgba(80,20,20,.5);color:#fff;font:22px 'Russo One',sans-serif;text-align:center;pointer-events:none}
.death.show{display:grid}
.fade{position:absolute;inset:0;background:#0E1318;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}

/* ---- нижнее меню ---- */
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);padding:6px 4px 8px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 10px;border-radius:8px}
.nav button[aria-current="page"]{color:var(--text)}
.nav button[aria-current="page"] svg{color:var(--faction)}
.nav svg{width:22px;height:22px}
.nav button{padding:4px 4px;min-width:0;flex:1}
.nav-ic{position:relative;display:block;line-height:0}
.nav-dot{position:absolute;top:-4px;right:-9px;min-width:15px;height:15px;border-radius:8px;background:#E0463A;color:#fff;font:9px/15px 'Russo One',sans-serif;font-style:normal;text-align:center;padding:0 3px}
.nav-dot[hidden]{display:none}
.qs:not([hidden]){display:flex;flex-direction:column}
.qs-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.qs-head svg{width:20px;height:20px;color:var(--muted)}
.qs-head h1{margin:0 0 0 auto;font:17px 'Russo One',sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.qs-tabs button[aria-selected="true"]{color:#F2C14B;border-bottom-color:#F2C14B}
.qs-dot{display:inline-block;min-width:15px;height:15px;border-radius:8px;background:#E0463A;color:#fff;font:9px/15px 'Russo One',sans-serif;font-style:normal;text-align:center;padding:0 3px;vertical-align:1px}
.qs-body{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px}
.qs-floor{font-size:12px;font-weight:600;color:var(--text);margin:10px 2px 8px}.qs-floor span{color:var(--muted);font-weight:400}
.qs-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.qs-card small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.qs-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qs-row b{font:600 14px Rubik,sans-serif;color:#C8D0D8;display:flex;align-items:center;gap:6px;min-width:0}
.qs-ic{font-style:normal;font-size:14px;width:16px;text-align:center;flex:none}
.qs-rew{font-size:11px;color:#F2A93B;white-space:nowrap;flex:none}
.qs-card.done .qs-ic{color:#7BC98A}.qs-card.done b{color:#9AA6B2}
.qs-card.on{border-color:#4E7FB0;background:linear-gradient(180deg,rgba(78,127,176,.22),var(--panel-2));box-shadow:0 0 0 1px rgba(78,127,176,.35) inset}
.qs-card.on b,.qs-card.on .qs-ic{color:#F2C14B}
.qs-card.lock{opacity:.42}
.qs-pr{display:flex;align-items:center;gap:8px;margin-top:6px}.qs-pr .vbar{flex:1;margin:0}.qs-pr em{font:12px 'Russo One',sans-serif;font-style:normal;color:var(--text)}
.qs-card.sp{border-color:#3E5A7A;background:linear-gradient(180deg,rgba(62,90,122,.25),var(--panel-2))}
.qs-card.sp b{color:#F2C14B}.qs-card.sp .qs-rew{color:#5FD4E8}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .qs-row b{color:#2A333C}:root:not([data-theme="dark"]) .qs-card.done b{color:#5A6570}:root:not([data-theme="dark"]) .qs-card.on b{color:#A8650F}:root:not([data-theme="dark"]) .qs-card.on .qs-ic{color:#A8650F}:root:not([data-theme="dark"]) .qs-card.sp b{color:#A8650F}:root:not([data-theme="dark"]) .qs-rew{color:#B86A12}:root:not([data-theme="dark"]) .qs-card.sp .qs-rew{color:#1C7F96}:root:not([data-theme="dark"]) .qs-tabs button[aria-selected="true"]{color:#A8650F;border-bottom-color:#D99A2B}}
:root[data-theme="light"] .qs-row b{color:#2A333C}:root[data-theme="light"] .qs-card.done b{color:#5A6570}:root[data-theme="light"] .qs-card.on b{color:#A8650F}:root[data-theme="light"] .qs-card.on .qs-ic{color:#A8650F}:root[data-theme="light"] .qs-card.sp b{color:#A8650F}:root[data-theme="light"] .qs-rew{color:#B86A12}:root[data-theme="light"] .qs-card.sp .qs-rew{color:#1C7F96}:root[data-theme="light"] .qs-tabs button[aria-selected="true"]{color:#A8650F;border-bottom-color:#D99A2B}
.qs-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qs-btns .qs-go{margin-top:9px}
.qs-go.alt{background:none;border:1px solid #D99A2B;color:#F2C14B;text-shadow:none}
.qs-go:disabled{opacity:.6}
.qs-ok{margin-top:8px;color:#7BC98A;font-size:13px;font-weight:600}
.qs-card.sp.done{opacity:.75}
.qs-go{display:block;width:100%;margin-top:9px;border:0;border-radius:8px;padding:9px;background:linear-gradient(180deg,#F2C14B,#D99A2B);color:#fff;font:600 13px Rubik,sans-serif;text-shadow:0 1px 1px rgba(0,0,0,.25)}

/* ---- окна ---- */
.sheet{position:fixed;inset:0;background:rgba(10,14,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.card{width:100%;max-width:520px;max-height:82%;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-head h2{margin:0;font:19px 'Russo One',sans-serif}
.card-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card-head .x{margin-left:auto;border:0;background:var(--panel-2);border-radius:10px;width:36px;height:36px;font-size:18px;flex:none}
.card-body{overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px;font-size:13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--faction);border-color:var(--faction);color:#1B232C}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px;font-size:13px}
.chips button[aria-pressed="true"]{border-color:var(--faction);color:var(--faction);font-weight:700}
.money{font-size:13px;color:var(--muted);margin-bottom:10px}
.money b{color:var(--text)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.li .ic{width:40px;height:40px;flex:none;border-radius:9px;background:#1B232C;display:grid;place-items:center}
.li .ic svg{width:28px;height:28px}
.li .tx{flex:1;min-width:0;font-size:14px}
.li .tx small{display:block;color:var(--muted);font-size:12px}
.li .need{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;margin-top:3px}
.li .need .ok{color:var(--ok)}.li .need .no{color:var(--rust)}

.wallets button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px 8px;font-size:13px}
.wallets .wl{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:18px 'Russo One',sans-serif;color:#fff}
.orline{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 8px}

/* ---- карта ---- */
.maploc{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
.prof>*{flex-shrink:0}
.mapbox{background:#0B1015;border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}
.mapbox canvas{display:block;margin:0 auto;border-radius:8px}
.maplegend{display:flex;justify-content:center;gap:14px;font-size:12px;color:#93A0AC;margin-top:8px}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.maph{margin:4px 2px 0;font:14px 'Russo One',sans-serif;color:var(--muted);letter-spacing:.5px}
.moblist{display:grid;gap:8px}
.mobcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mobcard.open{border-color:var(--faction)}
.mobhead{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 14px;text-align:left}
.mobhead small{display:block;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.mobhead b{font:16px 'Russo One',sans-serif}
.mobhead .chev{margin-left:auto;color:var(--faction);font-size:18px}
.mobdot{width:11px;height:11px;border-radius:50%;flex:none}
.mobstats{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.mobstats span{background:var(--panel-2);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted)}
.mobstats b{color:var(--text)}
.dsect{padding:10px 14px 4px;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan)}
.droprow{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line);font-size:14px}
.droprow:last-child{border:0}
.dic{width:26px;height:26px;flex:none;display:grid;place-items:center}
.dic svg{width:26px;height:26px}
.dn{flex:1;min-width:0}
.dv{font-weight:700;white-space:nowrap}

/* ---- меню под мини-картой ---- */
.gmenu{position:absolute;right:8px;top:122px;width:108px;display:flex;flex-direction:column;gap:6px;z-index:3}
.gm-list{position:absolute;right:0;top:46px;width:236px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(12,17,23,.96);border:1px solid #2E3B49;border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:4}
.gm-list[hidden]{display:none}
.gm-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3}
.gm-list[hidden] + .gm-back{display:none}
.gm-toggle{position:relative;z-index:4}
.mb-ic .mb{transform-box:view-box;transform-origin:12px 12px;transition:transform .32s cubic-bezier(.45,1.5,.5,1)}
.gm-toggle[aria-expanded="true"] .mb{transform:rotate(90deg)}
.gm-toggle[aria-expanded="true"] .mb2{transition-delay:.08s}
.gm-toggle[aria-expanded="true"] .mb3{transition-delay:.16s}
.gm-toggle[aria-expanded="false"] .mb1{transition-delay:.16s}
.gm-toggle[aria-expanded="false"] .mb2{transition-delay:.08s}
.gm-b{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,rgba(24,33,43,.95),rgba(14,20,27,.95));border:1px solid #2E3B49;border-left:3px solid var(--c);border-radius:10px;padding:8px 9px;color:var(--c);font:12px 'Russo One',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.35);text-align:left}
.gm-b svg{width:17px;height:17px;flex:none}
.gm-b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-toggle{color:#E4DED1}
.gm-toggle[aria-expanded="true"]{background:linear-gradient(180deg,rgba(242,169,59,.22),rgba(14,20,27,.95))}
.gm-list .gm-b{animation:gmIn .18s ease-out both}
@keyframes gmIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* ---- таргет и пати ---- */
.tframe{position:absolute;left:100px;right:124px;top:calc(var(--hb, 120px) + 6px);min-width:150px;background:rgba(16,22,28,.92);border:1px solid #34414E;border-radius:12px;padding:7px 8px;color:#E4DED1;z-index:2}
.tframe[hidden]{display:none}
.tf-top{display:flex;align-items:center;gap:7px}
.tf-ic{width:28px;height:28px;border-radius:8px;background:#1B232C;display:grid;place-items:center;flex:none;overflow:hidden}
.tf-ic svg{width:24px;height:24px}
.tf-tx{flex:1;min-width:0}
.tf-tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-tx small{display:block;font-size:11px;color:#93A0AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-x{background:none;border:0;color:#93A0AC;font-size:15px;padding:2px 4px}
.tf-bar{position:relative;height:16px;margin-top:4px;border-radius:6px}
.tf-cp{height:5px;margin-top:6px}.tf-cp[hidden]{display:none}.tf-cp i{background:linear-gradient(90deg,#C4901C,#F2C14B)}
.tf-bar i{background:linear-gradient(90deg,#E0694A,#F2A93B)}
.tf-bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.3px;text-shadow:0 1px 2px #000}
.tf-acts{display:flex;gap:5px;margin-top:6px}
.tf-acts:empty{display:none}
.tf-acts button{flex:1;border:1px solid #34414E;background:#1B232C;color:#E4DED1;border-radius:8px;padding:6px 2px;font-size:11px;font-weight:500}
.tf-acts button[data-tf="heal"]{border-color:#7BC98A;color:#7BC98A}
.tf-acts button[data-tf="invite"]{border-color:var(--faction);color:var(--faction)}
.tf-acts button:disabled{opacity:.5}
.pframes{position:absolute;left:8px;top:calc(var(--hb, 120px) + 100px);width:112px;display:flex;flex-direction:column;gap:5px;z-index:2}
.pframes[hidden]{display:none}
.pf{display:grid;grid-template-columns:1fr auto;gap:2px 4px;background:rgba(16,22,28,.88);border:1px solid #34414E;border-radius:9px;padding:5px 7px;text-align:left;color:#E4DED1}
.pf.far{opacity:.6}
.pf-n{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-l{font-size:10px;color:#93A0AC}
.pf-bar{grid-column:1/3;height:5px;border-radius:3px;background:#34414E;overflow:hidden}
.pf-bar b{display:block;height:100%;background:#7BC98A}
.pf small{grid-column:1/3;font-size:9px;color:#93A0AC}
.pf-acts{display:flex;gap:4px}
.pf-acts button{flex:1;border:1px solid #34414E;background:rgba(16,22,28,.88);color:#93A0AC;border-radius:7px;padding:4px;font-size:10px}
.pinvite{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(16,22,28,.96);border:1px solid var(--faction);border-radius:14px;padding:12px 14px;color:#E4DED1;text-align:center;z-index:4;width:250px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pinvite[hidden]{display:none}
.pinvite span{display:block;font-size:14px;margin-bottom:10px}
.pinvite div{display:flex;gap:8px}
.pinvite button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:700}
.pinvite button[data-pi="yes"]{background:#7BC98A;color:#10181F}
.pinvite button[data-pi="no"]{background:#34414E;color:#E4DED1}
.pinfo{display:flex;gap:12px;align-items:center}
.pinfo-av{width:84px;height:92px;background:#1B232C;border-radius:12px;display:grid;place-items:center;flex:none}
.pinfo-av img{width:78px;height:88px}
.pinfo-tx{display:grid;gap:6px;flex:1}
.pinfo-tx small{display:block;font-size:11px;color:var(--muted)}
.pinfo-tx b{font-size:14px}
.pinfo-eq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pinfo-eq div{border:1px solid;border-radius:10px;padding:6px;text-align:center;background:var(--panel-2)}
.pinfo-eq small{display:block;font-size:10px;color:var(--muted)}
.pinfo-eq b{font-size:12px}
/* ---- прокачка ---- */
.ctabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.ctabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.ctabs button[aria-pressed="true"]{background:var(--faction);color:#1B232C}
.ctabs i{font-style:normal;background:#E0694A;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:4px}
.ptscard{display:flex;align-items:center;justify-content:space-between;background:radial-gradient(80% 120% at 0% 0%,rgba(123,201,138,.16),transparent 60%),var(--panel)}
.ptscard small{display:block;color:var(--muted);font-size:12px}
.ptscard b{font:30px 'Russo One',sans-serif;color:var(--ok)}
.ptsmeta{text-align:right;font-size:12px;color:var(--muted);line-height:1.5}
.upstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.upstats div{background:var(--panel-2);border-radius:10px;padding:8px 2px;text-align:center;font-size:10px;color:var(--muted)}
.upstats b{display:block;font:14px 'Russo One',sans-serif;color:var(--text)}
.uplist{display:grid;gap:8px}
.uprow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.uprow .tx{flex:1;min-width:0}
.uprow b{font-size:14px}
.uprow small{display:block;font-size:12px;color:var(--text)}
.uprow small.muted{color:var(--muted)}
.upbtn{border:0;border-radius:10px;padding:8px 10px;background:linear-gradient(180deg,#3A7BD5,#2A5CA8);color:#fff;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;min-width:88px}
.upbtn span:last-child{font-size:10px;opacity:.85}
.upbtn.wide{width:100%;flex-direction:row;justify-content:center;gap:6px;padding:10px;margin-top:10px}
.upbtn:disabled{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.skcard{display:flex;flex-direction:column}
.skhead{display:flex;gap:12px;align-items:center}
.skic{width:62px;height:62px;flex:none}
.skic svg{width:62px;height:62px}
.skhead .tx{flex:1}
.skhead b{display:block;font:16px 'Russo One',sans-serif}
.skhead small{display:block;font-size:12px;font-weight:500}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{flex:1;height:5px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.pips i.on{background:var(--faction);border-color:var(--faction)}
.sklore{margin:10px 0 6px;font-size:13px;color:var(--muted);font-style:italic}
.skeff{font-size:14px;font-weight:500;background:var(--panel-2);border-radius:10px;padding:8px 10px}
.skmeta{font-size:12px;color:var(--cyan);margin-top:6px}
.sknext{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px}
.sknext small{width:100%;color:var(--muted)}
.sknext span{color:var(--ok);background:rgba(123,201,138,.1);border-radius:6px;padding:2px 6px}
.paslist{display:grid;gap:8px}
.pasrow{display:flex;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.pasrow.locked{opacity:.85}
.pasic{width:42px;height:42px;border-radius:12px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 35%,#141B22),#0E1318);border:2px solid var(--c);display:grid;place-items:center;flex:none}
.pasic svg{width:24px;height:24px}
.pasrow .tx{flex:1;min-width:0}
.pasrow b{font-size:14px}
.pasrow em{font-style:normal;font-size:12px;color:var(--amber)}
.pasrow small{display:block;font-size:12px;color:var(--muted)}
.pasrow small.now{color:var(--ok)}
.pasrow .upbtn.wide{margin-top:8px;padding:8px}

/* кнопка NPC/портала: под карточкой персонажа, ниже рамки цели, если та открыта */
#tframe:not([hidden]) ~ .talk{top:calc(var(--hb, 120px) + 84px)}
.talk{font-size:13px !important;padding:9px 14px !important}

/* ---- гильдия: присутствие ---- */
.mem .seen{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin-top:2px}
.mem .seen i{width:7px;height:7px;border-radius:50%;background:#6F7C88;flex:none}
.mem .seen.on{color:var(--ok)}
.mem .seen.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ---- сумка и склад: сортировка, перенос части стака, перестановка ---- */
.bagbar{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.bagbar span{flex:1;font-size:12px;color:var(--muted)}
.bagbar .act{padding:7px 10px;font-size:12px}
.movehint{margin:-4px 0 8px;color:var(--amber)}
.grid.moving .cell{animation:none}
.grid.moving .cell.lift{transform:scale(1.08);box-shadow:0 0 0 2px #F2C14B,0 6px 14px rgba(0,0,0,.45);z-index:1}
.grid.moving .cell.drop{border-style:dashed;cursor:pointer}
.qtybox{background:var(--panel-2);border:1px solid rgba(242,169,59,.45);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.qty-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.qty-top .ic{width:40px;height:40px;border-radius:10px;background:#141B22;display:grid;place-items:center;flex:none}
.qty-top .ic svg{width:32px;height:32px}
.qty-top b{display:block;font-size:14px}.qty-top small{font-size:12px;color:var(--muted)}
.qty-row{display:flex;gap:8px;align-items:center}
.qty-row input[type=range]{flex:1}
.qty-row .field{width:86px;margin:0;text-align:center}
.qty-quick{display:flex;gap:6px;margin:8px 0}
.qty-quick button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 4px;font-size:12px;color:var(--text)}
.qty-act{display:flex;gap:6px}.qty-act .act{flex:1}

/* ---- пополнение звёздами ---- */
.starpacks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}
.starpack{border:1.5px solid rgba(242,193,75,.5);background:linear-gradient(180deg,rgba(242,193,75,.14),rgba(242,193,75,.04));border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.starpack b{font:15px 'Russo One',sans-serif;color:#F2C14B}
.starpack span{font-size:11px;color:var(--muted)}
.starpack:disabled{opacity:.5}
.wsplit{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin:6px 0 2px}
.wsplit b{color:var(--text)}

/* название локации под мини-картой: одна строка, не залезает под «Меню» */
.loc-name{white-space:nowrap !important;overflow:hidden;text-overflow:ellipsis;width:118px !important;right:4px !important;font-size:10.5px !important;line-height:1.2 !important}

/* ---- реестр вещей и тестовый сервер ---- */
.regb{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.regb.ok{color:var(--ok)}
.envbadge{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:50;background:#E0463A;color:#fff;font:10px 'Russo One',sans-serif;letter-spacing:1px;padding:2px 10px;border-radius:0 0 8px 8px;pointer-events:none}

/* ---- обучение ---- */
.tutcard{position:absolute;left:50%;bottom:258px;transform:translateX(-50%);width:min(300px,calc(100% - 24px));z-index:6;background:rgba(12,17,23,.94);border:1.5px solid #F2C14B;border-radius:14px;padding:9px 12px;color:#E4DED1;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.tutcard[hidden]{display:none}
.tut-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tut-top b{font:12px 'Russo One',sans-serif;color:#F2C14B}
.tut-top button{border:0;background:none;color:var(--muted);font-size:11px;text-decoration:underline;padding:2px}
.tutcard p{margin:5px 0 7px;font-size:13px;line-height:1.35}
.tut-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.tut-bar i{display:block;height:100%;background:#F2C14B;transition:width .3s}
.tutring{position:fixed;z-index:60;border:3px solid #F2C14B;border-radius:18px;pointer-events:none;box-shadow:0 0 0 4px rgba(242,193,75,.25),0 0 18px #F2C14B;animation:tutPulse 1.1s ease-in-out infinite}
.tutring[hidden]{display:none}
@keyframes tutPulse{50%{transform:scale(1.06);opacity:.7}}
/* ---- ежедневные квесты ---- */
.gm-dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#E0463A;color:#fff;font:11px/18px 'Russo One',sans-serif;font-style:normal;text-align:center;padding:0 4px;box-shadow:0 0 8px rgba(224,70,58,.7)}
.gm-dot[hidden],.gm-q[hidden]{display:none}
.gm-q{margin-left:auto;min-width:16px;height:16px;border-radius:8px;background:#E0463A;color:#fff;font:10px/16px 'Russo One',sans-serif;font-style:normal;text-align:center}
.q-timer{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.qcard{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.qcard.ready{border-color:rgba(123,201,138,.7);box-shadow:0 0 0 1px rgba(123,201,138,.3) inset}
.qcard.got{opacity:.6}
.qcard.bonus{border-color:rgba(242,193,75,.55);background:linear-gradient(180deg,rgba(242,193,75,.1),var(--panel-2))}
.q-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q-top b{font-size:14px}.q-top span{font:13px 'Russo One',sans-serif;color:var(--cyan)}
.q-bot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.q-bot small{font-size:12px;color:#F2C14B}.q-bot .act{padding:6px 12px;font-size:12px;flex:none}
.qcard .vbar{margin:8px 0}

/* ---- PvP-рейтинг ---- */
.pvpme{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pvpme b{display:block;font:17px 'Russo One',sans-serif}.pvpme small{font-size:10px;color:var(--muted)}

/* ---- статистика админа ---- */
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stc{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.stc b{display:block;font:17px 'Russo One',sans-serif}.stc small{font-size:10px;color:var(--muted);line-height:1.2;display:block}
.stline{font-size:13px;margin:4px 0 10px}.stline small{color:var(--muted)}
.stbar{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin-bottom:4px}
.stbar div{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}.stbar i{display:block;height:100%;background:var(--cyan)}
.stbar b{text-align:right}
.sterr{background:var(--panel-2);border:1px solid rgba(224,105,74,.4);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.sterr summary{cursor:pointer;list-style:none}.sterr summary b{display:block;font-size:12px;color:#E0694A;word-break:break-word}
.sterr small{font-size:11px;color:var(--muted)}
.sterr pre{white-space:pre-wrap;word-break:break-all;font-size:10px;color:var(--muted);max-height:180px;overflow:auto}

/* ---- комплекты снаряжения ---- */
.setb h3{margin:0 0 8px;font:14px 'Russo One',sans-serif}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;font-size:12px}
.setrow b{font:13px 'Russo One',sans-serif;min-width:92px}
.setrow span{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--muted)}
.setrow span.on{border-color:rgba(123,201,138,.6);color:var(--ok)}

/* ---- разделы меню ---- */
.vip-head{text-align:center;font:34px 'Russo One',sans-serif;color:#F2A93B;text-shadow:0 0 18px rgba(242,169,59,.45);margin:4px 0 10px}
.vip-prog{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.vbar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin:6px 0 10px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,#5FD4E8,#F2C14B)}
.vip-bon{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}

/* ---- стикеры ---- */
.emo-panel{position:absolute;left:8px;bottom:254px;width:min(252px,calc(100% - 16px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px !important;background:rgba(20,15,10,.94);border:1.5px solid #8A6B45;border-radius:16px;padding:10px;z-index:6;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.emo-panel[hidden]{display:none}
.emo-cell{background:rgba(40,30,18,.8);border:1px solid rgba(201,163,106,.3);border-radius:10px;padding:3px 1px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#F2C14B}
.emo-cell:active{transform:scale(.94)}
.emo-art{width:40px;height:40px;display:grid;place-items:center}
.emo-art>svg,.emo-art>img{width:100%;height:100%}
.emo-cap{font:8px 'Russo One',sans-serif;color:#F2C14B;text-shadow:0 1px 0 #3A2408,0 0 3px #000;white-space:nowrap}
.emo-layer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.emo-float{position:absolute;width:64px;display:flex;flex-direction:column;align-items:center;margin-left:-32px;animation:emoPop .35s cubic-bezier(.2,1.6,.4,1) both}
.emo-float.out{animation:emoOut .3s ease-in both}
.emo-float .emo-art{width:54px;height:54px;filter:drop-shadow(0 0 8px rgba(242,193,75,.5)) drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.emo-float .emo-cap{font-size:11px}
@keyframes emoPop{from{transform:scale(.2) translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes emoOut{to{transform:scale(.6) translateY(-20px);opacity:0}}
.an-bounce{animation:aBounce 1s ease-in-out infinite}
.an-pulse{animation:aPulse 1.1s ease-in-out infinite}
.an-wiggle{animation:aWiggle .7s ease-in-out infinite}
.an-shake{animation:aShake .45s linear infinite}
.an-float{animation:aFloat 1.8s ease-in-out infinite}
.an-spin{animation:aSpin 2.4s linear infinite}
.an-dash{animation:aDash 1s ease-in-out infinite}
.an-wave{animation:aWave 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes aBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes aPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes aWiggle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes aShake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}}
@keyframes aFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes aSpin{to{transform:rotate(360deg)}}
@keyframes aDash{0%,100%{transform:translateX(-4px)}50%{transform:translateX(5px)}}
@keyframes aWave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
/* ---- редактор расположения кнопок ---- */
.lay-bar{position:absolute;left:50%;top:calc(var(--hb,120px) + 6px);transform:translateX(-50%);z-index:20;background:rgba(12,17,23,.95);border:1px solid #F2A93B;border-radius:14px;padding:10px 12px;text-align:center;color:#E4DED1;width:min(330px,calc(100% - 20px))}

.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--faction);color:var(--faction);font-weight:700}
textarea.field{min-height:70px;resize:vertical}
.danger{color:var(--rust)!important;border-color:rgba(224,105,74,.5)!important}
.actlist{display:grid;gap:8px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition:none!important}
}
/* ---- Chip War ---- */
.cw{position:absolute;left:50%;top:calc(var(--hb, 120px) + 6px);transform:translateX(-50%);z-index:3;display:flex;align-items:stretch;gap:0;border:1px solid #34414E;border-radius:10px;overflow:hidden;background:rgba(16,22,28,.92);color:#E4DED1;padding:0;font:12px Rubik,sans-serif;cursor:pointer}
.cw[hidden]{display:none}
.cw .cw-t{padding:5px 8px;font:12px 'Russo One',sans-serif;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cw .cw-f{padding:5px 7px;min-width:34px;text-align:center;border-left:1px solid #34414E;font-variant-numeric:tabular-nums}
.cw .cw-f b{display:block;height:3px;border-radius:2px;margin-top:3px;background:var(--c)}
.cw .cw-f.hold{background:color-mix(in srgb, var(--c) 22%, transparent)}
.cw .cw-dot{width:8px;height:8px;border-radius:50%;background:#E0694A;animation:cwp 1.2s infinite}
#tframe:not([hidden]) ~ .cw{top:calc(var(--hb, 120px) + 84px)}
@keyframes cwp{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.cw .cw-dot{animation:none}}
.facpick{display:flex;flex-direction:column;gap:8px}
.facpick button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid #34414E;border-left:5px solid var(--c);background:var(--panel-2);color:var(--text);font:15px 'Russo One',sans-serif}
.facpick button small{font:13px Rubik,sans-serif;color:var(--muted)}
.facpick button:focus-visible{outline:2px solid var(--c);outline-offset:2px}

<script>
// ---- сбор ошибок: всё, что сломалось у игрока, уходит на сервер (админ видит в «Статистике») ----
const ERR_Q = [];
(function(){
  const push = (msg, stack) => { if(ERR_Q.length < 30 && msg) ERR_Q.push({msg:String(msg).slice(0, 500), stack:String(stack || "").slice(0, 2000), ua:navigator.userAgent.slice(0, 200)}); };
  window.addEventListener("error", e => push(e.message, e.error && e.error.stack || (e.filename + ":" + e.lineno)));
  window.addEventListener("unhandledrejection", e => push("Promise: " + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));
  setInterval(() => { if(!ERR_Q.length || typeof NET === "undefined" || !NET.on || !NET.id) return; const x = ERR_Q.shift(); NET.api("/api/err", x).catch(() => {}); }, 4000);
})();
// ===================== ДАННЫЕ И СОСТОЯНИЕ =====================
const $ = id => document.getElementById(id);
const rnd = ([a,b]) => a + Math.floor(Math.random()*(b-a+1));

const LEVEL_CAP = 50;
const mobExpAt = l => 5 + 3*(l - 1) + 0.2*(l - 1)*(l - 1);
const expNeed = l => Math.round((3 + 0.9*l*l)*mobExpAt(l));

  // комплект: 3 вещи одного поколения — +1,5% атаки за номер поколения, 6 вещей — ещё +2% прочности и +крит
  for(const [t, n] of Object.entries(setCounts())){ if(n >= 3) atk = Math.round(atk*(1 + 0.015*t)); if(n >= 6){ maxhp = Math.round(maxhp*(1 + 0.02*t)); crit += Math.ceil(t/2); } }
  maxhp = Math.round(maxhp*(1 + 0.03*pasLv("vital")));
  crit += 2*pasLv("eagle");
  spd += 0.02*pasLv("servo");
  return {atk, def, maxhp, spd, crit, maxcp:maxhp*10,
    critPow:2 + 0.05*(U.cpow || 0) + 0.04*pasLv("fury"),
    rate:1 + 0.02*(U.aspd || 0) + 0.02*pasLv("swift"),
    regen:0.1*(U.regen || 0) + 0.2*pasLv("selfrepair"),
    dmgRed:Math.min(0.45, 0.03*pasLv("steelskin")),
    thorns:0.04*pasLv("retaliate"), steal:0.02*pasLv("hunger"), execute:0.06*pasLv("execute"),
    range:12*pasLv("longshot"), skillDmg:0.04*pasLv("overload"),
    cdr:Math.min(0.5, 0.02*pasLv("cold") + 0.025*pasLv("cyclotron")), loot:0.03*pasLv("looter")};
}

// Боевая мощь (БМ): одно число для сравнения пилотов и рейтинга
function combatPower(){
  const st = stat();
  let bm = st.atk*12 + st.def*10 + st.maxhp*1.5 + st.crit*6 + st.spd*300 + S.level*25;
  bm += (st.critPow - 2)*120 + (st.rate - 1)*500 + st.regen*40 + st.dmgRed*600 + st.steal*500 + st.cdr*400 + st.skillDmg*300;
  for(const [id, lv] of Object.entries(S.skl || {})) bm += (lv - 1)*15;
  return Math.round(bm);
}

const count = (list, id) => list.filter(x => x.id === id && ITEMS[id].type !== "gear").reduce((a,x) => a + x.n, 0);
const have = id => id === "scrap" ? S.scrap : id === "cores" ? S.cores : count(S.inv, id);
function addItem(list, id, n, max, g, e, uid){
  const stackable = ITEMS[id].type !== "gear";
  if(stackable){
    const ex = list.find(x => x.id === id);
    if(ex){ ex.n += n; return n; }
    if(list.length >= max) return 0;
    list.push({id, n}); return n;
  }
  let added = 0;
  while(added < n && list.length < max){ const it = {id, n:1, g:g||0, e:e||0}; if(uid) it.uid = uid; list.push(it); added++; }
  return added;
}
function removeItem(list, id, n){
  for(let i = list.length-1; i >= 0 && n > 0; i--){
    if(list[i].id !== id) continue;
    const take = Math.min(n, list[i].n); list[i].n -= take; n -= take;
    if(list[i].n <= 0) list.splice(i, 1);
  }
}

// Раньше телефон поднимал уровень, сервер его срезал, и игрок видел «Уровень выровнен…» снова и снова.
let capWarnT = 0, capDownT = 0;
function levelUps(){
  let up = false;
  if(S.level >= LEVEL_CAP){ S.exp = Math.min(S.exp, expNeed(S.level) - 1); return false; }
  const cap = !window.NET_ADMIN && S.srvCap > 0 ? Math.min(LEVEL_CAP, S.srvCap) : LEVEL_CAP;
  while(S.exp >= expNeed(S.level) && S.level < cap){ S.exp -= expNeed(S.level); S.level++; S.max_hp += 10; S.attack += 2; S.defense += 1; S.hp = stat().maxhp; up = true; }
  if(S.level >= cap && cap < LEVEL_CAP && S.exp >= expNeed(S.level)){
    // опыт не теряется: копится и засчитается, когда сервер подтвердит следующий уровень
    if(Date.now() > capWarnT){ capWarnT = Date.now() + 120000; toast("Уровень " + (S.level + 1) + " ждёт подтверждения сервера — продолжай бой"); }
  }
  return up;
}

// Короткие синтезированные звуки: не нужны файлы, работают офлайн.
const Sfx = (() => {
  let ac = null;
  const ctxA = () => { if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(ac.state === "suspended") ac.resume(); return ac; };
  function tone(freq, dur, type, gain, slide){
    if(!S.settings.sound) return; const a = ctxA(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime, v = gain*S.settings.vol;
    o.type = type; o.frequency.setValueAtTime(freq, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  }
  const P = {
    shot:() => tone(880, .09, "square", .05, 320),
    crit:() => { tone(1200, .12, "sawtooth", .06, 400); },
    hit:() => { tone(160, .15, "sawtooth", .08, 60); if(S.settings.vibro && navigator.vibrate) navigator.vibrate(30); },
    kill:() => { tone(300, .08, "square", .06, 600); setTimeout(() => tone(600, .1, "square", .05, 900), 70); },
    pick:() => tone(700, .07, "sine", .08, 1100),
    level:() => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .18, "triangle", .08), i*90)),
    ui:() => tone(520, .04, "sine", .04),
    msg:() => tone(990, .06, "sine", .04, 1300),
    portal:() => tone(200, .5, "sine", .07, 900)
  };
  return {play:n => { try{ P[n] && P[n](); }catch(e){} }};
})();

// детерминированный генератор, чтобы у каждой локации была своя постоянная карта
function seeded(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function nearestEnemy(range){

function update(dt){

  if(keys.KeyA || keys.ArrowLeft) mx -= 1; if(keys.KeyD || keys.ArrowRight) mx += 1;

  }

  if(safeSpot(p)) S.hp = Math.min(st.maxhp, S.hp + st.maxhp*(locKey === "lobby" ? 0.15 : 0.05)*dt);
  if(st.regen) S.hp = Math.min(st.maxhp, S.hp + st.regen*dt);
  if(S.cp === undefined || S.cp > st.maxcp) S.cp = st.maxcp;

  const tDist = t ? Math.hypot(t.x-p.x, t.y-p.y) : 0, tLos = t ? los(p.x, p.y, t.x, t.y) : false;

  const da2 = ((wantAim - p.aim + Math.PI*3) % (Math.PI*2)) - Math.PI; p.aim += da2*Math.min(1, dt*16);

    if(autoS.stuckT > 1.2){ autoDrop(t, 8); }
  } else if(inReach){ autoS.stuckT = 0; autoS.lastD = tDist; }
  // цель долго за стеной — тоже меняем

  if(p.atkT > 0) p.atkT -= dt;

    const fa = Math.atan2(foe.ry - p.y, foe.rx - p.x), fd = ((fa - p.aim + Math.PI*3) % (Math.PI*2)) - Math.PI; p.aim += fd*Math.min(1, dt*16);

      else { CB.fx.push({type:"slash", x:p.x + Math.cos(p.aim)*34, y:p.y + Math.sin(p.aim)*34, a:p.aim, life:.18, max:.18, c:CP.color || "#fff"}); Sfx.play("ui"); }
    } else if(t && inReach){

function updateEnemies(dt, st){
  for(const e of enemies){
    if(e.dead){ if(now > e.respawn){ if(e.room) respawnDungeon(e); else Object.assign(e, makeEnemy(e.type, npcs[0])); } continue; }
    const k = NPCS[e.type];
    if(e.room && !e.chase && (Math.abs(e.x - p.x) > 700 + vw/2 || Math.abs(e.y - p.y) > 700 + vh/2)) continue;   // далёкие мобы подземелья спят
    e.flash -= dt;
    if(e.stun > 0){ e.stun -= dt; e.moving = false; continue; }
    e.cd -= dt; e.lunge -= dt;
    const dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy);
    const safe = p.dead || safeSpot(p);
    if(!safe && d < 240 && !e.room) e.chase = true;             // в подземельях моб агрится только когда его ударили
    if(safe || d > (e.room ? 560 : 480)){ e.chase = false; e.roomAggro = false; }
    let vx = 0, vy = 0;
    if(e.chase){
      e.ang = Math.atan2(dy,dx);
      if(d > k.range*0.85){ vx = dx/d*k.speed; vy = dy/d*k.speed; }
      if(d <= k.range && e.cd <= 0 && los(e.x, e.y, p.x, p.y)){
        e.cd = 1.3; const K = 20 + 5*(k.lvl || 1), dmg = Math.max(1, Math.round(k.atk*K/(K + st.def*(1 + buffV("def")))));
        if(k.ranged) bolts.push({x:e.x, y:e.y, vx:dx/d*330, vy:dy/d*330, dmg, life:1.2, by:k.name, src:e});
        else { hurtPlayer(dmg, k.name, e); e.lunge = 0.15; }
      }
    } else if(e.room){
      // подземелье: до удара моб стоит на своём месте; после погони спокойно возвращается туда же
      const wx = e.hx - e.x, wy = e.hy - e.y, wd = Math.hypot(wx, wy);
      if(wd > 6){ vx = wx/wd*k.speed*0.6; vy = wy/wd*k.speed*0.6; e.ang = Math.atan2(wy, wx); }
      if(e.hp < e.max) e.hp = Math.min(e.max, e.hp + e.max*0.05*dt);
    } else {
      e.wanderT -= dt;
      if(e.wanderT <= 0){ e.wanderT = 2 + Math.random()*3; e.tx = e.hx + (Math.random()*240-120); e.ty = e.hy + (Math.random()*240-120); }
      const wx = e.tx-e.x, wy = e.ty-e.y, wd = Math.hypot(wx,wy);
      if(wd > 8){ vx = wx/wd*k.speed*0.45; vy = wy/wd*k.speed*0.45; e.ang = Math.atan2(wy,wx); }
      if(e.hp < e.max) e.hp = Math.min(e.max, e.hp + e.max*0.05*dt);
    }
    const eox = e.x, eoy = e.y;
    e.x += vx*dt; e.y += vy*dt; e.moving = !!(vx || vy);
    const sp = npcs[0], sd = Math.hypot(e.x-sp.x, e.y-sp.y);
    if(sd < 190){ e.x = sp.x + (e.x-sp.x)/sd*190; e.y = sp.y + (e.y-sp.y)/sd*190; }
    pushOut(e, k.r); slide(e, eox, eoy, k.r);
    if(e.room){                                                  // из своей комнаты моб не выходит даже в погоне
      const rm = e.room, m = Math.min(k.r*(k.boss ? BOSS_SCALE : 1), rm.w/2 - 2, rm.h/2 - 2);

      e.y = Math.max(rm.y + m, Math.min(rm.y + rm.h - m, e.y));
    }
  }
  for(const b of beams) b.life -= dt; beams = beams.filter(b => b.life > 0);
  for(const t of texts){ t.life -= dt; t.y -= 38*dt; } texts = texts.filter(t => t.life > 0);
}

// ---- надписи над роботом: эмблема гильдии, название гильдии, ник ----
const EMB_PATH = {};
function embPath(icon){
  if(EMB_PATH[icon] !== undefined) return EMB_PATH[icon];
  const src = (typeof G_ICONS !== "undefined" && G_ICONS[icon]) || "";
  const m = src.match(/d="([^"]+)"/);
  try{ EMB_PATH[icon] = m ? new Path2D(m[1]) : null; }catch(e){ EMB_PATH[icon] = null; }
  return EMB_PATH[icon];
}
// эмблема гильдии: векторный рисунок один раз превращается в картинку нужного размера
const emblemCache = new Map();
function drawEmblem(x, y, size, icon, color){
  const key = icon + "|" + color + "|" + size + "|" + dpr;
  let c = emblemCache.get(key);
  if(!c){
    const pad = 2, W2 = size + pad*2;
    c = document.createElement("canvas"); c.width = c.height = Math.ceil(W2*dpr);
    const g = c.getContext("2d"); g.scale(dpr, dpr); g.translate(W2/2, W2/2);
    const r = size/2;
    g.beginPath(); for(let i = 0; i < 6; i++){ const a = Math.PI/6 + i*Math.PI/3; g.lineTo(Math.cos(a)*r, Math.sin(a)*r); } g.closePath();
    g.fillStyle = "#1B232C"; g.fill(); g.lineWidth = 2; g.strokeStyle = color; g.stroke();
    const path = embPath(icon);
    if(path){ const s = size/40; g.scale(s, s); g.translate(-12, -12); g.fillStyle = color; g.fill(path); }
    c._w = W2;
    emblemCache.set(key, c); if(emblemCache.size > 200) emblemCache.delete(emblemCache.keys().next().value);
  }
  ctx.drawImage(c, x - c._w/2, y - c._w/2, c._w, c._w);
}
// подписи над головами: текст с обводкой один раз рисуется в маленький холст и дальше просто копируется
// (strokeText + fillText каждый кадр для десятков игроков — одна из самых дорогих операций на телефоне)
const nameCache = new Map();
function nameText(text, x, y, color, font){
  const key = text + "|" + color + "|" + font + "|" + dpr;
  let c = nameCache.get(key);
  if(!c){
    const g0 = document.createElement("canvas").getContext("2d"); g0.font = font;
    const m = g0.measureText(text), size = parseFloat((font.match(/(\d+(?:\.\d+)?)px/) || [0, 13])[1]);
    const asc = Math.ceil(m.actualBoundingBoxAscent || size*0.8), desc = Math.ceil(m.actualBoundingBoxDescent || size*0.25);
    const w = Math.ceil(m.width) + 6, h = asc + desc + 6, cv2 = g0.canvas;
    cv2.width = Math.ceil(w*dpr); cv2.height = Math.ceil(h*dpr);
    const g = cv2.getContext("2d"); g.scale(dpr, dpr); g.font = font; g.textAlign = "center";
    g.lineWidth = 3; g.lineJoin = "round"; g.strokeStyle = "rgba(0,0,0,.75)"; g.strokeText(text, w/2, asc + 3);
    g.fillStyle = color; g.fillText(text, w/2, asc + 3);
    c = {cv:cv2, w, h, by:asc + 3};
    nameCache.set(key, c); if(nameCache.size > 400) nameCache.delete(nameCache.keys().next().value);
  }
  ctx.drawImage(c.cv, x - c.w/2, y - c.by, c.w, c.h);
}
// шрифт мог догрузиться позже — перерисуем подписи уже им
if(document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => nameCache.clear());
function drawNameStack(x, y, nick, nickColor, g){
  nameText(nick, x, y - 32, nickColor, "600 13px Rubik, sans-serif");
  if(!g || !g.tag) return;
  const gc = /^#[0-9A-Fa-f]{6}$/.test(g.color || "") ? g.color : "#F2A93B";
  nameText("[" + g.tag + "] " + (g.name || ""), x, y - 47, gc, "11px Rubik, sans-serif");
  drawEmblem(x, y - 68, 22, g.icon || "gear", gc);
}

      ctx.translate(17, 0); ctx.rotate(t*30); ctx.fillStyle = "rgba(200,210,220,.35)"; ctx.fillRect(-8, -1.5, 16, 3); ctx.restore(); }
    ctx.fillStyle = "#4A4F57"; circle(0, 0, 12); ctx.fill(); ctx.fillStyle = k.color; circle(5, 0, 5); ctx.fill();
  } else if(kind === "sentry_bot"){
    ctx.fillStyle = "#2E3A46"; ctx.fillRect(8, -3, 20, 6);
    ctx.fillStyle = "#5A5F68"; ctx.beginPath(); for(let i = 0; i < 6; i++){ const a = i*Math.PI/3; ctx.lineTo(Math.cos(a)*19, Math.sin(a)*19); } ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1B232C"; circle(0, 0, 9); ctx.fill(); ctx.fillStyle = k.color; circle(3, 0, 5); ctx.fill();
  } else {
    ctx.strokeStyle = "#2E3A46"; ctx.lineWidth = 7; ctx.lineCap = "round";
    const w = Math.sin(t*8)*6*(e.moving ? 1 : 0);
    ctx.beginPath(); ctx.moveTo(-10,-18); ctx.lineTo(-10 + w,-32); ctx.moveTo(10,-18); ctx.lineTo(10 - w,-32);
    ctx.moveTo(-10,18); ctx.lineTo(-10 - w,32); ctx.moveTo(10,18); ctx.lineTo(10 + w,32); ctx.stroke();
    ctx.fillStyle = "#4A4F57"; rr(-24, -22, 48, 44, 10); ctx.fill();
    ctx.fillStyle = "#2E3A46"; ctx.fillRect(18, -5, 22, 10);
    ctx.fillStyle = "#1B232C"; rr(2, -10, 16, 20, 4); ctx.fill(); ctx.fillStyle = k.color; rr(8, -6, 7, 12, 2); ctx.fill();
  }
  }
  if(e.flash > 0){ ctx.globalAlpha = .6; ctx.fillStyle = "#fff"; circle(0, 0, k.r); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
  if(e.stun > 0){ ctx.save(); ctx.strokeStyle = "#5FD4E8"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -t*20; circle(e.x, e.y, k.r + 6); ctx.stroke(); ctx.restore();
    for(let i = 0; i < 3; i++){ const a = t*4 + i*2.1; ctx.fillStyle = "#FFE08A"; circle(e.x + Math.cos(a)*(k.r*0.7), e.y - k.r - 6 + Math.sin(a)*4, 2.5); ctx.fill(); } }
  if(k.boss){
    const w = 96, y0 = e.y - k.r - 20;
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(e.x - w/2 - 2, y0 - 2, w + 4, 10);
    ctx.fillStyle = "#6A1812"; ctx.fillRect(e.x - w/2, y0, w, 6);
    ctx.fillStyle = "#E0463A"; ctx.fillRect(e.x - w/2, y0, w*Math.max(0, e.hp/e.max), 6);
    nameText("☠ " + T(k.name), e.x, y0 - 8, "#FF8A6A", "700 12px Rubik, sans-serif");
    nameText(T("Уровень") + " " + k.lvl, e.x, y0 - 22, "#93A0AC", "10px Rubik, sans-serif");
  }
  else if(e.hp < e.max || p.target === e){
    const w = k.r*2 + 10;
    ctx.fillStyle = "#1B232C"; ctx.fillRect(e.x - w/2, e.y - k.r - 14, w, 5);
    ctx.fillStyle = "#E0694A"; ctx.fillRect(e.x - w/2, e.y - k.r - 14, w*Math.max(0, e.hp/e.max), 5);
  }
  if(p.target === e || (typeof lockedEnemy === "function" && lockedEnemy() === e)){
    ctx.strokeStyle = typeof lockedEnemy === "function" && lockedEnemy() === e ? "rgba(224,105,74,.95)" : "rgba(242,169,59,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    circle(e.x, e.y, k.r + 9); ctx.stroke(); ctx.setLineDash([]);
    if(!k.dungeon) label(k.name, e.x, e.y - k.r - 20, "#E4DED1");
  }
  // у мобов подземелья всегда видны уровень и имя; цвет — насколько он опасен для тебя
  if(k.dungeon && !k.boss && (p.target === e || (typeof lockedEnemy === "function" && lockedEnemy() === e))){
    const col = S.level >= k.lvl ? "#E4DED1" : S.level + 3 >= k.lvl ? "#F2A93B" : "#E0694A";
    nameText(T(k.name), e.x, e.y - k.r - 20, col, "600 11px Rubik, sans-serif");
    nameText(T("Уровень") + " " + k.lvl, e.x, e.y - k.r - 33, "#93A0AC", "10px Rubik, sans-serif");

}

const DROP_COLOR = {scrap:"#A7B0B8", cores:"#5FD4E8", wire:"#D9A441", plate:"#C9D1D8", chip:"#5FD4E8"};
function drawDrops(){
  for(const d of drops){
    const bob = Math.sin(d.t*6)*3;
    ctx.save(); ctx.translate(d.x, d.y + bob);
    const gc = d.g !== undefined ? gradeColor(d.g) : null;
    if(gc){ ctx.fillStyle = gc; ctx.globalAlpha = .3 + Math.sin(d.t*5)*.15; circle(0, 0, 15); ctx.fill(); ctx.globalAlpha = 1; }
    else if(d.kind !== "scrap"){ ctx.fillStyle = "rgba(242,169,59,.25)"; circle(0, 0, 11); ctx.fill(); }
    ctx.rotate(Math.PI/4); ctx.fillStyle = gc || DROP_COLOR[d.kind] || "#F2A93B"; ctx.fillRect(gc ? -6 : -5, gc ? -6 : -5, gc ? 12 : 10, gc ? 12 : 10);
    ctx.restore();
  }
}

// план подземелья для миникарты: сотни прямоугольников рисуются один раз, а не каждый кадр
const miniDgCache = {key:"", c:null};
function miniDungeon(size, s){
  const key = dgKey + "|" + dgRects.length + "|" + size + "|" + dpr;
  if(miniDgCache.key !== key){
    const c = document.createElement("canvas"); c.width = Math.ceil(size*dpr); c.height = Math.ceil(size*dpr);
    const g = c.getContext("2d"); g.scale(dpr, dpr); g.fillStyle = "#3A4757";
    for(const r of dgRects) g.fillRect(r.x*s, r.y*s, Math.max(1, r.w*s), Math.max(1, r.h*s));
    miniDgCache.key = key; miniDgCache.c = c;
  }
  return miniDgCache.c;
}
function drawMinimap(){
  const size = 92, x = vw - size - 8, y = 8, s = size / Math.max(W, H);
  ctx.fillStyle = "rgba(20,27,34,.85)"; rr(x-3, y-3, size+6, size+6, 10); ctx.fill();
  ctx.save(); rr(x, y, size, size, 7); ctx.clip();
  ctx.fillStyle = locKey === "lobby" ? "#1C252E" : LOCS[locKey].ground; ctx.fillRect(x, y, size, size);
  if(LOCS[locKey].dungeon) ctx.drawImage(miniDungeon(size, s), x, y, size, size);
  if(locKey === "lobby"){ ctx.fillStyle = "#34414E"; for(const r of rocks){ if(r.rw) ctx.fillRect(x + r.rx*s, y + r.ry*s, r.rw*s, r.rh*s); else { circle(x + r.x*s, y + r.y*s, Math.max(1.5, r.r*s)); ctx.fill(); } } }
  for(const n of npcs){ ctx.fillStyle = n.kind === "portal" || n.kind === "back" ? "#9B7BFF" : (LOBBY_PADS[n.kind] || "#F2A93B"); circle(x + n.x*s, y + n.y*s, 3.5); ctx.fill(); }
  ctx.fillStyle = "#E0694A";
  for(const e of enemies) if(!e.dead && Math.abs(e.x - p.x) < 700 && Math.abs(e.y - p.y) < 700) ctx.fillRect(x + e.x*s - 1, y + e.y*s - 1, 2.5, 2.5);
  if(typeof NET !== "undefined"){ ctx.fillStyle = "#7BC98A"; for(const o of NET.others.values()){ circle(x + o.rx*s, y + o.ry*s, 2.5); ctx.fill(); } }
  ctx.fillStyle = "#fff"; circle(x + p.x*s, y + p.y*s, 3); ctx.fill();
  ctx.restore();
}

let drawDt = 0.016;
function draw(t){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = W < vw ? (W - vw)/2 : Math.max(0, Math.min(W - vw, p.x - vw/2));
  const cy = H < vh ? (H - vh)/2 : Math.max(0, Math.min(H - vh, p.y - vh*0.45));
  window.camX = cx; window.camY = cy;
  ctx.fillStyle = "#0F151B"; ctx.fillRect(0, 0, vw, vh);
  ctx.save(); ctx.translate(-cx, -cy);
  if(locKey === "lobby") drawLobby(cx, cy, t); else if(LOCS[locKey].dungeon) drawDungeon(cx, cy, t); else drawField(cx, cy);
  drawRocks(cx, cy);
  for(const n of npcs) drawNpc(n, t);
  for(const s of sparks){ ctx.fillStyle = "#FFB347"; ctx.globalAlpha = s.life*2; ctx.fillRect(s.x, s.y, 3, 3); } ctx.globalAlpha = 1;
  drawDrops();
  for(const e of enemies) if(!e.dead && e.x > cx - 80 && e.x < cx + vw + 80 && e.y > cy - 100 && e.y < cy + vh + 80) drawEnemy(e, t);
  drawClassFx(drawDt);
  if(typeof drawPvpUnder === "function") drawPvpUnder(t);
  if(typeof drawOthers === "function") drawOthers(t, drawDt);
  if(!p.dead) drawBot(p.x, p.y, p.ang, p.aim, t, p.moving, p.flash);
  if(typeof drawPvpLayer === "function") drawPvpLayer(t, drawDt);
  if(locKey === "lobby") drawLobbyOverlay(t, drawDt);
  for(const b of bolts){ ctx.fillStyle = "#E0694A"; ctx.shadowColor = "#E0694A"; ctx.shadowBlur = 10; circle(b.x, b.y, 5); ctx.fill(); ctx.shadowBlur = 0; }
  for(const b of beams){
    const plasma = b.plasma || (S.eq.weapon && ITEMS[S.eq.weapon.id] && ITEMS[S.eq.weapon.id].tier >= 4), c = plasma ? "#C77DFF" : (classParams().color && S.cls !== "guard" ? classParams().color : "#5FD4E8");
    ctx.globalAlpha = b.life/0.12; ctx.strokeStyle = c; ctx.lineWidth = plasma ? 6 : 4; ctx.shadowColor = c; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  ctx.textAlign = "center"; ctx.font = "15px 'Russo One', sans-serif";
  for(const tx of texts){ const s = T(tx.t); ctx.globalAlpha = Math.min(1, tx.life*2); ctx.fillStyle = "#000"; ctx.fillText(s, tx.x+1, tx.y+1); ctx.fillStyle = tx.c; ctx.fillText(s, tx.x, tx.y); }
  ctx.globalAlpha = 1;
  if(typeof tutWorld === "function") tutWorld(t);
  ctx.restore();
  if(!(S.settings && S.settings.lowfx)){
    // затемнение краёв рисуется один раз на размер экрана, а не создаётся заново каждый кадр
    if(!GFX.vig){
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(vw/4)); c.height = Math.max(1, Math.round(vh/4));
      const g = c.getContext("2d"), w = c.width, h = c.height;
      const vg = g.createRadialGradient(w/2, h/2, Math.min(w, h)*0.35, w/2, h/2, Math.max(w, h)*0.75);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)"); g.fillStyle = vg; g.fillRect(0, 0, w, h);
      GFX.vig = c;
    }
    ctx.imageSmoothingEnabled = true; ctx.drawImage(GFX.vig, 0, 0, vw, vh);
  }
  drawMinimap();
}

// HUD: пишем в DOM только то, что изменилось — каждая запись в DOM заставляет браузер пересчитывать стили
const HUDC = {};
const hudText = (id, v) => { if(HUDC[id] !== v){ HUDC[id] = v; $(id).textContent = v; } };
const hudWidth = (id, pct) => { const v = (Math.round(Math.max(0, Math.min(100, pct))*5)/5) + "%"; if(HUDC[id + ":w"] !== v){ HUDC[id + ":w"] = v; $(id).style.width = v; } };
let hudBmT = 0;
function hud(){
  const st = stat();
  hudText("hLvl", "Ур. " + S.level); hudText("hName", S.name);
  hudText("hHp", Math.ceil(S.hp) + "/" + st.maxhp);
  hudWidth("hHpBar", S.hp/st.maxhp*100);
  const cp = Math.ceil(Math.min(S.cp ?? st.maxcp, st.maxcp));
  hudWidth("hCpBar", cp/st.maxcp*100); hudText("hCpTxt", "CP " + cp.toLocaleString("ru-RU") + " / " + st.maxcp.toLocaleString("ru-RU"));
  hudWidth("hXpBar", Math.min(100, S.exp/expNeed(S.level)*100));
  // полная золотая мигающая шкала — следующий уровень ждёт подтверждения сервера
  const held = !window.NET_ADMIN && S.srvCap > 0 && S.level >= S.srvCap && S.exp >= expNeed(S.level);
  if(HUDC.xpHeld !== held){ HUDC.xpHeld = held; $("hXpBar").classList.toggle("held", held); }
  hudText("hScrap", "Лом " + S.scrap); hudText("hCores", "Ядра " + S.cores);
  if(now - hudBmT > 0.5){ hudBmT = now; hudText("hBM", "БМ " + combatPower()); }          // боевая мощь — дорогой подсчёт, 2 раза в секунду хватает
  hudText("kitCount", String(have("kit_s") + have("kit_l")));
  const cd = (id, v, max) => { const k = `scaleY(${Math.round(Math.max(0, Math.min(1, v/max))*50)/50})`; if(HUDC[id + ":cd"] !== k){ HUDC[id + ":cd"] = k; $(id).querySelector(".cd").style.transform = k; } };
  cd("skFire", Math.max(0, p.fireCd), 1/classParams().rate); cd("skKit", p.kitCd, 2);
  classHud();
  if(typeof targetTick === "function") targetTick(drawDt);
}

// если 3 секунды подряд кадр дольше 24 мс (меньше ~40 FPS), упрощаем картинку ступенькой:
// сначала убираем пятна света на земле (~четверть времени кадра, почти незаметно), потом разрешение холста 2 → 1,5 → 1
function gfxWatch(ms){
  if(!running || paused || document.hidden || ms > 250 || (dpr <= 1 && !GFX.fx)) { GFX.frames = GFX.slow = 0; return; }
  GFX.frames++; if(ms > 24) GFX.slow++;
  if(GFX.frames < 180) return;
  if(GFX.slow > GFX.frames*0.6){ if(GFX.fx) GFX.fx = false; else { GFX.cap = dpr > 1.5 ? 1.5 : 1; resize(); } }
  GFX.frames = GFX.slow = 0;
}
function loop(ts){
  if(S.settings && S.settings.fps60 === false && ts - last < 31){ requestAnimationFrame(loop); return; }
  const raw = ts - last, dt = Math.min(0.05, raw/1000); last = ts;
  gfxWatch(raw);
  if(running && vw > 0){
    if(!paused) update(dt);
    drawDt = paused ? 0 : dt; draw(ts/1000); hud();
    saveTimer += dt; if(saveTimer > 3){ saveTimer = 0; save(); }
  }
  requestAnimationFrame(loop);
}

const invLine = () => `<div class="money">Лом: <b>${S.scrap}</b> · Ядра: <b>${S.cores}</b> · Сумка: <b>${S.inv.length}/${INV_MAX}</b></div>`;

// ---- склад ----
let stTab = "inv", stQty = null;
// сортировка: одинаковые предметы в один стак; снаряжение по слоту, грейду и заточке, затем сферы, книги, расходники, материалы
const SORT_SLOT = {weapon:0, head:1, armor:2, module:3, core:4, legs:5};
const SORT_TYPE = {gear:0, ench:1, book:2, use:3, mat:4};
function sortItems(list){
  const merged = [];
  for(const x of list){
    if(ITEMS[x.id].type !== "gear"){ const ex = merged.find(m => m.id === x.id); if(ex){ ex.n += x.n; continue; } }
    merged.push({...x});
  }
  merged.sort((a, b) => {
    const A = ITEMS[a.id], B = ITEMS[b.id];
    return (SORT_TYPE[A.type] ?? 9) - (SORT_TYPE[B.type] ?? 9)
      || (A.type === "gear" ? (SORT_SLOT[A.slot] ?? 9) - (SORT_SLOT[B.slot] ?? 9) : 0)
      || (b.g || 0) - (a.g || 0) || (b.e || 0) - (a.e || 0)
      || (A.lvl || 0) - (B.lvl || 0) || A.name.localeCompare(B.name, "ru");
  });
  list.splice(0, list.length, ...merged);
}
const cellHtml = (x, attrs, extra) => x ? `<button class="cell ${extra || ""}" type="button" ${attrs} aria-label="${ITEMS[x.id].name}" ${gStyle(x)}>${icon(x.id, x.g)}${encBadge(x)}${x.n > 1 ? `<b>${x.n}</b>` : ""}</button>` : "";
function renderStorage(){
  const from = stTab === "inv" ? S.inv : S.store, max = stTab === "inv" ? INV_MAX : STORE_MAX;
  let h = `<div class="tabs"><button type="button" data-st="inv" aria-pressed="${stTab === "inv"}">Сумка (${S.inv.length}/${INV_MAX})</button><button type="button" data-st="store" aria-pressed="${stTab === "store"}">Склад (${S.store.length}/${STORE_MAX})</button></div>`;
  h += `<div class="bagbar"><button class="act alt" type="button" data-sortlist="${stTab}">⇅ Сортировать</button></div>`;
  const q = stQty !== null ? from[stQty] : null;
  if(q){
    const n = q.n, half = Math.max(1, Math.floor(n/2));
    h += `<section class="qtybox"><div class="qty-top"><div class="ic">${icon(q.id, q.g)}</div><div><b>${ITEMS[q.id].name}</b><small>${stTab === "inv" ? "На склад" : "В сумку"} · всего ${n}</small></div></div>
      <div class="qty-row"><input type="range" min="1" max="${n}" value="${n}" id="stQtyIn" aria-label="Количество"><input class="field" type="number" min="1" max="${n}" value="${n}" id="stQtyNum" aria-label="Количество"></div>
      <div class="qty-quick">${[1, 10, half, n].filter((v, i, a) => v <= n && a.indexOf(v) === i).map(v => `<button type="button" data-stqn="${v}">${v === n ? "Всё" : v === half && v !== 1 && v !== 10 ? "Половина" : v}</button>`).join("")}</div>
      <div class="qty-act"><button class="act alt" type="button" data-stqcancel="1">Отмена</button><button class="act" type="button" data-stmove="${stQty}">Перенести <span id="stQtyLbl">${n}</span></button></div></section>`;
  }
  h += `<div class="grid">`;
  for(let i = 0; i < max; i++){ const x = from[i]; h += x ? cellHtml(x, `data-move="${i}"`, stQty === i ? "sel" : "") : `<div class="cell empty"></div>`; }
  h += `</div><p class="hint">${stTab === "inv" ? "Нажми на предмет, чтобы положить его на склад." : "Нажми на предмет, чтобы забрать его в сумку."} У стопки можно выбрать, сколько перенести. Склад не теряется при гибели.</p>`;
  body().innerHTML = h;
  const r = $("stQtyIn"), num = $("stQtyNum");
  if(r){
    const sync = v => { v = Math.max(1, Math.min(q.n, parseInt(v) || 1)); r.value = v; num.value = v; $("stQtyLbl").textContent = v; };
    r.addEventListener("input", () => sync(r.value));
    num.addEventListener("input", () => { const v = parseInt(num.value); if(v >= 1) sync(v); });
    num.addEventListener("keydown", e => e.stopPropagation());

}
// перенос: стопка целиком или выбранное количество
function transferItem(i, k){
  const from = stTab === "inv" ? S.inv : S.store, to = stTab === "inv" ? S.store : S.inv, max = stTab === "inv" ? STORE_MAX : INV_MAX;
  const x = from[i]; if(!x) return;
  k = Math.max(1, Math.min(x.n || 1, k || x.n || 1));
  if(!addItem(to, x.id, k, max, x.g, x.e, x.uid)){ toast(stTab === "inv" ? "Склад заполнен" : "Сумка заполнена"); return; }
  if(ITEMS[x.id].type === "gear" || k >= x.n) from.splice(i, 1); else x.n -= k;
  toast((stTab === "inv" ? "На склад: " : "В сумку: ") + ITEMS[x.id].name + (k > 1 ? " ×" + k : ""));
}

function equipAt(i){
  const x = S.inv[i]; if(!x) return false; const it = ITEMS[x.id];
  if(it.lvl && S.level < it.lvl){ toast("Нужен " + it.lvl + " уровень"); return false; }
  if(it.cls && it.cls !== S.cls){ toast("Это оружие класса «" + CLASSES[it.cls].name + "»"); return false; }
  const old = S.eq[it.slot];
  S.inv.splice(i, 1); S.eq[it.slot] = {id:x.id, g:x.g||0, e:x.e||0, ...(x.uid ? {uid:x.uid} : {})};
  if(old) S.inv.splice(i, 0, {id:old.id, n:1, g:old.g, e:old.e||0, ...(old.uid ? {uid:old.uid} : {})});
  S.hp = Math.min(S.hp, stat().maxhp);
  toast("Надето: " + it.name); save(); return true;
}
function unequip(slot){
  const e = S.eq[slot]; if(!e) return false;
  if(!addItem(S.inv, e.id, 1, INV_MAX, e.g, e.e, e.uid)){ toast("Сумка заполнена"); return false; }

}
