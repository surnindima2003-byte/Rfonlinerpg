// Двуногие роботы-трансформеры в виде «три четверти»: стоят вертикально, шагают, смотрят на цель.
// drawMech(g, x, y, o): g — контекст холста, (x, y) — точка между ступнями,
// o = {cls, fac, eq:{слот:грейд}, aim, moving, t, flash, atk (0..1), dead, scale}
function mechPalette(o){
  const F = FACTIONS[o.fac] || FACTIONS.aegis, C = CLASSES[o.cls], eq = o.eq || {};
  const gc = s => eq[s] !== undefined && eq[s] !== null ? gradeColor(eq[s]) : null;
  return {
    F, glow:C ? C.color : F.color, trim:F.color,
    light:mix(F.body, "#FFFFFF", .45), mid:F.body, dark:F.dark, deep:shade(F.dark, .55),
    head:gc("head"), wpn:gc("weapon"), arm:gc("armor"), core:gc("core"), legs:gc("legs"), mod:gc("module")
  };
}
function mgrad(g, x0, y0, x1, y1, c1, c2, c3){ const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, c1); gr.addColorStop(.55, c2); gr.addColorStop(1, c3 || c2); return gr; }
function rrp(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function poly(g, pts){ g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function glowDot(g, x, y, r, c, a){ g.save(); g.globalAlpha = a == null ? 1 : a; g.shadowColor = c; g.shadowBlur = r*3; g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill(); g.restore(); }
function capsule(g, x1, y1, x2, y2, w, fill, stroke){
  g.save(); g.lineCap = "round"; g.strokeStyle = stroke || "#141A21"; g.lineWidth = w + 2.4;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.strokeStyle = fill; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
const OUT = "#12171D";

// ---- ноги ----
function mechLeg(g, P, kind, hx, hy, ph, front, moving){
  const sw = moving ? Math.sin(ph)*0.42 : 0, lift = moving ? Math.max(0, Math.sin(ph + Math.PI/2))*0.55 : 0;
  const shade2 = front ? 1 : .72;
  const metal = mgrad(g, hx - 6, hy, hx + 6, hy + 30, shade(P.light, shade2), shade(P.mid, shade2), shade(P.dark, shade2));
  if(kind === "reaper"){
    // ноги коленями назад: бедро вперёд, голень назад, стопа вперёд
    const a1 = sw - 0.45, k = [hx + Math.sin(a1)*13, hy + Math.cos(a1)*13];
    const a2 = a1 + 1.25 - lift*0.6, a = [k[0] - Math.sin(a2)*12, k[1] + Math.cos(a2)*12];
    const f = [a[0] + 2 + lift*3, a[1] + 8 - lift*3];
    capsule(g, hx, hy, k[0], k[1], 6.5, metal);
    capsule(g, k[0], k[1], a[0], a[1], 5, metal);
    capsule(g, a[0], a[1], f[0], f[1], 3.6, shade(P.dark, shade2));
    g.fillStyle = shade(P.dark, shade2); poly(g, [[f[0] - 4, f[1] + 1], [f[0] + 6, f[1] + 1], [f[0] + 2, f[1] - 3]]); g.fill();
    glowDot(g, k[0], k[1], 1.6, P.glow, front ? .9 : .5);
    return;
  }
  const heavy = kind === "guard", L1 = heavy ? 14 : 14, L2 = heavy ? 13 : 15, w1 = heavy ? 9 : 6.5, w2 = heavy ? 10 : 6;
  const a1 = sw, k = [hx + Math.sin(a1)*L1, hy + Math.cos(a1)*L1];
  const a2 = a1 - lift, f = [k[0] + Math.sin(a2)*L2, k[1] + Math.cos(a2)*L2];
  capsule(g, hx, hy, k[0], k[1], w1, metal);
  // бедро: бронепластина со светящейся полосой
  g.save(); g.translate(hx, hy); g.rotate(-a1);
  g.fillStyle = mgrad(g, -w1/2, 0, w1/2, L1, shade(P.light, shade2), shade(P.mid, shade2), shade(P.dark, shade2)); g.strokeStyle = OUT; g.lineWidth = 1.1;
  rrp(g, -w1/2 - 1.5, 1, w1 + 3, L1*0.7, 2.5); g.fill(); g.stroke();
  g.globalAlpha = front ? .9 : .5; g.fillStyle = P.glow; g.fillRect(-.8, 3, 1.6, L1*0.45); g.globalAlpha = 1;
  g.restore();
  // голень: бронированная пластина
  g.save(); g.translate(k[0], k[1]); g.rotate(-a2);
  g.fillStyle = mgrad(g, -w2/2, 0, w2/2, L2, shade(P.light, shade2), shade(P.mid, shade2), shade(P.dark, shade2));
  g.strokeStyle = OUT; g.lineWidth = 1.2;
  poly(g, [[-w2/2 - 1, -1], [w2/2 + 1, -1], [w2/2, L2 - 1], [-w2/2, L2 - 1]]); g.fill(); g.stroke();
  if(P.legs){ g.fillStyle = P.legs; g.fillRect(-w2/2 + 1, L2*0.35, w2 - 2, 2.2); }
  // ступня
  g.fillStyle = shade(P.dark, shade2); rrp(g, -w2/2 - 2, L2 - 2, w2 + 7, heavy ? 5.5 : 4.5, 2); g.fill(); g.stroke();
  g.restore();
  g.fillStyle = shade(P.deep, 1.3); g.strokeStyle = OUT; g.lineWidth = 1; g.beginPath(); g.arc(k[0], k[1], heavy ? 4.2 : 3.2, 0, Math.PI*2); g.fill(); g.stroke();
  glowDot(g, k[0], k[1], 1.3, P.glow, front ? .85 : .45);
}

// ---- голова ----
function mechHead(g, P, kind, hx, hy, t, lookUp){
  g.save(); g.translate(hx, hy); g.rotate(lookUp*0.25);
  const eye = P.head || P.glow;
  if(kind === "guard"){
    g.fillStyle = mgrad(g, -7, -8, 7, 6, P.light, P.mid, P.dark); g.strokeStyle = OUT; g.lineWidth = 1.3;
    poly(g, [[-7, -6], [6, -7], [8, 1], [5, 6], [-6, 6], [-8, 0]]); g.fill(); g.stroke();
    g.fillStyle = "#0B0F13"; rrp(g, -3, -2.5, 11, 3.6, 1.5); g.fill();
    g.save(); g.shadowColor = eye; g.shadowBlur = 8; g.fillStyle = eye; rrp(g, -1, -1.8, 8.5, 2, 1); g.fill(); g.restore();
  } else if(kind === "reaper"){
    g.fillStyle = mgrad(g, -6, -9, 6, 5, P.light, P.mid, P.dark); g.strokeStyle = OUT; g.lineWidth = 1.2;
    poly(g, [[-6, -3], [0, -8], [9, -4], [7, 3], [0, 6], [-5, 3]]); g.fill(); g.stroke();
    g.fillStyle = P.dark; poly(g, [[-5, -5], [-13, -13], [-3, -8]]); g.fill(); g.stroke();
    poly(g, [[-2, -7], [-7, -17], [1, -9]]); g.fill(); g.stroke();
    glowDot(g, 4.5, -2.4, 1.6, eye); glowDot(g, 7.4, -1.6, 1.2, eye);
  } else if(kind === "sniper"){
    g.fillStyle = mgrad(g, -6, -8, 6, 6, P.light, P.mid, P.dark); g.strokeStyle = OUT; g.lineWidth = 1.2;
    rrp(g, -6, -7, 12, 12, 4); g.fill(); g.stroke();
    // прицел-монокль
    g.fillStyle = "#0B0F13"; g.beginPath(); g.arc(5.5, -1.5, 4.6, 0, Math.PI*2); g.fill(); g.stroke();
    g.save(); g.shadowColor = eye; g.shadowBlur = 10; g.fillStyle = eye; g.beginPath(); g.arc(5.8, -1.5, 2.4, 0, Math.PI*2); g.fill(); g.restore();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(5, -2.4, .8, 0, Math.PI*2); g.fill();
    g.strokeStyle = P.dark; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-4, -7); g.lineTo(-8, -15); g.stroke();
    glowDot(g, -8, -15.5, 1.3, P.glow, .6 + Math.sin(t*5)*.4);
  } else {
    // техномант: гладкий купол, визор-полоса
    g.fillStyle = mgrad(g, -6, -8, 6, 6, P.light, P.mid, P.dark); g.strokeStyle = OUT; g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(0, -1, 6.8, 7.4, 0, 0, Math.PI*2); g.fill(); g.stroke();
    g.save(); g.shadowColor = eye; g.shadowBlur = 10; g.fillStyle = eye; rrp(g, -2, -2.8, 9, 3, 1.5); g.fill(); g.restore();
  }
  g.restore();
}

// ---- оружие и руки ----
function mechArmFront(g, P, kind, sx, sy, la, t, atk){
  const wglow = P.wpn || P.glow;
  g.save(); g.translate(sx, sy);
  if(kind === "guard"){
    // щит на передней руке, слегка повёрнут к цели
    g.rotate(la*0.35 - 0.15);
    capsule(g, 0, 0, 7, 9, 6.5, mgrad(g, 0, 0, 8, 10, P.light, P.mid, P.dark));
    g.translate(10, 7);
    g.fillStyle = mgrad(g, -7, -14, 7, 14, P.light, P.mid, P.deep); g.strokeStyle = OUT; g.lineWidth = 1.5;
    poly(g, [[-4, -15], [6, -12], [7, 8], [1, 16], [-5, 9]]); g.fill(); g.stroke();
    g.strokeStyle = P.arm || P.trim; g.lineWidth = 1.6; poly(g, [[-2, -11], [4, -9], [5, 7], [1, 12], [-3, 7]]); g.stroke();
    glowDot(g, 1.5, -1, 2, wglow, .95);
  } else if(kind === "reaper"){
    const sw = atk > 0 ? -1.4 + (1 - atk)*2.4 : la;
    g.rotate(sw);
    capsule(g, 0, 0, 12, 0, 5.5, mgrad(g, 0, -3, 12, 3, P.light, P.mid, P.dark));
    g.translate(12, 0);
    g.fillStyle = shade(P.dark, 1.2); rrp(g, -1, -3.5, 6, 7, 2); g.fill();
    // клинок
    g.save(); g.shadowColor = wglow; g.shadowBlur = 8;
    g.fillStyle = mgrad(g, 0, -4, 26, 4, "#FFFFFF", mix(wglow, "#FFFFFF", .5), wglow);
    g.beginPath(); g.moveTo(3, -3); g.quadraticCurveTo(18, -9, 30, -4); g.quadraticCurveTo(18, -2, 4, 2); g.closePath(); g.fill(); g.restore();
    g.strokeStyle = OUT; g.lineWidth = .8; g.stroke();
  } else if(kind === "sniper"){
    g.rotate(la);
    const kick = atk > 0 ? -atk*4 : 0;
    g.translate(kick, 0);
    // длинная винтовка
    g.fillStyle = mgrad(g, 0, -4, 0, 5, "#8C98A5", "#3A444F", "#1C232B"); g.strokeStyle = OUT; g.lineWidth = 1.2;
    rrp(g, -8, -3, 22, 7, 2); g.fill(); g.stroke();
    g.fillStyle = "#2A333D"; rrp(g, 12, -1.8, 26, 3.6, 1.4); g.fill(); g.stroke();
    rrp(g, -2, -8, 12, 4, 1.6); g.fill(); g.stroke();
    g.fillStyle = wglow; g.fillRect(36, -1.8, 3, 3.6);
    glowDot(g, 8, -6, 1.3, wglow);
    if(atk > .6){ glowDot(g, 42, 0, 4, "#FFE08A", .8); }
    capsule(g, -2, 3, 3, 9, 5, mgrad(g, -2, 3, 3, 9, P.light, P.mid, P.dark));
  } else if(kind === "techno"){
    g.rotate(la);
    capsule(g, 0, 0, 13, 0, 5, mgrad(g, 0, -3, 13, 3, P.light, P.mid, P.dark));
    g.fillStyle = P.dark; g.beginPath(); g.arc(14, 0, 3.4, 0, Math.PI*2); g.fill();
    // энергосфера над ладонью
    const r = 5 + Math.sin(t*6)*.8 + atk*3;
    g.save(); g.shadowColor = wglow; g.shadowBlur = 16;
    const gr = g.createRadialGradient(22, 0, 0, 22, 0, r); gr.addColorStop(0, "#FFFFFF"); gr.addColorStop(.5, wglow); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(22, 0, r*1.4, 0, Math.PI*2); g.fill(); g.restore();
    g.strokeStyle = wglow; g.lineWidth = 1; g.globalAlpha = .7; g.beginPath(); g.ellipse(22, 0, r*1.6, r*.6, t*3, 0, Math.PI*2); g.stroke(); g.globalAlpha = 1;
  } else {
    g.rotate(la);
    capsule(g, 0, 0, 12, 0, 5.5, mgrad(g, 0, -3, 12, 3, P.light, P.mid, P.dark));
    g.fillStyle = "#2A333D"; rrp(g, 10, -3, 12, 6, 2); g.fill();
    g.fillStyle = wglow; g.fillRect(20, -2, 3, 4);
  }
  g.restore();
}
function mechArmBack(g, P, kind, sx, sy, la, t, moving, atk){
  const sw = moving ? Math.sin(t*9)*0.35 : Math.sin(t*2)*0.05;
  g.save(); g.translate(sx, sy); g.globalAlpha = .92;
  const metal = mgrad(g, -3, 0, 3, 14, shade(P.light, .8), shade(P.mid, .8), shade(P.dark, .8));
  if(kind === "guard"){
    // молот в задней руке
    const a = atk > 0 ? -2 + (1 - atk)*2.6 : 0.35 + sw;
    g.rotate(a);
    capsule(g, 0, 0, 0, 12, 7, metal);
    g.translate(0, 14);
    g.strokeStyle = "#3A444F"; g.lineWidth = 2.5; g.beginPath(); g.moveTo(0, -2); g.lineTo(0, 10); g.stroke();
    g.fillStyle = mgrad(g, -7, 8, 7, 16, shade(P.light, .85), shade(P.mid, .85), shade(P.deep, .9)); g.strokeStyle = OUT; g.lineWidth = 1.2;
    rrp(g, -7, 9, 14, 8, 2); g.fill(); g.stroke();
    glowDot(g, 0, 13, 1.4, P.wpn || P.glow, .8);
  } else if(kind === "reaper"){
    g.rotate(0.6 + sw);
    capsule(g, 0, 0, 0, 12, 5, metal);
    g.save(); g.shadowColor = P.wpn || P.glow; g.shadowBlur = 6; g.fillStyle = mix(P.wpn || P.glow, "#FFFFFF", .3);
    g.beginPath(); g.moveTo(-1, 12); g.quadraticCurveTo(-5, 22, -2, 30); g.quadraticCurveTo(2, 22, 2.5, 12); g.closePath(); g.fill(); g.restore();
  } else if(kind === "sniper"){
    // задняя рука держит винтовку снизу
    g.rotate(la + 0.5);
    capsule(g, 0, 0, 10, 2, 4.6, metal);
  } else if(kind === "techno"){
    g.rotate(0.5 + sw);
    capsule(g, 0, 0, 0, 12, 4.5, metal);
    glowDot(g, 0, 14, 2.4, P.glow, .7 + Math.sin(t*4)*.3);
  } else {
    g.rotate(0.4 + sw); capsule(g, 0, 0, 0, 12, 5, metal);
  }
  g.restore();
}

// ---- корпус ----
function mechTorso(g, P, kind, bx, by, t){
  const core = P.core || P.glow, trim = P.arm || P.trim;
  g.save(); g.translate(bx, by); g.strokeStyle = OUT; g.lineWidth = 1.5;
  if(kind === "guard"){
    g.fillStyle = mgrad(g, -12, -14, 12, 12, P.light, P.mid, P.deep);
    poly(g, [[-12, -12], [12, -14], [14, 0], [9, 11], [-9, 11], [-13, 0]]); g.fill(); g.stroke();
    g.strokeStyle = trim; g.lineWidth = 1.6; poly(g, [[-8, -9], [8, -10], [10, 0], [6, 7], [-6, 7], [-9, 0]]); g.stroke();
    g.fillStyle = "#0B0F13"; g.beginPath(); g.arc(1, -2, 5, 0, Math.PI*2); g.fill();
    glowDot(g, 1, -2, 3.4, core);
    // огромные наплечники
    for(const [x, s] of [[-12, .82], [12, 1]]){
      g.save(); g.translate(x, -12); g.scale(s, s);
      g.fillStyle = mgrad(g, -9, -8, 9, 8, P.light, P.mid, P.dark); g.strokeStyle = OUT; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(0, 0, 10, 7.5, x < 0 ? -.3 : .3, 0, Math.PI*2); g.fill(); g.stroke();
      g.strokeStyle = P.trim; g.lineWidth = 2; g.beginPath(); g.ellipse(0, 1, 7, 4.5, x < 0 ? -.3 : .3, Math.PI*.1, Math.PI*.9); g.stroke();
      g.restore();
    }
  } else if(kind === "reaper"){
    g.fillStyle = mgrad(g, -9, -14, 9, 10, P.light, P.mid, P.deep);
    poly(g, [[-9, -12], [10, -13], [6, 3], [2, 11], [-3, 11], [-6, 3]]); g.fill(); g.stroke();
    g.strokeStyle = trim; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-6, -9); g.lineTo(1, 6); g.lineTo(7, -10); g.stroke();
    glowDot(g, 1, -4, 2.6, core);
    for(const [x, dir] of [[-9, -1], [10, 1]]){
      g.fillStyle = mgrad(g, x - 6, -20, x + 6, -8, P.light, P.mid, P.dark); g.strokeStyle = OUT; g.lineWidth = 1.2;
      poly(g, [[x - 5*dir, -9], [x + 7*dir, -12], [x + 3*dir, -22], [x - 2*dir, -14]]); g.fill(); g.stroke();
    }
    // энергокабель-хвост за спиной
    g.strokeStyle = P.glow; g.globalAlpha = .7; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-8, 4); g.quadraticCurveTo(-18, 8 + Math.sin(t*4)*3, -22, 16); g.stroke(); g.globalAlpha = 1;
  } else if(kind === "sniper"){
    // рюкзак с антенной
    g.fillStyle = mgrad(g, -16, -14, -6, 6, shade(P.mid, .9), P.dark, P.deep);
    rrp(g, -16, -13, 9, 18, 3); g.fill(); g.stroke();
    glowDot(g, -11.5, -8, 1.3, P.mod || P.glow, .6 + Math.sin(t*3)*.4);
    g.strokeStyle = P.dark; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-14, -13); g.lineTo(-17, -28); g.stroke();
    glowDot(g, -17, -28.5, 1.4, P.glow, .5 + Math.sin(t*6)*.5);
    g.strokeStyle = OUT; g.lineWidth = 1.4;
    g.fillStyle = mgrad(g, -8, -14, 8, 10, P.light, P.mid, P.deep);
    poly(g, [[-8, -12], [8, -13], [9, 2], [5, 10], [-5, 10], [-8, 2]]); g.fill(); g.stroke();
    g.fillStyle = trim; g.fillRect(-6, -4, 12, 2);
    glowDot(g, 0, 3, 2.2, core);
    g.fillStyle = mgrad(g, 4, -16, 12, -8, P.light, P.mid, P.dark); rrp(g, 3, -16, 10, 7, 3); g.fill(); g.stroke();
  } else if(kind === "techno"){
    // нимб за головой
    g.save(); g.translate(0, -22); g.rotate(t*.8);
    g.shadowColor = P.glow; g.shadowBlur = 10; g.strokeStyle = P.glow; g.lineWidth = 2; g.setLineDash([6, 3]);
    g.beginPath(); g.arc(0, 0, 11, 0, Math.PI*2); g.stroke(); g.restore();
    g.fillStyle = mgrad(g, -8, -14, 8, 12, P.light, P.mid, P.deep);
    poly(g, [[-7, -12], [7, -13], [8, 0], [4, 8], [-4, 8], [-8, 0]]); g.fill(); g.stroke();
    g.strokeStyle = trim; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-5, -9); g.lineTo(0, -4); g.lineTo(5, -10); g.stroke();
    glowDot(g, 0, -1, 3, core);
    // парящие плечевые сферы
    for(const [x, ph] of [[-12, 0], [12, 1.5]]){ glowDot(g, x, -11 + Math.sin(t*3 + ph)*1.5, 3, P.glow, .9); g.fillStyle = P.dark; g.beginPath(); g.arc(x, -11 + Math.sin(t*3 + ph)*1.5, 2, 0, Math.PI*2); g.fill(); }
  } else {
    g.fillStyle = mgrad(g, -9, -13, 9, 10, P.light, P.mid, P.deep);
    poly(g, [[-9, -12], [9, -13], [10, 1], [6, 10], [-6, 10], [-9, 1]]); g.fill(); g.stroke();
    glowDot(g, 0, -2, 2.6, core);
  }
  // таз
  g.fillStyle = mgrad(g, -8, 8, 8, 16, P.mid, P.dark, P.deep); g.strokeStyle = OUT; g.lineWidth = 1.2;
  if(kind === "techno"){
    // «юбка» из пластин
    for(let i = -2; i <= 2; i++){ poly(g, [[i*4 - 3, 7], [i*4 + 3, 7], [i*5 + 3, 19], [i*5 - 3, 19]]); g.fill(); g.stroke(); }
    g.fillStyle = P.glow; g.globalAlpha = .6; g.fillRect(-10, 17, 20, 1.5); g.globalAlpha = 1;
  } else { rrp(g, -8, 8, 16, 7, 2.5); g.fill(); g.stroke(); }
  g.restore();
}

function drawMech(g, x, y, o){
  const kind = o.cls && CLASSES[o.cls] ? o.cls : "base", P = mechPalette(o), t = o.t || 0, s = o.scale || 1;
  const aim = o.aim || 0, dir = Math.cos(aim) >= 0 ? 1 : -1;
  let la = Math.atan2(Math.sin(aim), Math.cos(aim)*dir); la = Math.max(-1.3, Math.min(1.1, la));
  const moving = !!o.moving, ph = t*9, atk = Math.max(0, o.atk || 0);
  const hover = kind === "techno";
  const bob = hover ? Math.sin(t*2.4)*2.2 - 5 : (moving ? -Math.abs(Math.sin(ph))*2.2 : Math.sin(t*2)*0.6);
  const hipY = (kind === "guard" ? -26 : kind === "reaper" ? -27 : -30) + bob;
  // тень
  g.save(); g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(x, y + 1, (kind === "guard" ? 17 : 13)*s, 5*s, 0, 0, Math.PI*2); g.fill(); g.restore();
  if(hover){ g.save(); const gr = g.createRadialGradient(x, y, 0, x, y, 14*s); gr.addColorStop(0, P.glow); gr.addColorStop(1, "rgba(0,0,0,0)"); g.globalAlpha = .45 + Math.sin(t*5)*.15; g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 14*s, 5*s, 0, 0, Math.PI*2); g.fill(); g.restore(); }
  g.save(); g.translate(x, y); g.scale(dir*s, s);
  const legW = kind === "guard" ? 6 : 4.5;
  if(!hover){
    mechLeg(g, P, kind, -legW, hipY + 12, ph + Math.PI, false, moving);
  }
  const torsoY = hipY - 2;
  const shoulderF = [kind === "guard" ? 11 : 8, torsoY - 11], shoulderB = [kind === "guard" ? -11 : -8, torsoY - 11];
  mechArmBack(g, P, kind, shoulderB[0], shoulderB[1], la, t, moving, atk);
  if(hover){ // короткие ноги под «юбкой»
    g.fillStyle = P.dark; g.strokeStyle = OUT; g.lineWidth = 1;
    rrp(g, -6, hipY + 14, 5, 9, 2); g.fill(); g.stroke(); rrp(g, 2, hipY + 14, 5, 9, 2); g.fill(); g.stroke();
  }
  mechTorso(g, P, kind, 0, torsoY, t);
  if(!hover) mechLeg(g, P, kind, legW, hipY + 12, ph, true, moving);
  mechHead(g, P, kind, kind === "guard" ? 1 : 1.5, torsoY - (kind === "guard" ? 18 : 20), t, Math.max(-1, Math.min(1, la)));
  mechArmFront(g, P, kind, shoulderF[0], shoulderF[1], la, t, atk);
  g.restore();
  if(o.flash > 0){ g.save(); g.globalAlpha = .5; g.fillStyle = "#fff"; g.beginPath(); g.ellipse(x, y - 28*s, 16*s, 30*s, 0, 0, Math.PI*2); g.fill(); g.restore(); }
}

// ---- портреты для интерфейса: та же модель, отрисованная крупно ----
const mechCache = new Map();
function mechImg(cls, fac, eq, size){
  const key = [cls, fac, JSON.stringify(eq || {}), size || 120].join("|");
  if(mechCache.has(key)) return mechCache.get(key);
  const W = size || 120, H = Math.round(W*1.25), c = document.createElement("canvas");
  c.width = W*2; c.height = H*2;
  const g = c.getContext("2d"); g.scale(2, 2);
  drawMech(g, W*0.5, H*0.9, {cls, fac, eq, aim:0.15, t:0.6, scale:W/60});
  const html = `<img src="${c.toDataURL()}" alt="" style="width:100%;height:100%;object-fit:contain">`;
  mechCache.set(key, html); if(mechCache.size > 60) mechCache.delete(mechCache.keys().next().value);
  return html;
}
const eqGrades = eq => { const o = {}; for(const k in eq || {}) if(eq[k]) o[k] = typeof eq[k] === "object" ? eq[k].g : eq[k]; return o; };
// ===================== ПИКСЕЛЬ-АРТ МЕХИ =====================
// Каждый кадр рисуется попиксельно в сетке 48×44: детали с бликом и тенью, автоматическая тёмная обводка,
// светящиеся пиксели получают отдельный слой свечения. Кадры: покой (2), шаг (4), атака (2).
// Спрайт смотрит вправо, точка опоры — между ступнями (20, 42).
const SPR_W = 48, SPR_H = 44, SPR_AX = 20, SPR_AY = 42;
const sprCache = new Map();

function sprPalette(o){
  const F = FACTIONS[o.fac] || FACTIONS.aegis, C = CLASSES[o.cls], eq = o.eq || {};
  const gc = s => eq[s] !== undefined && eq[s] !== null ? gradeColor(eq[s]) : null;
  const md = F.body, glow = C ? C.color : F.color;
  return {
    hi:mix(md, "#FFFFFF", .55), lt:mix(md, "#FFFFFF", .25), md, dk:F.dark, dd:shade(F.dark, .55),
    trim:F.color, glow, glowHi:mix(glow, "#FFFFFF", .55),
    eye:gc("head") || glow, wpn:gc("weapon") || glow, arm:gc("armor") || F.color, core:gc("core") || glow,
    legs:gc("legs") || shade(F.dark, .8), mod:gc("module") || glow,
    steel:"#9AA6B2", steelHi:"#D5DCE3", steelDk:"#4B5561", gun:"#2F3842", gunHi:"#56626F"
  };
}

function buildSprite(kind, P, anim, f){
  const buf = new Array(SPR_W*SPR_H).fill(null), glowPx = [];
  const put = (x, y, c, g) => { x = Math.round(x); y = Math.round(y); if(x < 0 || y < 0 || x >= SPR_W || y >= SPR_H || !c) return; buf[y*SPR_W + x] = c; if(g) glowPx.push([x, y, c]); };
  const rect = (x, y, w, h, c, g) => { for(let j = 0; j < h; j++) for(let i = 0; i < w; i++) put(x + i, y + j, c, g); };
  // деталь с объёмом: блик сверху, светлый левый край, тень справа и снизу
  const block = (x, y, w, h, base, lt, dk, hi) => {
    rect(x, y, w, h, base);
    for(let i = 0; i < w; i++){ put(x + i, y, hi || lt); put(x + i, y + h - 1, dk); }
    for(let j = 1; j < h - 1; j++){ put(x, y + j, lt); put(x + w - 1, y + j, dk); }
  };
  const line = (x0, y0, x1, y1, c, g) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for(let i = 0; i <= n; i++) put(x0 + (x1 - x0)*i/n, y0 + (y1 - y0)*i/n, c, g); };
  const disc = (cx, cy, r, c, g) => { for(let y = -r; y <= r; y++) for(let x = -r; x <= r; x++) if(x*x + y*y <= r*r + r*0.6) put(cx + x, cy + y, c, g); };
  const M = [P.md, P.lt, P.dk, P.hi];            // металл корпуса
  const S = [P.steel, P.steelHi, P.steelDk, "#EEF2F5"];

  // кадры анимации: смещения ног и корпуса
  let bob = 0, legF = 0, legB = 0, liftF = 0, liftB = 0;
  if(anim === "walk"){ const W = [[2, -2, 0, 1, 0], [0, 0, 0, 0, -1], [-2, 2, 1, 0, 0], [0, 0, 0, 0, -1]][f]; [legF, legB, liftF, liftB, bob] = W; }
  if(anim === "idle") bob = f ? 0 : 0;
  const B = bob, idleGlow = anim === "idle" && f === 1;

  const legPair = (thick, xb, xf) => {
    const leg = (x, dx, lift, front) => {
      const c = front ? M : [P.dk, P.md, P.dd, P.lt];
      block(x + dx, 32 - lift, thick, 5, c[0], c[1], c[2], c[3]);              // бедро
      rect(x + dx, 34 - lift, thick, 1, P.legs);                                // полоса грейда
      block(x + dx - (thick > 4 ? 0 : 0), 37 - lift, thick, 4, c[2], c[0], P.dd); // голень
      block(x + dx - 1, 41 - lift, thick + 3, 2, P.dd, c[2], P.dd);              // ступня
      put(x + dx + (thick >> 1), 36 - lift, P.glow, true);                      // коленный огонёк
    };
    leg(xb, legB, liftB, false); leg(xf, legF, liftF, true);
  };

  if(kind === "guard"){
    legPair(5, 14, 21);
    rect(14, 30 + B, 13, 3, P.dd);                                              // таз
    block(12, 19 + B, 17, 12, P.md, P.lt, P.dk, P.hi);                          // корпус
    line(14, 23 + B, 26, 23 + B, P.arm); line(14, 28 + B, 26, 28 + B, P.dk);
    disc(20, 25 + B, 2, "#0B0F13"); disc(20, 25 + B, 1, P.core, true); put(20, 25 + B, "#fff", true);
    // голова в шлеме, утоплена между плеч
    block(16, 12 + B, 10, 8, P.md, P.lt, P.dk, P.hi);
    rect(19, 15 + B, 7, 2, "#0B0F13"); rect(20, 15 + B, 5, 1, P.eye, true);
    line(17, 11 + B, 24, 11 + B, P.trim);
    // задняя рука с молотом
    if(anim === "attack" && f === 0){ block(9, 17 + B, 4, 6, P.dk, P.md, P.dd); line(10, 16 + B, 12, 4 + B, P.gunHi); block(7, 1 + B, 9, 5, P.steel, P.steelHi, P.steelDk, "#EEF2F5"); put(11, 3 + B, P.wpn, true); }
    else if(anim === "attack"){ block(27, 22 + B, 5, 4, P.dk, P.md, P.dd); line(30, 24 + B, 40, 28 + B, P.gunHi); block(38, 25 + B, 6, 8, P.steel, P.steelHi, P.steelDk, "#EEF2F5"); put(41, 29 + B, P.wpn, true); for(const [x, y] of [[45, 26], [46, 30], [44, 34]]) put(x, y + B, "#FFE08A", true); }
    else { block(9, 22 + B, 4, 8, P.dk, P.md, P.dd); line(10, 29 + B, 10, 37 + B, P.gunHi); block(7, 36 + B, 8, 4, P.steel, P.steelHi, P.steelDk, "#EEF2F5"); put(10, 37 + B, P.wpn, true); }
    // огромные наплечники
    block(8, 16 + B, 8, 6, P.md, P.lt, P.dk, P.hi); rect(9, 20 + B, 6, 1, P.trim);
    block(25, 16 + B, 8, 6, P.md, P.lt, P.dk, P.hi); rect(26, 20 + B, 6, 1, P.arm);
    // башенный щит спереди
    if(!(anim === "attack" && f === 1)){
      block(29, 20 + B, 8, 16, P.md, P.lt, P.dk, P.hi);
      line(30, 21 + B, 35, 21 + B, P.arm); line(30, 34 + B, 35, 34 + B, P.arm); line(30, 21 + B, 30, 34 + B, P.arm); line(35, 21 + B, 35, 34 + B, P.arm);
      disc(32, 27 + B, 1, P.wpn, true); put(32, 25 + B, P.trim); put(32, 29 + B, P.trim);
    } else block(31, 22 + B, 5, 12, P.md, P.lt, P.dk, P.hi);
  }

  else if(kind === "reaper"){
    // ноги коленями назад
    const dleg = (x, dx, lift, front) => {
      const c = front ? M : [P.dk, P.md, P.dd, P.lt];
      block(x + dx, 30 - lift, 4, 5, c[0], c[1], c[2], c[3]);
      line(x + dx + 3, 35 - lift, x + dx - 1, 38 - lift, c[2]); line(x + dx + 2, 35 - lift, x + dx - 2, 38 - lift, c[0]);
      line(x + dx - 2, 38 - lift, x + dx, 41 - lift, c[2]);
      rect(x + dx - 1, 41 - lift, 5, 1, P.dd); put(x + dx + 4, 41 - lift, P.dd);
      put(x + dx + 1, 32 - lift, P.legs); put(x + dx + 2, 35 - lift, P.glow, true);
    };
    dleg(15, legB, liftB, false); dleg(21, legF, liftF, true);
    // энергокабель-хвост
    for(let i = 0; i < 9; i++) put(13 - i, 27 + B + Math.round(Math.sin(i*0.9 + f)*1.2) + (i >> 1), i % 2 ? P.glow : shade(P.glow, .6), i % 3 === 0);
    // V-образный корпус
    for(let j = 0; j < 11; j++){ const w = 13 - Math.round(j*0.6), x0 = 14 + Math.round(j*0.3); rect(x0, 19 + B + j, w, 1, j < 2 ? P.hi : j > 8 ? P.dk : P.md); put(x0, 19 + B + j, P.lt); put(x0 + w - 1, 19 + B + j, P.dk); }
    line(16, 21 + B, 20, 28 + B, P.arm); line(25, 21 + B, 21, 28 + B, P.arm);
    put(20, 23 + B, P.core, true); put(21, 23 + B, P.core, true); put(20, 24 + B, P.core, true); put(21, 24 + B, "#fff", true);
    // шипастые наплечники
    line(12, 20 + B, 15, 16 + B, P.md); line(13, 21 + B, 16, 17 + B, P.lt); line(11, 19 + B, 13, 14 + B, P.hi);
    line(26, 19 + B, 29, 14 + B, P.lt); line(27, 20 + B, 30, 15 + B, P.md); line(28, 20 + B, 31, 17 + B, P.dk);
    // угловатая голова с рогами
    for(let j = 0; j < 7; j++) rect(18 + (j < 2 ? 1 : 0), 11 + B + j, 8 - (j > 4 ? 2 : 0), 1, j === 0 ? P.hi : j > 4 ? P.dk : P.md);
    // стреловидный гребень назад, как у хищного шлема
    for(let i = 0; i < 7; i++){ rect(19 - i, 10 + B + Math.floor(i/2), 3 + Math.floor(i/3), 1, i < 2 ? P.hi : P.lt); }
    for(let i = 0; i < 6; i++) put(18 - i, 12 + B + Math.floor(i/2), P.dk);
    put(12, 13 + B, P.dd); put(13, 13 + B, P.glow, true);
    // челюсть-забрало
    rect(22, 16 + B, 4, 1, P.dk); put(25, 15 + B, P.dk);
    put(23, 14 + B, P.eye, true); put(24, 14 + B, P.eye, true); put(21, 14 + B, P.eye, true);
    // клинки
    const blade = (x0, y0, x1, y1, bright) => { line(x0, y0, x1, y1, bright ? P.wpn : shade(P.wpn, .6), bright); line(x0, y0 + 1, x1 - 1, y1 + 1, bright ? mix(P.wpn, "#FFFFFF", .6) : shade(P.wpn, .45), bright); };
    line(15, 22 + B, 12, 27 + B, P.dk); blade(12, 27 + B, 8, 36 + B, false);                 // задняя рука
    if(anim === "attack" && f === 0){ line(26, 21 + B, 28, 17 + B, P.md); blade(28, 17 + B, 34, 5 + B, true); }
    else if(anim === "attack"){ line(26, 22 + B, 31, 25 + B, P.md); blade(31, 25 + B, 45, 30 + B, true); for(let i = 0; i < 5; i++) put(33 + i*2, 19 + B + i*2, P.glowHi, true); }
    else { line(26, 22 + B, 29, 26 + B, P.md); line(27, 22 + B, 30, 26 + B, P.lt); blade(30, 26 + B, 40, 21 + B, true); }
  }

  else if(kind === "sniper"){
    legPair(3, 16, 21);
    // рюкзак с антенной
    block(10, 18 + B, 6, 11, P.dk, P.md, P.dd, P.lt); put(12, 21 + B, P.mod, true);
    line(12, 17 + B, 9, 7 + B, P.dd); put(9, 6 + B, anim === "idle" && f ? P.glowHi : P.glow, true);
    rect(16, 30 + B, 9, 2, P.dd);
    block(15, 19 + B, 10, 12, P.md, P.lt, P.dk, P.hi);                         // корпус
    rect(16, 26 + B, 8, 1, P.arm); put(20, 23 + B, P.core, true); put(19, 23 + B, P.core, true);
    // голова с прицелом-моноклем
    block(16, 10 + B, 9, 9, P.md, P.lt, P.dk, P.hi);
    disc(23, 14 + B, 2, "#0B0F13"); put(23, 14 + B, P.eye, true); put(24, 14 + B, P.eye, true); put(23, 13 + B, "#fff", true);
    rect(17, 9 + B, 5, 1, P.trim);
    // длинная винтовка
    const kick = anim === "attack" && f === 0 ? -2 : 0;
    rect(13 + kick, 23 + B, 7, 4, P.gun); rect(13 + kick, 23 + B, 7, 1, P.gunHi);          // приклад
    rect(19 + kick, 22 + B, 24, 3, P.gun); rect(19 + kick, 22 + B, 24, 1, P.gunHi);        // ствол
    rect(22 + kick, 19 + B, 7, 3, P.gun); put(28 + kick, 20 + B, P.wpn, true);             // прицел
    rect(42 + kick, 22 + B, 2, 3, P.wpn, true);
    block(25 + kick, 24 + B, 3, 4, P.md, P.lt, P.dk);                                      // руки на оружии
    block(19 + kick, 25 + B, 3, 3, P.dk, P.md, P.dd);
    if(anim === "attack" && f === 0){ for(const [x, y] of [[44, 23], [45, 22], [46, 23], [45, 24], [47, 23], [45, 21], [45, 25]]) put(x, y + B, "#FFE08A", true); }
    if(anim === "attack" && f === 1){ put(44, 21 + B, "#8C98A5"); put(45, 20 + B, "#6B7580"); }
  }

  else if(kind === "techno"){
    // ---- кибер-колдун: острый капюшон, тёмный плащ со светящимися схемами, рваная накидка, посох с кристаллом ----
    const sway = anim === "walk" ? (f % 2 ? 1 : -1) : (f ? 1 : 0);
    // рваная накидка за спиной
    for(let j = 0; j < 22; j++){
      const y = 17 + B + j, x1 = 16 - Math.floor(j*0.35), w = 4 + Math.floor(j*0.35) - (j > 18 ? (j % 2) : 0);
      const xs = x1 - Math.floor(j/7)*sway*(j > 10 ? 1 : 0);
      rect(xs, y, w, 1, j % 5 === 0 ? P.dk : P.dd); put(xs, y, shade(P.dd, .8));
    }
    for(const [x, y] of [[9, 39], [11, 38], [13, 39]]) put(x - sway, y + B, P.dd);
    // тонкие ноги из-под плаща
    const slimLeg = (x, dx, lift, front) => {
      const c = front ? M : [P.dk, P.md, P.dd, P.lt];
      rect(x + dx, 36 - lift, 3, 5, c[2]); put(x + dx, 36 - lift, c[0]); put(x + dx + 1, 38 - lift, P.legs);
      rect(x + dx - 1, 41 - lift, 5, 1, P.dd); put(x + dx + 3, 40 - lift, P.dd);
    };
    slimLeg(17, legB, liftB, false); slimLeg(21, legF, liftF, true);
    // полы плаща: тёмные пластины, расходятся книзу
    for(let j = 0; j < 15; j++){
      const y = 22 + B + j, x0 = 17 - Math.floor(j/4), w = 9 + Math.floor(j/2);
      rect(x0, y, w, 1, j > 12 ? P.dd : P.dk);
      put(x0, y, P.md); put(x0 + w - 1, y, P.dd);
      if(j > 7) put(x0 + (w >> 1), y, "#07090C");
    }
    rect(13, 37 + B, 17, 1, P.arm);
    // схемы на плаще
    line(19, 23 + B, 19, 30 + B, P.glow, true); put(18, 31 + B, P.glow, true); put(17, 32 + B, P.glow, true); put(17, 33 + B, P.glowHi, true);
    line(23, 24 + B, 23, 29 + B, P.glow, true); put(24, 30 + B, P.glow, true); put(25, 31 + B, P.glowHi, true);
    put(21, 26 + B, P.glow, true); put(21, 27 + B, P.glow, true);
    for(let i = 0; i < 5; i++) put(15 + i*3, 37 + B, P.glow, true);
    // пояс с ядром
    rect(16, 22 + B, 10, 1, P.dd); put(21, 22 + B, P.core, true); put(20, 22 + B, P.core, true);
    // узкая грудь и воротник
    block(17, 16 + B, 8, 6, P.dk, P.md, P.dd, P.lt);
    line(18, 17 + B, 21, 20 + B, P.trim); line(24, 17 + B, 21, 20 + B, P.trim);
    // острый капюшон: пустота вместо лица и три глаза
    const hood = [[19, 2], [18, 4], [17, 6], [16, 8], [15, 10], [15, 11], [15, 11], [15, 11], [15, 11], [16, 10], [17, 8]];
    hood.forEach(([x0, w], j) => { rect(x0, 4 + B + j, w, 1, j < 2 ? P.hi : j < 5 ? P.lt : j > 8 ? P.dk : P.md); put(x0, 4 + B + j, P.lt); put(x0 + w - 1, 4 + B + j, P.dk); });
    for(let i = 0; i < 4; i++) put(14 - i, 11 + B + i, i % 2 ? P.dd : P.dk);             // складка назад
    const face = [[21, 4], [20, 5], [20, 6], [20, 6], [21, 5]];
    face.forEach(([x0, w], j) => rect(x0, 9 + B + j, w, 1, "#05070A"));
    line(25, 8 + B, 26, 13 + B, P.trim);                                                 // кромка капюшона
    put(21, 10 + B, P.eye, true); put(24, 10 + B, P.eye, true); put(22, 12 + B, P.eye, true); put(23, 12 + B, shade(P.eye, .8), true);
    // широкие рукава; задняя рука со светящимися пальцами
    for(let i = 0; i < 6; i++) rect(15 - Math.floor(i/2), 18 + B + i, 3 + Math.floor(i/2), 1, i === 5 ? P.dd : P.dk);
    put(12, 24 + B, P.glowHi, true); put(11, 25 + B, P.glow, true); put(13, 25 + B, P.glow, true);
    // посох и передняя рука
    const up = anim === "attack" && f === 0, fw = anim === "attack" && f === 1;
    const sx = 29, top = up ? 0 : 5;
    if(fw){ line(26, 22 + B, 39, 13 + B, P.gunHi); line(26, 23 + B, 39, 14 + B, P.gun); }
    else { line(sx, top + 7 + B, sx, 41 + B, P.gun); line(sx + 1, top + 7 + B, sx + 1, 40 + B, P.gunHi); rect(sx - 1, 41 + B, 3, 1, P.dd); }
    for(let i = 0; i < 4; i++) rect(25 + Math.floor(i/2), 18 + B + i, 3, 1, i === 3 ? P.dd : P.dk);   // рукав
    rect(27, 21 + B, 3, 3, P.md); put(27, 21 + B, P.lt);
    // навершие: кольцо-держатель и крупный кристалл
    const cx = fw ? 41 : sx + 1, cy = fw ? 11 : top + 3;
    put(cx - 3, cy + 1 + B, P.gunHi); put(cx + 3, cy + 1 + B, P.gunHi); put(cx - 3, cy + 2 + B, P.gun); put(cx + 3, cy + 2 + B, P.gun);
    put(cx - 2, cy + 3 + B, P.gunHi); put(cx + 2, cy + 3 + B, P.gunHi);
    for(let j = -3; j <= 3; j++){ const w = 3 - Math.abs(j); for(let i = -w + 1; i < w; i++) put(cx + i, cy + j + B, j < 0 && i <= 0 ? mix(P.wpn, "#FFFFFF", .5) : P.wpn, true); }
    put(cx, cy + B, "#fff", true); put(cx - 1, cy - 1 + B, "#fff", true);
    const sh = [[-5, -3], [5, -4], [4, 3], [-4, 4]];
    sh.forEach(([dx, dy], i) => { if((i + f) % 2 === 0 || anim === "attack") put(cx + dx, cy + dy + B, P.glowHi, true); });
    // атака: рунический круг, разряд
    if(up){
      const rx = cx + 9, ry = cy + 4 + B;
      for(let i = 0; i < 24; i++){ const a = i/24*Math.PI*2; put(rx + Math.round(Math.cos(a)*5), ry + Math.round(Math.sin(a)*5), i % 4 ? P.glow : P.glowHi, true); }
      for(let i = -2; i <= 2; i++){ put(rx + i, ry + i, P.glow, true); put(rx + i, ry - i, P.glow, true); }
      put(rx, ry, "#fff", true);
    }
    if(fw){ for(const [x, y] of [[44, 9], [46, 11], [45, 13], [47, 8], [43, 7]]) put(x, y + B, P.glowHi, true); }
  }

  else {
    legPair(4, 15, 21);
    rect(15, 30 + B, 11, 2, P.dd);
    block(14, 19 + B, 12, 12, P.md, P.lt, P.dk, P.hi);
    put(20, 24 + B, P.core, true); put(19, 24 + B, P.core, true);
    block(16, 11 + B, 9, 8, P.md, P.lt, P.dk, P.hi); rect(19, 14 + B, 6, 2, "#0B0F13"); rect(20, 14 + B, 4, 1, P.eye, true);
    line(15, 21 + B, 13, 28 + B, P.dk);
    const kick = anim === "attack" && f === 0 ? -1 : 0;
    block(25 + kick, 21 + B, 4, 4, P.md, P.lt, P.dk); rect(28 + kick, 22 + B, 8, 3, P.gun); rect(35 + kick, 22 + B, 2, 3, P.wpn, true);
    if(anim === "attack" && f === 0) for(const [x, y] of [[38, 22], [39, 23], [38, 24]]) put(x, y + B, "#FFE08A", true);
  }
  if(idleGlow) for(const g of glowPx) g.push(1);

  // автоматическая обводка тёмным контуром
  const out = buf.slice();
  for(let y = 0; y < SPR_H; y++) for(let x = 0; x < SPR_W; x++){
    if(buf[y*SPR_W + x]) continue;
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < SPR_W && Y < SPR_H && buf[Y*SPR_W + X]; });
    if(n) out[y*SPR_W + x] = "#0B0E12";
  }
  return {px:out, glow:glowPx};
}

// ключ снаряжения для кэша спрайтов: считается один раз на объект, а не JSON.stringify каждый кадр
const eqKeys = new WeakMap();
function eqKey(eq){
  if(!eq) return "";
  let k = eqKeys.get(eq); if(k !== undefined) return k;
  k = ""; for(const s of ["head", "weapon", "module", "armor", "core", "legs"]) k += (eq[s] ?? "-") + ",";
  eqKeys.set(eq, k); return k;
}
// спрайт → холст нужного масштаба (+ слой свечения), с кэшем
function spriteCanvas(kind, o, anim, f, ps){
  const P = sprPalette(o);
  const key = kind + "|" + o.fac + "|" + eqKey(o.eq) + "|" + anim + "|" + f + "|" + ps;
  let c = sprCache.get(key);
  if(c) return c;
  const spr = buildSprite(kind, P, anim, f);
  const base = document.createElement("canvas"); base.width = SPR_W*ps; base.height = SPR_H*ps;
  const g = base.getContext("2d");
  for(let i = 0; i < spr.px.length; i++){ const col = spr.px[i]; if(!col) continue; g.fillStyle = col; g.fillRect((i % SPR_W)*ps, Math.floor(i/SPR_W)*ps, ps, ps); }
  const glow = document.createElement("canvas"); glow.width = base.width; glow.height = base.height;
  const gg = glow.getContext("2d");
  for(const [x, y, col, strong] of spr.glow){ gg.shadowColor = col; gg.shadowBlur = ps*(strong ? 5 : 3.5); gg.fillStyle = col; gg.fillRect(x*ps, y*ps, ps, ps); }
  c = {base, glow};
  sprCache.set(key, c);
  if(sprCache.size > 400) sprCache.delete(sprCache.keys().next().value);
  return c;
}

// замена прежней модели: тот же вызов drawMech(g, x, y, o)
function drawMech(g, x, y, o){
  const kind = o.cls && CLASSES[o.cls] ? o.cls : "base", t = o.t || 0;
  const ps = o.ps || Math.max(1, Math.round(2*(o.scale || 1)));
  // дробный масштаб: спрайт рисуется вдвое крупнее и плавно уменьшается — пиксели остаются ровными
  // если масштаб на экране целый (например, 1,5 × плотность 2 = 3), спрайт строится сразу в пикселях экрана
  // и копируется 1:1 без сглаживания — чётче и заметно быстрее, чем уменьшение с imageSmoothingQuality "high"
  const dev = ps*(g === ctx ? dpr : 1), exact = g === ctx && Math.abs(dev - Math.round(dev)) < 1e-6 && ps % 1 !== 0;
  const frac = ps % 1 !== 0 && !exact, rps = exact ? Math.round(dev) : frac ? Math.round(ps*2) : ps;
  const dir = Math.cos(o.aim || 0) >= 0 ? 1 : -1;
  let anim = "idle", f = Math.floor(t*2) % 2;
  if(o.atk > 0){ anim = "attack"; f = o.atk > 0.5 ? 0 : 1; }
  else if(o.moving){ anim = "walk"; f = Math.floor(t*8) % 4; }
  const spr = spriteCanvas(kind, o, anim, f, rps), DW = SPR_W*ps, DH = SPR_H*ps;
  // тень и свечение под ногами
  g.save();
  g.fillStyle = "rgba(0,0,0,.38)"; g.beginPath(); g.ellipse(x, y, (kind === "guard" ? 11 : 9)*ps, 2.6*ps, 0, 0, Math.PI*2); g.fill();

  g.restore();
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(dir, 1);
  g.imageSmoothingEnabled = frac; if(frac) g.imageSmoothingQuality = "high";
  // корпус и подсветка запекаются в один холст (два варианта яркости): одна отрисовка вместо двух
  // и без переключения режима смешивания на каждого пилота
  const gi = anim === "idle" && f ? 1 : 0;
  if(!spr.comb) spr.comb = [];
  let cb = spr.comb[gi];
  if(!cb){
    cb = document.createElement("canvas"); cb.width = spr.base.width; cb.height = spr.base.height;
    const q = cb.getContext("2d"); q.drawImage(spr.base, 0, 0);
    q.globalCompositeOperation = "lighter"; q.globalAlpha = gi ? .70 : .55; q.drawImage(spr.glow, 0, 0);
    spr.comb[gi] = cb;
  }
  g.drawImage(cb, -SPR_AX*ps, -SPR_AY*ps, DW, DH);
  g.restore();
  if(o.flash > 0){ g.save(); g.globalAlpha = .5; g.globalCompositeOperation = "lighter"; g.translate(Math.round(x), Math.round(y)); g.scale(dir, 1); g.drawImage(spr.base, -SPR_AX*ps, -SPR_AY*ps, DW, DH); g.restore(); }
}

// портрет для интерфейса
function mechImg(cls, fac, eq, size){
  const key = [cls, fac, JSON.stringify(eq || {}), size || 120].join("|");
  if(mechCache.has(key)) return mechCache.get(key);
  const W = size || 120, ps = Math.max(1, Math.floor(W/34)), c = document.createElement("canvas");
  c.width = W*2; c.height = Math.round(W*1.2)*2;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  drawMech(g, c.width*0.44, c.height*0.94, {cls, fac, eq, aim:0.1, t:0.1, ps:ps*2});
  const html = `<img src="${c.toDataURL()}" alt="" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated">`;
  mechCache.set(key, html); if(mechCache.size > 60) mechCache.delete(mechCache.keys().next().value);
  return html;
}
// ===================== ПИКСЕЛЬ-АРТ ИКОНКИ ПРЕДМЕТОВ =====================
// Каждая вещь рисуется попиксельно в сетке 20×20: объём, тёмная обводка, свои цвета.
// Грейд виден по цвету деталей, свечению за предметом и искрам (у синих и золотых).
const ICON_N = 20, iconCache = new Map();
const IPAL = {
  steel:["#E6ECF1", "#AEB9C4", "#77838F", "#4A5561"], dark:["#6B7682", "#4A5561", "#323B45", "#1F262E"],
  rust:["#E3A273", "#B8703F", "#8A4B2A", "#5A2F1B"], copper:["#FFC48A", "#E08A4E", "#B0602E", "#6E3A1A"],
  red:["#FF8A7A", "#E0463A", "#A8281F", "#6A1812"], green:["#B8F2A0", "#5FC94A", "#2F8F2A", "#1A5519"],
  orange:["#FFD08A", "#F2A93B", "#C47B0E", "#7A4A08"], blue:["#A8DDFF", "#4EA8F5", "#2A6FC0", "#173F75"],
  purple:["#E0C8FF", "#9B7BFF", "#6A48D0", "#3C2880"], gold:["#FFF1B8", "#F2C14B", "#C4901C", "#7A5510"],

};
function gradePal(g){ return [["#FFFFFF", "#C9D1D8", "#9AA3AB", "#5E666E"], ["#D8FFC8", "#6FCF7A", "#3A9A48", "#1E5A28"], ["#D2EBFF", "#4EA8F5", "#2A6FC0", "#173F75"], ["#FFF4C0", "#F2C14B", "#C4901C", "#7A5510"]][g || 0]; }

function drawItemPixels(id, g){
  const N = ICON_N, buf = new Array(N*N).fill(null), glow = [];
  const put = (x, y, c, gl) => { x = Math.round(x); y = Math.round(y); if(x < 0 || y < 0 || x >= N || y >= N || !c) return; buf[y*N + x] = c; if(gl) glow.push([x, y, c]); };
  const rect = (x, y, w, h, c, gl) => { for(let j = 0; j < h; j++) for(let i = 0; i < w; i++) put(x + i, y + j, c, gl); };
  const line = (x0, y0, x1, y1, c, gl) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for(let i = 0; i <= n; i++) put(x0 + (x1 - x0)*i/n, y0 + (y1 - y0)*i/n, c, gl); };
  const disc = (cx, cy, r, c, gl) => { for(let y = -r; y <= r; y++) for(let x = -r; x <= r; x++) if(x*x + y*y <= r*r + r*0.6) put(cx + x, cy + y, c, gl); };
  // деталь с объёмом: [блик, светлый, основной, тень]
  const block = (x, y, w, h, p) => { rect(x, y, w, h, p[1]); for(let i = 0; i < w; i++){ put(x + i, y, p[0]); put(x + i, y + h - 1, p[3]); } for(let j = 1; j < h - 1; j++){ put(x, y + j, p[0]); put(x + w - 1, y + j, p[2]); } };
  const G = gradePal(g), S = IPAL.steel, D = IPAL.dark, R = IPAL.rust;

    case "chip":

      rect(7, 7, 6, 6, "#1B232C"); rect(7, 7, 6, 1, "#3A4652"); put(9, 9, IPAL.cyan[1], true); put(10, 10, IPAL.cyan[0], true);
      for(let i = 0; i < 4; i++){ const p = 6 + i*2 + (i > 1 ? 1 : 0); for(const [x, y] of [[p, 3], [p, 4], [p, 15], [p, 16], [3, p], [4, p], [15, p], [16, p]]) put(x, y, IPAL.gold[1]); }
      line(6, 12, 8, 12, IPAL.gold[0]); break;

    // ---- книги умений ----
    case (id.startsWith("bk_") || id.startsWith("bp_")) && id: {
      const it = ITEMS[id], col = it.cls ? CLASSES[it.cls].color : "#F2C14B";

      const core = id === "sph_cu" ? "#FFB347" : "#7FE6FF";
      for(let y = -7; y <= 7; y++) for(let x = -7; x <= 7; x++){ const d = x*x + y*y; if(d > 52) continue;
        const l = (-x - y)/10 + (1 - Math.sqrt(d)/7.2)*0.6; put(10 + x, 10 + y, l > .75 ? P[0] : l > .35 ? P[1] : l > -.25 ? P[2] : P[3]); }
      // гравировка-кольцо и светящееся ядро

      disc(10, 10, 1, core, true); put(10, 10, "#FFFFFF", true);

    case "laser1":
      block(2, 8, 11, 5, S); rect(12, 9, 5, 3, D[1]); rect(12, 9, 5, 1, D[0]); block(4, 12, 4, 6, IPAL.orange); rect(3, 10, 8, 1, IPAL.blue[1]);
      rect(16, 9, 2, 3, G[1], true); put(17, 10, G[0], true); rect(5, 9, 5, 1, G[2]); break;
    case "laser2":
      block(1, 8, 12, 5, S); rect(12, 9, 7, 3, D[1]); rect(12, 9, 7, 1, D[0]); block(4, 12, 3, 6, IPAL.red); block(8, 12, 3, 3, D); rect(2, 10, 9, 1, IPAL.red[1]);
      for(let i = 0; i < 3; i++) put(13 + i*2, 8, G[1], true); rect(18, 9, 2, 3, G[1], true); put(19, 10, G[0], true); rect(3, 6, 6, 2, D[1]); break;
    case "plasma":
      block(1, 7, 12, 7, IPAL.purple); rect(12, 8, 7, 5, D[1]); rect(12, 8, 7, 1, D[0]);
      disc(6, 10, 2, "#1B232C"); disc(6, 10, 1, G[1], true); put(6, 10, "#FFFFFF", true);
      rect(18, 9, 2, 3, G[1], true); put(19, 10, G[0], true); block(3, 13, 4, 5, D); line(9, 7, 12, 4, S[1]); put(12, 4, G[1], true); break;

    // ---- сенсоры ----
    case "st_head":
      block(4, 5, 12, 10, R); rect(6, 8, 8, 3, "#1B232C"); put(8, 9, "#8A4B2A"); put(11, 9, "#C47B0E", true);

    case "sensor1":
      block(4, 4, 12, 11, S); rect(7, 2, 6, 2, IPAL.orange[1]); put(7, 2, IPAL.orange[0]); rect(6, 7, 8, 4, "#1B232C"); rect(7, 8, 2, 2, G[1], true); rect(11, 8, 2, 2, G[1], true);
      rect(4, 15, 12, 2, D[1]); put(5, 15, D[0]); break;
    case "sensor2":
      block(3, 4, 13, 12, D); rect(5, 7, 9, 4, "#0B0F13"); disc(12, 9, 2, G[2], true); disc(12, 9, 1, G[1], true); put(12, 8, "#FFFFFF", true);
      rect(6, 8, 3, 2, G[1], true); line(4, 4, 2, 0, S[2]); put(2, 0, G[1], true); rect(3, 3, 13, 1, S[1]); rect(4, 16, 11, 2, S[2]); break;

    // ---- модули ----
    case "st_module":
      block(4, 5, 12, 11, R); disc(10, 10, 3, R[3]); disc(10, 10, 1, "#C47B0E", true); line(5, 6, 8, 9, "#5A2F1B"); break;
    case "servo":
      for(let i = 0; i < 8; i++){ const a = i/8*Math.PI*2; rect(9 + Math.round(Math.cos(a)*6), 9 + Math.round(Math.sin(a)*6), 2, 2, S[1]); }
      disc(10, 10, 5, S[1]); disc(10, 10, 3, S[2]); disc(10, 10, 1, G[1], true); put(8, 7, S[0]); put(7, 8, S[0]);
      line(15, 15, 18, 18, IPAL.orange[1]); line(14, 16, 17, 19, IPAL.red[1]); break;
    case "shieldgen":
      for(let y = 2; y <= 11; y++){ const w = Math.round(Math.sqrt(Math.max(0, 64 - (y - 10)*(y - 10)*1.1))); for(let x = -w; x <= w; x++) if(Math.abs(x) >= w - 1 || y === 2) put(10 + x, y, G[1], true); }

      line(4, 12, 8, 15, "#5A2F1B"); put(15, 13, "#5A2F1B"); break;
    case "plate1":
