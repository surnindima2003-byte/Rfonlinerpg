  if(!rows.length) return "";
  return `<section class="pcard setb"><h3>Комплекты</h3>${rows.map(([t, n]) => { const T = TIERS[t - 1];
    return `<div class="setrow"><b style="color:${T.color}">«${T.set}» ${n}/6</b>
      <span class="${n >= 3 ? "on" : ""}">3: +${+(1.5*t).toFixed(1)}% атаки</span><span class="${n >= 6 ? "on" : ""}">6: +${2*t}% прочности, +${Math.ceil(t/2)}% крита</span></div>`; }).join("")}</section>`;
}
// ===================== ЧАТ: ОБЩИЙ, ГИЛЬДИЯ, ЛИЧНЫЕ =====================
// Сообщения хранятся в общем хранилище артефакта. В боте их будет хранить сервер игры,
// и тогда гильдейские и личные сообщения увидят только участники.
let chatDb = null, chatUid = null, chatShared = [], chatLocalMsgs = [];
let chatCh = "world", chatOpen = false, chatLastSend = 0, dmTo = null, chatSeen = {world:Date.now(), guild:Date.now(), dm:Date.now()};
S.dmList = S.dmList || [];
chatLocalMsgs.push({id:"l0", ch:"world", sys:true, local:true, text:"Добро пожаловать в MetalWar! Нажми на ник пилота, чтобы написать ему лично.", ts:Date.now() - 1000});

const me = () => S.name;
const isMine = m => (chatUid && m.uid === chatUid) || m.mine;
const sortTs = arr => arr.sort((a, b) => a.ts - b.ts);
const allMsgs = () => [...chatShared, ...chatLocalMsgs];

function msgsFor(ch){
  const all = allMsgs();
  if(ch === "world") return all.filter(m => m.ch === "world");
  if(ch === "guild") return S.guildId ? all.filter(m => m.ch === "guild" && m.g === S.guildId) : [];
  if(!dmTo) return [];
  return all.filter(m => m.ch === "dm" && ((m.nick === me() && m.to === dmTo) || (m.nick === dmTo && m.to === me())));
}
function unreadIn(ch){
  const all = allMsgs(); let list;
  if(ch === "dm") list = all.filter(m => m.ch === "dm" && m.to === me());
  else if(ch === "guild") list = S.guildId ? all.filter(m => m.ch === "guild" && m.g === S.guildId) : [];
  else list = all.filter(m => m.ch === "world" && !m.local);
  return list.some(m => m.ts > chatSeen[ch] && !isMine(m));
}

function chatLocal(text, gold){ chatLocalMsgs.push({id:"l" + Math.random(), ch:"world", sys:true, gold:!!gold, local:true, text, ts:Date.now()}); onChatUpdate(); }
function chatAnnounce(text){
  if(chatDb) chatDb.collection("chat").add({ch:"world", sys:true, gold:true, text:text.slice(0, 160), ts:Date.now(), uid:chatUid || ""}).catch(() => chatLocal(text, true));
  else chatLocal(text, true);
}

(async () => {
  if(!window.claude || typeof claude.use !== "function") return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db) return;
    try{ chatUid = user ? await user.id() : null; }catch(e){}
    chatDb = db;
    db.collection("chat").orderBy("ts", "desc").limit(200).onSnapshot(snap => {
      const before = chatShared.length;
      chatShared = snap.docs.map(d => ({id:d.id, ...d.data()}))
        .filter(m => typeof m.text === "string" && typeof m.ts === "number" && ["world","guild","dm"].includes(m.ch));
      for(const m of chatShared) if(m.ch === "dm" && m.to === me() && m.nick && m.nick !== me() && !S.dmList.includes(String(m.nick))) S.dmList.push(String(m.nick).slice(0, 16));
      if(before && chatShared.length > before) Sfx.play("msg");
      onChatUpdate();
    }, () => { chatDb = null; chatLocal("Общий чат недоступен, сообщения видишь только ты"); });
  }catch(e){}
})();

const fmtTime = ts => new Date(ts).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});

// всё чужое выводится через textContent — в разметку не попадает
function msgEl(m){
  const el = document.createElement("div");
  if(m.sys){ el.className = "msg sys" + (m.gold ? " gold" : ""); el.textContent = (m.gold ? "★ " : "") + m.text; return el; }
  el.className = "msg" + (isMine(m) ? " me" : "");
  const top = document.createElement("div"); top.className = "top";
  const who = document.createElement("button"); who.type = "button"; who.className = "who";
  const nick = String(m.nick || "Пилот").slice(0, 16);
  who.textContent = nick; who.dataset.notr = "1"; who.style.color = (FACTIONS[m.fac] || FACTIONS.aegis).color;
  if(nick === me() || chatCh === "dm") who.disabled = true; else { who.dataset.dm = nick; who.title = "Написать лично"; }
  const lv = document.createElement("span"); lv.className = "lv"; lv.textContent = "ур. " + (+m.lvl || 1);
  const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = fmtTime(m.ts);
  top.append(who);
  if(m.admin){ const a = document.createElement("span"); a.className = "lv"; a.style.color = "#F2C14B"; a.textContent = "ADM"; top.append(a); }
  else if(m.mod){ const a = document.createElement("span"); a.className = "lv"; a.style.color = "#5FD4E8"; a.textContent = "MOD"; top.append(a); }
  top.append(lv, tm);
  // обычный игрок: пожаловаться на чужое сообщение
  if(!window.NET_MOD && chatCh === "world" && m.uid && String(m.uid) !== String(NET.id) && !m.admin && !m.mod){
    const rb = document.createElement("button"); rb.type = "button"; rb.className = "rep-b"; rb.textContent = "⚑"; rb.title = "Пожаловаться";
    rb.dataset.rep = String(m.uid); rb.dataset.rnick = nick; rb.dataset.rtext = String(m.text || "").slice(0, 200); top.append(rb);
  }
  // модератор: кнопка мута у чужих сообщений мирового чата
  if(window.NET_MOD && chatCh === "world" && m.uid && String(m.uid) !== String(NET.id) && !m.admin && (!m.mod || window.NET_ADMIN)){
    const mb = document.createElement("button"); mb.type = "button"; mb.className = "mute-b"; mb.textContent = "🔇";
    mb.title = "Мут"; mb.dataset.mute = String(m.uid); mb.dataset.mnick = nick; top.append(mb);
  }
  const tx = document.createElement("div"); tx.className = "tx"; tx.textContent = m.text; tx.dataset.notr = "1";
  el.append(top, tx); return el;
}

function renderTabsBadges(){
  document.querySelectorAll("[data-cch]").forEach(b => {
    b.setAttribute("aria-selected", String(b.dataset.cch === chatCh));
    b.querySelector("i")?.remove();
    if(b.dataset.cch !== chatCh && unreadIn(b.dataset.cch)) b.append(document.createElement("i"));
  });
}

function renderChatSub(){
  const sub = $("cpSub"); sub.replaceChildren();
  if(chatCh === "guild"){
    if(!S.guildId){
      const s = document.createElement("span"); s.textContent = "Ты пока не в гильдии.";
      const b = document.createElement("button"); b.type = "button"; b.className = "linkbtn"; b.dataset.cp = "open"; b.textContent = "Найти или создать гильдию";
      sub.append(s, b);
    } else {
      const s = document.createElement("span"); s.textContent = typeof gCur !== "undefined" && gCur ? "[" + gCur.tag + "] " + gCur.name : "Гильдия";
      sub.append(s);
    }
  } else if(chatCh === "dm"){
    if(!S.dmList.length){ sub.textContent = "Напиши @ник в начале сообщения или нажми на ник в общем чате, чтобы начать беседу"; return; }
    for(const n of S.dmList){
      const c = document.createElement("button"); c.type = "button"; c.className = "cp-chip"; c.dataset.chip = n;
      c.setAttribute("aria-pressed", String(dmTo === n)); c.append("@" + n);
      const x = document.createElement("span"); x.textContent = "×"; x.dataset.close = n; x.setAttribute("aria-label", "Закрыть беседу");
      c.append(x); sub.append(c);
    }
  }
}

function renderChatLog(){
  const log = $("chatLog"), near = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const list = sortTs(msgsFor(chatCh)).slice(-120);
  if(!list.length){
    const e = document.createElement("div"); e.className = "cp-empty";
    e.textContent = chatCh === "guild" ? (S.guildId ? "В гильдии пока тихо. Напиши первым!" : "Ты пока не в гильдии")
      : chatCh === "dm" ? (dmTo ? "Начни беседу с @" + dmTo : "Выбери беседу или отметь @ник") : "Сообщений пока нет";
    log.replaceChildren(e); return;
  }
  log.replaceChildren(...list.map(msgEl));
  if(near || !log.dataset.init){ log.scrollTop = log.scrollHeight; log.dataset.init = "1"; }
}

function renderChat(){
  const inp = $("chatIn");
  inp.placeholder = chatCh === "dm" ? (dmTo ? "Сообщение @" + dmTo + "…" : "@ник и сообщение…") : chatCh === "guild" ? "Сообщение гильдии…" : "Сообщение…";
  inp.disabled = chatCh === "guild" && !S.guildId;
  chatSeen[chatCh] = Date.now();
  renderTabsBadges(); renderChatSub(); $("chatLog").dataset.init = ""; renderChatLog();
}

function onChatUpdate(){
  const all = sortTs(allMsgs().filter(m => !m.local && (m.ch === "world" || (m.ch === "guild" && S.guildId && m.g === S.guildId) || (m.ch === "dm" && (m.to === me() || m.nick === me())))));
  const last = all[all.length - 1], el = $("chatLast");
  if(last){
    el.textContent = "";
    if(last.sys) el.textContent = last.text;
    else { const b = document.createElement("b"); b.textContent = (last.ch === "dm" ? "✉ " : last.ch === "guild" ? "[Г] " : "") + String(last.nick || "Пилот").slice(0, 16) + ": "; el.append(b, document.createTextNode(last.text)); }
  }
  if(!chatOpen && (unreadIn("world") || unreadIn("guild") || unreadIn("dm"))) $("chatBar").classList.add("new");
  if(chatOpen){ chatSeen[chatCh] = Date.now(); renderChatLog(); renderTabsBadges(); }
}

function chatError(text){
  let e = $("chatErr"); if(!e){ e = document.createElement("div"); e.id = "chatErr"; e.className = "cp-err"; e.setAttribute("role", "alert"); $("chatPanel").append(e); }
  e.textContent = text; e.classList.add("show"); clearTimeout(e._h); e._h = setTimeout(() => e.classList.remove("show"), 2200);
}

function openDm(nick){
  nick = String(nick).trim().slice(0, 16);
  if(nick === me()){ chatError("Нельзя написать самому себе"); return false; }
  if(!S.dmList.includes(nick)) S.dmList.unshift(nick);
  dmTo = nick; chatCh = "dm"; save(); renderChat(); return true;
}

// ---- мут в чате: окно выбора срока у модератора и блок отправки у замученного ----
function openMutePicker(uid, nick){
  document.querySelector(".mute-pop")?.remove();
  const pop = document.createElement("div"); pop.className = "mute-pop";
  pop.innerHTML = `<div><b>Мут для ${String(nick || "пилота").replace(/[<>&]/g, "")}</b><div class="mg">
    ${[[5, "5 мин"], [15, "15 мин"], [60, "1 час"], [180, "3 часа"], [1440, "24 часа"]].map(([m, t]) => `<button type="button" data-mm="${m}">${t}</button>`).join("")}
    <button type="button" class="un" data-mm="0">Снять</button><button type="button" class="cx" data-mm="x">Отмена</button></div></div>`;
  pop.addEventListener("click", e => {
    const b = e.target.closest("[data-mm]");
    if(e.target === pop || (b && b.dataset.mm === "x")){ pop.remove(); return; }
    if(!b) return;
    if(NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify({t:"mute", uid, nick, min:+b.dataset.mm}));
    else toast("Нет связи с сервером");
    pop.remove(); Sfx.play("ui");
  });
  document.body.append(pop);
}
function wsSend(o){ if(NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(o)); return true; } toast("Нет связи с сервером"); return false; }
const escH = t => String(t ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;"}[c]));
function popup(html, onClick){
  document.querySelector(".mute-pop")?.remove();
  const pop = document.createElement("div"); pop.className = "mute-pop"; pop.innerHTML = `<div>${html}</div>`;
  pop.addEventListener("click", e => { if(e.target === pop || e.target.closest("[data-x]")){ pop.remove(); return; } onClick(e, pop); });
  document.body.append(pop); return pop;
}
function openReportPicker(uid, nick, text){
  popup(`<b>Жалоба на ${escH(nick)}</b><q style="display:block;color:var(--muted);font-size:13px;margin:-4px 0 10px">«${escH(text)}»</q><div class="mg">
    <button type="button" data-rr="spam">Спам</button><button type="button" data-rr="insult">Оскорбления</button><button type="button" data-rr="ads">Реклама</button>
    <button type="button" data-rr="other">Другое</button><button type="button" class="cx" data-x="1">Отмена</button></div>`, (e, pop) => {
    const b = e.target.closest("[data-rr]"); if(!b) return;
    wsSend({t:"report", uid, nick, text, reason:b.dataset.rr}); pop.remove(); Sfx.play("ui");
  });
}

setInterval(renderRepBtn, 1500);
function muteLeft(){ return Math.max(0, (S.mutedUntil || 0) - Date.now()); }
function muteText(){ const m = Math.ceil(muteLeft()/60000); return m >= 60 ? Math.floor(m/60) + " ч " + (m % 60) + " мин" : m + " мин"; }
async function sendChat(){
  const inp = $("chatIn");
  let text = inp.value.replace(/\s+/g, " ").trim();
  if(!text) return;
  if(muteLeft() > 0){ chatError("🔇 У тебя мут в чате ещё " + muteText()); return; }
  // «@ник текст» во вкладке «Личные» открывает беседу
  if(chatCh === "dm" && text.startsWith("@")){
    const sp = text.indexOf(" "), nick = (sp < 0 ? text.slice(1) : text.slice(1, sp)).trim();
    if(nick.length < 3){ chatError("Ник: минимум 3 символа"); return; }
    if(!openDm(nick)) return;
    text = sp < 0 ? "" : text.slice(sp + 1).trim();
    inp.value = text; if(!text){ inp.focus(); return; }
  }
  if(chatCh === "dm" && !dmTo){ chatError("Отметь @ник, чтобы начать беседу"); return; }
  if(chatCh === "guild" && !S.guildId){ chatError("Сначала вступи в гильдию"); return; }
  if(Date.now() - chatLastSend < 3000){ chatError("Не так быстро: раз в 3 секунды"); return; }
  chatLastSend = Date.now(); inp.value = "";
  const msg = {ch:chatCh, text:text.slice(0, 200), nick:me(), fac:S.faction, lvl:S.level, uid:chatUid || "", ts:Date.now()};
  if(chatCh === "guild") msg.g = S.guildId;
  if(chatCh === "dm") msg.to = dmTo;
  if(typeof NET !== "undefined" && NET.ws && NET.ws.readyState === 1 && chatCh !== "guild"){
    NET.ws.send(JSON.stringify({t:"chat", ch:chatCh, text:msg.text, to:msg.to}));
  } else if(chatDb){
    try{ await chatDb.collection("chat").add(msg); }
    catch(e){ chatError("Не отправлено, попробуй ещё раз"); inp.value = text; chatLastSend = 0; }
  } else { chatLocalMsgs.push({...msg, id:"l" + Math.random(), mine:true}); onChatUpdate(); }
}

// ---- события панели ----
$("chatPanel").addEventListener("click", e => {
  const x = e.target.closest("[data-close]");
  if(x){ const n = x.dataset.close; S.dmList = S.dmList.filter(v => v !== n); if(dmTo === n) dmTo = null; save(); renderChat(); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.cch){ chatCh = b.dataset.cch; Sfx.play("ui"); renderChat(); }
  else if(b.dataset.chip){ dmTo = b.dataset.chip; renderChat(); }
  else if(b.dataset.mute){ openMutePicker(+b.dataset.mute, b.dataset.mnick); }
  else if(b.dataset.rep){ openReportPicker(+b.dataset.rep, b.dataset.rnick, b.dataset.rtext); }
  else if(b.id === "repBtn"){ wsSend({t:"reports"}); }
  else if(b.dataset.dm){ if(openDm(b.dataset.dm)) $("chatIn").focus(); }
  else if(b.dataset.cp === "open"){ closeChat(); showTab("guild"); }
});
$("chatSend").addEventListener("click", sendChat);
$("chatIn").addEventListener("keydown", e => { e.stopPropagation(); if(e.key === "Enter"){ e.preventDefault(); sendChat(); } });
$("chatIn").addEventListener("keyup", e => e.stopPropagation());

// ---- хранилище: общее (db) или локальное для файла без Claude ----
function makeLocalDb(){
  let data = {}; try{ data = JSON.parse(localStorage.getItem("mw-localdb") || "{}"); }catch(e){}
  const subs = new Set();
  const persist = () => { try{ localStorage.setItem("mw-localdb", JSON.stringify(data)); }catch(e){} setTimeout(() => subs.forEach(s => s()), 0); };
  const newId = () => "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const snapDoc = path => ({id:path.split("/").pop(), exists:path in data, data:() => data[path] ? JSON.parse(JSON.stringify(data[path])) : undefined});
  function colDocs(col, q){
    const pre = col + "/";
    let docs = Object.keys(data).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snapDoc);
    for(const [f, op, v] of (q.where || [])) docs = docs.filter(d => op === "==" ? d.data()[f] === v : true);
    if(q.order){ const [f, dir] = q.order; docs.sort((a, b) => ((a.data()[f] > b.data()[f]) ? 1 : -1) * (dir === "desc" ? -1 : 1)); }
    if(q.limit) docs = docs.slice(0, q.limit);
    return {docs, size:docs.length, empty:!docs.length};
  }
  function query(col, q){
    q = q || {};
    return {path:col,
      where:(f, op, v) => query(col, {...q, where:[...(q.where || []), [f, op, v]]}),
      orderBy:(f, dir) => query(col, {...q, order:[f, dir]}),
      limit:n => query(col, {...q, limit:n}),
      get:async () => colDocs(col, q),
      onSnapshot:next => { const s = () => next(colDocs(col, q)); subs.add(s); setTimeout(s, 0); return () => subs.delete(s); },
      doc:id => docRef(col + "/" + (id || newId())),
      add:async d => { const r = docRef(col + "/" + newId()); await r.set(d); return r; }};
  }
  function docRef(path){
    return {id:path.split("/").pop(), path,
      get:async () => snapDoc(path),
      set:async d => { data[path] = JSON.parse(JSON.stringify(d)); persist(); },
      update:async d => { if(!(path in data)) throw {code:"invalid_argument"}; data[path] = {...data[path], ...JSON.parse(JSON.stringify(d))}; persist(); },
      delete:async () => { delete data[path]; persist(); },
      onSnapshot:next => { const s = () => next(snapDoc(path)); subs.add(s); setTimeout(s, 0); return () => subs.delete(s); },
      collection:c => query(path + "/" + c)};
  }
  return {collection:c => query(c), doc:docRef};
}

// хранилище гильдий на сервере игры (в Telegram): тот же интерфейс, обновление раз в 3 секунды
function makeRemoteDb(api){
  const subs = new Set();
  let refreshT = null;
  const refreshAll = () => { clearTimeout(refreshT); refreshT = setTimeout(() => subs.forEach(s => s.run()), 150); };
  const call = async body => { const r = await api("/api/db", body); if(!r || !r.ok) throw new Error((r && r.error) || "db"); return r; };
  const snapDoc = (id, data) => ({id, exists:data !== null && data !== undefined, data:() => data ? JSON.parse(JSON.stringify(data)) : undefined});
  function poll(fetcher, next){
    let last = "", stop = false;
    const s = {run:async () => { if(stop) return; try{ const v = await fetcher(); const js = JSON.stringify(v.raw); if(js !== last){ last = js; next(v.snap); } }catch(e){} }};
    subs.add(s); s.run(); const iv = setInterval(s.run, 3000);
    return () => { stop = true; clearInterval(iv); subs.delete(s); };
  }
  function query(col, q){
    q = q || {};
    const list = async () => { const r = await call({op:"list", col, q}); const docs = r.docs.map(d => snapDoc(d.id, d.data)); return {raw:r.docs, snap:{docs, size:docs.length, empty:!docs.length}}; };
    const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    return {path:col,
      where:(f, op, v) => query(col, {...q, where:[...(q.where || []), [f, op, v]]}),
      orderBy:(f, dir) => query(col, {...q, order:[f, dir || "asc"]}),
      limit:n => query(col, {...q, limit:n}),
      get:async () => (await list()).snap,
      onSnapshot:(next, err) => poll(list, next),
      doc:id => docRef(col + "/" + (id || newId())),
      add:async d => { const r = await call({op:"add", col, data:d}); refreshAll(); return docRef(col + "/" + r.id); }};
  }
  function docRef(path){
    const id = path.split("/").pop();
    const get = async () => { const r = await call({op:"get", path}); return {raw:r.data, snap:snapDoc(id, r.exists ? r.data : null)}; };
    const write = async (op, data) => { await call({op, path, data}); refreshAll(); };
    return {id, path, get:async () => (await get()).snap,
      set:d => write("set", d), update:d => write("update", d), delete:() => write("delete"),
      onSnapshot:(next, err) => poll(get, next), collection:c => query(path + "/" + c)};
  }
  return {collection:c => query(c), doc:docRef};
}

function attachGuild(id){
  detachGuild(); S.guildId = id; save();
  let membersLoaded = false;
  gUnsubs.push(gRef(id).onSnapshot(d => {
    if(!d.exists){ if(S.guildId === id){ toast("Гильдия распущена"); leftGuild(); } return; }

  }, () => {}));
  gUnsubs.push(gCol(id, "members").onSnapshot(s => {

  gUnsubs.push(gCol(id, "requests").onSnapshot(s => { gRequests = s.docs.map(d => ({id:d.id, ...d.data()})); renderGuildIfOpen(); }, () => {}));
  gUnsubs.push(gCol(id, "log").orderBy("ts", "desc").limit(30).onSnapshot(s => { gLog = s.docs.map(d => d.data()); renderGuildIfOpen(); }, () => {}));

let gPres = {}, gPresT = 0;
async function gPresLoad(){
  if(gLocal || typeof NET === "undefined" || !NET.on || !NET.id || !gMembers.length) return;
  try{
    const r = await NET.api("/api/presence", {ids:gMembers.map(m => m.uid).filter(u => /^\d+$/.test(u))});
    if(r && r.ok){ gPres = r.p; gPresT = Date.now(); renderGuildIfOpen(); }
  }catch(e){}
}
setInterval(() => { if(!$("scrGuild").hidden && gTab === "members") gPresLoad(); }, 30000);
function presenceOf(m, isMe){
  if(isMe) return {online:true, last:Date.now()};
  if(gPres[m.uid]) return gPres[m.uid];
  if(gLocal){                                            // превью: правдоподобное время для демо-участников
    let hsh = 0; for(const c of String(m.uid)) hsh = (hsh*31 + c.charCodeAt(0)) >>> 0;
    return {online:hsh % 4 === 0, last:Date.now() - (hsh % 96)*1800e3 - 5*60e3};
  }
  return null;
}
function seenHtml(m, isMe){
  const pr = presenceOf(m, isMe);
  if(!pr) return "";
  if(pr.online) return `<small class="seen on"><i></i>в сети</small>`;
  if(!pr.last) return `<small class="seen">давно не заходил</small>`;
  const d = new Date(pr.last), now = new Date(), mins = Math.floor((now - d)/60000);
  const hm = d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const dd = Math.round((day(now) - day(d))/86400000);
  let t;
  if(mins < 1) t = "только что";
  else if(mins < 60) t = mins + " мин назад";
  else if(dd === 0) t = "сегодня в " + hm;
  else if(dd === 1) t = "вчера в " + hm;
  else if(dd < 7) t = d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"}) + " в " + hm;
  else t = d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit", year:"numeric"});
  return `<small class="seen"><i></i>заходил ${t}</small>`;
}

      h += `<button class="btn wide" type="button" data-gs="transfer" data-id="${esc(uid)}">Передать лидерство</button>`;
    }
    h += `<button class="btn wide" type="button" data-gs="pm" data-id="${esc(uid)}">Написать лично</button>`;
    h += `<button class="btn wide danger" type="button" data-gs="kick" data-id="${esc(uid)}">Исключить из гильдии</button></div>`;
    body().innerHTML = h;
  });
}
function confirmSheet(title, text, btn, action, id){
  openSheet(title, "", () => { body().innerHTML = `<p style="margin:0 0 14px">${esc(text)}</p><div class="row2"><button class="btn" type="button" data-gs="cancel">Отмена</button><button class="btn danger" type="button" data-gs="${action}" data-id="${esc(id || "")}">${esc(btn)}</button></div>`; });
}

const VALID_NAME = /^[\p{L}\p{N} _\-]{3,20}$/u, VALID_TAG = /^[\p{L}\p{N}]{2,4}$/u;

// ---- действия ----
async function guildAction(a, b){
  const id = b.dataset.id, v = b.dataset.v;
  try{
  if(a === "create"){ if(S.guildId) return; cg = {icon:"gear", color:G_COLORS[0], open:true}; createSheet(); return; }
  if(a === "cgicon" || a === "cgcolor" || a === "cgopen"){
    const keep = {n:$("cgName").value, t:$("cgTag").value, d:$("cgDesc").value};
    if(a === "cgicon") cg.icon = v; else if(a === "cgcolor") cg.color = v; else cg.open = v === "1";
    createSheet(); $("cgName").value = keep.n; $("cgTag").value = keep.t; $("cgDesc").value = keep.d; return;
  }
  if(a === "docreate"){
    const name = $("cgName").value.trim().replace(/\s+/g, " "), tag = $("cgTag").value.trim().toUpperCase(), desc = $("cgDesc").value.trim().slice(0, 120);
    if(!VALID_NAME.test(name)){ toast("Название: 3–20 букв, цифр, пробелов"); return; }
    if(!VALID_TAG.test(tag)){ toast("Тег: 2–4 буквы или цифры"); return; }
    if(gList.some(g => g.name.toLowerCase() === name.toLowerCase())){ toast("Гильдия с таким названием уже есть"); return; }
    if(gList.some(g => safeText(g.tag).toUpperCase() === tag)){ toast("Такой тег уже занят"); return; }
    if(S.scrap < GUILD_COST){ toast("Не хватает лома"); return; }
    b.disabled = true;
    const ref = GDB.collection("guilds").doc();
    await ref.set({name, tag, emblem:{icon:cg.icon, color:cg.color}, desc, open:cg.open, minLvl:1, level:1, spent:0, count:1, leader:gUid, leaderNick:S.name, created:Date.now()});
    await GDB.doc("guilds/" + ref.id + "/members/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, role:"leader", joined:Date.now(), donated:0, xp:0, bm:combatPower()});
    S.scrap -= GUILD_COST; S.guildReqs = [];
    closeSheet(); attachGuild(ref.id); await glog(S.name + " основал гильдию"); toast("Гильдия «" + name + "» создана!"); Sfx.play("level"); return;
  }
  if(a === "join"){
    const g = gList.find(x => x.id === id); if(!g || S.guildId) return;
    if(S.level < (+g.minLvl || 1)){ toast("Нужен " + g.minLvl + " уровень"); return; }
    const size = (await gCol(id, "members").get()).size;
    if(size >= gMax(g)){ toast("В гильдии нет мест"); return; }
    if(g.open){
      await GDB.doc("guilds/" + id + "/members/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, role:"member", joined:Date.now(), donated:0, xp:0, bm:combatPower()});
      attachGuild(id); await recount(id); await glog(S.name + " вступил в гильдию"); toast("Добро пожаловать в «" + g.name + "»!"); Sfx.play("level");
    } else {
      if(S.guildReqs.length >= 3){ toast("Не больше трёх заявок одновременно"); return; }
      await GDB.doc("guilds/" + id + "/requests/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, ts:Date.now(), bm:combatPower()});
      S.guildReqs.push(id); save(); watchRequest(id); toast("Заявка отправлена");
      if(gLocal && id.startsWith("demo_")) setTimeout(async () => {   // в демо лидер отвечает сам
        const r = await GDB.doc("guilds/" + id + "/requests/" + gUid).get(); if(!r.exists) return;
        await GDB.doc("guilds/" + id + "/members/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, role:"member", joined:Date.now(), donated:0, xp:0});
        await GDB.doc("guilds/" + id + "/requests/" + gUid).delete(); await recount(id);
      }, 6000);
    }
    renderGuild(); return;
  }
  if(a === "cancelreq"){ await GDB.doc("guilds/" + id + "/requests/" + gUid).delete(); S.guildReqs = S.guildReqs.filter(x => x !== id); if(gReqWatch[id]){ gReqWatch[id](); delete gReqWatch[id]; } save(); renderGuild(); return; }
  if(a === "tab"){ gTab = v; renderGuild(); return; }
  if(a === "chat"){ showTab("game"); chatCh = "guild"; openChat(); return; }
  if(a === "member"){ memberSheet(id); return; }
  if(a === "cancel"){ closeSheet(); return; }
  if(a === "accept" && can("accept")){
    const r = gRequests.find(x => x.uid === id); if(!r) return;
    if(gMembers.length >= gMax(gCur)){ toast("Нет мест. Улучши гильдию"); return; }
    await gCol(S.guildId, "members").doc(id).set({uid:id, nick:safeText(r.nick).slice(0, 16), lvl:+r.lvl || 1, fac:r.fac, role:"member", joined:Date.now(), donated:0, xp:0, bm:+r.bm || 0});
    await gCol(S.guildId, "requests").doc(id).delete(); await recount(S.guildId); await glog(S.name + " принял " + safeText(r.nick)); return;
  }
  if(a === "reject" && can("accept")){ await gCol(S.guildId, "requests").doc(id).delete(); return; }
  const m = gMembers.find(x => x.uid === id), role = myRole();
  if(a === "pm" && m){ closeSheet(); showTab("game"); openChat(); openDm(m.nick); return; }
  if(a === "kick" && m){
    if(!(role === "leader" || (role === "officer" && m.role === "member"))) return;
    if(!b.dataset.ok){ confirmSheet("Исключить " + m.nick + "?", "Пилот покинет гильдию. Его вклад в казну останется.", "Исключить", "kick", id); const c = body().querySelector('[data-gs="kick"]'); c.dataset.ok = "1"; return; }
    const donated = +m.donated || 0;
    await gCol(S.guildId, "members").doc(id).delete();
    if(donated) await gRef(S.guildId).update({spent:(+gCur.spent || 0) - donated});   // вклад остаётся в казне
    closeSheet(); await recount(S.guildId); await glog(S.name + " исключил " + m.nick); return;
  }
  if(role !== "leader"){ if(["promote","demote","transfer","upgrade","savesettings","setopen","setcolor","disband"].includes(a)) return; }
  if(a === "promote" && m){ await gCol(S.guildId, "members").doc(id).update({role:"officer"}); closeSheet(); await glog(m.nick + " стал офицером"); return; }
  if(a === "demote" && m){ await gCol(S.guildId, "members").doc(id).update({role:"member"}); closeSheet(); await glog(m.nick + " больше не офицер"); return; }
  if(a === "transfer" && m){
    if(!b.dataset.ok){ confirmSheet("Передать лидерство?", m.nick + " станет лидером, а ты офицером.", "Передать", "transfer", id); body().querySelector('[data-gs="transfer"]').dataset.ok = "1"; return; }
    await gCol(S.guildId, "members").doc(id).update({role:"leader"});
    await gCol(S.guildId, "members").doc(gUid).update({role:"officer"});
    await gRef(S.guildId).update({leader:id, leaderNick:safeText(m.nick)});
    closeSheet(); await glog(S.name + " передал лидерство " + m.nick); return;
  }
  if(a === "donate"){
    const me = myMember(); if(!me) return;
    const amt = v === "all" ? S.scrap : Math.min(+v, S.scrap);
    if(amt <= 0){ toast("Нет лома для пожертвования"); return; }
    S.scrap -= amt; save();
    await gCol(S.guildId, "members").doc(gUid).update({donated:(+me.donated || 0) + amt});
    await glog(S.name + " пожертвовал " + amt + " лома"); toast("Спасибо! +" + amt + " в казну"); return;
  }
  if(a === "upgrade"){
    const cost = upCost(gCur.level || 1);
    if(gBank() < cost){ toast("В казне не хватает лома"); return; }
    await gRef(S.guildId).update({level:(gCur.level || 1) + 1, spent:(+gCur.spent || 0) + cost});
    await glog("Гильдия достигла " + ((gCur.level || 1) + 1) + " уровня"); Sfx.play("level"); return;
  }
  if(a === "setopen"){ await gRef(S.guildId).update({open:v === "1"}); return; }
  if(a === "setcolor"){ await gRef(S.guildId).update({emblem:{icon:(gCur.emblem || {}).icon || "gear", color:v}}); return; }
  if(a === "savesettings"){
    const desc = $("gsDesc").value.trim().slice(0, 120), minLvl = Math.max(1, Math.min(30, parseInt($("gsMin").value) || 1));
    await gRef(S.guildId).update({desc, minLvl}); toast("Настройки сохранены"); return;
  }
  if(a === "leave"){
    if(role === "leader" && gMembers.length > 1){ toast("Сначала передай лидерство другому участнику"); return; }
    if(!b.dataset.ok){
      confirmSheet(role === "leader" ? "Покинуть и распустить?" : "Покинуть гильдию?", role === "leader" ? "Ты последний участник: гильдия будет распущена." : "Твой вклад в казну останется гильдии.", "Покинуть", "leave");
      body().querySelector('[data-gs="leave"]').dataset.ok = "1"; return;
    }
    closeSheet();
    if(role === "leader") return disband();
    const donated = +(myMember() || {}).donated || 0, gid = S.guildId;
    await glog(S.name + " покинул гильдию");
    if(donated) await gRef(gid).update({spent:(+gCur.spent || 0) - donated});
    await gCol(gid, "members").doc(gUid).delete();
    await recount(gid); leftGuild(); toast("Ты покинул гильдию"); return;
  }
  if(a === "disband"){
    if(!b.dataset.ok){ confirmSheet("Распустить гильдию?", "Все участники будут исключены, казна пропадёт. Это нельзя отменить.", "Распустить", "disband"); body().querySelector('[data-gs="disband"]').dataset.ok = "1"; return; }
    closeSheet(); return disband();
  }
  }catch(e){ toast("Не получилось, попробуй ещё раз"); }
}
async function disband(){
  const gid = S.guildId; leftGuild();
  for(const c of ["members","requests","log"]){ const s = await gCol(gid, c).get(); for(const d of s.docs) await gCol(gid, c).doc(d.id).delete(); }
  await gRef(gid).delete(); toast("Гильдия распущена");
}

// ===================== СЕРВЕР: СОХРАНЕНИЯ, АДМИНКА, ЖИВОЙ МИР =====================
// Работает только внутри Telegram (есть подпись initData). В превью этот блок молчит.
const NET = {on:false, admin:false, id:null, ws:null, others:new Map(), god:false, api:null};
NET.ready = new Promise(r => NET._ready = r);
window.NET_GOD = false; window.NET_ADMIN = false;

(() => {
  const TG = window.Telegram && window.Telegram.WebApp;
  if(!TG || !TG.initData) return;
  const initData = TG.initData;
  NET.on = true;
  const api = NET.api = (path, body) => fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({initData, ...(body || {})})})
    .then(r => r.ok ? r.json() : r.text().then(t => ({ok:false, error:t})));

  // ---- сохранения ----
  let lastPushed = "";
  let serverEpoch = null;
  function snapshot(){ return {S, W:Wl, ts:S._ts || 0, bm:combatPower()}; }
  async function push(force){
    // До ответа сервера эпоха неизвестна: отправка здесь могла бы вернуть
    // старый локальный инвентарь сразу после полного сброса.
    if(!serverEpoch) return;
    const js = JSON.stringify(snapshot());
    if(!force && js === lastPushed) return;
    S._ts = Date.now(); save();
    const data = snapshot(); lastPushed = JSON.stringify(data);
    try{ await api("/api/state/save", {epoch:serverEpoch, data}); }catch(e){ lastPushed = ""; }
  }
  setInterval(() => push(false), 10000);
  document.addEventListener("visibilitychange", () => { if(document.hidden) push(true); });

  // ---- выдачи от администратора ----
  const GRANT_NAME = {scrap:"лома", cores:"ядер", exp:"опыта", level:"уровней"};
  function applyGrant(g){
    const a = +g.payload.amount || 0;
    if(g.by === "market" && g.kind === "scrap"){ S.scrap += a; toast("Маркет: лот продан, получено " + a + " лома"); if(typeof mkRefresh === "function") mkRefresh(); }
    else if(g.kind === "scrap" || g.kind === "cores"){ S[g.kind] += a; toast((g.by === "chipwar" ? "Chip War: получено " : String(g.by || "").startsWith("special:") ? "Задание выполнено: +" : "Администратор выдал ") + a + " " + GRANT_NAME[g.kind]); }
    else if(g.kind === "exp"){ S.exp += a; levelUps(); toast("Администратор выдал " + a + " опыта"); }
    else if(g.kind === "level"){ for(let i = 0; i < a; i++){ S.level++; S.max_hp += 10; S.attack += 2; S.defense += 1; } S.hp = stat().maxhp; toast("Администратор поднял уровень до " + S.level); }
    else if(g.kind === "item" && ITEMS[g.payload.item]){
      const it = ITEMS[g.payload.item];
      let got = 0; for(let i = 0; i < a; i++){ if(addItem(S.inv, g.payload.item, 1, INV_MAX, g.payload.grade) || addItem(S.store, g.payload.item, 1, STORE_MAX, g.payload.grade)) got++; }
      toast("Администратор выдал: " + it.name + (it.type === "gear" ? " (" + GRADES[g.payload.grade].name.toLowerCase() + ")" : "") + (got > 1 ? " ×" + got : "") + (got < a ? ". Не хватило места" : ""));
    }
    Sfx.play("level"); save(); push(true);
    api("/api/grants/ack", {ids:[g.id]});
  }

  // ---- вход ----
  // Сервер не ответил или вернул ошибку — не висим на заставке, а повторяем с паузой
  let loadTry = 0;
  function loadFailed(){
    loadTry++;
    NET._ready();
    const wait = Math.min(15, 2 * loadTry);
    const run = document.querySelector("#splash .sp-run");
    if(run) run.textContent = "Сервер не отвечает, повтор через " + wait + " с…";
    setTimeout(loadState, wait * 1000);
  }
  function loadState(){
    api("/api/state/load").then(r => (r && r.ok) ? onLoaded(r) : loadFailed(), loadFailed);
  }
  function onLoaded(r){
    const run = document.querySelector("#splash .sp-run");
    if(run && loadTry) run.textContent = "ЗАПУСК…";
   serverEpoch = r.epoch;
    // база на сервере была сброшена: очищаем прогресс на телефоне и начинаем заново
    if(r.epoch && localStorage.getItem("mw-epoch") !== r.epoch){
      ["mw-save-v2", "mw-wallet", "mw-localdb", "mw-demo"].forEach(k => localStorage.removeItem(k));
      localStorage.setItem("mw-epoch", r.epoch); sessionStorage.removeItem("mw-synced");
      location.reload(); return;
    }
    NET.admin = window.NET_ADMIN = !!r.admin; NET.id = r.tg.id; NET._ready();
    const srv = r.save;
    // на сервере прогресс новее (например, с другого телефона) — берём его
    if(srv && srv.S && (srv.ts || 0) > (S._ts || 0) && !sessionStorage.getItem("mw-synced")){
      try{
        localStorage.setItem("mw-save-v2", JSON.stringify({...srv.S, _ts:srv.ts}));
        if(srv.W) localStorage.setItem("mw-wallet", JSON.stringify(srv.W));
        sessionStorage.setItem("mw-synced", "1"); location.reload(); return;
      }catch(e){}
    }
    if(!srv) push(true);
    (r.grants || []).forEach(applyGrant);
    if(NET.admin){ $("adminBtn").hidden = false; }
    connect();
  }
  loadState();

  // ---- живой мир ----
  let retry = 1000;
  function connect(){
    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    NET.ws = ws;
    ws.onopen = () => { retry = 1000; ws.send(JSON.stringify({t:"auth", initData, proto:2})); };
    ws.onmessage = ev => {
      let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
      if(d.t === "hello"){ S.pvpKr = +d.kr || 0;
        NET.admin = window.NET_ADMIN = !!d.admin; NET.id = d.id;
        NET.mod = window.NET_MOD = !!(d.mod || d.admin); S.mutedUntil = +d.muted || 0;
        chatUid = String(d.id); chatDb = null;
        chatShared = (d.history || []).filter(m => typeof m.text === "string");
        onChatUpdate();
        if(typeof onHello === "function") onHello(d);
      } else if(d.t === "pd"){
        // протокол 2: сервер присылает только изменившихся соседей и id ушедших
        if(d.loc !== locKey){ NET.others.clear(); return; }
        if(d.full){ const keep = new Set((d.up || []).map(o => o.id)); for(const id of [...NET.others.keys()]) if(!keep.has(id)) NET.others.delete(id); }
        for(const o of d.up || []){ const cur = NET.others.get(o.id); if(cur) Object.assign(cur, o); else NET.others.set(o.id, {...o, rx:o.x, ry:o.y}); }
        for(const id of d.gone || []) NET.others.delete(id);
      } else if(d.t === "players"){
        if(d.loc !== locKey){ NET.others.clear(); return; }
        const seen = new Set();
        for(const o of d.list || []){
          seen.add(o.id);
          const cur = NET.others.get(o.id);
          if(cur) Object.assign(cur, o); else NET.others.set(o.id, {...o, rx:o.x, ry:o.y});
        }
        for(const id of [...NET.others.keys()]) if(!seen.has(id)) NET.others.delete(id);
      } else if(d.t === "chat" && d.m && typeof d.m.text === "string"){
        chatShared.push(d.m); if(chatShared.length > 300) chatShared.shift();
        if(!isMine(d.m)) Sfx.play("msg");
        if(d.m.ch === "dm" && d.m.to === S.name && d.m.nick !== S.name && !S.dmList.includes(d.m.nick)) S.dmList.push(String(d.m.nick).slice(0, 16));
        onChatUpdate();
      } else if(d.t === "grant" && d.grant){ applyGrant(d.grant); }
            else if(d.t === "admin_nick" && typeof d.name === "string"){
        S.name = d.name.slice(0, 16); save(); push(true);
        toast("Администратор изменил твой позывной на «" + S.name + "»");
      }
      else if(typeof onNetExtra === "function") onNetExtra(d);
    };
    ws.onclose = () => { NET.ws = null; NET.others.clear(); NET.party = null; if(typeof renderPartyFrames === "function") renderPartyFrames(); setTimeout(connect, retry); retry = Math.min(retry*2, 15000); };
  }

  // своё положение — 8 раз в секунду, пока что-то меняется
  let lastPos = "", lastSent = 0;
  setInterval(() => {
    const ws = NET.ws; if(!ws || ws.readyState !== 1 || !p) return;
    const eq = {}; for(const k in S.eq) if(S.eq[k]) eq[k] = S.eq[k].g;
    const msg = {t:"pos", loc:locKey, x:Math.round(p.x), y:Math.round(p.y), ang:+p.ang.toFixed(2), aim:+p.aim.toFixed(2), moving:p.moving, dead:p.dead,

      hp:Math.ceil(S.hp), mhp:stat().maxhp, cp:Math.ceil(S.cp ?? stat().maxcp), mcp:stat().maxcp, bm:combatPower(), df:stat().def,

// ===================== КЛАССЫ: УМЕНИЯ И ВЫБОР =====================
const CB = {cd:[0,0,0,0], buffs:{}, queue:[], fx:[]};
const CLASS_CHANGE_COST = 100;
// умение на заданном уровне: урон, длительность, радиус, дальность растут, перезарядка падает
function skillAt(s, lv){
  const k = (lv || 1) - 1, o = {...s};
  if(s.mult) o.mult = +(s.mult*(1 + 0.1*k)).toFixed(2);
  if(s.stun) o.stun = +(s.stun + 0.25*k).toFixed(2);
  if(s.v) o.v = +(s.v*(1 + 0.08*k)).toFixed(3);
  if(s.dur) o.dur = +(s.dur + 0.4*k).toFixed(1);
  if(s.radius) o.radius = Math.round(s.radius + 4*k);
  if(s.dist) o.dist = Math.round(s.dist + 8*k);
  o.cd = +(s.cd*(1 - 0.02*k)).toFixed(1);
  return o;
}
const buffV = k => { const b = CB.buffs[k]; return b && b.t > 0 ? b.v : 0; };

function hitEnemy(e, dmg, kind){
  if(!e || e.dead) return;
  const C = classParams();
  if(e.hp/e.max < 0.3){ const ex = stat().execute; if(ex) dmg *= 1 + ex; }
  const edef = NPCS[e.type].def || 0; if(edef) dmg *= 30/(30 + edef);
  dmg = Math.max(1, Math.round(dmg));
  e.hp -= dmg; e.flash = 0.12; e.chase = true;
  if(e.room && !e.roomAggro){                                   // в подземелье на удар отвечает вся комната
    for(const o of enemies) if(o.room === e.room && !o.dead){ o.chase = true; o.roomAggro = true; }
  }
  const col = kind === "crit" ? "#F2C14B" : kind === "aoe" ? "#FFB347" : "#fff";
  addText(e.x + (Math.random()*16-8), e.y - 24, (kind === "crit" ? "КРИТ -" : "-") + dmg, col);
  const a = Math.atan2(e.y - p.y, e.x - p.x);
  if(kind === "melee" || kind === "strike-m" || (kind === "crit" && C.melee)) CB.fx.push({type:"slash", x:e.x - Math.cos(a)*10, y:e.y - Math.sin(a)*10, a, life:.2, max:.2, c:C.color || "#fff"});
  else if(kind !== "aoe") beams.push({x1:p.x + Math.cos(p.aim)*24, y1:p.y - 26 + Math.sin(p.aim)*24, x2:e.x, y2:e.y, life:0.12, plasma:kind === "plasma"});
  const st = stat();
  const steal = buffV("steal") + st.steal; if(steal){ S.hp = Math.min(st.maxhp, S.hp + dmg*steal); }
  if(e.hp <= 0 && !e.dead) killEnemy(e);
}

function useSkill(i){
  const C = clsOf(S.cls);
  if(!C){ openClassSheet(); return; }
  if(!p || p.dead || paused || CB.cd[i] > 0) return;
  const st = stat(), s = skillAt(C.skills[i], skillLv(C.skills[i].id)), atk = st.atk*(1 + buffV("atk"))*(1 + st.skillDmg);
  const need = r => { const lk = typeof lockedEnemy === "function" ? lockedEnemy() : null;
    const t = locKey === "lobby" ? null : lk && Math.hypot(lk.x - p.x, lk.y - p.y) <= r + NPCS[lk.type].r ? lk : nearestEnemy(r);
    if(!t) toast("Нет цели рядом"); else if(!lk){ tgt = {kind:"enemy", e:t}; renderTargetFrame(); } return t; };
  switch(s.type){
    case "strike": { const t = need(C.range + 60); if(!t) return;
      hitEnemy(t, atk*s.mult, s.big ? "plasma" : C.melee ? "strike-m" : "beam"); if(s.stun) t.stun = s.stun; break; }
    case "aoe": {
      for(const e of enemies){ if(e.dead) continue; if(Math.hypot(e.x-p.x, e.y-p.y) < s.radius + NPCS[e.type].r && los(p.x, p.y, e.x, e.y)){ hitEnemy(e, atk*s.mult, "aoe"); if(s.stun && !e.dead) e.stun = s.stun; } }
      CB.fx.push({type:"ring", x:p.x, y:p.y, r:s.radius, life:.45, max:.45, c:C.color}); p.atkT = 0.25; break; }
    case "buff": CB.buffs[s.buff] = {v:s.v, t:s.dur, max:s.dur}; addText(p.x, p.y - 44, s.name, C.color); break;
    case "leap": { const t = need(s.dist); if(!t) return;
      const a = Math.atan2(t.y-p.y, t.x-p.x), d = Math.max(0, Math.hypot(t.x-p.x, t.y-p.y) - NPCS[t.type].r - 24);
      CB.fx.push({type:"trail", x1:p.x, y1:p.y, x2:p.x + Math.cos(a)*d, y2:p.y + Math.sin(a)*d, life:.3, max:.3, c:C.color});
      [p.x, p.y] = landAlong(p.x, p.y, p.x + Math.cos(a)*d, p.y + Math.sin(a)*d, p.r); pushOut(p, p.r); unstick(p, p.r); p.ang = p.aim = a; p.inv = 0.3;
      hitEnemy(t, atk*s.mult, "strike-m"); break; }
    case "dash": {
      const a = p.ang;
      if(s.instant){
        CB.fx.push({type:"ring", x:p.x, y:p.y, r:34, life:.35, max:.35, c:C.color});
        const bx = p.x, by = p.y; p.x += Math.cos(a)*s.dist; p.y += Math.sin(a)*s.dist; pushOut(p, p.r); unstick(p, p.r);
        if(!walkable(p.x, p.y, 14)){ p.x = bx; p.y = by; toast("Телепорт в стену невозможен"); }
        CB.fx.push({type:"ring", x:p.x, y:p.y, r:34, life:.35, max:.35, c:C.color});
      } else { p.dashT = s.dist/1150; p.dx = Math.cos(a); p.dy = Math.sin(a); }
      p.inv = 0.3; break; }
    case "volley": {
      const list = enemies.filter(e => !e.dead && Math.hypot(e.x-p.x, e.y-p.y) < C.range + 40 && los(p.x, p.y, e.x, e.y)).sort((a, b) => Math.hypot(a.x-p.x, a.y-p.y) - Math.hypot(b.x-p.x, b.y-p.y)).slice(0, s.n);
      if(!list.length || locKey === "lobby"){ toast("Нет цели рядом"); return; }
      list.forEach(e => hitEnemy(e, atk*s.mult, "beam")); break; }
    case "burst": { const t = need(C.range + 40); if(!t) return;
      for(let k = 0; k < s.n; k++) CB.queue.push({t:k*0.12, e:t, dmg:atk*s.mult}); break; }
  }
  CB.cd[i] = s.cd*(1 - st.cdr); Sfx.play("crit");
  if(Sfx.haptic) Sfx.haptic("medium");
}

function classUpdate(dt){
  for(let i = 0; i < 4; i++) CB.cd[i] = Math.max(0, CB.cd[i] - dt);
  for(const k in CB.buffs) CB.buffs[k].t -= dt;
  for(const q of CB.queue){ q.t -= dt; if(q.t <= 0 && !q.done){ q.done = true; hitEnemy(q.e, q.dmg, "beam"); Sfx.play("shot"); } }
  CB.queue = CB.queue.filter(q => !q.done);
}

// ---- эффекты на карте ----
function drawClassFx(dt){
  for(const f of CB.fx){
    f.life -= dt; const k = Math.max(0, f.life/f.max);
    ctx.save(); ctx.globalAlpha = k;
    if(f.type === "ring"){ ctx.strokeStyle = f.c; ctx.lineWidth = 6*k + 2; circle(f.x, f.y, f.r*(1.1 - k*0.5)); ctx.stroke(); ctx.globalAlpha = k*0.15; ctx.fillStyle = f.c; circle(f.x, f.y, f.r*(1.1 - k*0.5)); ctx.fill(); }
    else if(f.type === "slash"){ ctx.strokeStyle = f.c; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(f.x, f.y, 22, f.a - 1.1 + (1-k)*0.6, f.a + 0.5 + (1-k)*0.6); ctx.stroke(); }
    else if(f.type === "trail"){ ctx.strokeStyle = f.c; ctx.lineWidth = 10*k; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); }
    ctx.restore();
  }
  CB.fx = CB.fx.filter(f => f.life > 0);
}
const BUFF_COLOR = {def:"#5FD4E8", atk:"#E0694A", rate:"#7BC98A", steal:"#9B7BFF"};
function drawBuffAura(x, y, t){
  let i = 0;
  for(const k in CB.buffs){ if(CB.buffs[k].t <= 0) continue;
    ctx.save(); ctx.strokeStyle = BUFF_COLOR[k]; ctx.globalAlpha = .55 + Math.sin(t*6 + i)*.2; ctx.lineWidth = 3;
    ctx.setLineDash([10, 6]); ctx.lineDashOffset = -t*30*(i % 2 ? -1 : 1); circle(x, y, 30 + i*6); ctx.stroke(); ctx.restore(); i++; }
}

// оружие на башне зависит от класса: щит, клинки, длинный ствол или излучатель
function weaponShape(cls, wpn, tip, t){
  if(cls === "guard"){
    ctx.fillStyle = "#56616D"; rr(4, -4, 12, 8, 2); ctx.fill();
    ctx.strokeStyle = tip; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(8, 0, 16, -0.9, 0.9); ctx.stroke();
  } else if(cls === "reaper"){
    ctx.strokeStyle = tip; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(6, -7); ctx.lineTo(28, -15); ctx.moveTo(6, 7); ctx.lineTo(28, 15); ctx.stroke();
    ctx.strokeStyle = "#2E3A46"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(6, -7); ctx.lineTo(14, -10); ctx.moveTo(6, 7); ctx.lineTo(14, 10); ctx.stroke();
  } else if(cls === "sniper"){
    ctx.fillStyle = "#2E3A46"; rr(4, -2.5, 34, 5, 2); ctx.fill(); rr(10, -6, 10, 4, 1); ctx.fill();
    ctx.fillStyle = tip; ctx.fillRect(36, -2.5, 4, 5);
  } else if(cls === "techno"){
    ctx.fillStyle = "#2E3A46"; rr(4, -2.5, 13, 5, 2); ctx.fill();
    ctx.fillStyle = tip; ctx.globalAlpha = .6 + Math.sin(t*6)*.3; circle(21, 0, 6); ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = tip; ctx.lineWidth = 1.5; circle(21, 0, 9); ctx.stroke();
  } else {
    const bl = 20 + 2*((ITEMS[wpn] && ITEMS[wpn].tier) || 1);
    ctx.fillStyle = "#2E3A46"; rr(4, -3.5, bl, 7, 2); ctx.fill();
    ctx.fillStyle = tip; ctx.fillRect(bl, -3.5, 4, 7);
  }
}

function mix(hex, to, t){ const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16); const ch = s => Math.round(((a >> s) & 255)*(1-t) + ((b >> s) & 255)*t); return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join(""); }

// ---- кнопки умений на экране ----
function renderSkillButtons(){
  const C = clsOf(S.cls);
  for(let i = 0; i < 4; i++){
    const b = $("skC" + i);
    if(!C){ b.innerHTML = `<i class="cd"></i><span>?</span>`; b.setAttribute("aria-label", "Выбрать класс"); b.style.borderColor = ""; continue; }
    const s = C.skills[i];
    b.innerHTML = `${skillIcon(s, C.color)}<i class="cdc"></i><b class="cdt"></b>`;
    b.setAttribute("aria-label", s.name); b.style.borderColor = C.color;
  }
  $("skFire").querySelector("span").textContent = C && C.melee ? "УДАР" : "ОГОНЬ";
}
function classHud(){
  const C = clsOf(S.cls); if(!C) return;
  const cdr = stat().cdr;
  for(let i = 0; i < 4; i++){
    const b = $("skC" + i), cd = CB.cd[i], max = skillAt(C.skills[i], skillLv(C.skills[i].id)).cd*(1 - cdr);
    const el = b.querySelector(".cdt"), ring = b.querySelector(".cdc"); if(!el || !ring){ renderSkillButtons(); return; }
    const pv = (cd/max*100).toFixed(0); if(ring.dataset.p !== pv){ ring.dataset.p = pv; ring.style.setProperty("--p", pv); }
    const txt = cd > 0 ? Math.ceil(cd) : ""; if(el.textContent != txt) el.textContent = txt;
    const ready = cd <= 0; if(b.classList.contains("ready") !== ready){ b.classList.toggle("ready", ready); if(ready && b.dataset.was) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); } b.dataset.was = "1"; }
  }
}
for(let i = 0; i < 4; i++) $("skC" + i).addEventListener("click", () => useSkill(i));
window.addEventListener("keydown", e => { if(!running || paused) return; const n = ["Digit1","Digit2","Digit3","Digit4"].indexOf(e.code); if(n >= 0) useSkill(n); });

// ---- окно выбора класса ----
function classStats(id){
  const C = CLASSES[id];
  return {hp:Math.round(S.max_hp*C.hp), atk:Math.round(S.attack*C.atk), def:Math.round(S.defense*C.def), spd:C.speed, rate:C.rate};
}
function openClassSheet(){
  const first = !S.cls, free = !S.clsChanged;
  openSheet(first ? "Выбор класса" : "Смена класса", first ? "Класс определяет характеристики и умения" : (free ? "Первая смена бесплатно" : "Смена класса стоит " + CLASS_CHANGE_COST + " лома"), () => {
    const all = Object.keys(CLASSES).map(classStats);
    const mx = k => Math.max(...all.map(s => s[k]));
    body().innerHTML = Object.entries(CLASSES).map(([id, C]) => {
      const s = classStats(id), cur = S.cls === id;
      const bar = (lbl, v, k, fmt) => `<div class="cbar"><span>${lbl}</span><i><b style="width:${Math.round(v/mx(k)*100)}%;background:${C.color}"></b></i><em>${fmt ? fmt(v) : v}</em></div>`;
      return `<section class="clscard" style="border-color:${cur ? C.color : ""}">
        <div class="clshead"><h3 style="color:${C.color}">${C.name}</h3><span>${C.role}</span></div>
        ${bar("Прочность", s.hp, "hp")}${bar("Атака", s.atk, "atk")}${bar("Броня", s.def, "def")}${bar("Скорость", s.spd, "spd")}${bar("Атак/сек", s.rate, "rate", v => v.toFixed(2))}
        <div class="clsskills">${C.skills.map(k => `<div class="clsskill"><div class="ic" style="border-color:${C.color}">${skillIcon(k, C.color)}</div><div><b>${k.name}</b><small>${k.desc}</small><em>Перезарядка: ${k.cd} сек</em></div></div>`).join("")}</div>
        <button class="btn wide clsbtn" type="button" data-cls="${id}" ${cur ? "disabled" : ""}>${cur ? "Текущий класс" : "Выбрать класс"}</button>
      </section>`;
    }).join("") + `<p class="hint">Характеристики показаны для твоего уровня без снаряжения.</p>`;
  });
}
$("shBody").addEventListener("click", e => {
  const b = e.target.closest("button[data-cls]"); if(!b || b.disabled) return;

async function loadTop(kind){
  if(typeof NET !== "undefined" && NET.on && NET.id){
    const r = await NET.api("/api/top", {kind});
    if(r && r.ok) return r;
    throw new Error("top");
  }
  // запасной вариант без сервера
  const myBM = combatPower();
  if(!GDB) return {items:[], me:{}};
  const gs = (await GDB.collection("guilds").get()).docs.map(d => ({id:d.id, ...d.data()}));
  const players = new Map(), guilds = [];
  for(const g of gs){
    const ms = (await GDB.collection("guilds/" + g.id + "/members").get()).docs.map(d => d.data());
    for(const m of ms){ if(m.uid === gUid) m.bm = myBM; players.set(m.uid, {id:m.uid, nick:m.nick, lvl:m.lvl, cls:m.cls || (m.uid === gUid ? S.cls : ""), bm:+m.bm || 0, tag:g.tag}); }
    guilds.push({id:g.id, name:g.name, tag:g.tag, emblem:g.emblem, level:g.level, count:ms.length, bm:ms.reduce((a, m) => a + (+m.bm || 0), 0)});
  }
  if(!players.has(gUid)) players.set(gUid, {id:gUid, nick:S.name, lvl:S.level, cls:S.cls, bm:myBM, tag:""});
  const me = players.get(gUid); me.cls = S.cls; me.nick = S.name; me.lvl = S.level;
  if(kind === "players"){
    const items = [...players.values()].sort((a, b) => b.bm - a.bm);
    return {items, me:{rank:items.findIndex(x => x.id === gUid) + 1, bm:myBM}};
  }
  guilds.sort((a, b) => b.bm - a.bm);
  return {items:guilds, me:{rank:S.guildId ? guilds.findIndex(g => g.id === S.guildId) + 1 : null, id:S.guildId}};
}

const pct = v => Math.round(v*100) + "%";
function skillType(s){
  if(s.type === "buff") return "Усиление";
  if(s.type === "dash") return "Перемещение";
  if(s.type === "leap") return "Урон · перемещение";
  return s.stun ? "Урон · контроль" : "Урон";
}
function skillText(s){
  switch(s.type){
    case "strike": return (s.big ? "Плазменный снаряд" : "Удар по цели") + `: ${pct(s.mult)} атаки` + (s.stun ? ` · оглушение ${s.stun} сек` : "");
    case "aoe": return `Урон по области (радиус ${s.radius}): ${pct(s.mult)} атаки` + (s.stun ? ` · оглушение ${s.stun} сек` : "");
    case "buff": return ({def:"Броня", atk:"Атака", rate:"Скорость атаки"}[s.buff] ? `${({def:"Броня", atk:"Атака", rate:"Скорость атаки"})[s.buff]} +${pct(s.v)}` : `Вампиризм ${pct(s.v)} от урона`) + ` · длительность ${s.dur} сек`;
    case "leap": return `Прыжок к цели (до ${s.dist}) и удар: ${pct(s.mult)} атаки`;
    case "dash": return (s.instant ? "Телепорт вперёд на " : "Рывок вперёд на ") + s.dist + " · неуязвимость 0,3 сек";
    case "volley": return `Выстрел по ${s.n} целям: ${pct(s.mult)} атаки каждой`;
    case "burst": return `Очередь из ${s.n} выстрелов: ${pct(s.mult)} атаки каждый`;
  }
  return "";
}
function skillDiff(a, b){
  const out = [];
  if(a.mult !== b.mult) out.push(`Урон ${pct(a.mult)} → ${pct(b.mult)}`);
  if(a.stun !== b.stun && a.stun) out.push(`Оглушение ${a.stun} → ${b.stun} сек`);
  if(a.v !== b.v) out.push(`Сила ${pct(a.v)} → ${pct(b.v)}`);
  if(a.dur !== b.dur) out.push(`Длительность ${a.dur} → ${b.dur} сек`);
  if(a.radius !== b.radius) out.push(`Радиус ${a.radius} → ${b.radius}`);
  if(a.dist !== b.dist) out.push(`Дальность ${a.dist} → ${b.dist}`);
  if(a.cd !== b.cd) out.push(`Перезарядка ${fmtN(a.cd)} → ${fmtN(b.cd)} сек`);
  return out;
}

        <div class="tx"><b>${p.name}</b> <em>${lv ? "Ур. " + lv + "/" + PAS_MAX : "🔒 Не изучен"}</em>
        <small>${p.desc}</small>${lv ? `<small class="now">Сейчас: ${p.sign || "+"}${fmtN(p.per*lv)}${p.unit}</small>` : ""}${lv ? pips(lv, PAS_MAX) : ""}${max ? "" : bookLine(cost)}
        <button class="upbtn wide" type="button" data-pas="${p.id}" ${!max && canPay(cost) ? "" : "disabled"}>${max ? "Максимальный уровень" : (lv ? "Улучшить" : "Изучить") + " · " + costTxt(cost)}</button></div></div>`;
    };
    if(C) h += `<section class="pcard"><h3 style="color:${C.color}">Классовые: ${C.name}</h3><div class="paslist">${own.map(row).join("")}</div></section>`;
    else h += `<section class="pcard"><div class="empty">Классовые пассивные откроются после выбора класса</div></section>`;
    h += `<section class="pcard"><h3>Общие</h3><div class="paslist">${common.map(row).join("")}</div></section>`;
  }
  h += `<p class="hint" style="text-align:center">Книги можно только выбить из врагов: чем выше уровень моба, тем выше шанс. Продать или купить книги нельзя.</p>`;
  return h;
}

function tryTarget(ev){
  const r = gameEl.getBoundingClientRect();
  const wx = (window.camX || 0) + ev.clientX - r.left, wy = (window.camY || 0) + ev.clientY - r.top;
  let best = null, bd = 40;
  for(const e of enemies){ if(e.dead) continue; const d = Math.hypot(e.x - wx, e.y - wy) - NPCS[e.type].r*0.5; if(d < bd){ bd = d; best = {kind:"enemy", e}; } }

  if(!best) return false;
  tgt = best; renderTargetFrame(); Sfx.play("ui");
  if(Sfx.haptic) Sfx.haptic("light");
  return true;
}
