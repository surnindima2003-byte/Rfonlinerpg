<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MetalWar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D6DCE2; --panel:#EDF0F3; --panel-2:#E2E7EC; --line:#B9C3CC;
  --text:#1D2731; --muted:#5B6874;
  --amber:#C47B0E; --cyan:#0C8BA3; --rust:#B24A2C; --ok:#3F8A4E;
  --faction:#F2A93B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161D25; --panel:#202A34; --panel-2:#1A232C; --line:#34414E;
    --text:#E4DED1; --muted:#93A0AC;
    --amber:#F2A93B; --cyan:#5FD4E8; --rust:#E0694A; --ok:#7BC98A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161D25; --panel:#202A34; --panel-2:#1A232C; --line:#34414E;
  --text:#E4DED1; --muted:#93A0AC;
  --amber:#F2A93B; --cyan:#5FD4E8; --rust:#E0694A; --ok:#7BC98A;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.screen{flex:1;min-height:0;position:relative}
.screen[hidden]{display:none}

/* ---- игровой экран ---- */
.game{background:#141B22;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:8px;right:108px;top:8px;color:#E4DED1;pointer-events:none}
.hud-card{background:rgba(20,27,34,.82);border:1px solid #34414E;border-radius:12px;padding:7px 10px}
.hud-top{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.hud-top b{font:14px 'Russo One',sans-serif}
.hud-top .nm{overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:4px;background:#34414E;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;transition:width .2s}
.bar.hp i{background:#7BC98A}.bar.xp{height:4px}.bar.xp i{background:#5FD4E8}
.hud-res{display:flex;gap:10px;font-size:12px;margin-top:5px;opacity:.9}
.side{position:absolute;left:8px;top:84px;display:flex;flex-direction:column;gap:6px}
.side button{background:rgba(20,27,34,.82);border:1px solid #34414E;color:#E4DED1;border-radius:10px;padding:6px 10px;font-size:12px;text-align:left}
.loc-name{position:absolute;right:8px;top:112px;width:96px;text-align:center;color:#E4DED1;font-size:11px;opacity:.8;pointer-events:none}
.zone-tag{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);color:#E4DED1;font:20px 'Russo One',sans-serif;opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 2px 8px #000;text-align:center;white-space:nowrap}
.zone-tag small{display:block;font:13px Rubik,sans-serif;opacity:.8}
.zone-tag.show{opacity:1}
.talk{position:absolute;left:50%;bottom:258px;transform:translateX(-50%);border:1px solid var(--faction);background:rgba(20,27,34,.9);color:#E4DED1;border-radius:12px;padding:10px 18px;font:14px 'Russo One',sans-serif;box-shadow:0 0 18px rgba(242,169,59,.25);white-space:nowrap}
.talk[hidden]{display:none}
.stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(228,222,209,.25);background:rgba(20,27,34,.35);pointer-events:none;display:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(228,222,209,.35);border:2px solid rgba(228,222,209,.5)}
.stick-hint{position:absolute;left:16px;bottom:62px;color:#E4DED1;opacity:.45;font-size:12px;pointer-events:none;max-width:150px}
.skills{position:absolute;right:8px;bottom:12px;width:220px;height:236px}
.sk{position:absolute;border-radius:50%;border:2px solid rgba(228,222,209,.35);background:rgba(20,27,34,.75);color:#E4DED1;font:11px 'Russo One',sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none;padding:0}
.sk.main{right:0;bottom:0;width:90px;height:90px;border-color:var(--faction);font-size:13px}
.sk.c0{right:100px;bottom:0;width:56px;height:56px}
.sk.c1{right:94px;bottom:64px;width:56px;height:56px}
.sk.c2{right:54px;bottom:118px;width:56px;height:56px}
.sk.c3{right:0;bottom:128px;width:56px;height:56px}
.sk.mini{width:44px;height:44px;font-size:9px}
.sk.kit{right:164px;bottom:6px}
.sk.auto{right:66px;bottom:188px}
.sk svg{width:28px;height:28px;position:relative}
.sk.c0,.sk.c1,.sk.c2,.sk.c3{padding:0;border:0;background:none;overflow:visible;border-radius:14px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.sk .skart{position:absolute;inset:0;width:100%;height:100%}
.sk .cdc{position:absolute;inset:3px;border-radius:11px;background:conic-gradient(rgba(8,11,15,.74) calc(var(--p,0)*1%), transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font:18px 'Russo One',sans-serif;color:#fff;text-shadow:0 1px 4px #000,0 0 2px #000}
.sk.ready{animation:none}
.sk.pop{animation:skpop .45s ease-out}
@keyframes skpop{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.14);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}
.sk.c0:active,.sk.c1:active,.sk.c2:active,.sk.c3:active{transform:scale(.92)}
/* окно классов */
.clscard{border:2px solid var(--line);background:var(--panel-2);border-radius:16px;padding:14px;margin-bottom:12px}
.clshead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.clshead h3{margin:0;font:20px 'Russo One',sans-serif}
.clshead span{color:var(--muted);font-size:13px}
.cbar{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.cbar span{color:var(--muted);text-align:right}
.cbar i{height:8px;border-radius:4px;background:var(--panel);overflow:hidden}
.cbar i b{display:block;height:100%;border-radius:4px}
.cbar em{font-style:normal;font-weight:700}
.clsskills{display:grid;gap:8px;margin:12px 0}
.clsskill{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.clsskill .ic{width:54px;height:54px;flex:none}
.clsskill .ic svg{width:54px;height:54px}
.clsskill b{display:block;font-size:14px}
.clsskill small{display:block;color:var(--muted);font-size:13px}
.clsskill em{font-style:normal;font-size:12px;color:var(--cyan)}
.clsbtn{background:rgba(242,169,59,.14);border-color:rgba(242,169,59,.6);color:var(--amber);font-weight:700}
.clsbtn:disabled{opacity:.6;cursor:default}
.clsline{display:flex;align-items:center;gap:10px}
.clsline b{font:17px 'Russo One',sans-serif}
.clsline small{display:block;color:var(--muted);font-size:12px}
.clsline .act{margin-left:auto}
.sk .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;transform:scaleY(0)}
.sk span{position:relative;line-height:1.15;text-align:center}
.sk.on{background:var(--faction);color:#1B232C}
.death{position:absolute;inset:0;display:none;place-items:center;background:rgba(80,20,20,.5);color:#fff;font:22px 'Russo One',sans-serif;text-align:center;pointer-events:none}
.death.show{display:grid}
.fade{position:absolute;inset:0;background:#0E1318;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}

/* ---- нижнее меню ---- */
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);padding:6px 4px 8px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 10px;border-radius:8px}
.nav button[aria-current="page"]{color:var(--text)}
.nav button[aria-current="page"] svg{color:var(--faction)}
.nav svg{width:22px;height:22px}

/* ---- окна ---- */
.sheet{position:fixed;inset:0;background:rgba(10,14,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.card{width:100%;max-width:520px;max-height:82%;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-head h2{margin:0;font:19px 'Russo One',sans-serif}
.card-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card-head .x{margin-left:auto;border:0;background:var(--panel-2);border-radius:10px;width:36px;height:36px;font-size:18px;flex:none}
.card-body{overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px;font-size:13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--faction);border-color:var(--faction);color:#1B232C}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px;font-size:13px}
.chips button[aria-pressed="true"]{border-color:var(--faction);color:var(--faction);font-weight:700}
.money{font-size:13px;color:var(--muted);margin-bottom:10px}
.money b{color:var(--text)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.li .ic{width:40px;height:40px;flex:none;border-radius:9px;background:#1B232C;display:grid;place-items:center}
.li .ic svg{width:28px;height:28px}
.li .tx{flex:1;min-width:0;font-size:14px}
.li .tx small{display:block;color:var(--muted);font-size:12px}
.li .need{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;margin-top:3px}
.li .need .ok{color:var(--ok)}.li .need .no{color:var(--rust)}
.act{border:0;border-radius:10px;padding:9px 12px;background:var(--faction);color:#1B232C;font-weight:700;font-size:13px;white-space:nowrap}
.act.alt{background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:500}
.act:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;background:#1B232C;border:1px solid #34414E;display:grid;place-items:center;position:relative;padding:0}
.cell svg{width:62%;height:62%}
.cell b{position:absolute;right:4px;bottom:2px;font-size:11px;color:#E4DED1}
.cell.sel{border-color:var(--faction);box-shadow:0 0 0 2px var(--faction) inset}
.cell.empty{opacity:.45;cursor:default}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.slot{border-radius:12px;background:var(--panel-2);border:1px dashed var(--line);padding:8px;text-align:center;font-size:12px;color:var(--muted);min-height:92px}
.slot .ic{width:40px;height:40px;margin:4px auto;border-radius:9px;background:#1B232C;display:grid;place-items:center}
.slot .ic svg{width:28px;height:28px}
.slot.has{border-style:solid;color:var(--text)}
.detail{margin-top:10px;background:var(--panel-2);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;min-height:62px}
.detail .tx{flex:1;font-size:14px}.detail small{display:block;color:var(--muted);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* ---- профиль ---- */
.prof{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.pcard h3{margin:0 0 10px;font:17px 'Russo One',sans-serif}
.who{display:flex;gap:12px;align-items:center}
.who svg{width:64px;height:70px;flex:none;background:#1B232C;border-radius:12px;padding:4px}
.who b{display:block;font:18px 'Russo One',sans-serif}
.faction-btn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline dotted}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stats div{background:var(--panel-2);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.stats b{display:block;font:17px 'Russo One',sans-serif;color:var(--text)}
.bal{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.bal b{font:30px 'Russo One',sans-serif}
.bal span{color:var(--muted)}
.addr{font-size:13px;color:var(--muted);margin-bottom:12px;word-break:break-all}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px;font-weight:500}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#10181F}
.btn.wide{width:100%}
#gConnect{margin-bottom:8px}
.demo{font-size:12px;color:var(--muted);margin:10px 0 0}
.reflink{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.reflink code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px Rubik,sans-serif}
.reflink button{border:0;background:var(--faction);color:#1B232C;border-radius:8px;padding:6px 10px;font-weight:500}
.refnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.refnums div{background:var(--panel-2);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--muted)}
.refnums b{display:block;font:18px 'Russo One',sans-serif;color:var(--text)}
.rules{margin:0;padding:0;list-style:none;font-size:13px;display:grid;gap:6px}
.rules li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.rules li:last-child{border:0;padding:0}
.rules em{font-style:normal;font-weight:700;color:var(--ok);white-space:nowrap}
.hist{display:grid;gap:6px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px}
.hist small{color:var(--muted);display:block}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--rust);font-weight:700}
.field{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;padding:12px;font:16px Rubik,sans-serif;margin:6px 0 10px}

/* ---- персонаж ---- */
.cstage{position:relative;background:radial-gradient(90% 70% at 50% 40%,#2B3845 0%,#161D25 70%);border:1px solid var(--line);border-radius:18px;padding:14px 10px;display:grid;grid-template-columns:74px 1fr 74px;gap:6px;align-items:center;color:#E4DED1}
.ccol{display:flex;flex-direction:column;gap:12px}
.cslot{height:74px;border-radius:14px;background:#141B22;border:2px solid #34414E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#93A0AC;font-size:10px;padding:4px}
.cslot svg{width:36px;height:36px}
.cslot .empty-ic{width:36px;height:36px;border:2px dashed #34414E;border-radius:8px}
.cslot.sel{box-shadow:0 0 0 3px var(--faction)}
.crobot{width:100%;max-height:250px;animation:cbob 3s ease-in-out infinite}
@keyframes cbob{50%{transform:translateY(-6px)}}
.cplat{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:44%;height:18px;border-radius:50%;background:repeating-linear-gradient(-45deg,#F2A93B 0 8px,#1B232C 8px 16px);opacity:.5}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cstats div{background:var(--panel-2);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.cstats b{display:block;font:17px 'Russo One',sans-serif;color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chips.wrap{flex-wrap:wrap}.chips.wrap button{flex:0 0 auto;padding:6px 10px}
.cmp{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:3px}
.up{color:var(--ok)}.down{color:var(--rust)}
.li.gear{border-left-width:4px}
button.li{width:100%;font:inherit;color:inherit}
.cdetail{display:flex;gap:10px;align-items:center}
.cdetail .ic{width:48px;height:48px;border-radius:10px;background:#1B232C;display:grid;place-items:center;flex:none;border:2px solid}
.cdetail .ic svg{width:34px;height:34px}
.cdetail .tx{flex:1;min-width:0;font-size:15px}
.cdetail small{display:block;color:var(--muted);font-size:12px}

/* ---- чат ---- */
.chatbar{position:absolute;left:8px;bottom:10px;max-width:calc(100% - 236px);display:flex;align-items:center;gap:8px;background:rgba(20,27,34,.85);border:1px solid #34414E;color:#E4DED1;border-radius:12px;padding:7px 10px;font-size:12px;text-align:left}
.chatbar svg{width:18px;height:18px;flex:none;color:var(--faction)}
.chatbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chatbar b{color:var(--faction);font-weight:500}
.chatbar .dot{width:7px;height:7px;border-radius:50%;background:#E0694A;flex:none;display:none}
.chatbar.new .dot{display:block}
.chatpanel{position:absolute;left:0;right:0;bottom:0;height:52%;min-height:280px;display:flex;flex-direction:column;background:rgba(16,22,28,.97);border-top:2px solid var(--faction);color:#E4DED1;z-index:3;touch-action:auto}
.chatpanel[hidden]{display:none}
.cp-head{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;font:15px 'Russo One',sans-serif}
.cp-head svg{width:18px;height:18px;color:var(--faction)}
.cp-x{margin-left:auto;background:none;border:0;color:#93A0AC;font-size:18px;padding:2px 6px}
.cp-tabs{display:flex;border-bottom:1px solid #2A3440}
.cp-tabs button{flex:1;background:none;border:0;color:#93A0AC;padding:9px 4px;font-size:14px;border-bottom:3px solid transparent;position:relative}
.cp-tabs button[aria-selected="true"]{color:#E4DED1;border-bottom-color:var(--faction);font-weight:500}
.cp-tabs i{position:absolute;top:6px;margin-left:3px;width:6px;height:6px;border-radius:50%;background:#E0694A}
.cp-sub{padding:6px 12px;font-size:12px;color:#93A0AC;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0}
.cp-sub:empty{display:none}
.cp-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #34414E;background:#1B232C;color:#E4DED1;border-radius:14px;padding:4px 6px 4px 10px;font-size:12px}
.cp-chip[aria-pressed="true"]{border-color:var(--faction);color:var(--faction)}
.cp-chip span{color:#93A0AC;font-size:13px;padding:0 3px}
.cp-guild{display:flex;gap:6px;width:100%}
.cp-guild input{flex:1;min-width:0;border:1px solid #34414E;background:#1B232C;color:#E4DED1;border-radius:10px;padding:8px 10px;font:14px Rubik,sans-serif}
.cp-log{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.cp-empty{margin:auto;text-align:center;color:#93A0AC;font-size:13px;max-width:260px}
.msg{font-size:14px;line-height:1.35;word-wrap:break-word}
.msg .top{display:flex;align-items:baseline;gap:6px}
.msg .who{font-weight:700;background:none;border:0;padding:0;font-size:13px;cursor:pointer}
.msg .who[disabled]{cursor:default}
.msg .lv{font-size:11px;color:#93A0AC}
.msg .tm{font-size:11px;color:#6B7884}
.msg .tx{color:#E4DED1}
.msg.me .tx{color:#F7E7C6}
.msg.sys{color:#93A0AC;font-size:13px;font-style:italic}
.msg.sys.gold{color:#F2C14B;font-style:normal}
.cp-in{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #2A3440}
.cp-in input{flex:1;min-width:0;border:1px solid #34414E;background:#1B232C;color:#E4DED1;border-radius:22px;padding:10px 14px;font:16px Rubik,sans-serif}
.cp-in button{width:44px;height:44px;border-radius:50%;border:0;background:var(--faction);color:#1B232C;display:grid;place-items:center;flex:none}
.cp-in svg{width:20px;height:20px}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);font-size:12px;text-decoration:underline}
.cp-err{position:absolute;left:50%;top:-54px;transform:translateX(-50%);background:#5A1F1F;border:1px solid #E0694A;color:#FFD9D0;border-radius:10px;padding:8px 14px;font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s}
.cp-err.show{opacity:1}

/* ---- профиль ---- */
.pscreen{display:flex;flex-direction:column;background:var(--bg)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.phead svg{width:22px;height:22px;color:var(--faction)}
.phead h1{margin:0;font:20px 'Russo One',sans-serif}
.phead span{margin-left:auto;color:var(--muted);font-size:13px}
.ptabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 6px;scrollbar-width:none}
.ptabs button{flex:1 0 auto;background:none;border:0;color:var(--muted);padding:10px 12px;font-size:14px;border-bottom:3px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--faction);font-weight:500}
.pbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.pcard h3{margin:0 0 10px;font:16px 'Russo One',sans-serif}
.balance{text-align:center;padding:22px 14px;background:radial-gradient(80% 90% at 50% 0%,rgba(95,212,232,.18),transparent 70%),var(--panel)}
.balance .gem{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:rgba(95,212,232,.14)}
.balance .gem svg{width:26px;height:26px}
.balance small{display:block;color:var(--cyan);font-size:13px;margin-bottom:4px}
.balance .num{font:34px 'Russo One',sans-serif;letter-spacing:.5px}
.balance .num span{font-size:20px;color:var(--muted)}
.balance .num em{font-style:normal;font-size:16px;color:var(--amber);margin-left:6px}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wbtn{border-radius:14px;padding:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid}
.wbtn svg{width:18px;height:18px}
.wbtn.dep{background:rgba(123,201,138,.14);border-color:rgba(123,201,138,.5);color:var(--ok)}
.wbtn.wd{background:rgba(242,169,59,.14);border-color:rgba(242,169,59,.5);color:var(--amber)}
.tonbox{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.tonbox .wi{width:34px;height:34px;border-radius:9px;background:var(--panel);display:grid;place-items:center;flex:none}
.tonbox .wi svg{width:18px;height:18px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px;font-weight:500}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#10181F}
.btn.link{background:rgba(95,212,232,.08);border-color:rgba(95,212,232,.4);color:var(--cyan)}
.btn.wide{width:100%}
.promo{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(242,169,59,.14),transparent),var(--panel);border-color:rgba(242,169,59,.35)}
.promo svg{width:48px;height:48px;flex:none}
.promo b{font:16px 'Russo One',sans-serif;color:var(--amber)}
.promo .tag{font-size:10px;font-weight:700;background:var(--amber);color:#1B232C;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.promo small{display:block;color:var(--muted);font-size:13px}
.ops{display:grid;gap:10px}
.op{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.op small{display:block;color:var(--muted);font-size:12px}
.op .r{text-align:right;font-weight:700}
.op .r small{font-weight:400}
.plus{color:var(--ok)}.minus{color:var(--rust)}
.demo{font-size:12px;color:var(--muted);margin:10px 0 0}
.reflink{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:12px;padding:10px 12px;margin:8px 0}
.reflink code{flex:1;min-width:0;word-break:break-all;font:13px Rubik,sans-serif}
.reflink button{border:0;background:var(--faction);color:#1B232C;border-radius:8px;padding:7px 10px;font-weight:500;flex:none}
.cap{font-size:12px;color:var(--muted)}
.cap b{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;font-size:12px;color:var(--muted)}
.two b{display:block;font:22px 'Russo One',sans-serif;color:var(--text)}
.empty{text-align:center;color:var(--cyan);font-size:14px;padding:18px 0}
.empty small{display:block;color:var(--muted)}
.blog{display:grid;gap:6px}
.bl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.bl .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.bl .ico svg{width:18px;height:18px}
.bl.win .ico{background:rgba(123,201,138,.15);color:var(--ok)}
.bl.lose .ico{background:rgba(224,105,74,.15);color:var(--rust)}
.bl small{display:block;color:var(--muted);font-size:12px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;font-weight:500;text-align:left}
.langs button[aria-pressed="true"]{border-color:var(--ok);background:rgba(123,201,138,.12);color:var(--ok)}
.langs .fl{font-size:20px}
.langs .ck{margin-left:auto}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.set:last-child{border:0}
.set small{display:block;color:var(--muted);font-size:12px}
.set .tx{flex:1}
.sw{width:48px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.set input[type=range]{width:100%;accent-color:var(--faction)}
.field{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;padding:12px;font:16px Rubik,sans-serif;margin:4px 0 10px}
.flabel{font-size:12px;color:var(--muted)}
.copyrow{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
.copyrow code{flex:1;min-width:0;word-break:break-all;font:13px ui-monospace,Menlo,monospace}
.copyrow button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;flex:none}
.note{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;border:1px solid}
.note.warn{background:rgba(242,169,59,.10);border-color:rgba(242,169,59,.45);color:var(--amber)}
.note.info{background:rgba(95,212,232,.08);border-color:rgba(95,212,232,.35);color:var(--text)}
.note b{display:block}
.note small{color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--cyan);border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.wallets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.wallets button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px 8px;font-size:13px}
.wallets .wl{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:18px 'Russo One',sans-serif;color:#fff}
.orline{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 8px}

/* ---- таргет и пати ---- */
.tframe{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:196px;background:rgba(16,22,28,.92);border:1px solid #34414E;border-radius:12px;padding:7px 8px;color:#E4DED1;z-index:2}
.tframe[hidden]{display:none}
.tf-top{display:flex;align-items:center;gap:7px}
.tf-ic{width:28px;height:28px;border-radius:8px;background:#1B232C;display:grid;place-items:center;flex:none;overflow:hidden}
.tf-ic svg{width:24px;height:24px}
.tf-tx{flex:1;min-width:0}
.tf-tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-tx small{display:block;font-size:11px;color:#93A0AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-x{background:none;border:0;color:#93A0AC;font-size:15px;padding:2px 4px}
.tf-bar{position:relative;height:12px;margin-top:6px;border-radius:6px}
.tf-bar i{background:linear-gradient(90deg,#E0694A,#F2A93B)}
.tf-bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;text-shadow:0 1px 2px #000}
.tf-acts{display:flex;gap:5px;margin-top:6px}
.tf-acts:empty{display:none}
.tf-acts button{flex:1;border:1px solid #34414E;background:#1B232C;color:#E4DED1;border-radius:8px;padding:6px 2px;font-size:11px;font-weight:500}
.tf-acts button[data-tf="heal"]{border-color:#7BC98A;color:#7BC98A}
.tf-acts button[data-tf="invite"]{border-color:var(--faction);color:var(--faction)}
.tf-acts button:disabled{opacity:.5}
.pframes{position:absolute;left:8px;top:150px;width:112px;display:flex;flex-direction:column;gap:5px;z-index:2}
.pframes[hidden]{display:none}
.pf{display:grid;grid-template-columns:1fr auto;gap:2px 4px;background:rgba(16,22,28,.88);border:1px solid #34414E;border-radius:9px;padding:5px 7px;text-align:left;color:#E4DED1}
.pf.far{opacity:.6}
.pf-n{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-l{font-size:10px;color:#93A0AC}
.pf-bar{grid-column:1/3;height:5px;border-radius:3px;background:#34414E;overflow:hidden}
.pf-bar b{display:block;height:100%;background:#7BC98A}
.pf small{grid-column:1/3;font-size:9px;color:#93A0AC}
.pf-acts{display:flex;gap:4px}
.pf-acts button{flex:1;border:1px solid #34414E;background:rgba(16,22,28,.88);color:#93A0AC;border-radius:7px;padding:4px;font-size:10px}
.pinvite{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(16,22,28,.96);border:1px solid var(--faction);border-radius:14px;padding:12px 14px;color:#E4DED1;text-align:center;z-index:4;width:250px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pinvite[hidden]{display:none}
.pinvite span{display:block;font-size:14px;margin-bottom:10px}
.pinvite div{display:flex;gap:8px}
.pinvite button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:700}
.pinvite button[data-pi="yes"]{background:#7BC98A;color:#10181F}
.pinvite button[data-pi="no"]{background:#34414E;color:#E4DED1}
.pinfo{display:flex;gap:12px;align-items:center}
.pinfo-av{width:84px;height:92px;background:#1B232C;border-radius:12px;display:grid;place-items:center;flex:none}
.pinfo-av svg{width:74px;height:82px}
.pinfo-tx{display:grid;gap:6px;flex:1}
.pinfo-tx small{display:block;font-size:11px;color:var(--muted)}
.pinfo-tx b{font-size:14px}
.pinfo-eq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pinfo-eq div{border:1px solid;border-radius:10px;padding:6px;text-align:center;background:var(--panel-2)}
.pinfo-eq small{display:block;font-size:10px;color:var(--muted)}
.pinfo-eq b{font-size:12px}
/* ---- прокачка ---- */
.ctabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.ctabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.ctabs button[aria-pressed="true"]{background:var(--faction);color:#1B232C}
.ctabs i{font-style:normal;background:#E0694A;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:4px}
.ptscard{display:flex;align-items:center;justify-content:space-between;background:radial-gradient(80% 120% at 0% 0%,rgba(123,201,138,.16),transparent 60%),var(--panel)}
.ptscard small{display:block;color:var(--muted);font-size:12px}
.ptscard b{font:30px 'Russo One',sans-serif;color:var(--ok)}
.ptsmeta{text-align:right;font-size:12px;color:var(--muted);line-height:1.5}
.upstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.upstats div{background:var(--panel-2);border-radius:10px;padding:8px 2px;text-align:center;font-size:10px;color:var(--muted)}
.upstats b{display:block;font:14px 'Russo One',sans-serif;color:var(--text)}
.uplist{display:grid;gap:8px}
.uprow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.uprow .tx{flex:1;min-width:0}
.uprow b{font-size:14px}
.uprow small{display:block;font-size:12px;color:var(--text)}
.uprow small.muted{color:var(--muted)}
.upbtn{border:0;border-radius:10px;padding:8px 10px;background:linear-gradient(180deg,#3A7BD5,#2A5CA8);color:#fff;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;min-width:88px}
.upbtn span:last-child{font-size:10px;opacity:.85}
.upbtn.wide{width:100%;flex-direction:row;justify-content:center;gap:6px;padding:10px;margin-top:10px}
.upbtn:disabled{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.skcard{display:flex;flex-direction:column}
.skhead{display:flex;gap:12px;align-items:center}
.skic{width:62px;height:62px;flex:none}
.skic svg{width:62px;height:62px}
.skhead .tx{flex:1}
.skhead b{display:block;font:16px 'Russo One',sans-serif}
.skhead small{display:block;font-size:12px;font-weight:500}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{flex:1;height:5px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.pips i.on{background:var(--faction);border-color:var(--faction)}
.sklore{margin:10px 0 6px;font-size:13px;color:var(--muted);font-style:italic}
.skeff{font-size:14px;font-weight:500;background:var(--panel-2);border-radius:10px;padding:8px 10px}
.skmeta{font-size:12px;color:var(--cyan);margin-top:6px}
.sknext{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px}
.sknext small{width:100%;color:var(--muted)}
.sknext span{color:var(--ok);background:rgba(123,201,138,.1);border-radius:6px;padding:2px 6px}
.paslist{display:grid;gap:8px}
.pasrow{display:flex;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.pasrow.locked{opacity:.85}
.pasic{width:42px;height:42px;border-radius:12px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 35%,#141B22),#0E1318);border:2px solid var(--c);display:grid;place-items:center;flex:none}
.pasic svg{width:24px;height:24px}
.pasrow .tx{flex:1;min-width:0}
.pasrow b{font-size:14px}
.pasrow em{font-style:normal;font-size:12px;color:var(--amber)}
.pasrow small{display:block;font-size:12px;color:var(--muted)}
.pasrow small.now{color:var(--ok)}
.pasrow .upbtn.wide{margin-top:8px;padding:8px}

/* ---- позывной ---- */
.namehero{display:grid;place-items:center;margin:-4px 0 8px}
.namehero svg{width:110px;height:120px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}

/* ---- рейтинг ---- */
.bmcard{text-align:center;background:radial-gradient(80% 100% at 50% 0%,rgba(242,193,75,.16),transparent 70%),var(--panel)}
.bmcard small{display:block;color:var(--muted);font-size:13px}
.bmcard b{display:block;font:32px 'Russo One',sans-serif;color:#F2C14B}
.bmcard span{font-size:12px;color:var(--muted)}
.tlist{display:grid;gap:6px}
.trow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.trow.me{border-color:var(--faction);box-shadow:0 0 0 1px var(--faction) inset}
.trow .tx{flex:1;min-width:0}
.trow .tx b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tx small{display:block;color:var(--muted);font-size:12px}
.trow .bm{text-align:right;font:16px 'Russo One',sans-serif}
.trow .bm small{display:block;font:11px Rubik,sans-serif;color:var(--muted)}
.rk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:13px 'Russo One',sans-serif;background:var(--panel-2);color:var(--muted);flex:none}
.rk.m1{background:#F2C14B;color:#1B232C}.rk.m2{background:#C9D1D8;color:#1B232C}.rk.m3{background:#C98A4E;color:#1B232C}
.tmine{font-size:13px;color:var(--muted)}
.tmine b{color:var(--text)}
.bmline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.bmline b{font:20px 'Russo One',sans-serif;color:#F2C14B}

/* ---- гильдии ---- */
.ghead{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.ghead h1{margin:0;font:20px 'Russo One',sans-serif}
.ghead .act{margin-left:auto}
.gsearch{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 12px;font:15px Rubik,sans-serif}
.gitem{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.gitem .tx{flex:1;min-width:0}
.gitem b{font-weight:700}
.gitem .tag{color:var(--muted);font-weight:500;margin-right:4px}
.gitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.gitem p{margin:4px 0 0;font-size:13px;color:var(--text);opacity:.85;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gbanner{display:flex;gap:14px;align-items:center;background:radial-gradient(90% 120% at 0% 0%,rgba(242,169,59,.14),transparent 60%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.gbanner .tx{flex:1;min-width:0}
.gbanner h2{margin:0;font:19px 'Russo One',sans-serif;overflow:hidden;text-overflow:ellipsis}
.gbanner small{display:block;color:var(--muted);font-size:13px}
.gbanner p{margin:6px 0 0;font-size:13px}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.gstats b{display:block;font:16px 'Russo One',sans-serif;color:var(--text)}
.gtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.gtabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;position:relative}
.gtabs button[aria-pressed="true"]{background:var(--faction);border-color:var(--faction);color:#1B232C;font-weight:700}
.gtabs i{font-style:normal;background:#E0694A;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:5px}
.mem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mem .tx{flex:1;min-width:0;font-size:14px}
.mem small{display:block;color:var(--muted);font-size:12px}
.role{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;flex:none}
.role.leader{background:rgba(242,193,75,.18);color:#F2C14B}

.perks{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px}
.perks li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px}

.glog{display:grid;gap:6px;font-size:13px}

.pick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.pick button{border:2px solid var(--line);background:var(--panel-2);border-radius:10px;padding:4px;display:grid;place-items:center}

.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--faction);color:var(--faction);font-weight:700}
textarea.field{min-height:70px;resize:vertical}
.danger{color:var(--rust)!important;border-color:rgba(224,105,74,.5)!important}
.actlist{display:grid;gap:8px}
.actlist .btn{text-align:left}

  const it = ITEMS[id], m = GRADES[g||0].mult, o = {};

  if(it.crit) o.crit = Math.round(it.crit*m);
  return o;
}
function gearDesc(id, g){
  const s = gearStats(id, g), p = [];
  if(s.atk) p.push("+" + s.atk + " атаки");

  return p.join(", ");

// итоговые характеристики с учётом экипировки
function stat(){
  const C = classParams(), U = S.up || {};
  let atk = Math.round(S.attack*C.atk) + (U.atk || 0), def = Math.round(S.defense*C.def) + (U.def || 0);
  let maxhp = Math.round(S.max_hp*C.hp) + 10*(U.hp || 0), spd = 0, crit = 3 + (U.crit || 0);
  for(const e of Object.values(S.eq)){ if(!e) continue; const s = gearStats(e.id, e.g); atk += s.atk||0; def += s.def||0; maxhp += s.hp||0; spd += s.spd||0; crit += s.crit||0; }
  maxhp = Math.round(maxhp*(1 + 0.03*pasLv("vital")));
  crit += 2*pasLv("eagle");
  spd += 0.02*pasLv("servo");
  return {atk, def, maxhp, spd, crit,
    critPow:2 + 0.05*(U.cpow || 0) + 0.04*pasLv("fury"),
    rate:1 + 0.02*(U.aspd || 0) + 0.02*pasLv("swift"),
    regen:0.1*(U.regen || 0) + 0.2*pasLv("selfrepair"),
    dmgRed:Math.min(0.45, 0.03*pasLv("steelskin")),
    thorns:0.04*pasLv("retaliate"), steal:0.02*pasLv("hunger"), execute:0.06*pasLv("execute"),
    range:12*pasLv("longshot"), skillDmg:0.04*pasLv("overload"),
    cdr:Math.min(0.5, 0.02*pasLv("cold") + 0.025*pasLv("cyclotron")), loot:0.03*pasLv("looter")};
}

// Боевая мощь (БМ): одно число для сравнения пилотов и рейтинга
function combatPower(){
  const st = stat();
  let bm = st.atk*12 + st.def*10 + st.maxhp*1.5 + st.crit*6 + st.spd*300 + S.level*25;
  bm += (st.critPow - 2)*120 + (st.rate - 1)*500 + st.regen*40 + st.dmgRed*600 + st.steal*500 + st.cdr*400 + st.skillDmg*300;
  for(const [id, lv] of Object.entries(S.skl || {})) bm += (lv - 1)*15;
  return Math.round(bm);
}

const count = (list, id) => list.filter(x => x.id === id && ITEMS[id].type !== "gear").reduce((a,x) => a + x.n, 0);
const have = id => id === "scrap" ? S.scrap : id === "cores" ? S.cores : count(S.inv, id);
function addItem(list, id, n, max, g){
  const stackable = ITEMS[id].type !== "gear";
  if(stackable){
    const ex = list.find(x => x.id === id);
    if(ex){ ex.n += n; return n; }
    if(list.length >= max) return 0;
    list.push({id, n}); return n;
  }
  let added = 0;
  while(added < n && list.length < max){ list.push({id, n:1, g:g||0}); added++; }
  return added;
}
function removeItem(list, id, n){
  for(let i = list.length-1; i >= 0 && n > 0; i--){
    if(list[i].id !== id) continue;
    const take = Math.min(n, list[i].n); list[i].n -= take; n -= take;
    if(list[i].n <= 0) list.splice(i, 1);
  }
}

const Sfx = (() => {
  let ac = null;
  const ctxA = () => { if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } } if(ac.state === "suspended") ac.resume(); return ac; };
  function tone(freq, dur, type, gain, slide){
    if(!S.settings.sound) return; const a = ctxA(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime, v = gain*S.settings.vol;
    o.type = type; o.frequency.setValueAtTime(freq, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  }
  const P = {
    shot:() => tone(880, .09, "square", .05, 320),
    crit:() => { tone(1200, .12, "sawtooth", .06, 400); },
    hit:() => { tone(160, .15, "sawtooth", .08, 60); if(S.settings.vibro && navigator.vibrate) navigator.vibrate(30); },
    kill:() => { tone(300, .08, "square", .06, 600); setTimeout(() => tone(600, .1, "square", .05, 900), 70); },
    pick:() => tone(700, .07, "sine", .08, 1100),
    level:() => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .18, "triangle", .08), i*90)),
    ui:() => tone(520, .04, "sine", .04),
    msg:() => tone(990, .06, "sine", .04, 1300),
    portal:() => tone(200, .5, "sine", .07, 900)
  };
  return {play:n => { try{ P[n] && P[n](); }catch(e){} }};
})();

function seeded(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

      {rx:355, ry:60, rw:70, rh:62, deco:true}, {rx:465, ry:60, rw:70, rh:62, deco:true}, {rx:575, ry:60, rw:70, rh:62, deco:true}, // зарядные станции
      {rx:872, ry:130, rw:68, rh:340, deco:true},               // конвейер
      {rx:60, ry:440, rw:118, rh:150, deco:true},               // ремонтный отсек с шагоходом
      {rx:60, ry:60, rw:120, rh:78, deco:true},                 // ящики у торговца
      {x:660, y:600, r:9, deco:true}, {x:880, y:600, r:9, deco:true}, {x:660, y:860, r:9, deco:true}, {x:880, y:860, r:9, deco:true} // столбики у портала
    ];
    npcs = [{kind:"trader",x:240,y:300},{kind:"storage",x:760,y:300},{kind:"craft",x:240,y:720},{kind:"portal",x:770,y:730}];
    return {x:500, y:640};
  }
  const L = LOCS[key], rng = seeded(Object.keys(LOCS).indexOf(key)*977 + 13);
  W = 2200; H = 2200;
  const spawn = {x:1100, y:1980};
  npcs = [{kind:"back", x:spawn.x, y:spawn.y + 60}];
  while(rocks.length < 70){
    const x = 80 + rng()*(W-160), y = 80 + rng()*(H-160), r = 18 + rng()*32;
    if(Math.hypot(x-spawn.x, y-spawn.y) < 260) continue;
    rocks.push({x, y, r, shade:rng()});
  }
  for(let i = 0; i < L.count; i++) enemies.push(makeEnemy(L.npcs[i % L.npcs.length], spawn));
  return spawn;
}
function makeEnemy(type, spawn){

  do { x = 80 + Math.random()*(W-160); y = 80 + Math.random()*(H-160); tries++; }
  while(tries < 200 && (Math.hypot(x-spawn.x, y-spawn.y) < 480 || rocks.some(r => Math.hypot(r.x-x, r.y-y) < r.r + k.r + 10)));
  return {type, x, y, hx:x, hy:y, tx:x, ty:y, hp:k.hp, max:k.hp, cd:0, ang:Math.random()*6, chase:false, dead:false, respawn:0, flash:0, wanderT:0, lunge:0};
}

// ---- механика ----
function addText(x, y, t, c){ texts.push({x, y, t, c, life:0.9}); }
function pushOut(o, r){
  for(const k of rocks){
    if(k.rw){
      const cx = Math.max(k.rx, Math.min(k.rx + k.rw, o.x)), cy = Math.max(k.ry, Math.min(k.ry + k.rh, o.y));
      const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
      if(d < r){ if(d > 0){ o.x = cx + dx/d*r; o.y = cy + dy/d*r; } else o.y = k.ry + k.rh + r; }
      continue;
    }
    const dx = o.x-k.x, dy = o.y-k.y, d = Math.hypot(dx,dy), m = k.r + r; if(d < m && d > 0){ o.x = k.x + dx/d*m; o.y = k.y + dy/d*m; }
  }
  const wall = locKey === "lobby" ? 60 : 0;
  o.x = Math.max(r + wall, Math.min(W - r - wall, o.x)); o.y = Math.max(r + wall, Math.min(H - r - wall, o.y));
}
const safeSpot = o => locKey === "lobby" || (npcs[0] && Math.hypot(o.x-npcs[0].x, o.y-npcs[0].y) < 150);

let lastHitBy = "враг";

function nearestEnemy(range){
  let best = null, bd = range;
  for(const e of enemies){ if(e.dead) continue; const d = Math.hypot(e.x-p.x, e.y-p.y); if(d < bd){ bd = d; best = e; } }
  return best;
}

function update(dt){
  now += dt;
  const st = stat();
  for(const s of sparks){ s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 300*dt; s.life -= dt; } sparks = sparks.filter(s => s.life > 0);
  if(p.dead){
    p.deadT -= dt;
    if(p.deadT <= 0){ $("death").classList.remove("show"); S.hp = st.maxhp; p.deadT = 99; travel("lobby"); }
    updateEnemies(dt, st); return;
  }
  p.fireCd -= dt; p.dashCd = Math.max(0, p.dashCd-dt); p.kitCd = Math.max(0, p.kitCd-dt); p.inv -= dt; p.flash -= dt;
  if(S.hp > st.maxhp) S.hp = st.maxhp;

  let mx = stick.x, my = stick.y;
  if(keys.KeyW || keys.ArrowUp) my -= 1; if(keys.KeyS || keys.ArrowDown) my += 1;
  if(keys.KeyA || keys.ArrowLeft) mx -= 1; if(keys.KeyD || keys.ArrowRight) mx += 1;
  const ml = Math.hypot(mx,my); if(ml > 1){ mx /= ml; my /= ml; }
  p.moving = ml > 0.08;
  const speed = classParams().speed*(1 + st.spd);
  if(p.dashT > 0){ p.dashT -= dt; p.x += p.dx*1150*dt; p.y += p.dy*1150*dt; }
  else if(p.moving){
    p.x += mx*speed*dt; p.y += my*speed*dt;
    const target = Math.atan2(my, mx); const da = ((target - p.ang + Math.PI*3) % (Math.PI*2)) - Math.PI; p.ang += da*Math.min(1, dt*12);
  }
  pushOut(p, p.r);
  if(safeSpot(p)) S.hp = Math.min(st.maxhp, S.hp + st.maxhp*(locKey === "lobby" ? 0.15 : 0.05)*dt);
  if(st.regen) S.hp = Math.min(st.maxhp, S.hp + st.regen*dt);

  // ближайший NPC для кнопки «Поговорить»
  nearNpc = null;
  for(const n of npcs) if(Math.hypot(n.x-p.x, n.y-p.y) < 95){ nearNpc = n; break; }
  const tb = $("talkBtn");
  if(nearNpc){ tb.hidden = false; tb.textContent = NPC_INFO[nearNpc.kind].talk; } else tb.hidden = true;

  // бой: дальность, частота и вид атаки зависят от класса
  classUpdate(dt);
  const CP = classParams();
  const RANGE = CP.range + st.range;
  const locked = typeof lockedEnemy === "function" ? lockedEnemy() : null;
  const t = locKey === "lobby" ? null : (locked && Math.hypot(locked.x-p.x, locked.y-p.y) < Math.max(RANGE, 240) + 160 ? locked : nearestEnemy(Math.max(RANGE, 240) + (auto ? 40 : 0))); p.target = t;
  const inReach = t && Math.hypot(t.x-p.x, t.y-p.y) <= RANGE + NPCS[t.type].r + (auto ? 10 : 0);
  const wantAim = t ? Math.atan2(t.y-p.y, t.x-p.x) : p.ang;
  const da2 = ((wantAim - p.aim + Math.PI*3) % (Math.PI*2)) - Math.PI; p.aim += da2*Math.min(1, dt*16);
  if(CP.melee && auto && t && !inReach && !p.moving && stick.id === null){ const a = Math.atan2(t.y-p.y, t.x-p.x); p.x += Math.cos(a)*speed*dt; p.y += Math.sin(a)*speed*dt; p.ang = a; p.moving = true; pushOut(p, p.r); }
  if((firing || (auto && inReach)) && p.fireCd <= 0){
    p.fireCd = 1/(CP.rate*(1 + buffV("rate"))*st.rate);
    if(CP.melee){
      if(inReach){ const isCrit = Math.random()*100 < st.crit; hitEnemy(t, (st.atk*(1 + buffV("atk")) + Math.floor(Math.random()*3))*(isCrit ? st.critPow : 1), isCrit ? "crit" : "melee"); Sfx.play(isCrit ? "crit" : "shot"); }
      else { CB.fx.push({type:"slash", x:p.x + Math.cos(p.aim)*34, y:p.y + Math.sin(p.aim)*34, a:p.aim, life:.18, max:.18, c:CP.color || "#fff"}); Sfx.play("ui"); }
    } else if(t && inReach){
      const isCrit = Math.random()*100 < st.crit;
      hitEnemy(t, (st.atk*(1 + buffV("atk")) + Math.floor(Math.random()*3))*(isCrit ? st.critPow : 1), isCrit ? "crit" : "beam");
      Sfx.play(isCrit ? "crit" : "shot");
    } else { beams.push({x1:p.x + Math.cos(p.aim)*24, y1:p.y + Math.sin(p.aim)*24, x2:p.x + Math.cos(p.aim)*200, y2:p.y + Math.sin(p.aim)*200, life:0.12}); Sfx.play("shot"); }
  }


  updateEnemies(dt, st);

  for(const b of bolts){
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(Math.hypot(b.x-p.x, b.y-p.y) < p.r + 4){ hurtPlayer(b.dmg, b.by, b.src); b.life = 0; }
    if(rocks.some(r => !r.rw && Math.hypot(r.x-b.x, r.y-b.y) < r.r)) b.life = 0;
  }
  bolts = bolts.filter(b => b.life > 0);

  // подбор лута
  fullWarnT -= dt;
  for(const d of drops){
    d.t += dt; const dist = Math.hypot(p.x-d.x, p.y-d.y);
    if(dist < 110 && !d.stuck){ d.x += (p.x-d.x)*dt*6; d.y += (p.y-d.y)*dt*6; }
    if(dist > 130) d.stuck = false;
    if(dist < 24 && !d.stuck){
      if(d.kind === "scrap" || d.kind === "cores"){ Sfx.play("pick"); S[d.kind] += d.amt; addText(p.x, p.y-40, "+" + d.amt + (d.kind === "scrap" ? " лома" : " ядро"), d.kind === "scrap" ? "#C9D1D8" : "#5FD4E8"); d.got = true; }
      else if(addItem(S.inv, d.kind, d.amt, INV_MAX, d.g)){ addText(p.x, p.y-40, ITEMS[d.kind].name, d.g !== undefined ? gradeColor(d.g) : "#F2A93B"); if(d.g >= 2) toast("Найдено: " + ITEMS[d.kind].name + " (" + GRADES[d.g].name.toLowerCase() + ")"); if(d.g === 3 && typeof chatAnnounce === "function") chatAnnounce(S.name + " нашёл легендарную вещь: " + ITEMS[d.kind].name); d.got = true; }
      else { d.stuck = true; if(fullWarnT <= 0){ toast("Сумка заполнена. Освободи место на складе или продай"); fullWarnT = 4; } }
    }
  }
  drops = drops.filter(d => !d.got);
}

function updateEnemies(dt, st){
  for(const e of enemies){
    if(e.dead){ if(now > e.respawn) Object.assign(e, makeEnemy(e.type, npcs[0])); continue; }
    const k = NPCS[e.type];
    e.flash -= dt;
    if(e.stun > 0){ e.stun -= dt; e.moving = false; continue; }
    e.cd -= dt; e.lunge -= dt;
    const dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy);
    const safe = p.dead || safeSpot(p);
    if(!safe && d < 240) e.chase = true;
    if(safe || d > 480) e.chase = false;
    let vx = 0, vy = 0;
    if(e.chase){
      e.ang = Math.atan2(dy,dx);
      if(d > k.range*0.85){ vx = dx/d*k.speed; vy = dy/d*k.speed; }
      if(d <= k.range && e.cd <= 0){
        e.cd = 1.3; const dmg = Math.max(1, Math.round(k.atk - st.def*(1 + buffV("def"))));
        if(k.ranged) bolts.push({x:e.x, y:e.y, vx:dx/d*330, vy:dy/d*330, dmg, life:1.2, by:k.name, src:e});
        else { hurtPlayer(dmg, k.name, e); e.lunge = 0.15; }
      }
    } else {
      e.wanderT -= dt;
      if(e.wanderT <= 0){ e.wanderT = 2 + Math.random()*3; e.tx = e.hx + (Math.random()*240-120); e.ty = e.hy + (Math.random()*240-120); }
      const wx = e.tx-e.x, wy = e.ty-e.y, wd = Math.hypot(wx,wy);
      if(wd > 8){ vx = wx/wd*k.speed*0.45; vy = wy/wd*k.speed*0.45; e.ang = Math.atan2(wy,wx); }
      if(e.hp < e.max) e.hp = Math.min(e.max, e.hp + e.max*0.05*dt);
    }
    e.x += vx*dt; e.y += vy*dt; e.moving = !!(vx || vy);
    const sp = npcs[0], sd = Math.hypot(e.x-sp.x, e.y-sp.y);
    if(sd < 190){ e.x = sp.x + (e.x-sp.x)/sd*190; e.y = sp.y + (e.y-sp.y)/sd*190; }
    pushOut(e, k.r);
  }
  for(const b of beams) b.life -= dt; beams = beams.filter(b => b.life > 0);
  for(const t of texts){ t.life -= dt; t.y -= 38*dt; } texts = texts.filter(t => t.life > 0);
}
// ===================== ОТРИСОВКА =====================
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); }
function label(text, x, y, color){
  text = T(text);
  ctx.font = "13px Rubik, sans-serif"; ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillText(text, x+1, y+1); ctx.fillStyle = color; ctx.fillText(text, x, y);
}

// ---- лобби: пол, объекты, свет ----
let steam = [];
const LOBBY_PADS = {trader:"#7BC98A", storage:"#5FD4E8", craft:"#E0694A", portal:"#9B7BFF"};
function drawLobby(cx, cy, t){
  ctx.fillStyle = "#0F151B"; ctx.fillRect(cx, cy, vw, vh);
  // пол из стальных плит с заклёпками
  for(let x = 60; x < W-60; x += 110) for(let y = 60; y < H-60; y += 110){
    if(x+110 < cx || x > cx+vw || y+110 < cy || y > cy+vh) continue;
    ctx.fillStyle = ((x+y)/110) % 2 ? "#1C252E" : "#1F2932"; ctx.fillRect(x, y, 108, 108);
    ctx.fillStyle = "#2A3440";
    for(const [a, b] of [[6,6],[100,6],[6,100],[100,100]]){ circle(x+a, y+b, 2); ctx.fill(); }
  }
  // решётчатые дорожки от центра к станциям
  ctx.save(); ctx.lineCap = "round";
  for(const n of npcs){
    ctx.strokeStyle = "#161E26"; ctx.lineWidth = 46; ctx.beginPath(); ctx.moveTo(500, 500); ctx.lineTo(n.x, n.y); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 40; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(500, 500); ctx.lineTo(n.x, n.y); ctx.stroke(); ctx.setLineDash([]);
    const a = Math.atan2(n.y-500, n.x-500), px = Math.cos(a+Math.PI/2)*24, py = Math.sin(a+Math.PI/2)*24;
    ctx.strokeStyle = "rgba(242,169,59,.45)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(500+px, 500+py); ctx.lineTo(n.x+px, n.y+py); ctx.moveTo(500-px, 500-py); ctx.lineTo(n.x-px, n.y-py); ctx.stroke();
  }
  ctx.restore();
  // площадки станций
  for(const n of npcs){
    const c = LOBBY_PADS[n.kind] || "#F2A93B";
    ctx.fillStyle = "#18212A"; circle(n.x, n.y, 70); ctx.fill();
    ctx.strokeStyle = c; ctx.globalAlpha = .35 + Math.sin(t*2 + n.x)*.1; ctx.lineWidth = 3; circle(n.x, n.y, 70); ctx.stroke();
    ctx.setLineDash([8, 10]); ctx.lineWidth = 2; ctx.globalAlpha = .25; circle(n.x, n.y, 60); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

// ---- надписи над роботом: эмблема гильдии, название гильдии, ник ----
const EMB_PATH = {};
function embPath(icon){
  if(EMB_PATH[icon] !== undefined) return EMB_PATH[icon];
  const src = (typeof G_ICONS !== "undefined" && G_ICONS[icon]) || "";
  const m = src.match(/d="([^"]+)"/);
  try{ EMB_PATH[icon] = m ? new Path2D(m[1]) : null; }catch(e){ EMB_PATH[icon] = null; }
  return EMB_PATH[icon];
}
function drawEmblem(x, y, size, icon, color){
  ctx.save(); ctx.translate(x, y);
  const r = size/2;
  ctx.beginPath(); for(let i = 0; i < 6; i++){ const a = Math.PI/6 + i*Math.PI/3; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); } ctx.closePath();
  ctx.fillStyle = "#1B232C"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
  const path = embPath(icon);
  if(path){ const s = size/40; ctx.scale(s, s); ctx.translate(-12, -12); ctx.fillStyle = color; ctx.fill(path); }
  ctx.restore();
}
function nameText(text, x, y, color, font){
  ctx.font = font; ctx.textAlign = "center";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function drawNameStack(x, y, nick, nickColor, g){
  nameText(nick, x, y - 32, nickColor, "600 13px Rubik, sans-serif");
  if(!g || !g.tag) return;
  const gc = /^#[0-9A-Fa-f]{6}$/.test(g.color || "") ? g.color : "#F2A93B";
  nameText("[" + g.tag + "] " + (g.name || ""), x, y - 47, gc, "11px Rubik, sans-serif");
  drawEmblem(x, y - 68, 22, g.icon || "gear", gc);
}

  } else if(e.type === "sentry_bot"){
    ctx.fillStyle = "#2E3A46"; ctx.fillRect(8, -3, 20, 6);
    ctx.fillStyle = "#5A5F68"; ctx.beginPath(); for(let i = 0; i < 6; i++){ const a = i*Math.PI/3; ctx.lineTo(Math.cos(a)*19, Math.sin(a)*19); } ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1B232C"; circle(0, 0, 9); ctx.fill(); ctx.fillStyle = k.color; circle(3, 0, 5); ctx.fill();
  } else {
    ctx.strokeStyle = "#2E3A46"; ctx.lineWidth = 7; ctx.lineCap = "round";
    const w = Math.sin(t*8)*6*(e.moving ? 1 : 0);
    ctx.beginPath(); ctx.moveTo(-10,-18); ctx.lineTo(-10 + w,-32); ctx.moveTo(10,-18); ctx.lineTo(10 - w,-32);
    ctx.moveTo(-10,18); ctx.lineTo(-10 - w,32); ctx.moveTo(10,18); ctx.lineTo(10 + w,32); ctx.stroke();
    ctx.fillStyle = "#4A4F57"; rr(-24, -22, 48, 44, 10); ctx.fill();
    ctx.fillStyle = "#2E3A46"; ctx.fillRect(18, -5, 22, 10);
    ctx.fillStyle = "#1B232C"; rr(2, -10, 16, 20, 4); ctx.fill(); ctx.fillStyle = k.color; rr(8, -6, 7, 12, 2); ctx.fill();
  }
  if(e.flash > 0){ ctx.globalAlpha = .6; ctx.fillStyle = "#fff"; circle(0, 0, k.r); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
  if(e.stun > 0){ ctx.save(); ctx.strokeStyle = "#5FD4E8"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -t*20; circle(e.x, e.y, k.r + 6); ctx.stroke(); ctx.restore();
    for(let i = 0; i < 3; i++){ const a = t*4 + i*2.1; ctx.fillStyle = "#FFE08A"; circle(e.x + Math.cos(a)*(k.r*0.7), e.y - k.r - 6 + Math.sin(a)*4, 2.5); ctx.fill(); } }
  if(e.hp < e.max || p.target === e){
    const w = k.r*2 + 10;
    ctx.fillStyle = "#1B232C"; ctx.fillRect(e.x - w/2, e.y - k.r - 14, w, 5);
    ctx.fillStyle = "#E0694A"; ctx.fillRect(e.x - w/2, e.y - k.r - 14, w*Math.max(0, e.hp/e.max), 5);
  }
  if(p.target === e || (typeof lockedEnemy === "function" && lockedEnemy() === e)){
    ctx.strokeStyle = typeof lockedEnemy === "function" && lockedEnemy() === e ? "rgba(224,105,74,.95)" : "rgba(242,169,59,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    circle(e.x, e.y, k.r + 9); ctx.stroke(); ctx.setLineDash([]);
    label(k.name, e.x, e.y - k.r - 20, "#E4DED1");
  }
}

const DROP_COLOR = {scrap:"#A7B0B8", cores:"#5FD4E8", wire:"#D9A441", plate:"#C9D1D8", chip:"#5FD4E8"};
function drawDrops(){
  for(const d of drops){
    const bob = Math.sin(d.t*6)*3;
    ctx.save(); ctx.translate(d.x, d.y + bob);
    const gc = d.g !== undefined ? gradeColor(d.g) : null;
    if(gc){ ctx.fillStyle = gc; ctx.globalAlpha = .3 + Math.sin(d.t*5)*.15; circle(0, 0, 15); ctx.fill(); ctx.globalAlpha = 1; }
    else if(d.kind !== "scrap"){ ctx.fillStyle = "rgba(242,169,59,.25)"; circle(0, 0, 11); ctx.fill(); }
    ctx.rotate(Math.PI/4); ctx.fillStyle = gc || DROP_COLOR[d.kind] || "#F2A93B"; ctx.fillRect(gc ? -6 : -5, gc ? -6 : -5, gc ? 12 : 10, gc ? 12 : 10);
    ctx.restore();
  }
}

function drawMinimap(){
  const size = 92, x = vw - size - 8, y = 8, s = size / Math.max(W, H);
  ctx.fillStyle = "rgba(20,27,34,.85)"; rr(x-3, y-3, size+6, size+6, 10); ctx.fill();
  ctx.save(); rr(x, y, size, size, 7); ctx.clip();
  ctx.fillStyle = locKey === "lobby" ? "#1C252E" : LOCS[locKey].ground; ctx.fillRect(x, y, size, size);
  if(locKey === "lobby"){ ctx.fillStyle = "#34414E"; for(const r of rocks){ if(r.rw) ctx.fillRect(x + r.rx*s, y + r.ry*s, r.rw*s, r.rh*s); else { circle(x + r.x*s, y + r.y*s, Math.max(1.5, r.r*s)); ctx.fill(); } } }
  for(const n of npcs){ ctx.fillStyle = n.kind === "portal" || n.kind === "back" ? "#9B7BFF" : (LOBBY_PADS[n.kind] || "#F2A93B"); circle(x + n.x*s, y + n.y*s, 3.5); ctx.fill(); }
  ctx.fillStyle = "#E0694A";
  for(const e of enemies) if(!e.dead && Math.hypot(e.x-p.x, e.y-p.y) < 700) ctx.fillRect(x + e.x*s - 1, y + e.y*s - 1, 2.5, 2.5);
  if(typeof NET !== "undefined"){ ctx.fillStyle = "#7BC98A"; for(const o of NET.others.values()){ circle(x + o.rx*s, y + o.ry*s, 2.5); ctx.fill(); } }
  ctx.fillStyle = "#fff"; circle(x + p.x*s, y + p.y*s, 3); ctx.fill();
  ctx.restore();
}

let drawDt = 0.016;
function draw(t){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = W < vw ? (W - vw)/2 : Math.max(0, Math.min(W - vw, p.x - vw/2));
  const cy = H < vh ? (H - vh)/2 : Math.max(0, Math.min(H - vh, p.y - vh*0.45));
  window.camX = cx; window.camY = cy;
  ctx.fillStyle = "#0F151B"; ctx.fillRect(0, 0, vw, vh);
  ctx.save(); ctx.translate(-cx, -cy);
  if(locKey === "lobby") drawLobby(cx, cy, t); else drawField(cx, cy);
  drawRocks(cx, cy);
  for(const n of npcs) drawNpc(n, t);
  for(const s of sparks){ ctx.fillStyle = "#FFB347"; ctx.globalAlpha = s.life*2; ctx.fillRect(s.x, s.y, 3, 3); } ctx.globalAlpha = 1;
  drawDrops();
  for(const e of enemies) if(!e.dead) drawEnemy(e, t);
  drawClassFx(drawDt);
  if(typeof drawOthers === "function") drawOthers(t, drawDt);
  if(!p.dead) drawBot(p.x, p.y, p.ang, p.aim, t, p.moving, p.flash);
  if(locKey === "lobby") drawLobbyOverlay(t, drawDt);
  for(const b of bolts){ ctx.fillStyle = "#E0694A"; ctx.shadowColor = "#E0694A"; ctx.shadowBlur = 10; circle(b.x, b.y, 5); ctx.fill(); ctx.shadowBlur = 0; }
  for(const b of beams){
    const plasma = b.plasma || (S.eq.weapon && S.eq.weapon.id === "plasma"), c = plasma ? "#C77DFF" : (classParams().color && S.cls !== "guard" ? classParams().color : "#5FD4E8");
    ctx.globalAlpha = b.life/0.12; ctx.strokeStyle = c; ctx.lineWidth = plasma ? 6 : 4; ctx.shadowColor = c; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  ctx.textAlign = "center"; ctx.font = "15px 'Russo One', sans-serif";
  for(const tx of texts){ const s = T(tx.t); ctx.globalAlpha = Math.min(1, tx.life*2); ctx.fillStyle = "#000"; ctx.fillText(s, tx.x+1, tx.y+1); ctx.fillStyle = tx.c; ctx.fillText(s, tx.x, tx.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
  const vg = ctx.createRadialGradient(vw/2, vh/2, Math.min(vw, vh)*0.35, vw/2, vh/2, Math.max(vw, vh)*0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);
  drawMinimap();
}

function hud(){
  const st = stat();
  $("hLvl").textContent = "Ур. " + S.level; $("hName").textContent = S.name;
  $("hHp").textContent = Math.ceil(S.hp) + "/" + st.maxhp;
  $("hHpBar").style.width = Math.max(0, S.hp/st.maxhp*100) + "%";
  $("hXpBar").style.width = Math.min(100, S.exp/expNeed(S.level)*100) + "%";
  $("hScrap").textContent = "Лом " + S.scrap; $("hCores").textContent = "Ядра " + S.cores;
  const bm = "БМ " + combatPower(); if($("hBM").dataset.v !== bm){ $("hBM").dataset.v = bm; $("hBM").textContent = bm; }
  $("kitCount").textContent = have("kit_s") + have("kit_l");
  const cd = (id, v, max) => $(id).querySelector(".cd").style.transform = `scaleY(${Math.max(0, v/max)})`;
  cd("skFire", Math.max(0, p.fireCd), 1/classParams().rate); cd("skKit", p.kitCd, 2);
  classHud();
  if(typeof targetTick === "function") targetTick(drawDt);
}

function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000); last = ts;
  if(running && vw > 0){
    if(!paused) update(dt);
    drawDt = paused ? 0 : dt; draw(ts/1000); hud();
    saveTimer += dt; if(saveTimer > 3){ saveTimer = 0; save(); }
  }
  requestAnimationFrame(loop);
}

// ---- мастерская ----
function renderCraft(){
  let h = invLine() + `<div class="list">`;
  for(const r of RECIPES){
    const it = ITEMS[r.id], lvlOk = !it.lvl || S.level >= it.lvl;
    const parts = Object.entries(r.need).map(([k, n]) => {
      const nm = k === "scrap" ? "Лом" : k === "cores" ? "Ядра" : ITEMS[k].name, hv = have(k);
      return `<span class="${hv >= n ? "ok" : "no"}">${nm} ${Math.min(hv, n)}/${n}</span>`;
    }).join("");
    const can = lvlOk && Object.entries(r.need).every(([k, n]) => have(k) >= n);
    h += `<div class="li"><div class="ic">${icon(r.id)}</div><div class="tx">${it.name}<small>${SLOT_NAME[it.slot]}: ${gearDesc(r.id, 0)} (обычный)${it.lvl ? " · с " + it.lvl + " уровня" : ""}</small><div class="need">${parts}</div></div>
      <button class="act" type="button" data-craft="${r.id}" ${can ? "" : "disabled"}>Собрать</button></div>`;
  }
  body().innerHTML = h + `</div><p class="hint">Грейд собранной вещи случайный: 50% серый, 35% зелёный, 13% синий, 2% золотой. Материалы выпадают из врагов: провода из краулеров и дронов, микросхемы из дронов и стражей, бронепластины из стражей и шагоходов.</p>`;
}

// ---- экипировка (общая для сумки и вкладки Персонаж) ----
function equipAt(i){
  const x = S.inv[i]; if(!x) return false; const it = ITEMS[x.id];
  if(it.lvl && S.level < it.lvl){ toast("Нужен " + it.lvl + " уровень"); return false; }
  const old = S.eq[it.slot];
  S.inv.splice(i, 1); S.eq[it.slot] = {id:x.id, g:x.g||0};
  if(old) S.inv.splice(i, 0, {id:old.id, n:1, g:old.g});
  S.hp = Math.min(S.hp, stat().maxhp);
  toast("Надето: " + it.name); save(); return true;
}
function unequip(slot){
  const e = S.eq[slot]; if(!e) return false;
  if(!addItem(S.inv, e.id, 1, INV_MAX, e.g)){ toast("Сумка заполнена"); return false; }
  S.eq[slot] = null; S.hp = Math.min(S.hp, stat().maxhp); toast("Снято: " + ITEMS[e.id].name); save(); return true;
}

// ---- обработка нажатий во всех окнах ----
$("shBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  const d = b.dataset;
  if(d.chat !== undefined || d.wd || d.wal || d.gs || d.adm || d.cls || d.nick || d.pk) return;   // кнопки чата и кошелька обрабатываются отдельно
  if(d.tab){ trTab = d.tab; }
  else if(d.qty){ trQty = d.qty === "max" ? "max" : +d.qty; }
  else if(d.buy){
    const it = ITEMS[d.buy], n = it.type === "gear" ? 1 : trQty === "max" ? Math.floor(S.scrap/it.price) : trQty;
    if(n < 1 || S.scrap < it.price*n){ toast("Не хватает лома"); return; }
    if(!addItem(S.inv, d.buy, n, INV_MAX, 0)){ toast("Сумка заполнена"); return; }
    S.scrap -= it.price*n; toast("Куплено: " + it.name + " ×" + n);
  }
  else if(d.sell !== undefined){
    const x = S.inv[+d.sell]; if(!x) return; const n = Math.min(+d.n, x.n);
    S.scrap += sellPrice(x)*n; toast("Продано за " + sellPrice(x)*n + " лома");
    if(ITEMS[x.id].type === "gear") S.inv.splice(+d.sell, 1); else removeItem(S.inv, x.id, n);
  }
  else if(d.st){ stTab = d.st; }
  else if(d.move !== undefined){
    const from = stTab === "inv" ? S.inv : S.store, to = stTab === "inv" ? S.store : S.inv, max = stTab === "inv" ? STORE_MAX : INV_MAX;
    const x = from[+d.move]; if(!x) return;
    if(addItem(to, x.id, x.n, max, x.g)) from.splice(+d.move, 1); else toast(stTab === "inv" ? "Склад заполнен" : "Сумка заполнена");
  }
  else if(d.craft){
    const r = RECIPES.find(r => r.id === d.craft);
    const g = rollGrade(GRADE_ODDS.craft);
    if(!addItem(S.inv, r.id, 1, INV_MAX, g)){ toast("Освободи место в сумке"); return; }
    for(const [k, n] of Object.entries(r.need)){ if(k === "scrap" || k === "cores") S[k] -= n; else removeItem(S.inv, k, n); }
    toast("Собрано: " + ITEMS[r.id].name + " — " + GRADES[g].name.toLowerCase() + ". Надень во вкладке Персонаж");
  }
  else if(d.go){ closeSheet(); travel(d.go); return; }
  else if(d.pick !== undefined){ bagSel = bagSel === +d.pick ? null : +d.pick; }
  else if(d.use !== undefined){
    const x = S.inv[+d.use], mh = stat().maxhp;
    if(S.hp >= mh){ toast("Прочность и так полная"); return; }
    S.hp = Math.min(mh, S.hp + ITEMS[x.id].heal); removeItem(S.inv, x.id, 1); toast("Прочность восстановлена"); if(!S.inv[bagSel] || S.inv[bagSel].id !== x.id) bagSel = null;
  }
  else if(d.equip !== undefined){ equipAt(+d.equip); bagSel = null; }
  rerender();
});

let cSlot = null, cSel = null;   // выбранный слот и выбранный предмет из сумки
const STAT_NAMES = {atk:"атака", def:"броня", hp:"прочность", spd:"скорость", crit:"крит"};
function cmpHtml(id, g){
  const it = ITEMS[id], cur = S.eq[it.slot], a = gearStats(id, g), b = cur ? gearStats(cur.id, cur.g) : {};
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  return [...keys].map(k => {
    let d = (a[k]||0) - (b[k]||0); if(!d) return "";
    const v = k === "spd" ? Math.round(d*100) + "%" : k === "crit" ? d + "%" : d;
    return `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${v} ${STAT_NAMES[k]}</span>`;
  }).join("") || `<span>без изменений</span>`;
}
function slotBtn(s){
  const e = S.eq[s];
  return `<button type="button" class="cslot ${cSlot === s ? "sel" : ""}" data-cslot="${s}" ${e ? `style="border-color:${gradeColor(e.g)}"` : ""} aria-label="${SLOT_NAME[s]}${e ? ": " + ITEMS[e.id].name : ", пусто"}">
    ${e ? icon(e.id, e.g) : `<i class="empty-ic"></i>`}<span>${SLOT_NAME[s]}</span></button>`;
}
function renderGearTab(){
  const st = stat(), el = $("scrChar");
  let h = `<section class="cstage">
      <div class="ccol">${["head","weapon","module"].map(slotBtn).join("")}</div>
      <div style="position:relative"><svg class="crobot" viewBox="0 0 210 230">${robotSVG(S.faction)}</svg><div class="cplat"></div></div>
      <div class="ccol">${["armor","core","legs"].map(slotBtn).join("")}</div>
    </section>
    <section class="pcard"><div class="clsline">${S.cls ? `<div><b style="color:${CLASSES[S.cls].color}">${CLASSES[S.cls].name}</b><small>${CLASSES[S.cls].role} · ${CLASSES[S.cls].skills.map(k => k.name).join(", ")}</small></div>` : `<div><b>Класс не выбран</b><small>Класс даёт умения и меняет характеристики</small></div>`}<button class="act" type="button" data-cchange="1">${S.cls ? "Сменить" : "Выбрать"}</button></div></section>
    <section class="pcard"><div class="bmline">Боевая мощь <b>${combatPower().toLocaleString("ru-RU")}</b></div><div class="cstats">
      <div><b>${S.level}</b>Уровень</div><div><b>${st.atk}</b>Атака</div><div><b>${st.def}</b>Броня</div>
      <div><b>${st.maxhp}</b>Прочность</div><div><b>+${Math.round(st.spd*100)}%</b>Скорость</div><div><b>${st.crit}%</b>Крит</div>
    </div>
    <div class="legend">${GRADES.map(g => `<span><i style="background:${g.color}"></i>${g.name}</span>`).join("")}</div></section>`;

  // карточка выбранного: надетое в слоте или вещь из сумки
  const eqSel = cSlot && S.eq[cSlot], invSel = cSel !== null ? S.inv[cSel] : null;
  if(invSel && ITEMS[invSel.id].type === "gear"){
    const it = ITEMS[invSel.id], gc = gradeColor(invSel.g), lock = it.lvl && S.level < it.lvl;
    h += `<section class="pcard"><div class="cdetail"><div class="ic" style="border-color:${gc}">${icon(invSel.id, invSel.g)}</div>
      <div class="tx"><span style="color:${gc}">${it.name}</span><small>${GRADES[invSel.g].name} · ${itemDesc(invSel.id, invSel.g)}${it.lvl ? " · с " + it.lvl + " ур." : ""}</small><div class="cmp">${cmpHtml(invSel.id, invSel.g)}</div></div>
      <button class="act" type="button" data-cequip="${cSel}" ${lock ? "disabled" : ""}>${lock ? "Ур. " + it.lvl : "Надеть"}</button></div></section>`;
  } else if(eqSel){
    const it = ITEMS[eqSel.id], gc = gradeColor(eqSel.g);
    h += `<section class="pcard"><div class="cdetail"><div class="ic" style="border-color:${gc}">${icon(eqSel.id, eqSel.g)}</div>
      <div class="tx"><span style="color:${gc}">${it.name}</span><small>Надето · ${GRADES[eqSel.g].name} · ${itemDesc(eqSel.id, eqSel.g)}</small></div>
      <button class="act alt" type="button" data-cun="${cSlot}">Снять</button></div></section>`;
  }

  // снаряжение из сумки
  const list = S.inv.map((x, i) => ({x, i})).filter(o => ITEMS[o.x.id].type === "gear" && (!cSlot || ITEMS[o.x.id].slot === cSlot))
    .sort((a, b) => (b.x.g - a.x.g) || ITEMS[a.x.id].slot.localeCompare(ITEMS[b.x.id].slot));
  h += `<section class="pcard"><h3>Снаряжение в сумке</h3>
    <div class="chips wrap"><button type="button" data-cslot="" aria-pressed="${!cSlot}">Все</button>${Object.keys(SLOT_NAME).map(s => `<button type="button" data-cslot="${s}" aria-pressed="${cSlot === s}">${SLOT_NAME[s]}</button>`).join("")}</div><div class="list">`;
  h += list.length ? list.map(({x, i}) => {
    const it = ITEMS[x.id], gc = gradeColor(x.g);
    return `<button type="button" class="li gear" data-cpick="${i}" style="border-left-color:${gc};text-align:left;${cSel === i ? "box-shadow:0 0 0 2px var(--faction)" : ""}"><div class="ic">${icon(x.id, x.g)}</div>
      <div class="tx"><span style="color:${gc}">${it.name}</span><small>${SLOT_NAME[it.slot]} · ${gearDesc(x.id, x.g)}</small><div class="cmp">${cmpHtml(x.id, x.g)}</div></div></button>`;
  }).join("") : `<p class="hint" style="margin:0">${cSlot ? "Нет вещей для этого слота." : "В сумке нет снаряжения."} Купи обычные у торговца, выбей из врагов или собери в мастерской.</p>`;
  h += `</div></section>`;
  el.innerHTML = charTabsHtml() + h;
}
$("scrChar").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || b.disabled) return; const d = b.dataset;
  if(d.cchange){ openClassSheet(); return; }
  if(d.cslot !== undefined){ cSlot = d.cslot || null; cSel = null; }
  else if(d.cpick !== undefined){ cSel = cSel === +d.cpick ? null : +d.cpick; }
  else if(d.cequip !== undefined){ if(equipAt(+d.cequip)) cSel = null; }
  else if(d.cun){ unequip(d.cun); }
  renderChar();
});

  else if(name === "top") topTabOpened();

}

// Сообщения хранятся в общем хранилище артефакта. В боте их будет хранить сервер игры,
// и тогда гильдейские и личные сообщения увидят только участники.
let chatDb = null, chatUid = null, chatShared = [], chatLocalMsgs = [];
let chatCh = "world", chatOpen = false, chatLastSend = 0, dmTo = null, chatSeen = {world:Date.now(), guild:Date.now(), dm:Date.now()};
S.dmList = S.dmList || [];
chatLocalMsgs.push({id:"l0", ch:"world", sys:true, local:true, text:"Добро пожаловать в MetalWar! Нажми на ник пилота, чтобы написать ему лично.", ts:Date.now() - 1000});

const me = () => S.name;
const isMine = m => (chatUid && m.uid === chatUid) || m.mine;
const sortTs = arr => arr.sort((a, b) => a.ts - b.ts);
const allMsgs = () => [...chatShared, ...chatLocalMsgs];

function msgsFor(ch){
  const all = allMsgs();
  if(ch === "world") return all.filter(m => m.ch === "world");
  if(ch === "guild") return S.guildId ? all.filter(m => m.ch === "guild" && m.g === S.guildId) : [];
  if(!dmTo) return [];
  return all.filter(m => m.ch === "dm" && ((m.nick === me() && m.to === dmTo) || (m.nick === dmTo && m.to === me())));
}
function unreadIn(ch){
  const all = allMsgs(); let list;
  if(ch === "dm") list = all.filter(m => m.ch === "dm" && m.to === me());
  else if(ch === "guild") list = S.guildId ? all.filter(m => m.ch === "guild" && m.g === S.guildId) : [];
  else list = all.filter(m => m.ch === "world" && !m.local);
  return list.some(m => m.ts > chatSeen[ch] && !isMine(m));
}

function chatLocal(text, gold){ chatLocalMsgs.push({id:"l" + Math.random(), ch:"world", sys:true, gold:!!gold, local:true, text, ts:Date.now()}); onChatUpdate(); }
function chatAnnounce(text){
  if(chatDb) chatDb.collection("chat").add({ch:"world", sys:true, gold:true, text:text.slice(0, 160), ts:Date.now(), uid:chatUid || ""}).catch(() => chatLocal(text, true));
  else chatLocal(text, true);
}

(async () => {
  if(!window.claude || typeof claude.use !== "function") return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db) return;
    try{ chatUid = user ? await user.id() : null; }catch(e){}
    chatDb = db;
    db.collection("chat").orderBy("ts", "desc").limit(200).onSnapshot(snap => {
      const before = chatShared.length;
      chatShared = snap.docs.map(d => ({id:d.id, ...d.data()}))
        .filter(m => typeof m.text === "string" && typeof m.ts === "number" && ["world","guild","dm"].includes(m.ch));
      for(const m of chatShared) if(m.ch === "dm" && m.to === me() && m.nick && m.nick !== me() && !S.dmList.includes(String(m.nick))) S.dmList.push(String(m.nick).slice(0, 16));
      if(before && chatShared.length > before) Sfx.play("msg");
      onChatUpdate();
    }, () => { chatDb = null; chatLocal("Общий чат недоступен, сообщения видишь только ты"); });
  }catch(e){}
})();

const fmtTime = ts => new Date(ts).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});

// всё чужое выводится через textContent — в разметку не попадает
function msgEl(m){
  const el = document.createElement("div");
  if(m.sys){ el.className = "msg sys" + (m.gold ? " gold" : ""); el.textContent = (m.gold ? "★ " : "") + m.text; return el; }
  el.className = "msg" + (isMine(m) ? " me" : "");
  const top = document.createElement("div"); top.className = "top";
  const who = document.createElement("button"); who.type = "button"; who.className = "who";
  const nick = String(m.nick || "Пилот").slice(0, 16);
  who.textContent = nick; who.dataset.notr = "1"; who.style.color = (FACTIONS[m.fac] || FACTIONS.aegis).color;
  if(nick === me() || chatCh === "dm") who.disabled = true; else { who.dataset.dm = nick; who.title = "Написать лично"; }
  const lv = document.createElement("span"); lv.className = "lv"; lv.textContent = "ур. " + (+m.lvl || 1);
  const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = fmtTime(m.ts);
  top.append(who);
  if(m.admin){ const a = document.createElement("span"); a.className = "lv"; a.style.color = "#F2C14B"; a.textContent = "ADM"; top.append(a); }
  top.append(lv, tm);
  const tx = document.createElement("div"); tx.className = "tx"; tx.textContent = m.text; tx.dataset.notr = "1";
  el.append(top, tx); return el;
}

function renderTabsBadges(){
  document.querySelectorAll("[data-cch]").forEach(b => {
    b.setAttribute("aria-selected", String(b.dataset.cch === chatCh));
    b.querySelector("i")?.remove();
    if(b.dataset.cch !== chatCh && unreadIn(b.dataset.cch)) b.append(document.createElement("i"));
