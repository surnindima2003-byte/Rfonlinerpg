      rect(7, 7, 6, 1, G[1]); rect(5, 9, 2, 5, IPAL.red[1]); rect(13, 9, 2, 5, IPAL.red[1]); disc(10, 11, 2, D[2]); disc(10, 11, 1, G[1], true); rect(6, 15, 8, 1, S[3]); break;
    case "plate2":
      block(4, 4, 12, 14, D); block(1, 2, 6, 5, S); block(13, 2, 6, 5, S);
      rect(1, 6, 6, 1, G[1]); rect(13, 6, 6, 1, G[1]); line(6, 8, 10, 13, G[2]); line(14, 8, 10, 13, G[2]);
      disc(10, 11, 1, G[1], true); put(10, 11, G[0], true); rect(6, 16, 8, 1, S[2]); break;

    // ---- реакторы ----
    case "st_core":
      block(5, 3, 10, 15, R); rect(7, 6, 6, 9, "#1B232C"); rect(8, 8, 4, 5, "#8A4B2A"); put(9, 10, "#C47B0E", true); rect(5, 3, 10, 2, R[2]); break;
    case "reactor1":
      block(5, 2, 10, 16, S); rect(5, 2, 10, 2, D[1]); rect(5, 16, 10, 2, D[1]);
      line(3, 5, 3, 15, IPAL.cyan[2]); line(16, 5, 16, 15, IPAL.cyan[2]); put(3, 7, IPAL.cyan[0], true); put(16, 12, IPAL.cyan[0], true); rect(3, 4, 3, 1, IPAL.cyan[2]); rect(14, 15, 3, 1, IPAL.cyan[2]);
      rect(7, 5, 6, 10, "#0B0F13"); rect(8, 6, 4, 8, G[2], true); rect(9, 7, 2, 6, G[1], true); put(9, 8, G[0], true); break;
    case "reactor2":
      disc(10, 10, 8, D[2]); disc(10, 10, 7, D[1]); disc(10, 10, 5, "#0B0F13");
      for(let i = 0; i < 3; i++){ const a = i/3*Math.PI*2 - Math.PI/2; for(let r = 2; r <= 4; r++){ put(10 + Math.round(Math.cos(a)*r), 10 + Math.round(Math.sin(a)*r), IPAL.gold[1], true); put(10 + Math.round(Math.cos(a + .4)*r), 10 + Math.round(Math.sin(a + .4)*r), IPAL.gold[1], true); } }
      disc(10, 10, 1, G[1], true); put(10, 10, "#FFFFFF", true); put(5, 4, D[0]); put(4, 5, D[0]); break;

    // ---- ходовая ----
    case "st_legs":
      block(3, 5, 5, 12, R); block(12, 5, 5, 12, R); for(let y = 6; y < 16; y += 3){ put(4, y, "#5A2F1B"); put(13, y, "#5A2F1B"); } rect(2, 16, 7, 2, D[2]); rect(11, 16, 7, 2, D[2]); break;
    case "tracks1":
      block(2, 4, 6, 14, D); block(12, 4, 6, 14, D); rect(2, 4, 6, 2, IPAL.orange[1]); rect(12, 4, 6, 2, IPAL.orange[1]); for(let y = 5; y < 17; y += 2){ rect(3, y, 4, 1, S[2]); rect(13, y, 4, 1, S[2]); }
      rect(3, 10, 4, 1, G[1], true); rect(13, 10, 4, 1, G[1], true); break;
    case "tracks2":
      for(let y = 5; y <= 13; y++){ const w = y < 9 ? 7 + (y - 5) : 11 - (y - 9); rect(10 - w/2|0, y, w, 1, y < 8 ? S[0] : y > 11 ? S[2] : S[1]); }
      rect(4, 13, 12, 2, D[2]); for(const x of [5, 9, 13]){ put(x, 15, G[1], true); put(x + 1, 15, G[1], true); put(x, 16, G[2], true); put(x + 1, 17, G[0], true); }
      put(7, 7, G[1], true); put(12, 7, G[1], true); break;
    default:
      disc(10, 10, 5, S[1]);
  }
  // тёмная обводка
  const out = buf.slice();
  for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){
    if(buf[y*N + x]) continue;
    if([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < N && Y < N && buf[Y*N + X]; })) out[y*N + x] = "#0B0E12";
  }
  return {px:out, glow};
}

function itemIconURL(id, g){
  const key = id + "|" + (g || 0);
  if(iconCache.has(key)) return iconCache.get(key);
  const it = ITEMS[id], gear = it && it.type === "gear", gr = gear ? (g || 0) : -1;
  const newGear = gear && typeof drawGearPixels === "function" && it.fam;   // снаряжение — новый генератор 24×24
  const ps = 4, N = newGear ? GN : ICON_N, pad = newGear ? 0 : 2, W = (N + pad*2)*ps;
  const c = document.createElement("canvas"); c.width = W; c.height = W;
  const cx = c.getContext("2d");
  // свечение грейда за предметом
  if(gr >= 1){
    const col = GRADES[gr].color, rg = cx.createRadialGradient(W/2, W/2, 0, W/2, W/2, W*0.5);
    rg.addColorStop(0, col + (gr === 3 ? "88" : gr === 2 ? "66" : "44")); rg.addColorStop(1, col + "00");
    cx.fillStyle = rg; cx.fillRect(0, 0, W, W);
  }
  const spr = newGear ? drawGearPixels(id, gr) : drawItemPixels(id, gr < 0 ? 0 : gr);
  for(let i = 0; i < spr.px.length; i++){ const col = spr.px[i]; if(!col) continue; cx.fillStyle = col; cx.fillRect((i % N + pad)*ps, (Math.floor(i/N) + pad)*ps, ps, ps); }
  cx.globalCompositeOperation = "lighter";
  for(const [x, y, col] of spr.glow){ cx.shadowColor = col; cx.shadowBlur = ps*3; cx.fillStyle = col; cx.globalAlpha = .6; cx.fillRect((x + pad)*ps, (y + pad)*ps, ps, ps); }
  cx.globalAlpha = 1; cx.shadowBlur = 0;
  // искры у синих и золотых вещей
  if(gr >= 2){
    const sp = (gr === 3 ? [[2, 3], [20, 2], [21, 18], [1, 19], [11, 0]] : [[2, 4], [20, 18], [19, 2]]).map(([x, y]) => pad ? [x, y] : [Math.round(x*23/21), Math.round(y*23/21)]);
    cx.globalCompositeOperation = "source-over";
    for(const [x, y] of sp){ cx.fillStyle = "#FFFFFF"; cx.fillRect(x*ps + ps/2 - 1, y*ps - 2, 2, ps + 4); cx.fillRect(x*ps - 2, y*ps + ps/2 - 1, ps + 4, 2); }
  }
  const url = c.toDataURL();
  iconCache.set(key, url);
  return url;
}

// замена прежних векторных иконок: тот же вызов icon(id, g)
function icon(id, g){
  if(!ITEMS[id]) return "";
  return `<svg viewBox="0 0 32 32" aria-hidden="true" style="overflow:visible"><image href="${itemIconURL(id, g)}" x="-4" y="-4" width="40" height="40" style="image-rendering:pixelated"/></svg>`;
}


// ===================== ИКОНКИ НОВОГО СНАРЯЖЕНИЯ =====================
// 9 видов × 5 поколений. Материал зависит от поколения, камень-вставка — от грейда (G).
// палитра на каждое из 10 поколений; нечётные — прежние 5 палитр (вещи после переноса 1→1, 2→3 … 5→9 выглядят как раньше)
const TIER_MAT = [
  {M:["#E3A273", "#B8703F", "#8A4B2A", "#5A2F1B"], D:["#8A6B55", "#6B4A30", "#4A3020", "#2E1C12"], acc:"#E08A3A", glowAcc:false},
  {M:["#C9C3BA", "#9A9288", "#6E675F", "#46403A"], D:["#6E675F", "#4E4842", "#35302B", "#221E1A"], acc:"#D0A060", glowAcc:false},
  {M:["#EEF2F5", "#AEB9C4", "#77838F", "#4A5561"], D:["#6B7682", "#4A5561", "#323B45", "#1F262E"], acc:"#5FA8E8", glowAcc:false},
  {M:["#FFFFFF", "#D6E4EE", "#9FB4C4", "#62788A"], D:["#6E8394", "#526474", "#3A4854", "#232C34"], acc:"#8FD0FF", glowAcc:false},
  {M:["#F2FAFF", "#B8D8F0", "#7AA8CC", "#3F6A90"], D:["#5A7A96", "#3F5A74", "#2A4058", "#18283A"], acc:"#5FD4E8", glowAcc:true},
  {M:["#CFDCFF", "#8AA6F2", "#5670C8", "#2E3F86"], D:["#44508A", "#323C6A", "#222A4C", "#141A30"], acc:"#9AB8FF", glowAcc:true},
  {M:["#D8C8F0", "#8E7AB8", "#5E4A8E", "#34285A"], D:["#4A3E66", "#342A4E", "#221A38", "#140F24"], acc:"#E07BFF", glowAcc:true},
  {M:["#D6FFD9", "#8BE896", "#4FAE5E", "#2A6A34"], D:["#3E5A44", "#2C4432", "#1C2E22", "#101C14"], acc:"#6CFF7A", glowAcc:true},
  {M:["#FFF4C0", "#F2C14B", "#C4901C", "#7A5510"], D:["#4A4F60", "#2E3240", "#1E212C", "#12141C"], acc:"#7FE6FF", glowAcc:true},
  {M:["#FFFBEA", "#FFE08A", "#E0A92A", "#8A5E0E"], D:["#2E2A40", "#221E30", "#171422", "#0E0C16"], acc:"#FFFFFF", glowAcc:true}
];
function gearArt(fam, gen, T){
  // форма вещи — по паре поколений (1–2, 3–4 … 9–10), цвет — своего поколения
  const tier = Math.min(5, Math.ceil(gen/2));
  const {put, rect, line, disc, block, G} = T, m = TIER_MAT[Math.min(TIER_MAT.length, Math.max(1, gen)) - 1], M = m.M, D = m.D, A = m.acc, ag = m.glowAcc;
  const gem = (x, y, big) => { if(big){ rect(x, y, 2, 2, G[1], true); put(x, y, G[0], true); put(x + 1, y + 1, G[2], true); } else put(x, y, G[1], true); };
  const T5 = tier === 5, T4 = tier === 4, T3 = tier >= 3;
  if(fam === "hammer"){
    // рукоять с обмоткой, тяжёлый боёк; с Титана — шип, с Плазмы — энергоядро, Квант — золото с рунами
    rect(9, 8, 2, 11, D[1]); put(9, 8, D[0]); for(let y = 10; y < 18; y += 2){ rect(9, y, 2, 1, D[3]); }
    block(3, 3, 14, 6, T5 ? D : M); if(T5){ rect(3, 3, 14, 1, M[1]); rect(3, 8, 14, 1, M[2]); }
    rect(4, 4, 1, 4, T5 ? M[1] : M[0]); rect(15, 4, 1, 4, T5 ? M[2] : M[3]);
    if(tier >= 2){ rect(8, 3, 4, 6, T5 ? M[1] : M[2]); put(8, 3, T5 ? M[0] : M[1]); }
    if(T3 && !T5){ put(3, 5, M[3]); put(2, 5, M[2]); put(16, 5, M[3]); put(17, 5, M[2]); }
    if(T3){ put(9, 1, M[1]); put(10, 1, M[2]); put(9, 2, M[1]); put(10, 2, M[2]); }
    if(T4 || T5){ rect(9, 5, 2, 2, A, true); put(5, 5, A, true); put(14, 5, A, true); put(6, 6, A, ag); put(13, 6, A, ag); }
    else if(tier === 1){ put(5, 4, "#5A2F1B"); put(13, 7, "#5A2F1B"); put(6, 7, "#8A4B2A"); }
    gem(9, 18, true);
  } else if(fam === "blades"){
    // пара скрещённых клинков: чем выше поколение, тем изящнее лезвия и ярче кромка
    const edge = T3 ? A : M[0];
    for(let i = 0; i < 11; i++){ put(4 + i, 15 - i, M[1]); put(5 + i, 15 - i, M[2]); put(4 + i, 14 - i, edge, T3 && i % 2 === 0); }
    for(let i = 0; i < 11; i++){ put(15 - i, 15 - i, M[1]); put(14 - i, 15 - i, M[2]); put(15 - i, 14 - i, edge, T3 && i % 2 === 1); }
    if(tier === 1){ put(9, 9, "#5A2F1B"); put(7, 12, "#5A2F1B"); put(13, 11, "#8A4B2A"); }
    const H = T5 ? M : D;
    block(2, 15, 4, 2, H); block(14, 15, 4, 2, H); rect(3, 17, 2, 2, D[2]); rect(15, 17, 2, 2, D[2]);
    if(T4){ for(let i = 2; i < 10; i += 2){ put(4 + i, 15 - i, A, true); put(15 - i, 15 - i, A, true); } }
    gem(3, 15); gem(16, 15);
    if(T5){ put(9, 5, A, true); put(10, 5, A, true); }
  } else if(fam === "rifle"){
    // длинная винтовка: приклад, корпус, магазин, ствол, прицел; поколения добавляют дульный тормоз, линии, катушки
    const B = T5 ? M : M, K = T5 ? D : D;
    block(1, 10, 5, 4, K); put(1, 13, K[3]);
    block(5, 9, 10, 4, B);
    rect(14, 10, 5, 2, D[2]); rect(14, 10, 5, 1, D[1]);
    if(tier >= 2){ rect(18, 9, 2, 4, D[1]); put(18, 9, D[0]); }
    block(8, 12, 3, 4, K);
    block(6, 6, 6, 3, D); put(11, 7, G[1], true); put(6, 7, G[0], true);
    if(T3) rect(6, 10, 8, 1, A, ag);
    if(T4 || T5){ for(const x of [14, 16]) { put(x, 9, A, true); put(x, 12, A, true); } put(19, 10, A, true); put(19, 11, A, true); }
    if(tier === 1){ put(8, 10, "#5A2F1B"); put(12, 11, "#8A4B2A"); }
    gem(3, 11);
  } else if(fam === "staff"){
    // посох: древко и навершие — от гнутого ржавого крюка до золотого кольца с кристаллом
    rect(9, 7, 2, 12, D[1]); put(9, 7, D[0]); rect(9, 18, 2, 1, D[3]);
    for(let y = 9; y < 18; y += 3) rect(9, y, 2, 1, T5 ? M[1] : M[2]);
    if(tier === 1){ line(10, 7, 13, 4, M[2]); line(13, 4, 11, 1, M[1]); put(11, 1, M[0]); put(12, 5, "#5A2F1B"); }
    else if(tier === 2){ for(let i = 0; i < 12; i++){ const a = i/12*Math.PI*2; put(10 + Math.round(Math.cos(a)*3), 4 + Math.round(Math.sin(a)*3), M[i % 3]); } disc(10, 4, 1, A); }
    else {
      const ring = T5 ? M : M;
      if(T3 && !T4 && !T5){ line(8, 7, 6, 2, ring[1]); line(11, 7, 13, 2, ring[2]); }
      if(T4 || T5){ for(let i = 0; i < 16; i++){ const a = i/16*Math.PI*2; put(10 + Math.round(Math.cos(a)*5), 4 + Math.round(Math.sin(a)*4), T5 ? ring[i % 2] : A, T4); } }
      for(let j = -3; j <= 3; j++){ const w = 2 - Math.floor(Math.abs(j)/1.5); for(let i = -w; i <= w; i++) put(9.5 + i, 4 + j, j < 0 && i <= 0 ? "#FFFFFF" : A, true); }
    }
    gem(9, 12, true);
  } else if(fam === "sensor"){
    // шлем-сенсор: купол, визор с глазами; антенна, гребень, светящийся визор, золото
    const H = T5 ? M : M;
    for(let y = 0; y < 11; y++){ const w = [8, 10, 12, 12, 12, 12, 12, 12, 12, 11, 10][y], x0 = 10 - w/2; rect(x0, 4 + y, w, 1, y < 2 ? H[0] : y > 8 ? H[3] : H[1]); put(x0, 4 + y, H[0]); put(x0 + w - 1, 4 + y, H[2]); }
    rect(5, 8, 10, 3, "#0B0F13");
    if(T4 || T5) rect(6, 9, 8, 1, A, true);
    else { rect(6, 9, 2, 1, A, ag); rect(12, 9, 2, 1, A, ag); }
    if(tier >= 2){ line(14, 5, 16, 1, D[1]); put(16, 1, A, true); }
    if(T3){ rect(9, 2, 2, 3, T5 ? M[1] : M[2]); put(9, 2, M[0]); }
    if(T5){ put(4, 5, M[1]); put(3, 4, M[1]); put(15, 5, M[2]); }
    if(tier === 1){ put(7, 12, "#5A2F1B"); line(12, 5, 14, 7, "#5A2F1B"); }
    rect(5, 14, 10, 1, D[2]);
    gem(9, 12);
  } else if(fam === "armor"){
    // корпус: грудная плита, наплечники, ядро в центре; швы, светящиеся линии, золото
    block(4, 5, 12, 13, T5 ? D : M);
    block(1, 3, 5, 5, T5 ? M : D); block(14, 3, 5, 5, T5 ? M : D);
    if(tier >= 2){ rect(1, 7, 5, 1, A, ag); rect(14, 7, 5, 1, A, ag); }
    if(T3){ line(6, 8, 9, 12, T4 ? A : M[2], T4); line(13, 8, 10, 12, T4 ? A : M[2], T4); }
    if(T5){ rect(4, 5, 12, 1, M[1]); rect(4, 17, 12, 1, M[2]); line(6, 8, 9, 12, M[1]); line(13, 8, 10, 12, M[1]); }
    disc(10, 12, 2, T5 ? "#0B0F13" : D[2]); gem(9, 11, true);
    if(tier === 1){ put(6, 15, "#5A2F1B"); put(13, 9, "#5A2F1B"); put(7, 7, "#8A4B2A"); }
    rect(6, 16, 8, 1, T5 ? M[2] : M[3]);
  } else if(fam === "module"){
    // модуль: блок-основание и излучатель — от ржавого манометра до золотого гироскопа
    block(3, 12, 14, 6, T5 ? D : M); rect(5, 14, 10, 1, D[2]); gem(9, 15, true);
    if(tier === 1){ disc(10, 8, 3, M[2]); disc(10, 8, 2, "#EDE6D6"); line(10, 8, 11, 6, "#5A2F1B"); put(6, 13, "#5A2F1B"); }
    else if(tier === 2){ for(let i = 0; i < 8; i++){ const a = i/8*Math.PI*2; rect(9 + Math.round(Math.cos(a)*4), 7 + Math.round(Math.sin(a)*4), 2, 2, M[1]); } disc(10, 8, 3, M[1]); disc(10, 8, 1, A); }
    else if(T3 && !T4 && !T5){ for(let y = 2; y <= 11; y++){ const w = Math.round(Math.sqrt(Math.max(0, 49 - (y - 11)*(y - 11)))); put(10 - w, y, A, true); put(10 + w, y, A, true); } put(10, 4, "#FFFFFF", true); }
    else { const R = T5 ? M : [A, A, A, A];
      for(let i = 0; i < 14; i++){ const a = i/14*Math.PI*2; put(10 + Math.round(Math.cos(a)*5), 7 + Math.round(Math.sin(a)*3), R[i % 2], T4); put(10 + Math.round(Math.cos(a)*3), 7 + Math.round(Math.sin(a)*5), R[(i + 1) % 2], T4); }
      disc(10, 7, 1, T5 ? A : "#FFFFFF", true); }
  } else if(fam === "core"){
    // реактор: цилиндр со светящимся окном; трубки охлаждения, кольца, золотой корпус
    block(5, 2, 10, 16, T5 ? M : M); rect(5, 2, 10, 2, D[1]); rect(5, 16, 10, 2, D[1]);
    rect(7, 5, 6, 10, "#0B0F13");
    const core = tier === 1 ? "#E08A3A" : A;
    rect(8, 6, 4, 8, core, tier > 1); rect(9, 7, 2, 6, "#FFFFFF", tier > 1);
    if(T3){ line(3, 5, 3, 15, D[2]); line(16, 5, 16, 15, D[2]); put(3, 8, A, true); put(16, 12, A, true); }
    if(T4 || T5){ for(let i = 0; i < 12; i++){ const a = i/12*Math.PI*2; put(10 + Math.round(Math.cos(a)*8), 10 + Math.round(Math.sin(a)*2), A, true); } }
    if(tier === 1){ put(6, 10, "#5A2F1B"); put(13, 4, "#5A2F1B"); }
    gem(9, 16);
  } else if(fam === "legs"){
    // ходовая: гусеницы → стальные ноги → ховер-опоры → реактивные → золотые
    const L = T5 ? M : tier === 1 ? M : M;
    for(const x0 of [3, 11]){
      if(tier === 1){ block(x0, 4, 6, 14, D); for(let y = 5; y < 17; y += 2) rect(x0 + 1, y, 4, 1, M[2]); }
      else {
        block(x0 + 1, 3, 4, 7, L); disc(x0 + 3, 10, 1, D[2]); block(x0 + 1, 11, 4, 5, L);
        block(x0, 16, 6, 2, T5 ? D : D);
        if(tier >= 3){ rect(x0 + 1, 18, 4, 1, A, true); if(tier >= 4){ put(x0 + 2, 19, A, true); put(x0 + 3, 19, "#FFFFFF", true); } }
        if(tier === 2) rect(x0 + 1, 6, 4, 1, A);
      }
    }
    gem(5, 10); gem(13, 10);
  }
}
// ===================== ИКОНКИ СНАРЯЖЕНИЯ: 9 видов × 10 поколений × 4 грейда =====================
// Поколение задаёт материал и форму (от грубого ржавого хлама к звёздным артефактам),
// грейд меняет сам рисунок: серый — голый металл, зелёный — светящиеся вставки,
// синий — энергоядро и доп. пластины, золотой — золотая окантовка, самоцвет и украшения.
const GN = 24;
const GMAT = {
  1:["#E6A878", "#B8703F", "#8A4B2A", "#5A2F1B"], 2:["#C8C2B8", "#908A82", "#645F59", "#3E3A36"],
  3:["#EEF3F6", "#B4C0CB", "#7C8995", "#4A5561"], 4:["#FFFFFF", "#D2E0EA", "#8EA2B4", "#46566A"],
  5:["#DDF3FF", "#9FCBE8", "#6394B6", "#35566F"], 6:["#A8C8FF", "#5A82DA", "#34539F", "#1C2C62"],
  7:["#EBD2FF", "#B684FF", "#7C4CD6", "#452880"], 8:["#9AAA9C", "#5A6A5C", "#35423A", "#1B241E"],
  9:["#E2FFFF", "#86E6F2", "#3FA6C4", "#1D5068"], 10:["#FFF8DC", "#F4D682", "#C99C34", "#735414"]
};
const GACC = {1:"#F2A93B", 2:"#E0694A", 3:"#5FD4E8", 4:"#A6F4FF", 5:"#4EA8F5", 6:"#8FB8FF", 7:"#E07CFF", 8:"#6CFF7A", 9:"#FF7AE0", 10:"#FFF4C0"};
const GDECO = {1:["#C8F8B0", "#6FCF7A", "#2F8F3A"], 2:["#C8E8FF", "#4EA8F5", "#2A6FC0"], 3:["#FFF4C8", "#F2C14B", "#C4901C", "#7A5510"]};

function drawGearPixels(id, grade){
  const it = ITEMS[id], fam = it.fam, t = it.tier, g = grade || 0, b = Math.ceil(t/2);
  const N = GN, buf = new Array(N*N).fill(null), glow = [];
  const put = (x, y, c, gl) => { x = Math.round(x); y = Math.round(y); if(x < 0 || y < 0 || x >= N || y >= N || !c) return; buf[y*N + x] = c; if(gl) glow.push([x, y, c]); };
  const get = (x, y) => x < 0 || y < 0 || x >= N || y >= N ? null : buf[y*N + x];
  const rect = (x, y, w, h, c, gl) => { for(let j = 0; j < h; j++) for(let i = 0; i < w; i++) put(x + i, y + j, c, gl); };
  const line = (x0, y0, x1, y1, c, gl) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for(let i = 0; i <= n; i++) put(x0 + (x1 - x0)*i/n, y0 + (y1 - y0)*i/n, c, gl); };
  const disc = (cx, cy, r, c, gl) => { for(let y = -r; y <= r; y++) for(let x = -r; x <= r; x++) if(x*x + y*y <= r*r + r*0.6) put(cx + x, cy + y, c, gl); };
  const ring = (cx, cy, rx, ry, c, gl, step) => { const n = Math.max(12, Math.round((rx + ry)*3)); for(let i = 0; i < n; i += (step || 1)){ const a = i/n*Math.PI*2; put(cx + Math.cos(a)*rx, cy + Math.sin(a)*ry, c, gl); } };
  const block = (x, y, w, h, P) => { rect(x, y, w, h, P[1]); for(let i = 0; i < w; i++){ put(x + i, y, P[0]); put(x + i, y + h - 1, P[3]); } for(let j = 1; j < h - 1; j++){ put(x, y + j, P[0]); put(x + w - 1, y + j, P[2]); } };
  const gem = (cx, cy, col, big) => { const C = [mix(col, "#FFFFFF", .6), col, shade(col, .6)];
    if(big){ put(cx, cy - 2, C[0], true); rect(cx - 1, cy - 1, 3, 3, C[1], true); put(cx - 2, cy, C[1], true); put(cx + 2, cy, C[2], true); put(cx, cy + 2, C[2], true); put(cx - 1, cy - 1, "#FFFFFF", true); }
    else { put(cx, cy - 1, C[0], true); put(cx - 1, cy, C[1], true); put(cx + 1, cy, C[2], true); put(cx, cy + 1, C[2], true); put(cx, cy, C[1], true); } };
  // «золотая окантовка»: крайние пиксели фигуры внутри области становятся золотыми
  // золотая кромка: только верхние и нижние края, через пиксель — материал поколения остаётся виден
  const goldTrim = (x0, y0, x1, y1) => { const D = GDECO[3], mark = [];
    for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){ const c = get(x, y); if(!c) continue;
      if((!get(x, y - 1) || !get(x, y + 1)) && (x + y) % 2 === 0) mark.push([x, y, !get(x, y - 1) ? D[0] : D[2]]); }
    for(const [x, y, c] of mark) put(x, y, c); };
  const M = GMAT[t], A = GACC[t], D = GDECO[g];
  const rustSpots = (x0, y0, w, h, n) => { if(t > 2) return; let s = t*7 + w; for(let i = 0; i < n; i++){ s = (s*37 + 11) % 97; put(x0 + s % w, y0 + (s >> 3) % h, t === 1 ? "#6A3E26" : "#4A4540"); } };

  if(fam === "hammer"){
    const w = 12 + b, hh = 6 + (b >= 3 ? 1 : 0), x0 = 12 - (w >> 1), y0 = 3;
    // рукоять с обмоткой
    rect(11, 9, 2, 13, M[3]); put(11, 9, M[2]);
    for(let y = 15; y <= 20; y += 2) rect(11, y, 2, 1, g ? D[2] : (t <= 2 ? "#6A4A30" : M[2]));
    block(10, 21, 4, 2, M); if(g === 3) gem(12, 22, GDECO[3][1]);
    // боёк
    block(x0, y0, w, hh, M);
    if(b >= 3){ put(x0, y0, null); put(x0 + w - 1, y0, null); put(x0, y0 + hh - 1, null); put(x0 + w - 1, y0 + hh - 1, null); }
    rect(x0 + 2, y0 + 1, w - 4, 1, M[0]);
    rustSpots(x0 + 1, y0 + 1, w - 2, hh - 2, 5);
    if(b >= 2) for(const [x, y] of [[x0 + 1, y0 + 1], [x0 + w - 2, y0 + 1], [x0 + 1, y0 + hh - 2], [x0 + w - 2, y0 + hh - 2]]) put(x, y, M[0]);
    if(b >= 3) rect(x0 + 2, y0 + (hh >> 1), w - 4, 1, A, true);
    if(b >= 4){ for(const s of [-1, 1]){ const ex = s < 0 ? x0 - 1 : x0 + w; line(ex, y0 + 1, ex + s*2, y0 + (hh >> 1), M[1]); line(ex, y0 + hh - 2, ex + s*2, y0 + (hh >> 1), M[2]); } disc(12, y0 + (hh >> 1), 1, A, true); }
    if(b >= 5){ ring(12, y0 + 3, w/2 + 2, 5, A, true, 2); line(12, y0 - 2, 12, y0 - 1, A, true); }
    // грейд
    if(g >= 1) rect(x0 + 2, y0 + hh - 2, w - 4, 1, D[1], true);
    if(g >= 2){ disc(12, y0 + (hh >> 1), 2, D[2], true); disc(12, y0 + (hh >> 1), 1, D[1], true); put(12, y0 + (hh >> 1), "#FFFFFF", true); rect(10, y0 - 1, 5, 1, D[1]); }
    if(g === 3){ goldTrim(x0 - 3, y0 - 2, x0 + w + 2, y0 + hh); for(const s of [-1, 1]){ const ex = s < 0 ? x0 : x0 + w - 1; line(ex, y0, ex + s*3, y0 - 3, GDECO[3][1]); line(ex, y0 + 1, ex + s*3, y0 - 2, GDECO[3][2]); } gem(12, y0 + (hh >> 1), "#E0463A", true); }
  }

  else if(fam === "blades"){
    const wdt = b >= 3 ? 3 : 2;
    const bladeCol = [M[0], M[1], M[2]];
    for(const s of [1, -1]){
      // клинок от рукояти к острию по диагонали
      const hx = s > 0 ? 4 : 19, hy = 20, tx = s > 0 ? 20 : 3, ty = 3, n = 17;
      for(let i = 3; i <= n; i++){
        const x = hx + (tx - hx)*i/n, y = hy + (ty - hy)*i/n, curve = b >= 3 ? Math.round(Math.sin(i/n*Math.PI)*1.5*s) : 0;
        for(let k = 0; k < wdt; k++){ const c = k === 0 ? bladeCol[0] : k === wdt - 1 ? bladeCol[2] : bladeCol[1]; put(x + k*s + curve, y + k + (s < 0 ? 0 : 0), c); }
        if(b === 1 && i % 3 === 0) put(x + s + curve, y + 1, "#5A2F1B");                         // зазубрины ржавчины
        if(b >= 3) put(x - s + curve, y - 1 + 1, g >= 1 ? D[1] : A, true);                        // светящаяся кромка
        if(b >= 5 && i % 2) put(x + curve, y, mix(A, "#FFFFFF", .5), true);
      }
      // рукоять и гарда
      line(hx, hy, hx + 3*s*0.9, hy - 3, M[3]); put(hx - s, hy + 1, M[3]);
      for(let k = -2; k <= 2; k++) put(hx + 3*s*0.9 + k*0.7, hy - 3 - k*0.7*s, g === 3 ? GDECO[3][1] : M[2]);
      if(g >= 1) put(hx + s, hy - 1, D[1], true);
    }
    if(b >= 4) disc(12, 11, 1, A, true);
    if(g >= 2){ put(12, 10, D[1], true); put(11, 11, D[1], true); put(13, 11, D[1], true); }
    if(g === 3){ gem(12, 11, "#E0463A", true); for(const s of [1, -1]){ const hx = s > 0 ? 4 : 19; put(hx - s, 21, GDECO[3][1]); put(hx, 21, GDECO[3][0]); } }
  }

  else if(fam === "rifle"){
    const end = 18 + b;
    // приклад, корпус, ствол
    for(let y = 11; y <= 15; y++) rect(1 + Math.max(0, 13 - y - 0), y, 6 - Math.max(0, y - 13), 1, y === 11 ? M[0] : y >= 14 ? M[3] : (t <= 2 ? "#7A4A2A" : M[2]));
    block(5, 10, 11, 5, M);
    rect(14, 11, end - 13, 2, M[3]); rect(14, 11, end - 13, 1, M[2]);
    rect(end - 1, 10, 2, 4, M[2]); put(end, 11, A, true);
    rustSpots(6, 11, 8, 3, 4);
    // прицел, рукоять, магазин
    const sx0 = b >= 2 ? 6 : 7, sx1 = b >= 2 ? 14 : 13;
    rect(sx0, 7, sx1 - sx0, 2, M[3]); rect(sx0, 7, sx1 - sx0, 1, M[2]); rect(sx0 + 1, 9, 2, 1, M[3]); rect(sx1 - 3, 9, 2, 1, M[3]);
    put(sx1 - 1, 7, g >= 2 ? D[1] : A, true); put(sx1 - 1, 8, g >= 2 ? D[0] : shade(A, .7), true);
    block(9, 14, 3, 5, M); block(12, 14, 2, 3, M);
    if(b >= 3) for(let x = 16; x < end - 1; x += 2) put(x, 11, A, true);
    if(b >= 4){ rect(7, 11, 5, 2, shade(A, .6)); rect(8, 11, 3, 1, A, true); }
    if(b >= 5){ rect(15, 9, end - 15, 1, M[1]); rect(15, 14, end - 15, 1, M[1]); for(let x = 17; x < end; x += 3){ put(x, 8, A, true); put(x, 15, A, true); } }
    if(g >= 1) rect(2, 13, 4, 1, D[1], true);
    if(g >= 2){ put(end + 1, 11, D[1], true); put(end + 1, 12, D[0], true); rect(6, 10, 9, 1, D[2]); }
    if(g === 3){ goldTrim(0, 6, 23, 19); gem(4, 12, "#E0463A"); }
  }

  else if(fam === "staff"){
    // древко
    rect(11, 9, 2, 14, M[3]); put(11, 9, M[2]);
    for(let y = 14; y <= 20; y += 3) rect(11, y, 2, 1, g >= 1 ? D[1] : M[1], g >= 1);
    rect(10, 22, 4, 1, g === 3 ? GDECO[3][1] : M[2]);
    const cy = 5;
    if(b === 1){ line(12, 9, 12, 5, M[2]); line(12, 4, 15, 3, M[1]); line(15, 3, 16, 6, M[2]); line(12, 4, 9, 3, M[1]); put(9, 4, M[2]); disc(12, 6, 1, A, true); }
    else {
      const r = b >= 4 ? 3 : 2;
      line(9, 9, 9, 6, M[2]); line(15, 9, 15, 6, M[2]); line(9, 9, 15, 9, M[2]);                 // вилка-держатель
      // кристалл
      for(let j = -r - 1; j <= r + 1; j++){ const w = r + 1 - Math.abs(j); for(let i = -w + 1; i < w; i++) put(12 + i, cy + j, j < 0 && i <= 0 ? mix(A, "#FFFFFF", .5) : A, true); }
      put(12, cy, "#FFFFFF", true);
      if(b >= 3) ring(12, cy, r + 3, r + 2, M[1], false, 1);
      if(b >= 4) ring(12, cy, r + 4, 2, shade(A, .8), true, 2);
      if(b >= 5) for(let i = 0; i < 8; i++){ const a = i/8*Math.PI*2; put(12 + Math.cos(a)*(r + 5), cy + Math.sin(a)*(r + 4), i % 2 ? A : "#FFFFFF", true); }
    }
    if(g >= 2){ disc(6, 7, 1, D[1], true); disc(18, 4, 1, D[1], true); put(6, 7, "#FFFFFF", true); }
    if(g === 3){ goldTrim(0, 0, 23, 12); for(const s of [-1, 1]){ line(12 + s*3, 8, 12 + s*8, 4, GDECO[3][1]); line(12 + s*3, 9, 12 + s*7, 7, GDECO[3][2]); line(12 + s*5, 5, 12 + s*8, 2, GDECO[3][0]); } }
  }

  else if(fam === "sensor"){
    const w = 13 + (b >= 3 ? 2 : 0), x0 = 12 - (w >> 1);
    for(let y = 4; y <= 18; y++){ const k = y < 8 ? [5, 3, 2, 1][y - 4] : y > 15 ? y - 15 : 0, xl = x0 + k, ww = w - 2*k;
      rect(xl, y, ww, 1, y < 7 ? M[0] : y > 15 ? M[3] : M[1]); put(xl, y, M[0]); put(xl + ww - 1, y, M[2]); }
    rustSpots(x0 + 2, 6, w - 4, 8, 5);
    // визор
    const vy = 10, vh = b === 1 ? 1 : 2;
    rect(x0 + 2, vy, w - 4, vh + 1, "#0B0F13"); rect(x0 + 3, vy + (b === 1 ? 1 : 0), w - 6, vh, g >= 2 ? D[1] : A, true); put(x0 + w - 5, vy, "#FFFFFF", true);
    if(b >= 2){ line(x0 + w - 3, 5, x0 + w, 1, M[2]); put(x0 + w, 0, A, true); }
    if(b >= 3) for(let y = 1; y <= 4; y++) rect(11, y, 2, 1, y === 1 ? M[0] : M[1]);
    if(b >= 4) for(const s of [-1, 1]){ const ex = s < 0 ? x0 : x0 + w - 1; line(ex, 7, ex + s*3, 3, M[1]); line(ex, 8, ex + s*3, 4, M[3]); }
    if(b >= 5) ring(12, 1, 6, 1.4, A, true, 2);
    if(g >= 1){ rect(x0 + 2, 14, 2, 1, D[1], true); rect(x0 + w - 4, 14, 2, 1, D[1], true); }
    if(g >= 2){ put(x0 + 1, 12, D[1], true); put(x0 + w - 2, 12, D[1], true); }
    if(g === 3){ goldTrim(0, 0, 23, 19); gem(12, 7, "#E0463A"); }
  }

  else if(fam === "armor"){
    const pw = 3 + Math.min(3, b);
    // торс
    for(let y = 7; y <= 20; y++){ const k = y > 16 ? y - 16 : 0; rect(6 + k, y, 12 - 2*k, 1, y === 7 ? M[0] : y > 17 ? M[3] : M[1]); put(6 + k, y, M[0]); put(17 - k, y, M[2]); }
    line(8, 11, 15, 11, M[2]); line(8, 15, 15, 15, M[2]);
    rustSpots(7, 9, 10, 9, 6);
    // наплечники
    for(const s of [-1, 1]){ const px0 = s < 0 ? 6 - pw + 2 : 16; block(px0, 5, pw, 5, M); if(b >= 4){ line(px0 + (s < 0 ? 0 : pw - 1), 5, px0 + (s < 0 ? -1 : pw), 2, M[0]); } }
    if(b >= 2){ disc(12, 13, 1, "#0B0F13"); put(12, 13, A, true); }
    if(b >= 3){ put(11, 13, A, true); put(13, 13, A, true); put(12, 12, A, true); put(12, 14, A, true); line(9, 18, 14, 18, A, true); }
    if(b >= 5) for(const s of [-1, 1]){ line(12 + s*7, 12, 12 + s*11, 6, shade(A, .8), true); line(12 + s*7, 14, 12 + s*11, 10, A, true); }
    if(g >= 1){ line(8, 9, 10, 9, D[1], true); line(13, 9, 15, 9, D[1], true); }
    if(g >= 2){ disc(12, 13, 2, D[2], true); disc(12, 13, 1, D[1], true); put(12, 13, "#FFFFFF", true); }
    if(g === 3){ goldTrim(0, 2, 23, 21); gem(12, 13, "#E0463A", true); }
  }

  else if(fam === "module"){
    block(5, 13, 14, 7, M); rect(6, 19, 12, 1, M[3]); rustSpots(6, 14, 12, 5, 4);
    for(const x of [7, 16]) put(x, 16, g >= 1 ? D[1] : A, true);
    if(b === 1){ disc(12, 9, 3, M[1]); disc(12, 9, 2, "#1B232C"); line(12, 9, 14, 8, A, true); }
    else if(b === 2){ for(let i = 0; i < 8; i++){ const a = i/8*Math.PI*2; rect(11 + Math.round(Math.cos(a)*4), 8 + Math.round(Math.sin(a)*4), 2, 2, M[1]); } disc(12, 9, 3, M[1]); disc(12, 9, 1, A, true); }
    else if(b === 3){ for(let y = 3; y <= 12; y++){ const w = Math.round(Math.sqrt(Math.max(0, 49 - (y - 12)*(y - 12)*1.2))); for(let x = -w; x <= w; x++) if(Math.abs(x) >= w - 1 || y === 3) put(12 + x, y, A, true); } put(12, 7, "#FFFFFF", true); }
    else if(b === 4){ ring(12, 8, 5, 5, M[1]); ring(12, 8, 4, 4, M[2]); disc(12, 8, 2, A, true); put(11, 7, "#FFFFFF", true); }
    else { for(let j = -3; j <= 3; j++){ const w = 4 - Math.abs(j); for(let i = -w; i <= w; i++) put(12 + i, 8 + j, (i + j) % 2 ? A : mix(A, "#FFFFFF", .5), true); } ring(12, 8, 7, 2, A, true, 2); }
    if(g >= 2){ rect(8, 14, 8, 1, D[1], true); }
    if(g === 3){ goldTrim(0, 0, 23, 21); gem(12, 17, "#E0463A"); }
  }

  else if(fam === "core"){
    if(b <= 2){
      block(7, 3, 10, 18, M); rect(7, 3, 10, 2, M[3]); rect(7, 19, 10, 2, M[3]);
      rect(9, 6, 6, 12, "#0B0F13"); rect(10, 7, 4, 10, shade(A, .7), true); rect(11, 8, 2, 8, A, true); put(11, 9, "#FFFFFF", true);
      if(b === 2){ line(5, 6, 5, 18, M[2]); line(18, 6, 18, 18, M[2]); }
    } else {
      const r = b >= 4 ? 6 : 5;
      disc(12, 12, r + 1, M[3]); disc(12, 12, r, M[2]); disc(12, 12, r - 2, shade(A, .6), true); disc(12, 12, r - 3, A, true); put(11, 11, "#FFFFFF", true);
      ring(12, 12, r + 3, 2, M[1]);
      if(b >= 4) ring(12, 12, 2, r + 3, M[0]);
      if(b >= 5) for(let i = 0; i < 12; i++){ const a = i/12*Math.PI*2; put(12 + Math.cos(a)*(r + 4), 12 + Math.sin(a)*(r + 4), i % 3 ? A : "#FFFFFF", true); }
    }
    if(g >= 1){ put(8, 4, D[1], true); put(15, 4, D[1], true); put(8, 20, D[1], true); put(15, 20, D[1], true); }
    if(g >= 2) ring(12, 12, 9, 3, D[1], true, 2);
    if(g === 3){ goldTrim(0, 0, 23, 23); gem(12, 12, GDECO[3][1], true); }
  }

  else if(fam === "legs"){
    for(const lx of [5, 13]){
      block(lx, 4, 6, 7, M); block(lx + 1, 11, 4, 6, [M[1], M[2], M[3], M[3]]);
      rect(lx - 1, 17, 8, 3, M[2]); rect(lx - 1, 17, 8, 1, M[1]); rect(lx - 1, 19, 8, 1, M[3]);
      rustSpots(lx + 1, 5, 4, 5, 2);
      put(lx + 2, 10, b >= 2 ? A : M[3], b >= 2);
      if(b >= 3){ rect(lx, 20, 6, 1, shade(A, .7), true); rect(lx + 1, 21, 4, 1, A, true); put(lx + 2, 22, mix(A, "#FFFFFF", .5), true); }
      if(b >= 4) line(lx + (lx < 10 ? -1 : 6), 5, lx + (lx < 10 ? -2 : 7), 9, M[0]);
      if(g >= 1) rect(lx + 1, 6, 4, 1, D[1], true);
      if(g >= 2) put(lx + 3, 13, D[1], true);
    }
    if(b >= 5) ring(12, 22, 10, 1.2, A, true, 2);
    if(g === 3){ goldTrim(0, 0, 23, 20); for(const lx of [4, 19]){ line(lx, 17, lx + (lx < 10 ? -3 : 3), 14, GDECO[3][1]); } gem(8, 7, "#E0463A"); gem(16, 7, "#E0463A"); }
  }

  // узор «схем» по корпусу вещи: зелёный — редкий, синий — гуще, золотой — золотые искры
  if(g >= 1){
    const every = g === 1 ? 7 : g === 2 ? 6 : 8, col = g === 3 ? GDECO[3][0] : D[1], body = new Set([M[1], M[2]]);
    for(let y = 1; y < N - 1; y++) for(let x = 1; x < N - 1; x++){
      const c = get(x, y); if(!body.has(c)) continue;
      if(!get(x - 1, y) || !get(x + 1, y) || !get(x, y - 1) || !get(x, y + 1)) continue;   // только внутри фигуры
      if((x*3 + y*5) % every === 0) put(x, y, col, g >= 2);
      else if(g >= 1 && (x*3 + y*5) % every === 1 && (x + y) % 2) put(x, y, shade(col, .75));
    }
  }
  // тёмный контур
  const out = buf.slice();
  for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){
    if(buf[y*N + x]) continue;
    if([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => get(x + dx, y + dy))) out[y*N + x] = "#0B0E12";
  }
  return {px:out, glow, N};
}
// ===================== ЗАТОЧКА СНАРЯЖЕНИЯ =====================
// Медная сфера: при неудаче предмет разрушается (возвращаются обломки-лом).
// Титановая сфера: при неудаче предмет цел и сохраняет уровень заточки.
let enchRef = null, enchSph = "sph_cu", enchBusy = false, enchResult = "";

function enchGet(){
  if(!enchRef) return null;
  return enchRef.where === "inv" ? S.inv[enchRef.i] : S.eq[enchRef.slot];
}
function openEnchant(ref){
  enchRef = ref; enchResult = ""; enchBusy = false;
  if(!have(enchSph) && have(enchSph === "sph_cu" ? "sph_ti" : "sph_cu")) enchSph = enchSph === "sph_cu" ? "sph_ti" : "sph_cu";
  openSheet("Заточка", "Усиль снаряжение сферами", renderEnchant);
}
function renderEnchant(){
  const x = enchGet();
  if(!x){ body().innerHTML = `<div class="empty">Предмет больше не существует</div>`; return; }
  const it = ITEMS[x.id], gc = gradeColor(x.g), e = x.e || 0, max = e >= ENCH_MAX, ch = max ? 0 : ENCH_CHANCE[e];
  const chCol = ch >= 100 ? "var(--ok)" : ch >= 50 ? "var(--amber)" : "var(--rust)";
  const sph = (id, col) => `<button type="button" class="sph" data-sph="${id}" aria-pressed="${enchSph === id}" style="--c:${col}">
      <div class="sph-top">${icon(id)}<div><b>${ITEMS[id].name}</b><br><em style="color:${have(id) ? "var(--ok)" : "var(--rust)"}">× ${have(id)}</em></div></div>
      <small>${ITEMS[id].desc}</small></button>`;
  body().innerHTML = `
    <div class="enchbox">
      <div class="ench-item" id="enchItem" style="border-color:${gc}">${icon(x.id, x.g)}${encBadge(x)}</div>
      <div data-notr style="color:${gc};font-weight:700">${e ? "+" + e + " " : ""}</div><div style="color:${gc};font-weight:700;margin-top:-6px">${it.name}</div>
      ${max ? `<div class="ench-lv">Максимальная заточка <b>+${ENCH_MAX}</b></div>` : `
      <div class="ench-lv">+${e} → <b>+${e + 1}</b></div>
      <div class="ench-chance">Шанс успеха: <b style="color:${chCol}">${ch}%</b></div>
      <div class="ench-stats"><div><small>Сейчас</small>${gearDesc(x.id, x.g, e)}</div><span>→</span><div><small>После заточки</small><span style="color:var(--ok)">${gearDesc(x.id, x.g, e + 1)}</span></div></div>`}
    </div>
    <div class="ench-res" id="enchRes">${enchResult}</div>
    <div class="sphs">${sph("sph_cu", "#F0A060")}${sph("sph_ti", "#8FD8F0")}</div>
    <button class="btn pri wide" type="button" data-ench="go" ${max || enchBusy || !have(enchSph) ? "disabled" : ""}>${max ? "Максимум" : !have(enchSph) ? "Нет сферы: купи у торговца" : "Заточить · 1 " + (enchSph === "sph_cu" ? "медная" : "титановая") + " сфера"}</button>
    ${enchSph === "sph_cu" && !max && ch < 100 ? `<p class="hint" style="color:var(--rust);text-align:center">Внимание: при неудаче предмет будет разрушен</p>` : ""}
    <h3 style="margin:14px 0 4px;font:14px 'Russo One',sans-serif">Шансы заточки</h3>
    <div class="ench-table">${ENCH_CHANCE.map((c, i) => `<div class="${i === e ? "cur" : ""}"><b>+${i + 1}</b>${c}%</div>`).join("")}</div>
    <p class="hint">До +3 заточка безопасна для любых сфер. Каждый уровень даёт +${Math.round(ENCH_STEP*100)}% к характеристикам вещи.</p>`;
}

function doEnchant(forced){
  const x = enchGet(); if(!x || enchBusy) return;
  const e = x.e || 0; if(e >= ENCH_MAX || !have(enchSph)) return;
  enchBusy = true; removeItem(S.inv, enchSph, 1);
  const el = $("enchItem"); el.classList.remove("ok", "fail"); el.classList.add("flash"); Sfx.play("portal");
  $("enchRes").textContent = "…";
  setTimeout(() => {
    const chance = ENCH_CHANCE[e], ok = forced ? forced === "ok" : Math.random()*100 < chance, it = ITEMS[x.id];
    if(ok){
      x.e = e + 1; enchResult = `<span style="color:var(--ok)">Успех! ${it.name} +${x.e}</span>`;
      Sfx.play("level"); if(Sfx.haptic) Sfx.haptic("heavy");
      if(x.e >= 7 && typeof chatAnnounce === "function") chatAnnounce(S.name + " заточил " + it.name + " до +" + x.e);
    } else if(enchSph === "sph_ti"){
      enchResult = `<span style="color:var(--amber)">Неудача. Титановая сфера сохранила предмет</span>`; Sfx.play("hit");
    } else {
      const scrap = Math.max(5, Math.round(sellPrice(x)*0.5));
      if(enchRef.where === "inv") S.inv.splice(enchRef.i, 1); else S.eq[enchRef.slot] = null;
      S.scrap += scrap; S.hp = Math.min(S.hp, stat().maxhp);
      enchResult = `<span style="color:var(--rust)">Неудача: предмет разрушен. Из обломков получено ${scrap} лома</span>`; Sfx.play("hit");
      enchBusy = false; save();
      body().innerHTML = `<div class="enchbox"><div class="ench-item fail broken" style="border-color:var(--rust)">${icon(x.id, x.g)}</div></div><div class="ench-res">${enchResult}</div><button class="btn wide" type="button" data-ench="close">Закрыть</button>`;
      if(typeof bagSel !== "undefined") bagSel = null; if(typeof cSel !== "undefined") cSel = null;
      return;
    }
    enchBusy = false; save(); renderEnchant();
    const el2 = $("enchItem"); if(el2) el2.classList.add(ok ? "ok" : "fail");
  }, 900);
}

$("shBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  if(b.dataset.enchInv !== undefined){ openEnchant({where:"inv", i:+b.dataset.enchInv}); return; }
  if(b.dataset.sph){ enchSph = b.dataset.sph; enchResult = ""; renderEnchant(); return; }
  if(b.dataset.ench === "go") doEnchant();
  if(b.dataset.ench === "close") closeSheet();
});
$("scrChar").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.enchInv !== undefined) openEnchant({where:"inv", i:+b.dataset.enchInv});
  else if(b.dataset.enchEq) openEnchant({where:"eq", slot:b.dataset.enchEq});
});

// ===================== ПОДЗЕМЕЛЬЕ «НИЖНИЕ ЦЕХА» =====================
// Центральный коридор, от него 10 проходов. В каждом проходе сверху мобы нечётного уровня,
// снизу — следующего: 1/2, 3/4 … 19/20. В каждом крыле по 4 комнаты.
// Подземелья: горизонтальный коридор посередине, от него 10 проходов вверх и вниз.

// малая комната (5 мобов) и пара больших комнат рядом (по 12 мобов), цикл повторяется дважды.

const DG = {cols:10, colX:i => 470 + i*520, W:5500, H:2500, corrY:1250, corrH:110, small:{w:200, h:170}, big:{w:210, h:230}, cycles:2};
const DG_PREFIX = ["Ржавый","Слабый","Обычный","Стойкий","Закалённый","Хищный","Яростный","Бронированный","Кровожадный","Свирепый","Беспощадный","Древний","Элитный","Разъярённый","Грозный","Смертоносный","Титановый","Кошмарный","Апокалиптический","Легендарный",

// ---- главари: db1 … db40, по одному в самой дальней комнате каждого прохода ----
const BOSS_SCALE = 1.9, BOSS_RESPAWN = 300, BOSS_LOOT = 150;
for(let L = 1; L <= 40; L++){
  const m = NPCS["dg" + L];
  NPCS["db" + L] = {...m, name:"Главарь: " + m.name, boss:true, minion:"dg" + L,

// ---- таблица дропа в духе Lineage: лом всегда, материалы часто, сферы и ядра редко,
//      снаряжение и книги — очень редко. Одна функция и для выпадения, и для экрана карты ----
// ---- таблица выпадения по образцу LIBERTY: лом 30%, всё остальное — сотые и тысячные доли процента ----
const P = pct => pct/100;                                  // проценты → вероятность
const SCRAP_CHANCE = 0.30;
// снаряжение: шанс на КАЖДУЮ вещь; низкие уровни — обычный грейд, выше — только более редкие грейды и реже
function gearPer(lv){
  if(lv <= 10) return [P(0.0028 + 0.00008*(lv - 1)), 0, 0, 0];
  if(lv <= 20) return [0, P(0.0001), 0, 0];
  if(lv <= 30) return [0, P(0.00012), P(0.00002), 0];
  return [0, 0, P(0.0001), P(0.00001)];
}
function mobDrops(type, loc){
  const k = NPCS[type], L = LOCS[loc] || {}, lv = k.lvl || L.min || 1, s = lv - 1;
  const out = {exp:k.exp, scrap:k.scrap, scrapChance:k.boss ? 1 : SCRAP_CHANCE, items:[], gear:null};
  // материалы — как «ключи» в LIBERTY: 0,13% на 1 ур., растёт с уровнем; более редкие — реже
  const base = 0.13 + 0.0079*s;
  for(const [id, c] of Object.entries(k.loot || {})) out.items.push({id, chance:P(+(base*Math.max(0.3, Math.min(1, c/0.4))).toFixed(4)), sect:"mat"});
  out.items.push({id:"kit_s", chance:P(+(0.0267 + 0.0015*s).toFixed(4)), sect:"mat"});
  if(lv >= 3 || L.cores) out.items.push({id:"cores", chance:P(+(0.02 + 0.001*s).toFixed(4)), sect:"sph"});
  // сферы — как «камень обычной заточки»: 0,0033% на 1 ур.
  out.items.push({id:"sph_cu", chance:P(+(0.0033 + 0.000036*s).toFixed(6)), sect:"sph"});
  out.items.push({id:"sph_ti", chance:P(+(0.00033 + 0.0000036*s).toFixed(7)), sect:"sph"});
  // книги: 0,0001% каждая, книги навыков с 11 ур. — 0,0002%
  for(const b of BOOK_IDS) out.items.push({id:b, chance:P(ITEMS[b].pas ? 0.0001 : lv > 10 ? 0.0002 : 0.0001), sect:ITEMS[b].pas ? "bookp" : "book"});
  const pool = GEAR_IDS.filter(id => !ITEMS[id].starter && (ITEMS[id].lvl || 1) <= lv + 2 && (ITEMS[id].lvl || 1) >= lv - 10);   // вещи своего уровня и до 10 ниже
  out.gear = {pool, per:gearPer(lv)};
  if(k.boss){                                            // главарь: шансы ценного лута ×150
    out.items.forEach(it => it.chance = Math.min(0.9, it.chance*BOSS_LOOT));
    out.gear.per = out.gear.per.map(v => Math.min(0.5, v*BOSS_LOOT));
  }
  return out;
}
function rollDrops(e){
  const k = NPCS[e.type], D = mobDrops(e.type, locKey), st = stat();
  const vb = typeof vipBonus === "function" ? vipBonus() : {scrap:0, drop:0};
  if(Math.random() < D.scrapChance) drops.push({x:e.x, y:e.y, kind:"scrap", amt:Math.round(rnd(k.scrap)*(1 + st.loot + vb.scrap)), t:0});
  const srv = typeof regOnline === "function" && regOnline();
  if(srv) regKill(e);                                   // ценный лут решает сервер
  for(const it of D.items) if(!(srv && (it.id === "sph_cu" || it.id === "sph_ti")) && Math.random() < it.chance*(1 + vb.drop)) drops.push({x:e.x + Math.random()*30 - 15, y:e.y + Math.random()*30 - 15, kind:it.id, amt:it.amt ? rnd(it.amt) : 1, t:0});
  // снаряжение: один бросок на грейд, шанс = шанс вещи × число вещей
  if(!srv && D.gear && D.gear.pool.length) D.gear.per.forEach((p, g) => {
    if(p && Math.random() < p*D.gear.pool.length*(1 + vb.drop))
      drops.push({x:e.x - 12, y:e.y + 12, kind:D.gear.pool[Math.floor(Math.random()*D.gear.pool.length)], amt:1, g, t:0});
  });
}

// ---- геометрия ----
let dgRects = [], dgRooms = [], dgMarks = [], dgKey = "sector1";
function dgLayout(key){
  const cfg = DUNGEONS[key] || DUNGEONS.sector1, {corrY, corrH, small, big} = DG;
  dgKey = key; dgRects = []; dgRooms = []; dgMarks = [];
  dgRects.push({x:60, y:corrY - 150, w:260, h:300, hall:true});                     // входной зал с порталом
  dgRects.push({x:280, y:corrY - corrH/2, w:DG.W - 360, h:corrH, corr:true});         // центральный коридор
  for(let i = 0; i < DG.cols; i++){
    const cx = DG.colX(i), lvTop = cfg.first + 2*i;
    for(const side of [-1, 1]){                                                      // -1 — вверх, 1 — вниз
      const lv = side < 0 ? lvTop : lvTop + 1;
      let d = corrH/2 + 70;                                                           // расстояние от середины коридора
      for(let c = 0; c < DG.cycles; c++){
        // малая комната на оси прохода
        const sc = corrY + side*(d + small.h/2);
        const rs = {x:cx - small.w/2, y:sc - small.h/2, w:small.w, h:small.h, room:true, lv, n:5, cx, cy:sc, kind:"small"};
        dgRects.push(rs); dgRooms.push(rs);
        d += small.h + 70;
        // пара больших комнат слева и справа от прохода
        const bc = corrY + side*(d + big.h/2);
        for(const sx of [-1, 1]){
          const x0 = sx < 0 ? cx - 20 - big.w : cx + 20;
          const rb = {x:x0, y:bc - big.h/2, w:big.w, h:big.h, room:true, lv, n:12, cx:x0 + big.w/2, cy:bc, kind:"big"};
          dgRects.push(rb); dgRooms.push(rb);
          // дверной проём: широкий проход между коридором и комнатой, чтобы робот свободно проходил
          dgRects.push({x:sx < 0 ? cx - 80 : cx - 38, y:bc - 45, w:118, h:90, corr:true, door:true});
        }
        d += big.h + (c < DG.cycles - 1 ? 70 : 0);
      }
      // прямой проход от коридора до последней пары комнат
      const y1 = corrY, y2 = corrY + side*(d - 10);
      dgRects.push({x:cx - 38, y:Math.min(y1, y2), w:76, h:Math.abs(y2 - y1), corr:true});
      dgMarks.push({x:cx, y:corrY + side*98, lv, side, req:lvTop});
    }
  }
}
dgLayout("sector1");
// Проходимость считается по всей площади пола (объединению комнат, проходов и проёмов):
// робот помещается, если центр и точки по краю его корпуса стоят на полу — без «невидимых стен» на стыках.
let dgBuckets = null, dgBucketsFor = null;
const DG_BUCKET = 200;
function dgIndex(){
  if(dgBucketsFor === dgRects) return;
  dgBuckets = new Map(); dgBucketsFor = dgRects;
  for(const r of dgRects) for(let b = Math.floor(r.x/DG_BUCKET); b <= Math.floor((r.x + r.w)/DG_BUCKET); b++){ if(!dgBuckets.has(b)) dgBuckets.set(b, []); dgBuckets.get(b).push(r); }
}
function onFloor(x, y){
  const list = dgBuckets.get(Math.floor(x/DG_BUCKET)); if(!list) return false;
  for(const r of list) if(x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return true;
  return false;
}
function walkable(x, y, m){
  if(!(LOCS[locKey] && LOCS[locKey].dungeon)) return true;
  dgIndex();
  if(!onFloor(x, y)) return false;
  if(!m) return true;
  const d = m*0.71;
  return onFloor(x - m, y) && onFloor(x + m, y) && onFloor(x, y - m) && onFloor(x, y + m) &&
         onFloor(x - d, y - d) && onFloor(x + d, y - d) && onFloor(x - d, y + d) && onFloor(x + d, y + d);
}
// барьер уровня на входе в проход: пускает, если уровень пилота не ниже номера прохода
function gateAt(x, y){
  if(!(LOCS[locKey] && LOCS[locKey].dungeon)) return null;
  for(const m of dgMarks) if(S.level < m.req && Math.abs(x - m.x) < 46 && (m.side < 0 ? y < m.y : y > m.y)) return m;
  return null;
}
let gateWarn = 0;
function guardGate(){
  const m = gateAt(p.x, p.y);
  if(!m){ p.gx = p.x; p.gy = p.y; return; }
  // уже был за этим барьером (уровень выровнен сервером, телепорт админа) — не запираем, даём уйти
  if(p.gx != null && gateAt(p.gx, p.gy) === m){
    p.gx = p.x; p.gy = p.y;
    if(now > gateWarn){ gateWarn = now + 8; toast("Твой уровень ниже этого прохода: возвращайся к коридору"); }
    return;
  }
  p.x = p.gx ?? p.x; p.y = p.gy ?? (m.y - m.side*30); p.dashT = 0;
  if(now > gateWarn){ gateWarn = now + 2; toast("Барьер: проход открыт с " + m.req + " уровня"); Sfx.play("hit"); }
}
// прямая видимость: луч между точками не должен проходить через стену (только в подземельях)
function los(x1, y1, x2, y2){
  if(!(LOCS[locKey] && LOCS[locKey].dungeon)) return true;
  const n = Math.ceil(Math.hypot(x2 - x1, y2 - y1)/10);
  for(let i = 1; i < n; i++){ if(!walkable(x1 + (x2 - x1)*i/n, y1 + (y2 - y1)*i/n, 0)) return false; }
  return true;
}
// рывок/притяжение: идём по лучу шагами и останавливаемся в последней точке, где робот целиком на полу
function landAlong(x0, y0, x1, y1, r){
  const m = r*0.7, d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d/8));
  let lx = x0, ly = y0;
  for(let i = 1; i <= n; i++){
    const x = x0 + (x1 - x0)*i/n, y = y0 + (y1 - y0)*i/n;
    if(!walkable(x, y, m)) break;
    lx = x; ly = y;
  }
  return [lx, ly];
}
// если робот всё же оказался в стене — переносим в ближайшую свободную точку (по кольцам до 240 px)
function unstick(o, r){
  const m = r*0.7;
  if(walkable(o.x, o.y, m)) return false;
  for(let rad = 8; rad <= 240; rad += 8){
    const steps = Math.max(8, Math.round(rad/4));
    for(let k = 0; k < steps; k++){
      const a = k/steps*Math.PI*2, x = o.x + Math.cos(a)*rad, y = o.y + Math.sin(a)*rad;
      if(walkable(x, y, m)){ o.x = x; o.y = y; return true; }
    }
  }
  return false;
}
// скольжение вдоль стены: если шаг увёл в стену, пробуем сдвиг только по одной оси
function slide(o, ox, oy, r){
  const m = r*0.7;
  if(walkable(o.x, o.y, m)) return;
  if(!walkable(ox, oy, m)){ o.x = ox; o.y = oy; unstick(o, r); return; }   // стояли в стене — выбираемся, а не замираем
  if(walkable(o.x, oy, m)){ o.y = oy; return; }
  if(walkable(ox, o.y, m)){ o.x = ox; return; }
  o.x = ox; o.y = oy;
}

function buildDungeon(key){
  dgLayout(key);
  W = DG.W; H = DG.H; rocks = [];
  npcs = [{kind:"back", x:150, y:DG.corrY - 40}];
  for(const rm of dgRooms){
    const type = "dg" + rm.lv, cols = rm.kind === "big" ? 3 : 3;
    // главарь стоит в самой дальней от коридора комнате прохода (левая из последней пары больших)
    const far = dgRooms.filter(r => r.lv === rm.lv && r.kind === "big").sort((a, b) => Math.abs(b.cy - DG.corrY) - Math.abs(a.cy - DG.corrY) || a.cx - b.cx)[0];
    if(far === rm){ const bk = NPCS["db" + rm.lv]; enemies.push({type:"db" + rm.lv, x:rm.cx, y:rm.cy, hx:rm.cx, hy:rm.cy, tx:rm.cx, ty:rm.cy, hp:bk.hp, max:bk.hp, cd:0, ang:Math.random()*6, chase:false, dead:false, respawn:0, flash:0, wanderT:2, lunge:0, room:rm, boss:true}); }
    for(let j = 0; j < rm.n; j++){
      const k = NPCS[type], col = j % cols, row = Math.floor(j/cols), rows = Math.ceil(rm.n/cols);
      const x = rm.x + rm.w*(col + 0.5)/cols + (Math.random()*20 - 10);
      const y = rm.y + rm.h*(row + 0.5)/rows + (Math.random()*20 - 10);
      enemies.push({type, x, y, hx:x, hy:y, tx:x, ty:y, hp:k.hp, max:k.hp, cd:0, ang:Math.random()*6, chase:false, dead:false, respawn:0, flash:0, wanderT:Math.random()*3, lunge:0, room:rm});
    }
  }
  return {x:210, y:DG.corrY};
}
function respawnDungeon(e){
  const k = NPCS[e.type], rm = e.room;
  Object.assign(e, {x:k.boss ? rm.cx : rm.x + 25 + Math.random()*(rm.w - 50), y:k.boss ? rm.cy : rm.y + 25 + Math.random()*(rm.h - 50), hp:k.hp, max:k.hp, dead:false, chase:false, stun:0, flash:0, cd:1});
  e.hx = e.tx = e.x; e.hy = e.ty = e.y;
}

// ---- отрисовка ----
function drawDungeon(cx, cy, t){
  ctx.fillStyle = "#0B1015"; ctx.fillRect(cx, cy, vw, vh);
  const vis = r => r.x + r.w + 30 > cx && r.x - 30 < cx + vw && r.y + r.h + 40 > cy && r.y - 40 < cy + vh;
  // тёмные стены вокруг проходов
  for(const r of dgRects){ if(!vis(r)) continue; ctx.fillStyle = typeof wallPat === "function" ? wallPat() : "#141C25"; ctx.fillRect(r.x - 12, r.y - 12, r.w + 24, r.h + 24); }
  // пол из плит
  for(const r of dgRects){
    if(!vis(r)) continue;
    ctx.fillStyle = typeof tilePattern === "function" ? tilePattern(r.corr ? "corr" : "dungeon") : (r.corr ? "#232E3A" : "#283441");
    ctx.fillRect(r.x, r.y, r.w, r.h);
  }
  if(typeof drawGround === "function") drawGround(cx, cy); else if(typeof drawDecals === "function") drawDecals(cx, cy);
  // лицевая грань стены над комнатами и светильники
  for(const r of dgRects){
    if(!vis(r) || r.corr) continue;
    ctx.fillStyle = "#3A4757"; ctx.fillRect(r.x, r.y - 16, r.w, 16);
    ctx.fillStyle = "#2B3643"; ctx.fillRect(r.x, r.y - 4, r.w, 4);
    for(let x = r.x + 10; x < r.x + r.w; x += 30){ ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(x, r.y - 16, 1.5, 12); }
    const lx = r.x + r.w/2, fl = .7 + Math.sin(t*9 + r.x)*.2;
    // свет лампы — готовое пятно, мерцание через прозрачность (без нового градиента на каждую комнату в каждом кадре)
    ctx.globalAlpha = fl; ctx.drawImage(lampGlow(), lx - 70, r.y - 20); ctx.globalAlpha = 1;
    ctx.fillStyle = "#56616D"; ctx.fillRect(lx - 3, r.y - 10, 6, 6);
    ctx.fillStyle = `rgba(255,200,110,${fl})`; ctx.beginPath(); ctx.arc(lx, r.y - 12, 3, 0, Math.PI*2); ctx.fill();
  }
  // барьеры уровня на входе в проходы
  for(const m of dgMarks){
    if(m.x < cx - 80 || m.x > cx + vw + 80 || m.y < cy - 80 || m.y > cy + vh + 80) continue;
    const locked = S.level < m.req, col = locked ? "#E0694A" : S.level >= m.lv ? "#5FD4E8" : "#F2A93B";
    ctx.save();
    // энергополе поперёк коридора
    const x0 = m.x - 38, x1 = m.x + 38, fl = .55 + Math.sin(t*8 + m.x)*.2;
    ctx.globalAlpha = locked ? .35 + fl*.3 : .12 + fl*.1; ctx.fillStyle = col; ctx.fillRect(x0, m.y - 5, x1 - x0, 10);
    ctx.globalAlpha = locked ? .95 : .5; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, m.y); for(let x = x0; x <= x1; x += 6) ctx.lineTo(x, m.y + Math.sin(x*0.4 + t*14)*(locked ? 4 : 1.5)); ctx.stroke();
    ctx.fillStyle = "#56616D"; ctx.fillRect(x0 - 6, m.y - 10, 7, 20); ctx.fillRect(x1 - 1, m.y - 10, 7, 20);   // эмиттеры по краям

function drawMapCanvas(){
  const cv = $("mapCv"); if(!cv) return;
  const box = cv.parentElement, w = box.clientWidth, dpr2 = Math.min(2, window.devicePixelRatio || 1);

  let bx = 0, by = 0, bw = W, bh = H;
  if(LOCS[locKey].dungeon){ const xs = dgRects.flatMap(r => [r.x, r.x + r.w]), ys = dgRects.flatMap(r => [r.y, r.y + r.h]); bx = Math.min(...xs) - 30; by = Math.min(...ys) - 40; bw = Math.max(...xs) + 30 - bx; bh = Math.max(...ys) + 50 - by; }
  const scale = Math.min(w/bw, 320/bh), hh = Math.round(bh*scale);
  cv.style.width = w + "px"; cv.style.height = hh + "px"; cv.width = w*dpr2; cv.height = hh*dpr2;
  const g = cv.getContext("2d"); g.setTransform(dpr2, 0, 0, dpr2, 0, 0);
  g.fillStyle = "#0B1015"; g.fillRect(0, 0, w, hh);
  const ox = (w - bw*scale)/2, X = x => ox + (x - bx)*scale, Y = y => (y - by)*scale;
  if(LOCS[locKey].dungeon){
    for(const r of dgRects){ g.fillStyle = r.room ? "#3A4757" : "#2A3542"; g.fillRect(X(r.x), Y(r.y), Math.max(1.5, r.w*scale), Math.max(1.5, r.h*scale)); }

}

function arenaTick(dt){
  if(locKey !== "arena_fear" || !ARENA.active) return;
  if(p.dead){ ARENA.active = false; S.fearBest = Math.max(S.fearBest || 0, ARENA.wave - 1); save(); toast("Арена: пройдено волн " + Math.max(0, ARENA.wave - 1) + " · лучший результат " + S.fearBest); return; }
  if(ARENA.fighting){
    if(enemies.some(e => !e.dead)) return;
    // волна зачищена: награда и пауза перед следующей
    const w = ARENA.wave, scrap = 15*w + 3*S.level*w, exp = 10*w + 4*S.level;
    S.scrap += scrap; S.exp += exp; if(levelUps()) toast("Новый уровень: " + S.level + "!");
    S.fearBest = Math.max(S.fearBest || 0, w); save();
    toast("Волна " + w + " пройдена: +" + scrap + " лома, +" + exp + " опыта"); Sfx.play("level");
    ARENA.fighting = false; ARENA.next = now + 4; enemies = [];
    $("locName").textContent = "Страх · волна " + (w + 1) + " через 4 с";
    return;
  }
  if(now < ARENA.next) return;
  const w = ++ARENA.wave, lv = Math.max(1, Math.min(40, S.level - 1 + Math.floor(w/3))), n = Math.min(22, 3 + w*2);
  for(let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, r = 520 + Math.random()*60, type = "dg" + lv, k = NPCS[type];
    const x = 650 + Math.cos(a)*r, y = 650 + Math.sin(a)*r*0.9;
    enemies.push({type, x, y, hx:650, hy:650, tx:650, ty:650, hp:k.hp, max:k.hp, cd:1, ang:a + Math.PI, chase:true, dead:false, respawn:Infinity, flash:0, wanderT:0, lunge:0, arena:true});
  }
  ARENA.fighting = true;
  $("locName").textContent = "Страх · волна " + w;
  toast("Волна " + w + ": врагов " + n); Sfx.play("portal");
}

const CODEX_T = [["Комплект стойкости", "def"], ["Комплект мощи", "atk"], ["Комплект живучести", "hp"], ["Комплект точности", "crit"]];
const CODEX = [];
(() => {
  const gear = GEAR_IDS.filter(id => !ITEMS[id].starter);
  let seed = 7; const rnd01 = () => (seed = (seed*9301 + 49297) % 233280)/233280;
  for(let g = 0; g < 4; g++) for(const [tn, stat] of CODEX_T) for(let n = 1; n <= 3; n++){
    const cnt = 2 + ((n + g) % 3), slots = [], used = new Set();
    while(slots.length < cnt){ const id = gear[Math.floor(rnd01()*gear.length)]; if(used.has(ITEMS[id].slot)) continue; used.add(ITEMS[id].slot); slots.push({id, e:g >= 1 && slots.length === 0 && n % 2 ? g : 0}); }
    const val = stat === "hp" ? (g + 1)*12 : stat === "crit" ? (g >= 2 ? 2 : 1) : g + 1;
    CODEX.push({id:"cx" + g + stat + n, name:tn + ": " + GRADES[g].name + " №" + n, g, stat, val, slots});
  }
})();
S.codex = S.codex2 = S.codex2 || {};                 // кодекс пересобран под новое снаряжение

}

function codexSlot(cid, i){
  const c = CODEX.find(x => x.id === cid), s = c.slots[i], f = S.codex[cid] || (S.codex[cid] = []);

    addItem(S.inv, item.id, item.n || 1, INV_MAX, item.g, item.e, item.uid) || addItem(S.store, item.id, item.n || 1, STORE_MAX, item.g, item.e, item.uid);

let tcui = null;
function loadTonConnect(){
  return new Promise((res, rej) => {
    if(window.TON_CONNECT_UI) return res();
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js";
    sc.onload = res; sc.onerror = () => rej(new Error("TON Connect не загрузился"));
    document.head.appendChild(sc);
  });
}
async function tonConnect(){
  if(tcui) return tcui;
  await loadTonConnect();
  tcui = new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin + "/tonconnect-manifest.json"});
  tcui.onStatusChange(w => {
    if(w){
      const raw = w.account.address, test = w.account.chain === "-3";
      let fr = raw; try{ if(TON_CONNECT_UI.toUserFriendlyAddress) fr = TON_CONNECT_UI.toUserFriendlyAddress(raw, test); }catch(e){}
      Wl.connected = true; Wl.wallet = (w.device && w.device.appName) || "TON"; Wl.address = fr;
    } else { Wl.connected = false; Wl.wallet = ""; Wl.address = ""; }
    saveW(); if(!$("scrProfile").hidden) renderProfile();
  });
  return tcui;
}

// комментарий перевода для кошелька: одна ячейка TON (op 0 + текст), упакованная в BOC с контрольной суммой CRC32C
function crc32c(bytes){
  let c = ~0;
  for(const b of bytes){ c ^= b; for(let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0x82F63B78 : c >>> 1; }
  return ~c >>> 0;
}
function commentPayload(text){
  const data = [0, 0, 0, 0, ...new TextEncoder().encode(text)];
  const cell = [0, data.length*2, ...data];                                   // d1 = 0 ссылок, d2 = полные байты
  const boc = [0xB5, 0xEE, 0x9C, 0x72, 0x41, 0x01, 0x01, 0x01, 0x00, cell.length, 0x00, ...cell];
  const c = crc32c(boc);
  boc.push(c & 255, (c >>> 8) & 255, (c >>> 16) & 255, (c >>> 24) & 255);
  return btoa(String.fromCharCode(...boc));
}

function pvpPos(id){

    ctx.restore();
  }
  PVPFX.slashes = PVPFX.slashes.filter(s => s.life > 0);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for(const sp of PVPFX.sparks){ sp.life -= dt; sp.x += sp.vx*dt; sp.y += sp.vy*dt; sp.vy += 260*dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, sp.life*3)); ctx.fillStyle = sp.c; ctx.fillRect(sp.x - 1.5, sp.y - 1.5, 3, 3); }
  ctx.restore();
  PVPFX.sparks = PVPFX.sparks.filter(sp => sp.life > 0);
  // цифры урона: красные, крит — крупнее и золотой; всплывают и «прыгают» при появлении
  ctx.save(); ctx.textAlign = "center"; ctx.lineJoin = "round";
  for(const n of PVPFX.nums){
    n.life -= dt; n.y -= 26*dt; const age = n.max - n.life, pop = age < .12 ? 1.35 - age*2.9 : 1;
    ctx.globalAlpha = Math.max(0, Math.min(1, n.life*2.5));

    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.strokeText(n.t, n.x, n.y);
    ctx.fillStyle = n.crit ? "#FFD34A" : "#FF4A3A"; ctx.fillText(n.t, n.x, n.y);
  }
  ctx.restore();
  PVPFX.nums = PVPFX.nums.filter(n => n.life > 0);
}

// Продать за GRAM можно только такие вещи. Вещи без номера («привязанные») в игре работают как обычно.
const REG = {on:false, sph:{sph_cu:0, sph_ti:0}, uids:new Set()};

async function regSync(){
  if(!(typeof NET !== "undefined" && NET.on && NET.id)) return;
  try{
    const r = await regApi("state"); if(!r || !r.ok) return;

}

function mgResult(r){

function regAddSph(id, n){ REG.sph[id] = Math.max(0, (REG.sph[id] || 0) + n); }
// учтённых сфер не может быть больше, чем их лежит в сумке: лишние списываются и на сервере
function regClampSph(){
  if(!REG.on) return;
  for(const id of ["sph_cu", "sph_ti"]){
    const extra = (REG.sph[id] || 0) - have(id);
    if(extra > 0){ REG.sph[id] -= extra; regApi("gone", {sph:{[id]:extra}}); }
  }
}
function regUseSph(id, n){ if(!REG.on) return; const use = Math.min(REG.sph[id] || 0, n); if(use > 0){ REG.sph[id] -= use; regApi("gone", {sph:{[id]:use}}); } }
function regGone(uids){ uids = uids.filter(Boolean); if(!REG.on || !uids.length) return; uids.forEach(u => REG.uids.delete(u)); regApi("gone", {uids}); }

function regTradable(x){

const _doEnchantLocal = doEnchant;
doEnchant = async function(){
  const x = enchGet(); if(!x || enchBusy) return;

// 3 задания в день (набор зависит от даты и пилота), объём — от уровня. Бонус за выполнение всех трёх.
const QUEST_TYPES = {
  kill:{text:n => `Уничтожь ${n} врагов`, n:lv => Math.min(150, 30 + lv*3), w:3},
  dkill:{text:n => `Уничтожь ${n} врагов в подземелье`, n:lv => Math.min(120, 25 + lv*2), w:2},
  scrap:{text:n => `Собери ${n} лома с врагов`, n:lv => 60 + lv*12, w:2},
  skill:{text:n => `Используй умения ${n} раз`, n:() => 25, w:2},
  wave:{text:n => `Пройди ${n} волны на арене «Страх»`, n:() => 3, w:1},
  boss:{text:() => "Победи главаря в подземелье", n:() => 1, w:1, min:3},
  loot:{text:n => `Подбери лут ${n} раз`, n:lv => 15 + Math.floor(lv/2), w:2}
};
const qDay = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
function qReward(type, lv){
  const base = 80 + lv*15;
  return type === "boss" ? {scrap:base*3, cores:5} : type === "wave" ? {scrap:base*2, kit:2} : type === "dkill" ? {scrap:Math.round(base*1.5), cores:2} : {scrap:base, kit:1};
}
function qState(){
  const day = qDay(), lv = S.level || 1;
  if(!S.quests || S.quests.day !== day){
    // выбор трёх заданий: зависит от даты и пилота, без повторов
    let seed = 0; for(const c of day + (S.name || "")) seed = (seed*31 + c.charCodeAt(0)) >>> 0;
    const rnd = () => (seed = (seed*1103515245 + 12345) >>> 0) / 4294967296;
    const pool = Object.entries(QUEST_TYPES).filter(([, q]) => !q.min || lv >= q.min).flatMap(([id, q]) => Array(q.w).fill(id));
    const pick = [];
    while(pick.length < 3 && pool.length){ const id = pool[Math.floor(rnd()*pool.length)]; if(!pick.includes(id)) pick.push(id); if(pick.length >= new Set(pool).size) break; }
    S.quests = {day, bonus:false, list:pick.map(id => ({id, n:QUEST_TYPES[id].n(lv), p:0, done:false, got:false, r:qReward(id, lv)}))};
    save();
  }
  return S.quests;
}
function questEvent(type, amount){
  if(!S.nameChosen) return;
  const q = qState();
  let changed = false;
  for(const t of q.list){
    if(t.id !== type || t.done) continue;
    t.p = Math.min(t.n, t.p + (amount || 1)); changed = true;
    if(t.p >= t.n){ t.done = true; toast("📜 Квест выполнен: " + QUEST_TYPES[t.id].text(t.n) + " — забери награду во вкладке «Квесты»"); Sfx.play("level"); }
  }
  if(changed){ save(); qBadge(); }
}
const qClaimable = () => { const q = qState(); return q.list.filter(t => t.done && !t.got).length + (q.list.every(t => t.got) && !q.bonus ? 1 : 0); };
function qBadge(){
  const n = qClaimable(), b = $("gmToggle"); if(!b) return;
  let dot = b.querySelector(".gm-dot"); if(!dot){ dot = document.createElement("i"); dot.className = "gm-dot"; b.appendChild(dot); }
  dot.hidden = !n; dot.textContent = n || "";

// Враги рисуются попиксельно, как мехи игроков: обводка, объём, светящиеся глаза и анимация.

const EPX = 32;                       // сетка спрайта врага 32×32
const epxCache = new Map();
function epxBuild(kind, accent, f){
  const N = EPX, buf = new Array(N*N).fill(null), glow = [];

const rockCache = new Map();
function rockSprite(r, color, variant){
  const key = r + "|" + color + "|" + variant; let c = rockCache.get(key); if(c) return c;
  const ps = 2, n = Math.max(6, Math.ceil(r/ps)), size = n*2 + 2, cv2 = document.createElement("canvas"); cv2.width = cv2.height = size*ps;
  const g = cv2.getContext("2d"), P = [mix(color, "#FFFFFF", .25), color, shade(color, .72), shade(color, .5)];
  let seed = r*97 + variant*131 + 7; const rnd = () => (seed = (seed*1103515245 + 12345) >>> 0)/4294967296;
  const bump = Array.from({length:16}, () => 0.82 + rnd()*0.2), inside = (x, y) => { const dx = x - n, dy = y - n, a = (Math.atan2(dy, dx) + Math.PI)/(Math.PI*2)*16, rr = bump[Math.floor(a) % 16]*n; return dx*dx + dy*dy <= rr*rr; };
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x*ps, y*ps, ps, ps); };
  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){
    if(!inside(x, y)) continue;
    const l = ((n - x) + (n - y))/(n*1.6);                          // свет сверху-слева
    px(x, y, l > .45 ? P[0] : l > -.1 ? P[1] : l > -.55 ? P[2] : P[3]);
  }
  for(let i = 0; i < 3 + (r >> 4); i++){                             // трещины
    let x = n + Math.floor((rnd() - .5)*n), y = n + Math.floor((rnd() - .5)*n);
    for(let j = 0; j < 3 + Math.floor(rnd()*4); j++){ if(inside(x, y)) px(x, y, P[3]); x += rnd() < .5 ? 1 : 0; y += 1; }
  }
  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){       // тёмный контур
    if(inside(x, y)) continue;
    if([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => inside(x + dx, y + dy))) px(x, y, "#0B0E12");
  }
  rockCache.set(key, cv2); return cv2;
}

// ===================== ЯЗЫКИ =====================
// Интерфейс пишется по-русски, а здесь фразы подменяются на выбранный язык:
// в тексте страницы, подсказках полей, уведомлениях и надписях на карте.
// Сообщения игроков, ники и названия гильдий помечены data-notr и не переводятся.
const LANG_IDX = {en:0, uk:1, es:2, tr:3, pt:4};
let LANG = "ru", trRe = null;
const trMemo = new Map();
const CYR = /[А-Яа-яЁёЇїІіЄєҐґ]/;
function buildTrRe(){
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const keys = Object.keys(I18N).sort((a, b) => b.length - a.length);
  const mk = lb => new RegExp(keys.map(k => (lb && /^[\p{L}\p{N}]/u.test(k) ? "(?<![\\p{L}\\p{N}])" : "") + esc(k) + (/[\p{L}\p{N}]$/u.test(k) ? "(?![\\p{L}\\p{N}])" : "")).join("|"), "gu");
  try{ trRe = mk(true); }catch(e){ trRe = mk(false); }   // старые iPhone без lookbehind
}
function T(s){
  if(LANG === "ru" || !s || typeof s !== "string" || !CYR.test(s)) return s;
  const hit = trMemo.get(s); if(hit !== undefined) return hit;
  const i = LANG_IDX[LANG], trim = s.trim();
  let out;
  if(I18N[trim]) out = s.replace(trim, I18N[trim][i]);
  else out = s.replace(trRe, m => I18N[m] ? I18N[m][i] : m);
  if(trMemo.size > 3000) trMemo.clear();
  trMemo.set(s, out); return out;
}


// ===================== БОЙ С МОБАМИ: СЕРВЕР ВИДИТ УДАРЫ =====================
// Каждый моб получает номер боя; урон по нему копится и уходит на сервер в сообщении pos.
// Убийство сервер засчитывает, только если раньше видел удары по этому мобу.
const MG = {seq:Math.floor(Math.random()*1e9) + 1, hits:new Map(), n:0, wait:new Map()};
const _hitEnemyMG = hitEnemy;
hitEnemy = function(e, dmg, kind){
  if(!e || e.dead) return _hitEnemyMG(e, dmg, kind);
  if(!e.iid) e.iid = ++MG.seq;
  const iid = e.iid, before = e.hp;
  const r = _hitEnemyMG(e, dmg, kind);
  const done = Math.round(before - e.hp);
  if(done > 0 && locKey !== "lobby"){ const h = MG.hits.get(iid); if(h) h[2] += done; else MG.hits.set(iid, [iid, e.type, done]); }
  return r;
};
function mgTake(){
  if(!MG.hits.size && !killQ.length) return null;
  const out = {};
  if(MG.hits.size){
    out.h = [];
    for(const [iid, h] of MG.hits){ if(out.h.length >= 40) break; out.h.push(h); MG.hits.delete(iid); }
  }
  // убийства — только когда все удары уже уехали (иначе сервер увидит убийство раньше удара)
  if(killQ.length && !MG.hits.size){
    const batch = killQ.splice(0, 40), n = ++MG.n;
    MG.wait.set(n, {batch, t:Date.now()});
    for(const [k, v] of MG.wait) if(Date.now() - v.t > 30000) MG.wait.delete(k);
    out.k = batch.map(k => ({iid:k.iid, mob:k.mob, loc:k.loc})); out.n = n;
  }
  return out;
}

  }catch(err){ b.disabled = false; toast("Нет связи с сервером, попробуй ещё раз"); }
});

const CW = {st:null};
const cwEl = document.createElement("button");
cwEl.type = "button"; cwEl.className = "cw"; cwEl.id = "cwHud"; cwEl.hidden = true; cwEl.setAttribute("aria-label", "Chip War: счёт");
$("zoneTag").insertAdjacentElement("afterend", cwEl);
const cwTime = ms => { const t = Math.max(0, Math.round(ms/1000)); return Math.floor(t/60) + ":" + String(t % 60).padStart(2, "0"); };
function cwBuffOn(){ const b = CW.st && CW.st.buff; return b && Date.now() < b.until && FAC.srv === b.fac ? b : null; }
function cwApply(st){
  const prev = CW.st; CW.st = st;
  if(st.ann === "start"){ toast("⚔ Chip War началась: удержи чип в Железном каньоне"); Sfx.play("portal"); if(typeof chatLocal === "function") chatLocal("Chip War началась! Чип в центре Железного каньона, участвуют пилоты с " + st.min + "-го уровня"); }
  else if(st.ann === "soon"){ toast("Chip War через 5 минут — Железный каньон"); }
  else if(st.ann === "end"){ const w = st.win && FACTIONS[st.win]; toast(w ? "Chip War: победа " + w.name + (st.win === FAC.srv ? " — бонус твоей фракции на сутки!" : "") : "Chip War окончена вничью"); Sfx.play("level"); }
  cwHud();
}
function cwHud(){
  const st = CW.st, now = Date.now();
  const live = st && st.ph === "live", soon = st && st.ph !== "live" && st.next && st.next - now < 300000 && st.next > now;
  cwEl.hidden = !(live || soon);
  if(cwEl.hidden) return;
  if(soon){ cwEl.innerHTML = `<span class="cw-t">Chip War через ${cwTime(st.next - now)}</span>`; return; }
  cwEl.innerHTML = `<span class="cw-t"><i class="cw-dot"></i>${cwTime(st.end - now)}</span>` + ["aegis", "vex", "core"].map(f =>
    `<span class="cw-f${st.hold === f ? " hold" : ""}" style="--c:${FACTIONS[f].color}" aria-label="${FACTIONS[f].name}: ${st.sc[f]}">${st.sc[f]}<b style="width:${Math.min(100, st.sc[f]/st.target*100)}%"></b></span>`).join("");
}
setInterval(cwHud, 1000);
cwEl.addEventListener("click", () => {
  const st = CW.st; if(!st) return;
  openSheet("Chip War", "Битва фракций за чип", () => {
    const b = st.buff && Date.now() < st.buff.until ? st.buff : null;
    const holdTx = st.hold === "contested" ? "Чип оспаривается" : st.hold && FACTIONS[st.hold] ? "Чип держит " + FACTIONS[st.hold].name : "Чип свободен";
    body().innerHTML = `
      ${st.ph === "live" ? `<div class="stline"><b>${holdTx}</b> · до конца ${cwTime(st.end - Date.now())}</div>

      ${st.next ? `<div class="stline">Следующая битва: <b>${new Date(st.next).toLocaleString("ru-RU", {weekday:"short", hour:"2-digit", minute:"2-digit"})}</b></div>` : ""}
      ${b ? `<div class="stline">Бонус победителя у ${FACTIONS[b.fac].name}: +${Math.round((b.loot - 1)*100)}% к шансу ценного лута и +${Math.round(b.exp*100)}% опыта до ${new Date(b.until).toLocaleString("ru-RU", {hour:"2-digit", minute:"2-digit"})}</div>` : ""}
      <p class="demo">Чип стоит в центре Железного каньона. Пока в круге пилоты только одной фракции, она получает очки (до +3 в секунду). Если в круге несколько фракций, очки не идут никому. Побеждает первая фракция с ${st.target} очками или лидер к концу времени. Участвуют пилоты с ${st.min}-го уровня; кто простоял в круге хотя бы минуту, получает лом и ядра.</p>
      ${FAC.srv ? "" : `<button class="btn pri wide" type="button" data-facopen="1">Выбрать фракцию</button>`}`;
  });
});

// круг чипа на карте каньона
const _drawOthersCW = drawOthers;
drawOthers = function(t, dt){
  _drawOthersCW(t, dt);
  const st = CW.st; if(!st || st.ph !== "live" || locKey !== st.loc) return;
  const col = st.hold && FACTIONS[st.hold] ? FACTIONS[st.hold].color : st.hold === "contested" ? "#E4DED1" : "#8A96A3";
  ctx.save();
  ctx.globalAlpha = 0.12; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.9; ctx.strokeStyle = col; ctx.lineWidth = 3; if(st.hold === "contested") ctx.setLineDash([14, 10]);
  ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  const pulse = 10 + Math.sin(t*4)*2;                  // сам чип
  ctx.globalAlpha = 1; ctx.fillStyle = "#1B232C"; ctx.fillRect(st.x - 14, st.y - 14, 28, 28);
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = pulse; ctx.fillRect(st.x - 8, st.y - 8, 16, 16); ctx.shadowBlur = 0;
  ctx.restore();
};
// бонус опыта победившей фракции
const _killEnemyCW = killEnemy;
killEnemy = function(e){
  const wasDead = e.dead; _killEnemyCW(e);
  const b = cwBuffOn(); if(wasDead || !e.dead || !b) return;
  const extra = Math.round((NPCS[e.type].exp || 0)*b.exp); if(extra <= 0) return;
  S.exp += extra; addText(e.x, e.y - 50, "+" + extra + " Chip War", FACTIONS[b.fac].color);
  if(levelUps()){ Sfx.play("level"); toast("Новый уровень: " + S.level + "!"); }
};
if(typeof onNetExtra === "function"){
  const prevCW = onNetExtra;
  onNetExtra = function(d){
    if(d.t === "cw"){ cwApply(d); return; }
    if(d.t === "kres"){ mgResult(d); return; }
    prevCW(d);
  };
}

// статистика админа: воронка новичка и подозрительные убийства
function adFunnel(f){
  if(!f || !f.length) return "";
  const top = Math.max(1, f[0].n);
  return `<div class="dsect">Воронка новичков за 7 дней</div>` + f.map(x => `<div class="stbar"><span>${esc(x.name)}</span><div><i style="width:${x.n/top*100}%"></i></div><b>${x.n}${x !== f[0] && f[0].n ? ` <small>${Math.round(x.n*100/f[0].n)}%</small>` : ""}</b></div>`).join("");
}
function adSuspects(sx){
  if(!sx) return "";
  const mode = {off:"выключена", shadow:"только наблюдение", on:"отклоняет"}[sx.mode] || sx.mode;
  return `<div class="dsect">Отклонённые убийства за сутки</div><div class="stline">Проверка боя с мобами: <b>${mode}</b></div>` +
    (sx.list.length ? sx.list.map(x => `<div class="stline">${esc(x.nick)} <small>ур. ${x.lvl} · id ${x.uid}</small> — <b>${x.rejects}</b></div>`).join("") : `<div class="empty">Отказов нет</div>`);
}

// ---- перевод страницы ----
const trOrig = new WeakMap(), trDone = new WeakMap();
const skip = el => !el || el.closest("[data-notr],script,style,textarea");
function trText(n){
  if(skip(n.parentElement)) return;
  const cur = n.data;
  if(trDone.get(n) === cur) return;
  trOrig.set(n, cur);
  const t = T(cur); trDone.set(n, t); if(t !== cur) n.data = t;
}
const TR_ATTRS = ["placeholder", "aria-label", "title"];
function trAttrs(el){
  if(!el || el.closest("[data-notr],script,style")) return;
  for(const a of TR_ATTRS){
    if(!el.hasAttribute(a)) continue;
    const v = el.getAttribute(a);
    if(el.getAttribute("data-t-" + a) !== v) el.setAttribute("data-o-" + a, v);
    const t = T(el.getAttribute("data-o-" + a) || v);
    el.setAttribute("data-t-" + a, t); if(t !== v) el.setAttribute(a, t);
  }
}
function trTree(root){
  if(root.nodeType === 3){ trText(root); return; }
  if(root.nodeType !== 1) return;
  trAttrs(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n; while((n = w.nextNode())){ if(n.nodeType === 3) trText(n); else trAttrs(n); }
}
new MutationObserver(list => {
  if(LANG === "ru" && !trAll.pending) return;
  for(const m of list){
    if(m.type === "characterData") trText(m.target);
    else if(m.type === "attributes") trAttrs(m.target);
    else m.addedNodes.forEach(trTree);
  }
}).observe(document.body, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:TR_ATTRS});

function trAll(){
  trMemo.clear();
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){
    if(trOrig.has(n) && trDone.get(n) === n.data) n.data = trOrig.get(n);   // вернуть русский оригинал
    trDone.delete(n); trText(n);
  }
  document.querySelectorAll("[data-o-placeholder],[data-o-aria-label],[data-o-title]").forEach(el => {
    for(const a of TR_ATTRS){ const o = el.getAttribute("data-o-" + a); if(o !== null){ el.setAttribute(a, o); el.removeAttribute("data-t-" + a); } }
  });
  document.querySelectorAll("[placeholder],[aria-label],[title]").forEach(trAttrs);
}

function setLang(l, chosen){
  if(!(l === "ru" || l in LANG_IDX)) l = "ru";
  LANG = l; S.settings.lang = l; if(chosen) S.settings.langChosen = true; save();
  document.documentElement.lang = l;
  trAll();
}

(() => {
  buildTrRe();
  const TG = window.Telegram && window.Telegram.WebApp;
  const code = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && String(TG.initDataUnsafe.user.language_code || "").toLowerCase();

  if(!S.settings.langChosen && code){
    const base = code.slice(0, 2);
    l = ["ru","be","kk"].includes(base) ? "ru" : base in LANG_IDX ? base : "en";
  }
  setLang(l, false);
})();
