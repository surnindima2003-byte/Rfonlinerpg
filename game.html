}

function renderChatSub(){
  const sub = $("cpSub"); sub.replaceChildren();
  if(chatCh === "guild"){
    if(!S.guildId){
      const s = document.createElement("span"); s.textContent = "Ты пока не в гильдии.";
      const b = document.createElement("button"); b.type = "button"; b.className = "linkbtn"; b.dataset.cp = "open"; b.textContent = "Найти или создать гильдию";
      sub.append(s, b);
    } else {
      const s = document.createElement("span"); s.textContent = typeof gCur !== "undefined" && gCur ? "[" + gCur.tag + "] " + gCur.name : "Гильдия";
      sub.append(s);
    }
  } else if(chatCh === "dm"){
    if(!S.dmList.length){ sub.textContent = "Напиши @ник в начале сообщения или нажми на ник в общем чате, чтобы начать беседу"; return; }
    for(const n of S.dmList){
      const c = document.createElement("button"); c.type = "button"; c.className = "cp-chip"; c.dataset.chip = n;
      c.setAttribute("aria-pressed", String(dmTo === n)); c.append("@" + n);
      const x = document.createElement("span"); x.textContent = "×"; x.dataset.close = n; x.setAttribute("aria-label", "Закрыть беседу");
      c.append(x); sub.append(c);
    }
  }
}

function renderChatLog(){
  const log = $("chatLog"), near = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const list = sortTs(msgsFor(chatCh)).slice(-120);
  if(!list.length){
    const e = document.createElement("div"); e.className = "cp-empty";
    e.textContent = chatCh === "guild" ? (S.guildId ? "В гильдии пока тихо. Напиши первым!" : "Ты пока не в гильдии")
      : chatCh === "dm" ? (dmTo ? "Начни беседу с @" + dmTo : "Выбери беседу или отметь @ник") : "Сообщений пока нет";
    log.replaceChildren(e); return;
  }
  log.replaceChildren(...list.map(msgEl));
  if(near || !log.dataset.init){ log.scrollTop = log.scrollHeight; log.dataset.init = "1"; }
}

function renderChat(){
  const inp = $("chatIn");
  inp.placeholder = chatCh === "dm" ? (dmTo ? "Сообщение @" + dmTo + "…" : "@ник и сообщение…") : chatCh === "guild" ? "Сообщение гильдии…" : "Сообщение…";
  inp.disabled = chatCh === "guild" && !S.guildId;
  chatSeen[chatCh] = Date.now();
  renderTabsBadges(); renderChatSub(); $("chatLog").dataset.init = ""; renderChatLog();
}

function onChatUpdate(){
  const all = sortTs(allMsgs().filter(m => !m.local && (m.ch === "world" || (m.ch === "guild" && S.guildId && m.g === S.guildId) || (m.ch === "dm" && (m.to === me() || m.nick === me())))));
  const last = all[all.length - 1], el = $("chatLast");
  if(last){
    el.textContent = "";
    if(last.sys) el.textContent = last.text;
    else { const b = document.createElement("b"); b.textContent = (last.ch === "dm" ? "✉ " : last.ch === "guild" ? "[Г] " : "") + String(last.nick || "Пилот").slice(0, 16) + ": "; el.append(b, document.createTextNode(last.text)); }
  }
  if(!chatOpen && (unreadIn("world") || unreadIn("guild") || unreadIn("dm"))) $("chatBar").classList.add("new");
  if(chatOpen){ chatSeen[chatCh] = Date.now(); renderChatLog(); renderTabsBadges(); }
}

function chatError(text){
  let e = $("chatErr"); if(!e){ e = document.createElement("div"); e.id = "chatErr"; e.className = "cp-err"; e.setAttribute("role", "alert"); $("chatPanel").append(e); }
  e.textContent = text; e.classList.add("show"); clearTimeout(e._h); e._h = setTimeout(() => e.classList.remove("show"), 2200);
}

function openDm(nick){
  nick = String(nick).trim().slice(0, 16);
  if(nick === me()){ chatError("Нельзя написать самому себе"); return false; }
  if(!S.dmList.includes(nick)) S.dmList.unshift(nick);
  dmTo = nick; chatCh = "dm"; save(); renderChat(); return true;
}

async function sendChat(){
  const inp = $("chatIn");
  let text = inp.value.replace(/\s+/g, " ").trim();
  if(!text) return;
  // «@ник текст» во вкладке «Личные» открывает беседу
  if(chatCh === "dm" && text.startsWith("@")){
    const sp = text.indexOf(" "), nick = (sp < 0 ? text.slice(1) : text.slice(1, sp)).trim();
    if(nick.length < 3){ chatError("Ник: минимум 3 символа"); return; }
    if(!openDm(nick)) return;
    text = sp < 0 ? "" : text.slice(sp + 1).trim();
    inp.value = text; if(!text){ inp.focus(); return; }
  }
  if(chatCh === "dm" && !dmTo){ chatError("Отметь @ник, чтобы начать беседу"); return; }
  if(chatCh === "guild" && !S.guildId){ chatError("Сначала вступи в гильдию"); return; }
  if(Date.now() - chatLastSend < 3000){ chatError("Не так быстро: раз в 3 секунды"); return; }
  chatLastSend = Date.now(); inp.value = "";
  const msg = {ch:chatCh, text:text.slice(0, 200), nick:me(), fac:S.faction, lvl:S.level, uid:chatUid || "", ts:Date.now()};
  if(chatCh === "guild") msg.g = S.guildId;
  if(chatCh === "dm") msg.to = dmTo;
  if(typeof NET !== "undefined" && NET.ws && NET.ws.readyState === 1 && chatCh !== "guild"){
    NET.ws.send(JSON.stringify({t:"chat", ch:chatCh, text:msg.text, to:msg.to}));
  } else if(chatDb){
    try{ await chatDb.collection("chat").add(msg); }
    catch(e){ chatError("Не отправлено, попробуй ещё раз"); inp.value = text; chatLastSend = 0; }
  } else { chatLocalMsgs.push({...msg, id:"l" + Math.random(), mine:true}); onChatUpdate(); }
}

function renderProfile(){

// ---- хранилище: общее (db) или локальное для файла без Claude ----
function makeLocalDb(){
  let data = {}; try{ data = JSON.parse(localStorage.getItem("mw-localdb") || "{}"); }catch(e){}
  const subs = new Set();
  const persist = () => { try{ localStorage.setItem("mw-localdb", JSON.stringify(data)); }catch(e){} setTimeout(() => subs.forEach(s => s()), 0); };
  const newId = () => "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const snapDoc = path => ({id:path.split("/").pop(), exists:path in data, data:() => data[path] ? JSON.parse(JSON.stringify(data[path])) : undefined});
  function colDocs(col, q){
    const pre = col + "/";
    let docs = Object.keys(data).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snapDoc);
    for(const [f, op, v] of (q.where || [])) docs = docs.filter(d => op === "==" ? d.data()[f] === v : true);
    if(q.order){ const [f, dir] = q.order; docs.sort((a, b) => ((a.data()[f] > b.data()[f]) ? 1 : -1) * (dir === "desc" ? -1 : 1)); }
    if(q.limit) docs = docs.slice(0, q.limit);
    return {docs, size:docs.length, empty:!docs.length};
  }
  function query(col, q){
    q = q || {};
    return {path:col,
      where:(f, op, v) => query(col, {...q, where:[...(q.where || []), [f, op, v]]}),
      orderBy:(f, dir) => query(col, {...q, order:[f, dir]}),
      limit:n => query(col, {...q, limit:n}),
      get:async () => colDocs(col, q),
      onSnapshot:next => { const s = () => next(colDocs(col, q)); subs.add(s); setTimeout(s, 0); return () => subs.delete(s); },
      doc:id => docRef(col + "/" + (id || newId())),
      add:async d => { const r = docRef(col + "/" + newId()); await r.set(d); return r; }};
  }
  function docRef(path){
    return {id:path.split("/").pop(), path,
      get:async () => snapDoc(path),
      set:async d => { data[path] = JSON.parse(JSON.stringify(d)); persist(); },
      update:async d => { if(!(path in data)) throw {code:"invalid_argument"}; data[path] = {...data[path], ...JSON.parse(JSON.stringify(d))}; persist(); },
      delete:async () => { delete data[path]; persist(); },
      onSnapshot:next => { const s = () => next(snapDoc(path)); subs.add(s); setTimeout(s, 0); return () => subs.delete(s); },
      collection:c => query(path + "/" + c)};
  }
  return {collection:c => query(c), doc:docRef};
}

// хранилище гильдий на сервере игры (в Telegram): тот же интерфейс, обновление раз в 3 секунды
function makeRemoteDb(api){
  const subs = new Set();
  let refreshT = null;
  const refreshAll = () => { clearTimeout(refreshT); refreshT = setTimeout(() => subs.forEach(s => s.run()), 150); };
  const call = async body => { const r = await api("/api/db", body); if(!r || !r.ok) throw new Error((r && r.error) || "db"); return r; };
  const snapDoc = (id, data) => ({id, exists:data !== null && data !== undefined, data:() => data ? JSON.parse(JSON.stringify(data)) : undefined});
  function poll(fetcher, next){
    let last = "", stop = false;
    const s = {run:async () => { if(stop) return; try{ const v = await fetcher(); const js = JSON.stringify(v.raw); if(js !== last){ last = js; next(v.snap); } }catch(e){} }};
    subs.add(s); s.run(); const iv = setInterval(s.run, 3000);
    return () => { stop = true; clearInterval(iv); subs.delete(s); };
  }
  function query(col, q){
    q = q || {};
    const list = async () => { const r = await call({op:"list", col, q}); const docs = r.docs.map(d => snapDoc(d.id, d.data)); return {raw:r.docs, snap:{docs, size:docs.length, empty:!docs.length}}; };
    const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    return {path:col,
      where:(f, op, v) => query(col, {...q, where:[...(q.where || []), [f, op, v]]}),
      orderBy:(f, dir) => query(col, {...q, order:[f, dir || "asc"]}),
      limit:n => query(col, {...q, limit:n}),
      get:async () => (await list()).snap,
      onSnapshot:(next, err) => poll(list, next),
      doc:id => docRef(col + "/" + (id || newId())),
      add:async d => { const r = await call({op:"add", col, data:d}); refreshAll(); return docRef(col + "/" + r.id); }};
  }
  function docRef(path){
    const id = path.split("/").pop();
    const get = async () => { const r = await call({op:"get", path}); return {raw:r.data, snap:snapDoc(id, r.exists ? r.data : null)}; };
    const write = async (op, data) => { await call({op, path, data}); refreshAll(); };
    return {id, path, get:async () => (await get()).snap,
      set:d => write("set", d), update:d => write("update", d), delete:() => write("delete"),
      onSnapshot:(next, err) => poll(get, next), collection:c => query(path + "/" + c)};
  }
  return {collection:c => query(c), doc:docRef};
}

let GDB = null, gUid = null, gLocal = false, gReady = false;
let gList = [], gCur = null, gMembers = [], gRequests = [], gLog = [];
let gUnsubs = [], gTab = "members", gSearch = "", gPendingXp = 0, gReqWatch = {};
S.guildId = S.guildId || ""; S.guildReqs = S.guildReqs || [];

const gRef = id => GDB.doc("guilds/" + id);
const gCol = (id, c) => GDB.collection("guilds/" + id + "/" + c);
const myMember = () => gMembers.find(m => m.uid === gUid);
const myRole = () => (myMember() || {}).role;
const can = act => { const r = myRole(); return r === "leader" || (r === "officer" && ["accept","kick","donate"].includes(act)) || (r && act === "donate"); };
const gBank = () => gMembers.reduce((a, m) => a + (+m.donated || 0), 0) - (+(gCur && gCur.spent) || 0);
function guildExpMult(){ return gCur ? 1 + gBonus(gCur)/100 : 1; }
function guildAddXp(x){ if(gCur) gPendingXp += x; }
const safeText = v => String(v == null ? "" : v);
const gTime = ts => new Date(ts).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});

async function glog(text){ try{ await gCol(S.guildId, "log").add({text:text.slice(0, 140), ts:Date.now()}); }catch(e){} }
async function recount(gid){ try{ const s = await gCol(gid, "members").get(); await gRef(gid).update({count:s.size}); }catch(e){} }

function detachGuild(){ gUnsubs.forEach(u => { try{ u(); }catch(e){} }); gUnsubs = []; gCur = null; gMembers = []; gRequests = []; gLog = []; }
function attachGuild(id){
  detachGuild(); S.guildId = id; save();
  let membersLoaded = false;
  gUnsubs.push(gRef(id).onSnapshot(d => {
    if(!d.exists){ if(S.guildId === id){ toast("Гильдия распущена"); leftGuild(); } return; }
    gCur = {id, ...d.data()}; renderGuildIfOpen(); if(typeof onChatUpdate === "function") onChatUpdate();
  }, () => {}));
  gUnsubs.push(gCol(id, "members").onSnapshot(s => {
    gMembers = s.docs.map(d => ({id:d.id, ...d.data()}));
    if(membersLoaded && !gMembers.some(m => m.uid === gUid) && S.guildId === id){ toast("Тебя исключили из гильдии"); leftGuild(); return; }
    membersLoaded = true; renderGuildIfOpen();
  }, () => {}));
  gUnsubs.push(gCol(id, "requests").onSnapshot(s => { gRequests = s.docs.map(d => ({id:d.id, ...d.data()})); renderGuildIfOpen(); }, () => {}));
  gUnsubs.push(gCol(id, "log").orderBy("ts", "desc").limit(30).onSnapshot(s => { gLog = s.docs.map(d => d.data()); renderGuildIfOpen(); }, () => {}));
}
function leftGuild(){ detachGuild(); S.guildId = ""; save(); renderGuildIfOpen(); if(typeof onChatUpdate === "function") onChatUpdate(); }

// заявка: ждём, пока лидер или офицер добавит нас в состав
function watchRequest(gid){
  if(gReqWatch[gid]) return;
  gReqWatch[gid] = GDB.doc("guilds/" + gid + "/members/" + gUid).onSnapshot(d => {
    if(!d.exists) return;
    gReqWatch[gid](); delete gReqWatch[gid];
    S.guildReqs = S.guildReqs.filter(x => x !== gid);
    if(!S.guildId){ attachGuild(gid); toast("Твою заявку приняли!"); Sfx.play("level"); }
  }, () => {});
}

// периодически отправляем свой вклад опыта (только если он изменился)
setInterval(flushXp, 60000);
async function flushXp(){
  const m = myMember(); if(!gCur || !m) return;
  const bm = combatPower();
  if(!gPendingXp && m.bm === bm && m.lvl === S.level && m.nick === S.name) return;
  const add = gPendingXp; gPendingXp = 0;
  try{ await gCol(S.guildId, "members").doc(gUid).update({xp:(+m.xp || 0) + add, lvl:S.level, nick:S.name, bm}); }catch(e){ gPendingXp += add; }
}

function guildCatalog(){
  const q = gSearch.trim().toLowerCase();
  const list = gList.filter(g => !q || g.name.toLowerCase().includes(q) || safeText(g.tag).toLowerCase().includes(q));
  const items = list.map(g => {
    const full = (+g.count || 0) >= gMax(g), low = S.level < (+g.minLvl || 1), pending = S.guildReqs.includes(g.id);
    let btn;
    if(pending) btn = `<button class="act alt" type="button" data-gs="cancelreq" data-id="${esc(g.id)}">Отменить</button>`;
    else if(full) btn = `<button class="act" type="button" disabled>Мест нет</button>`;
    else if(low) btn = `<button class="act" type="button" disabled>Ур. ${+g.minLvl}</button>`;
    else btn = `<button class="act" type="button" data-gs="join" data-id="${esc(g.id)}">${g.open ? "Вступить" : "Заявка"}</button>`;
    return `<div class="gitem">${emblem(g.emblem)}<div class="tx"><b><span class="tag">[${esc(g.tag)}]</span>${esc(g.name)}</b>
      <small>Ур. ${+g.level || 1} · ${+g.count || 0}/${gMax(g)} пилотов · ${g.open ? "открытая" : "по заявкам"}${+g.minLvl > 1 ? " · с " + (+g.minLvl) + " ур." : ""}${pending ? " · заявка отправлена" : ""}</small>
      ${g.desc ? `<p>${esc(g.desc)}</p>` : ""}</div>${btn}</div>`;
  }).join("");
  return `<div class="ghead"><h1>Гильдии</h1><button class="act" type="button" data-gs="create">Создать</button></div>
    <input class="gsearch" id="gSearchIn" placeholder="Поиск по названию или тегу" aria-label="Поиск гильдии">
    ${items || `<div class="pcard"><div class="empty">${q ? "Ничего не найдено" : "Гильдий пока нет"}<small>Создай свою и пригласи друзей</small></div></div>`}
    <p class="demo">В гильдии открывается общий чат, казна и бонус к опыту за уровень гильдии.${gLocal ? " Сейчас гильдии хранятся только на этом устройстве." : ""}</p>`;
}

const VALID_NAME = /^[\p{L}\p{N} _\-]{3,20}$/u, VALID_TAG = /^[\p{L}\p{N}]{2,4}$/u;

// ---- действия ----
async function guildAction(a, b){
  const id = b.dataset.id, v = b.dataset.v;
  try{
  if(a === "create"){ if(S.guildId) return; cg = {icon:"gear", color:G_COLORS[0], open:true}; createSheet(); return; }
  if(a === "cgicon" || a === "cgcolor" || a === "cgopen"){
    const keep = {n:$("cgName").value, t:$("cgTag").value, d:$("cgDesc").value};
    if(a === "cgicon") cg.icon = v; else if(a === "cgcolor") cg.color = v; else cg.open = v === "1";
    createSheet(); $("cgName").value = keep.n; $("cgTag").value = keep.t; $("cgDesc").value = keep.d; return;
  }
  if(a === "docreate"){
    const name = $("cgName").value.trim().replace(/\s+/g, " "), tag = $("cgTag").value.trim().toUpperCase(), desc = $("cgDesc").value.trim().slice(0, 120);
    if(!VALID_NAME.test(name)){ toast("Название: 3–20 букв, цифр, пробелов"); return; }
    if(!VALID_TAG.test(tag)){ toast("Тег: 2–4 буквы или цифры"); return; }
    if(gList.some(g => g.name.toLowerCase() === name.toLowerCase())){ toast("Гильдия с таким названием уже есть"); return; }
    if(gList.some(g => safeText(g.tag).toUpperCase() === tag)){ toast("Такой тег уже занят"); return; }
    if(S.scrap < GUILD_COST){ toast("Не хватает лома"); return; }
    b.disabled = true;
    const ref = GDB.collection("guilds").doc();
    await ref.set({name, tag, emblem:{icon:cg.icon, color:cg.color}, desc, open:cg.open, minLvl:1, level:1, spent:0, count:1, leader:gUid, leaderNick:S.name, created:Date.now()});
    await GDB.doc("guilds/" + ref.id + "/members/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, role:"leader", joined:Date.now(), donated:0, xp:0, bm:combatPower()});
    S.scrap -= GUILD_COST; S.guildReqs = [];
    closeSheet(); attachGuild(ref.id); await glog(S.name + " основал гильдию"); toast("Гильдия «" + name + "» создана!"); Sfx.play("level"); return;
  }
  if(a === "join"){
    const g = gList.find(x => x.id === id); if(!g || S.guildId) return;
    if(S.level < (+g.minLvl || 1)){ toast("Нужен " + g.minLvl + " уровень"); return; }
    const size = (await gCol(id, "members").get()).size;
    if(size >= gMax(g)){ toast("В гильдии нет мест"); return; }
    if(g.open){
      await GDB.doc("guilds/" + id + "/members/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, role:"member", joined:Date.now(), donated:0, xp:0, bm:combatPower()});
      attachGuild(id); await recount(id); await glog(S.name + " вступил в гильдию"); toast("Добро пожаловать в «" + g.name + "»!"); Sfx.play("level");
    } else {
      if(S.guildReqs.length >= 3){ toast("Не больше трёх заявок одновременно"); return; }
      await GDB.doc("guilds/" + id + "/requests/" + gUid).set({uid:gUid, nick:S.name, lvl:S.level, fac:S.faction, ts:Date.now(), bm:combatPower()});
      S.guildReqs.push(id); save(); watchRequest(id); toast("Заявка отправлена");
      if(gLocal && id.startsWith("demo_")) setTimeout(async () => {   // в демо лидер отвечает сам
        const r = await GDB.doc("guilds/" + id + "/requests/" + gUid).get(); if(!r.exists) return;

        await GDB.doc("guilds/" + id + "/requests/" + gUid).delete(); await recount(id);
      }, 6000);
    }

  }
  if(a === "cancelreq"){ await GDB.doc("guilds/" + id + "/requests/" + gUid).delete(); S.guildReqs = S.guildReqs.filter(x => x !== id); if(gReqWatch[id]){ gReqWatch[id](); delete gReqWatch[id]; } save(); renderGuild(); return; }
  if(a === "tab"){ gTab = v; renderGuild(); return; }
  if(a === "chat"){ showTab("game"); chatCh = "guild"; openChat(); return; }
  if(a === "member"){ memberSheet(id); return; }
  if(a === "cancel"){ closeSheet(); return; }
  if(a === "accept" && can("accept")){

    if(gMembers.length >= gMax(gCur)){ toast("Нет мест. Улучши гильдию"); return; }

    await gCol(S.guildId, "requests").doc(id).delete(); await recount(S.guildId); await glog(S.name + " принял " + safeText(r.nick)); return;
  }
  if(a === "reject" && can("accept")){ await gCol(S.guildId, "requests").doc(id).delete(); return; }
  const m = gMembers.find(x => x.uid === id), role = myRole();
  if(a === "pm" && m){ closeSheet(); showTab("game"); openChat(); openDm(m.nick); return; }
  if(a === "kick" && m){
    if(!(role === "leader" || (role === "officer" && m.role === "member"))) return;
    if(!b.dataset.ok){ confirmSheet("Исключить " + m.nick + "?", "Пилот покинет гильдию. Его вклад в казну останется.", "Исключить", "kick", id); const c = body().querySelector('[data-gs="kick"]'); c.dataset.ok = "1"; return; }
    const donated = +m.donated || 0;
    await gCol(S.guildId, "members").doc(id).delete();
    if(donated) await gRef(S.guildId).update({spent:(+gCur.spent || 0) - donated});   // вклад остаётся в казне
    closeSheet(); await recount(S.guildId); await glog(S.name + " исключил " + m.nick); return;
  }
  if(role !== "leader"){ if(["promote","demote","transfer","upgrade","savesettings","setopen","setcolor","disband"].includes(a)) return; }
  if(a === "promote" && m){ await gCol(S.guildId, "members").doc(id).update({role:"officer"}); closeSheet(); await glog(m.nick + " стал офицером"); return; }
  if(a === "demote" && m){ await gCol(S.guildId, "members").doc(id).update({role:"member"}); closeSheet(); await glog(m.nick + " больше не офицер"); return; }
  if(a === "transfer" && m){
    if(!b.dataset.ok){ confirmSheet("Передать лидерство?", m.nick + " станет лидером, а ты офицером.", "Передать", "transfer", id); body().querySelector('[data-gs="transfer"]').dataset.ok = "1"; return; }
    await gCol(S.guildId, "members").doc(id).update({role:"leader"});
    await gCol(S.guildId, "members").doc(gUid).update({role:"officer"});
    await gRef(S.guildId).update({leader:id, leaderNick:safeText(m.nick)});
    closeSheet(); await glog(S.name + " передал лидерство " + m.nick); return;
  }
  if(a === "donate"){
    const me = myMember(); if(!me) return;
    const amt = v === "all" ? S.scrap : Math.min(+v, S.scrap);
    if(amt <= 0){ toast("Нет лома для пожертвования"); return; }
    S.scrap -= amt; save();
    await gCol(S.guildId, "members").doc(gUid).update({donated:(+me.donated || 0) + amt});
    await glog(S.name + " пожертвовал " + amt + " лома"); toast("Спасибо! +" + amt + " в казну"); return;
  }
  if(a === "upgrade"){
    const cost = upCost(gCur.level || 1);
    if(gBank() < cost){ toast("В казне не хватает лома"); return; }
    await gRef(S.guildId).update({level:(gCur.level || 1) + 1, spent:(+gCur.spent || 0) + cost});
    await glog("Гильдия достигла " + ((gCur.level || 1) + 1) + " уровня"); Sfx.play("level"); return;
  }
  if(a === "setopen"){ await gRef(S.guildId).update({open:v === "1"}); return; }
  if(a === "setcolor"){ await gRef(S.guildId).update({emblem:{icon:(gCur.emblem || {}).icon || "gear", color:v}}); return; }
  if(a === "savesettings"){
    const desc = $("gsDesc").value.trim().slice(0, 120), minLvl = Math.max(1, Math.min(30, parseInt($("gsMin").value) || 1));
    await gRef(S.guildId).update({desc, minLvl}); toast("Настройки сохранены"); return;
  }
  if(a === "leave"){
    if(role === "leader" && gMembers.length > 1){ toast("Сначала передай лидерство другому участнику"); return; }
    if(!b.dataset.ok){
      confirmSheet(role === "leader" ? "Покинуть и распустить?" : "Покинуть гильдию?", role === "leader" ? "Ты последний участник: гильдия будет распущена." : "Твой вклад в казну останется гильдии.", "Покинуть", "leave");
      body().querySelector('[data-gs="leave"]').dataset.ok = "1"; return;
    }
    closeSheet();
    if(role === "leader") return disband();
    const donated = +(myMember() || {}).donated || 0, gid = S.guildId;
    await glog(S.name + " покинул гильдию");
    if(donated) await gRef(gid).update({spent:(+gCur.spent || 0) - donated});

    if(!b.dataset.ok){ confirmSheet("Распустить гильдию?", "Все участники будут исключены, казна пропадёт. Это нельзя отменить.", "Распустить", "disband"); body().querySelector('[data-gs="disband"]').dataset.ok = "1"; return; }
    closeSheet(); return disband();

NET.ready = new Promise(r => NET._ready = r);
window.NET_GOD = false; window.NET_ADMIN = false;

(() => {
  const TG = window.Telegram && window.Telegram.WebApp;
  if(!TG || !TG.initData) return;

  NET.on = true;
  const api = NET.api = (path, body) => fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({initData, ...(body || {})})})
    .then(r => r.ok ? r.json() : r.text().then(t => ({ok:false, error:t})));

  // ---- сохранения ----
  let lastPushed = "";
  function snapshot(){ return {S, W:Wl, ts:S._ts || 0, bm:combatPower()}; }
  async function push(force){
    const js = JSON.stringify(snapshot());
    if(!force && js === lastPushed) return;
    S._ts = Date.now(); save();
    const data = snapshot(); lastPushed = JSON.stringify(data);
    try{ await api("/api/state/save", {data}); }catch(e){ lastPushed = ""; }
  }
  setInterval(() => push(false), 10000);
  document.addEventListener("visibilitychange", () => { if(document.hidden) push(true); });

  // ---- выдачи от администратора ----
  const GRANT_NAME = {scrap:"лома", cores:"ядер", exp:"опыта", level:"уровней"};
  function applyGrant(g){

    else if(g.kind === "exp"){ S.exp += a; levelUps(); toast("Администратор выдал " + a + " опыта"); }

    else if(g.kind === "item" && ITEMS[g.payload.item]){
      const it = ITEMS[g.payload.item];
      let got = 0; for(let i = 0; i < a; i++){ if(addItem(S.inv, g.payload.item, 1, INV_MAX, g.payload.grade) || addItem(S.store, g.payload.item, 1, STORE_MAX, g.payload.grade)) got++; }
      toast("Администратор выдал: " + it.name + (it.type === "gear" ? " (" + GRADES[g.payload.grade].name.toLowerCase() + ")" : "") + (got > 1 ? " ×" + got : "") + (got < a ? ". Не хватило места" : ""));
    }

    api("/api/grants/ack", {ids:[g.id]});
  }

  // ---- вход ----
  api("/api/state/load").then(r => {
    if(!r || !r.ok){ NET._ready(); return; }
    // база на сервере была сброшена: очищаем прогресс на телефоне и начинаем заново
    if(r.epoch && localStorage.getItem("mw-epoch") !== r.epoch){
      ["mw-save-v2", "mw-wallet", "mw-localdb", "mw-demo"].forEach(k => localStorage.removeItem(k));
      localStorage.setItem("mw-epoch", r.epoch); sessionStorage.removeItem("mw-synced");
      location.reload(); return;
    }
    NET.admin = window.NET_ADMIN = !!r.admin; NET.id = r.tg.id; NET._ready();
    const srv = r.save;
    // на сервере прогресс новее (например, с другого телефона) — берём его
    if(srv && srv.S && (srv.ts || 0) > (S._ts || 0) && !sessionStorage.getItem("mw-synced")){
      try{
        localStorage.setItem("mw-save-v2", JSON.stringify({...srv.S, _ts:srv.ts}));
        if(srv.W) localStorage.setItem("mw-wallet", JSON.stringify(srv.W));
        sessionStorage.setItem("mw-synced", "1"); location.reload(); return;
      }catch(e){}
    }
    if(!srv) push(true);
    (r.grants || []).forEach(applyGrant);
    if(NET.admin){ $("adminBtn").hidden = false; }
    connect();
  }).catch(() => NET._ready());

  // ---- живой мир ----
  let retry = 1000;
  function connect(){
    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    NET.ws = ws;
    ws.onopen = () => { retry = 1000; ws.send(JSON.stringify({t:"auth", initData})); };
    ws.onmessage = ev => {
      let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
      if(d.t === "hello"){
        NET.admin = window.NET_ADMIN = !!d.admin; NET.id = d.id;
        chatUid = String(d.id); chatDb = null;

      } else if(d.t === "players"){
        if(d.loc !== locKey){ NET.others.clear(); return; }
        const seen = new Set();
        for(const o of d.list || []){
          seen.add(o.id);
          const cur = NET.others.get(o.id);
          if(cur) Object.assign(cur, o); else NET.others.set(o.id, {...o, rx:o.x, ry:o.y});
        }
        for(const id of [...NET.others.keys()]) if(!seen.has(id)) NET.others.delete(id);
      } else if(d.t === "chat" && d.m && typeof d.m.text === "string"){
        chatShared.push(d.m); if(chatShared.length > 300) chatShared.shift();
        if(!isMine(d.m)) Sfx.play("msg");
        if(d.m.ch === "dm" && d.m.to === S.name && d.m.nick !== S.name && !S.dmList.includes(d.m.nick)) S.dmList.push(String(d.m.nick).slice(0, 16));
        onChatUpdate();
      } else if(d.t === "grant" && d.grant){ applyGrant(d.grant); }
      else if(typeof onNetExtra === "function") onNetExtra(d);
    };
    ws.onclose = () => { NET.ws = null; NET.others.clear(); NET.party = null; if(typeof renderPartyFrames === "function") renderPartyFrames(); setTimeout(connect, retry); retry = Math.min(retry*2, 15000); };
  }

  // своё положение — 8 раз в секунду, пока что-то меняется
  let lastPos = "", lastSent = 0;
  setInterval(() => {
    const ws = NET.ws; if(!ws || ws.readyState !== 1 || !p) return;
    const eq = {}; for(const k in S.eq) if(S.eq[k]) eq[k] = S.eq[k].g;
    const msg = {t:"pos", loc:locKey, x:Math.round(p.x), y:Math.round(p.y), ang:+p.ang.toFixed(2), aim:+p.aim.toFixed(2), moving:p.moving, dead:p.dead,
      nick:S.name, fac:S.faction, lvl:S.level, eq, wpn:S.eq.weapon ? S.eq.weapon.id : "", cls:S.cls || "",
      hp:Math.ceil(S.hp), mhp:stat().maxhp, bm:combatPower(),
      gt:gCur ? gCur.tag : "", gn:gCur ? gCur.name : "", gi:gCur && gCur.emblem ? gCur.emblem.icon : "", gc:gCur && gCur.emblem ? gCur.emblem.color : ""};
    const js = JSON.stringify(msg);
    if(js !== lastPos || Date.now() - lastSent > 2000){ ws.send(js); lastPos = js; lastSent = Date.now(); }
  }, 125);

  // ---- админ-панель ----
  let adm = {kind:"scrap", item:"plasma", grade:3};
  const GEAR_OPTS = Object.keys(ITEMS).filter(k => !ITEMS[k].starter);

        <div class="seg">${[["scrap","Лом"],["cores","Ядра"],["exp","Опыт"],["level","Уровни"]].map(([k, n]) => `<button type="button" data-adm="kind" data-v="${k}" aria-pressed="${adm.kind === k}">${n}</button>`).join("")}</div>
        <div class="chatin" style="margin-bottom:14px"><input class="field" id="admAmt" type="number" min="1" value="${adm.kind === "level" ? 5 : 10000}" style="margin:0"><button class="act" type="button" data-adm="give">Выдать</button></div>
        <div class="flabel">Предмет</div>
        <select class="field" id="admItem">${GEAR_OPTS.map(k => `<option value="${k}" ${adm.item === k ? "selected" : ""}>${ITEMS[k].name}</option>`).join("")}</select>
        <div class="pick">${GRADES.map((g, i) => `<button type="button" data-adm="grade" data-v="${i}" aria-pressed="${adm.grade === i}" aria-label="${g.name}"><span class="sw2" style="background:${g.color}"></span></button>`).join("")}</div>
        <button class="btn pri wide" type="button" data-adm="item">Выдать предмет</button>
        <div class="set" style="margin-top:8px"><div class="tx">Бессмертие<small>Только для тебя, пока открыта игра</small></div><button class="sw" type="button" role="switch" data-adm="god" aria-checked="${NET.god}" aria-label="Бессмертие"></button></div>
        <div class="flabel" style="margin-top:6px">Телепорт без ограничений по уровню</div>
        <div class="seg" style="flex-wrap:wrap">${Object.entries(LOCS).map(([k, L]) => `<button type="button" data-adm="tp" data-v="${k}">${L.name}</button>`).join("")}</div>
        <p class="demo">GRAM выдавать нельзя: это настоящие деньги, их можно только пополнить.</p>`;

  async function admGrant(payload){

// ---- другие пилоты на карте ----
function drawOthers(t, dt){
  if(!NET.others.size) return;
  for(const o of NET.others.values()){
    if(o.dead) continue;
    const k = Math.min(1, (dt || 0.016)*10);
    o.rx += (o.x - o.rx)*k; o.ry += (o.y - o.ry)*k;
    const F = FACTIONS[o.fac] || FACTIONS.aegis, eq = o.eq || {}, gc = s => eq[s] !== undefined ? gradeColor(eq[s]) : null;
    ctx.save(); ctx.translate(o.rx, o.ry);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(3, 6, 24, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.rotate(o.ang || 0);
    const off = o.moving ? (t*60) % 8 : 0;
    for(const ty of [-22, 13]){
      ctx.fillStyle = gc("legs") || "#2E3A46"; rr(-20, ty, 40, 9, 3); ctx.fill();
      ctx.strokeStyle = "#1B232C"; ctx.lineWidth = 2; ctx.beginPath(); for(let i = -20 + off; i < 20; i += 8){ ctx.moveTo(i, ty); ctx.lineTo(i, ty+9); } ctx.stroke();
    }
    ctx.fillStyle = F.body; rr(-15, -14, 30, 28, 7); ctx.fill();
    if(gc("armor")){ ctx.strokeStyle = gc("armor"); ctx.lineWidth = 3; rr(-13, -12, 26, 24, 6); ctx.stroke(); }
    ctx.fillStyle = F.color; ctx.fillRect(-15, -3, 5, 6);
    ctx.restore();
    ctx.save(); ctx.rotate(o.aim || 0);
    weaponShape(o.cls, o.wpn, gc("weapon") || F.color, t);
    ctx.fillStyle = F.dark; circle(0, 0, 11); ctx.fill();
    ctx.fillStyle = gc("head") || F.color; rr(3, -6, 5, 12, 2); ctx.fill();
    ctx.restore(); ctx.restore();
    const name = String(o.nick || "Пилот").slice(0, 16);
    const mate = typeof inParty === "function" && inParty(o.id);
    if(typeof tgt !== "undefined" && tgt && tgt.kind === "player" && tgt.id === o.id){ ctx.save(); ctx.strokeStyle = mate ? "rgba(123,201,138,.9)" : "rgba(242,169,59,.9)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]); ctx.lineDashOffset = -t*20; circle(o.rx, o.ry, 30); ctx.stroke(); ctx.restore(); }
    drawNameStack(o.rx, o.ry, (mate ? "◆ " : "") + (o.admin ? "[ADM] " : "") + name + " · " + (+o.lvl || 1), mate ? "#7BC98A" : (o.admin ? "#F2C14B" : F.color),
      o.gt ? {tag:String(o.gt).slice(0, 4), name:String(o.gn || "").slice(0, 20), icon:o.gi, color:o.gc} : null);
  }
}

const CB = {cd:[0,0,0,0], buffs:{}, queue:[], fx:[]};
const CLASS_CHANGE_COST = 100;
// умение на заданном уровне: урон, длительность, радиус, дальность растут, перезарядка падает
function skillAt(s, lv){
  const k = (lv || 1) - 1, o = {...s};
  if(s.mult) o.mult = +(s.mult*(1 + 0.1*k)).toFixed(2);
  if(s.stun) o.stun = +(s.stun + 0.25*k).toFixed(2);
  if(s.v) o.v = +(s.v*(1 + 0.08*k)).toFixed(3);
  if(s.dur) o.dur = +(s.dur + 0.4*k).toFixed(1);
  if(s.radius) o.radius = Math.round(s.radius + 4*k);
  if(s.dist) o.dist = Math.round(s.dist + 8*k);
  o.cd = +(s.cd*(1 - 0.02*k)).toFixed(1);
  return o;
}
const buffV = k => { const b = CB.buffs[k]; return b && b.t > 0 ? b.v : 0; };

function hitEnemy(e, dmg, kind){
  if(!e || e.dead) return;
  const C = classParams();
  if(e.hp/e.max < 0.3){ const ex = stat().execute; if(ex) dmg *= 1 + ex; }
  dmg = Math.max(1, Math.round(dmg));
  e.hp -= dmg; e.flash = 0.12; e.chase = true;
  const col = kind === "crit" ? "#F2C14B" : kind === "aoe" ? "#FFB347" : "#fff";
  addText(e.x + (Math.random()*16-8), e.y - 24, (kind === "crit" ? "КРИТ -" : "-") + dmg, col);
  const a = Math.atan2(e.y - p.y, e.x - p.x);
  if(kind === "melee" || kind === "strike-m" || (kind === "crit" && C.melee)) CB.fx.push({type:"slash", x:e.x - Math.cos(a)*10, y:e.y - Math.sin(a)*10, a, life:.2, max:.2, c:C.color || "#fff"});
  else if(kind !== "aoe") beams.push({x1:p.x + Math.cos(p.aim)*24, y1:p.y + Math.sin(p.aim)*24, x2:e.x, y2:e.y, life:0.12, plasma:kind === "plasma"});
  const st = stat();
  const steal = buffV("steal") + st.steal; if(steal){ S.hp = Math.min(st.maxhp, S.hp + dmg*steal); }
  if(e.hp <= 0 && !e.dead) killEnemy(e);
}

function useSkill(i){
  const C = clsOf(S.cls);
  if(!C){ openClassSheet(); return; }
  if(!p || p.dead || paused || CB.cd[i] > 0) return;
  const st = stat(), s = skillAt(C.skills[i], skillLv(C.skills[i].id)), atk = st.atk*(1 + buffV("atk"))*(1 + st.skillDmg);
  const need = r => { const t = locKey === "lobby" ? null : nearestEnemy(r); if(!t) toast("Нет цели рядом"); return t; };
  switch(s.type){
    case "strike": { const t = need(C.range + 60); if(!t) return;
      hitEnemy(t, atk*s.mult, s.big ? "plasma" : C.melee ? "strike-m" : "beam"); if(s.stun) t.stun = s.stun; break; }
    case "aoe": {
      for(const e of enemies){ if(e.dead) continue; if(Math.hypot(e.x-p.x, e.y-p.y) < s.radius + NPCS[e.type].r){ hitEnemy(e, atk*s.mult, "aoe"); if(s.stun && !e.dead) e.stun = s.stun; } }
      CB.fx.push({type:"ring", x:p.x, y:p.y, r:s.radius, life:.45, max:.45, c:C.color}); break; }
    case "buff": CB.buffs[s.buff] = {v:s.v, t:s.dur, max:s.dur}; addText(p.x, p.y - 44, s.name, C.color); break;
    case "leap": { const t = need(s.dist); if(!t) return;
      const a = Math.atan2(t.y-p.y, t.x-p.x), d = Math.max(0, Math.hypot(t.x-p.x, t.y-p.y) - NPCS[t.type].r - 24);
      CB.fx.push({type:"trail", x1:p.x, y1:p.y, x2:p.x + Math.cos(a)*d, y2:p.y + Math.sin(a)*d, life:.3, max:.3, c:C.color});
      p.x += Math.cos(a)*d; p.y += Math.sin(a)*d; pushOut(p, p.r); p.ang = p.aim = a; p.inv = 0.3;
      hitEnemy(t, atk*s.mult, "strike-m"); break; }
    case "dash": {
      const a = p.ang;
      if(s.instant){
        CB.fx.push({type:"ring", x:p.x, y:p.y, r:34, life:.35, max:.35, c:C.color});
        p.x += Math.cos(a)*s.dist; p.y += Math.sin(a)*s.dist; pushOut(p, p.r);
        CB.fx.push({type:"ring", x:p.x, y:p.y, r:34, life:.35, max:.35, c:C.color});
      } else { p.dashT = s.dist/1150; p.dx = Math.cos(a); p.dy = Math.sin(a); }
      p.inv = 0.3; break; }
    case "volley": {
      const list = enemies.filter(e => !e.dead && Math.hypot(e.x-p.x, e.y-p.y) < C.range + 40).sort((a, b) => Math.hypot(a.x-p.x, a.y-p.y) - Math.hypot(b.x-p.x, b.y-p.y)).slice(0, s.n);
      if(!list.length || locKey === "lobby"){ toast("Нет цели рядом"); return; }
      list.forEach(e => hitEnemy(e, atk*s.mult, "beam")); break; }
    case "burst": { const t = need(C.range + 40); if(!t) return;
      for(let k = 0; k < s.n; k++) CB.queue.push({t:k*0.12, e:t, dmg:atk*s.mult}); break; }
  }
  CB.cd[i] = s.cd*(1 - st.cdr); Sfx.play("crit");
  if(Sfx.haptic) Sfx.haptic("medium");
}

function classUpdate(dt){
  for(let i = 0; i < 4; i++) CB.cd[i] = Math.max(0, CB.cd[i] - dt);
  for(const k in CB.buffs) CB.buffs[k].t -= dt;
  for(const q of CB.queue){ q.t -= dt; if(q.t <= 0 && !q.done){ q.done = true; hitEnemy(q.e, q.dmg, "beam"); Sfx.play("shot"); } }
  CB.queue = CB.queue.filter(q => !q.done);
}

// ---- эффекты на карте ----
function drawClassFx(dt){
  for(const f of CB.fx){
    f.life -= dt; const k = Math.max(0, f.life/f.max);
    ctx.save(); ctx.globalAlpha = k;
    if(f.type === "ring"){ ctx.strokeStyle = f.c; ctx.lineWidth = 6*k + 2; circle(f.x, f.y, f.r*(1.1 - k*0.5)); ctx.stroke(); ctx.globalAlpha = k*0.15; ctx.fillStyle = f.c; circle(f.x, f.y, f.r*(1.1 - k*0.5)); ctx.fill(); }
    else if(f.type === "slash"){ ctx.strokeStyle = f.c; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(f.x, f.y, 22, f.a - 1.1 + (1-k)*0.6, f.a + 0.5 + (1-k)*0.6); ctx.stroke(); }
    else if(f.type === "trail"){ ctx.strokeStyle = f.c; ctx.lineWidth = 10*k; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); }
    ctx.restore();
  }
  CB.fx = CB.fx.filter(f => f.life > 0);
}
const BUFF_COLOR = {def:"#5FD4E8", atk:"#E0694A", rate:"#7BC98A", steal:"#9B7BFF"};
function drawBuffAura(x, y, t){
  let i = 0;
  for(const k in CB.buffs){ if(CB.buffs[k].t <= 0) continue;
    ctx.save(); ctx.strokeStyle = BUFF_COLOR[k]; ctx.globalAlpha = .55 + Math.sin(t*6 + i)*.2; ctx.lineWidth = 3;
    ctx.setLineDash([10, 6]); ctx.lineDashOffset = -t*30*(i % 2 ? -1 : 1); circle(x, y, 30 + i*6); ctx.stroke(); ctx.restore(); i++; }
}

// оружие на башне зависит от класса: щит, клинки, длинный ствол или излучатель
function weaponShape(cls, wpn, tip, t){
  if(cls === "guard"){
    ctx.fillStyle = "#56616D"; rr(4, -4, 12, 8, 2); ctx.fill();
    ctx.strokeStyle = tip; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(8, 0, 16, -0.9, 0.9); ctx.stroke();
  } else if(cls === "reaper"){
    ctx.strokeStyle = tip; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(6, -7); ctx.lineTo(28, -15); ctx.moveTo(6, 7); ctx.lineTo(28, 15); ctx.stroke();
    ctx.strokeStyle = "#2E3A46"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(6, -7); ctx.lineTo(14, -10); ctx.moveTo(6, 7); ctx.lineTo(14, 10); ctx.stroke();
  } else if(cls === "sniper"){
    ctx.fillStyle = "#2E3A46"; rr(4, -2.5, 34, 5, 2); ctx.fill(); rr(10, -6, 10, 4, 1); ctx.fill();
    ctx.fillStyle = tip; ctx.fillRect(36, -2.5, 4, 5);
  } else if(cls === "techno"){
    ctx.fillStyle = "#2E3A46"; rr(4, -2.5, 13, 5, 2); ctx.fill();
    ctx.fillStyle = tip; ctx.globalAlpha = .6 + Math.sin(t*6)*.3; circle(21, 0, 6); ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = tip; ctx.lineWidth = 1.5; circle(21, 0, 9); ctx.stroke();
  } else {
    const bl = wpn === "plasma" ? 28 : wpn === "laser2" ? 25 : 22;
    ctx.fillStyle = "#2E3A46"; rr(4, -3.5, bl, 7, 2); ctx.fill();
    ctx.fillStyle = tip; ctx.fillRect(bl, -3.5, 4, 7);
  }
}

// Каждая иконка — картинка 64×64: фон с глубиной и фактурой, объёмный металл, светящаяся энергия,
// блик и рамка со скосом. Цвета берутся из цвета класса.
let iconSeq = 0;
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v*k))); return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, "0")).join(""); }
function mix(hex, to, t){ const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16); const ch = s => Math.round(((a >> s) & 255)*(1-t) + ((b >> s) & 255)*t); return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join(""); }

// ===================== РЕЙТИНГ ПО БОЕВОЙ МОЩИ =====================
// В боте рейтинг считает сервер по сохранениям всех игроков.
// В превью — по участникам гильдий из общего хранилища и тебе.
let topTab = "players", topData = {players:null, guilds:null}, topLoading = false;
const fmtBM = n => (+n || 0).toLocaleString("ru-RU");
const CLS_NAME = id => CLASSES[id] ? CLASSES[id].name : "";

async function loadTop(kind){
  if(typeof NET !== "undefined" && NET.on && NET.id){
    const r = await NET.api("/api/top", {kind});
    if(r && r.ok) return r;
    throw new Error("top");
  }
  // запасной вариант без сервера
  const myBM = combatPower();
  if(!GDB) return {items:[], me:{}};
  const gs = (await GDB.collection("guilds").get()).docs.map(d => ({id:d.id, ...d.data()}));
  const players = new Map(), guilds = [];
  for(const g of gs){
    const ms = (await GDB.collection("guilds/" + g.id + "/members").get()).docs.map(d => d.data());
    for(const m of ms){ if(m.uid === gUid) m.bm = myBM; players.set(m.uid, {id:m.uid, nick:m.nick, lvl:m.lvl, cls:m.cls || (m.uid === gUid ? S.cls : ""), bm:+m.bm || 0, tag:g.tag}); }
    guilds.push({id:g.id, name:g.name, tag:g.tag, emblem:g.emblem, level:g.level, count:ms.length, bm:ms.reduce((a, m) => a + (+m.bm || 0), 0)});
  }
  if(!players.has(gUid)) players.set(gUid, {id:gUid, nick:S.name, lvl:S.level, cls:S.cls, bm:myBM, tag:""});
  const me = players.get(gUid); me.cls = S.cls; me.nick = S.name; me.lvl = S.level;
  if(kind === "players"){
    const items = [...players.values()].sort((a, b) => b.bm - a.bm);
    return {items, me:{rank:items.findIndex(x => x.id === gUid) + 1, bm:myBM}};
  }
  guilds.sort((a, b) => b.bm - a.bm);
  return {items:guilds, me:{rank:S.guildId ? guilds.findIndex(g => g.id === S.guildId) + 1 : null, id:S.guildId}};
}

async function refreshTop(){
  if(topLoading) return; topLoading = true; renderTop();
  try{ topData[topTab] = await loadTop(topTab); }catch(e){ topData[topTab] = {error:true}; }
  topLoading = false; renderTop();
}

const medal = r => r <= 3 ? `<span class="rk m${r}">${r}</span>` : `<span class="rk">${r}</span>`;
function renderTop(){
  const el = $("scrTop"), d = topData[topTab], myId = (typeof NET !== "undefined" && NET.id) ? String(NET.id) : gUid;
  let list = "";
  if(topLoading && !d) list = `<div class="empty">Загружаем рейтинг…</div>`;
  else if(!d || d.error) list = `<div class="empty">Не получилось загрузить рейтинг<small>Проверь связь и обнови</small></div>`;
  else if(!d.items.length) list = `<div class="empty">Рейтинг пока пуст</div>`;
  else if(topTab === "players"){
    list = d.items.map((it, i) => {
      const me = String(it.id) === String(myId), C = CLASSES[it.cls];
      return `<div class="trow ${me ? "me" : ""}">${medal(i + 1)}<div class="tx"><b data-notr style="color:${C ? C.color : "var(--text)"}">${it.tag ? "[" + esc(it.tag) + "] " : ""}${esc(it.nick || "Пилот")}</b><small>${C ? C.name + " · " : ""}ур. ${+it.lvl || 1}</small></div><div class="bm">${fmtBM(it.bm)}<small>БМ</small></div></div>`;
    }).join("");

  el.innerHTML = `<div class="ghead"><h1>Рейтинг</h1><button class="act alt" type="button" data-top="refresh" ${topLoading ? "disabled" : ""}>Обновить</button></div>
    <section class="pcard bmcard"><small>Твоя боевая мощь</small><b>${fmtBM(combatPower())}</b><span>Растёт от уровня, класса и снаряжения</span></section>
    <div class="seg"><button type="button" data-top="players" aria-pressed="${topTab === "players"}">Игроки</button><button type="button" data-top="guilds" aria-pressed="${topTab === "guilds"}">Гильдии</button></div>
    ${mine}<div class="tlist">${list}</div>
    <p class="demo">${topTab === "players" ? "Топ-100 пилотов по боевой мощи." : "Сила гильдии — сумма боевой мощи всех её участников."}</p>`;
}

  if(b.dataset.nick === "dice"){ $("nickNew").value = randomNick(); $("nickHint").textContent = "3–16 символов: буквы, цифры, пробел, _ или -"; $("nickHint").style.color = ""; return; }
  const name = $("nickNew").value.replace(/\s+/g, " ").trim();
  b.disabled = true;
  const r = await reserveName(name);
  b.disabled = false;
  if(!r.ok){ $("nickHint").textContent = r.error; $("nickHint").style.color = "var(--rust)"; Sfx.play("hit"); return; }
  S.name = name; S.nameChosen = true; save();
  window.sheetLock = false; $("shClose").hidden = false; closeSheet();
  toast("Добро пожаловать, " + name + "!"); Sfx.play("level");
  if(!S.cls) setTimeout(openClassSheet, 350);
});

// первый вход: сначала имя, потом класс
setTimeout(() => {
  if($("scrGame").hidden || $("sheet").classList.contains("open")) return;
  if(!S.nameChosen) openNameSheet(); else if(!S.cls) openClassSheet();
}, 1300);
// ===================== ПЕРСОНАЖ: УЛУЧШЕНИЯ И НАВЫКИ =====================
let cTab = "gear", skTab = "active";
function charTabsHtml(){
  return `<div class="ctabs">${[["gear","Снаряжение"],["up","Улучшения"],["sk","Навыки"]].map(([k, n]) => `<button type="button" data-ctab="${k}" aria-pressed="${cTab === k}">${n}${k !== "gear" && ptsFree() > 0 ? `<i>${ptsFree()}</i>` : ""}</button>`).join("")}</div>`;
}
function renderChar(){
  if(cTab === "gear") return renderGearTab();
  $("scrChar").innerHTML = charTabsHtml() + (cTab === "up" ? upgradesView() : skillsView());
}
const fmtN = v => (Math.round(v*100)/100).toLocaleString("ru-RU");
function pointsCard(extra){
  return `<section class="pcard ptscard"><div><small>Очки навыка</small><b>${ptsFree()}</b></div>
    <div class="ptsmeta">Получено за уровни: ${ptsTotal()}<br>Лом ${S.scrap} · Ядра ${S.cores}</div></section>${extra || ""}`;
}

// ---- улучшения ----
function upgradesView(){
  const st = stat(), C = classParams();
  const cards = [["Прочность", st.maxhp], ["Атака", st.atk], ["Броня", st.def], ["Атак/сек", (C.rate*st.rate).toFixed(2)], ["Шанс крита", st.crit + "%"], ["Сила крита", "×" + st.critPow.toFixed(2)], ["Регенерация", fmtN(st.regen) + "/с"], ["БМ", combatPower().toLocaleString("ru-RU")]];
  let h = pointsCard(`<section class="pcard"><div class="upstats">${cards.map(([n, v]) => `<div><b>${v}</b>${n}</div>`).join("")}</div></section>`);
  h += `<section class="pcard"><h3>Улучшения</h3><div class="uplist">`;
  for(const u of UPGRADES){
    const lv = S.up[u.id] || 0, max = lv >= UP_MAX, cost = upCostScrap(u, lv), can = !max && ptsFree() >= 1 && S.scrap >= cost;
    h += `<div class="uprow"><div class="tx"><b>${u.name}</b><small>Ур. ${lv}/${UP_MAX} · сейчас +${fmtN(u.per*lv)}${u.unit}</small><small class="muted">${u.desc}</small></div>
      <button class="upbtn" type="button" data-up="${u.id}" ${can ? "" : "disabled"}>${max ? "Макс." : `<span>${cost} лома</span><span>+ 1 ОН</span>`}</button></div>`;
  }
  const back = S.ptsUp;
  h += `</div><button class="btn wide" type="button" data-reset="up" style="margin-top:12px" ${back ? "" : "disabled"}>Сбросить улучшения · ${RESET_COST_CORES} ядра</button>
    <p class="hint" style="text-align:center">Вернётся очков навыка: ${back}. Потраченный лом не возвращается.</p></section>`;
  return h;
}

// ---- умения: полное описание ----
const pct = v => Math.round(v*100) + "%";
function skillType(s){
  if(s.type === "buff") return "Усиление";
  if(s.type === "dash") return "Перемещение";
  if(s.type === "leap") return "Урон · перемещение";
  return s.stun ? "Урон · контроль" : "Урон";
}
function skillText(s){
  switch(s.type){
    case "strike": return (s.big ? "Плазменный снаряд" : "Удар по цели") + `: ${pct(s.mult)} атаки` + (s.stun ? ` · оглушение ${s.stun} сек` : "");
    case "aoe": return `Урон по области (радиус ${s.radius}): ${pct(s.mult)} атаки` + (s.stun ? ` · оглушение ${s.stun} сек` : "");
    case "buff": return ({def:"Броня", atk:"Атака", rate:"Скорость атаки"}[s.buff] ? `${({def:"Броня", atk:"Атака", rate:"Скорость атаки"})[s.buff]} +${pct(s.v)}` : `Вампиризм ${pct(s.v)} от урона`) + ` · длительность ${s.dur} сек`;
    case "leap": return `Прыжок к цели (до ${s.dist}) и удар: ${pct(s.mult)} атаки`;
    case "dash": return (s.instant ? "Телепорт вперёд на " : "Рывок вперёд на ") + s.dist + " · неуязвимость 0,3 сек";
    case "volley": return `Выстрел по ${s.n} целям: ${pct(s.mult)} атаки каждой`;
    case "burst": return `Очередь из ${s.n} выстрелов: ${pct(s.mult)} атаки каждый`;
  }
  return "";
}
function skillDiff(a, b){
  const out = [];
  if(a.mult !== b.mult) out.push(`Урон ${pct(a.mult)} → ${pct(b.mult)}`);
  if(a.stun !== b.stun && a.stun) out.push(`Оглушение ${a.stun} → ${b.stun} сек`);
  if(a.v !== b.v) out.push(`Сила ${pct(a.v)} → ${pct(b.v)}`);
  if(a.dur !== b.dur) out.push(`Длительность ${a.dur} → ${b.dur} сек`);
  if(a.radius !== b.radius) out.push(`Радиус ${a.radius} → ${b.radius}`);
  if(a.dist !== b.dist) out.push(`Дальность ${a.dist} → ${b.dist}`);
  if(a.cd !== b.cd) out.push(`Перезарядка ${fmtN(a.cd)} → ${fmtN(b.cd)} сек`);
  return out;
}
const pips = (lv, max) => `<div class="pips">${Array.from({length:max}, (_, i) => `<i class="${i < lv ? "on" : ""}"></i>`).join("")}</div>`;
const costTxt = c => [c.pts ? c.pts + " ОН" : "", c.scrap ? c.scrap + " лома" : "", c.cores ? c.cores + " ядра" : ""].filter(Boolean).join(" + ");
const canPay = c => ptsFree() >= c.pts && S.scrap >= c.scrap && S.cores >= c.cores;

function skillsView(){
  let h = pointsCard(`<div class="seg"><button type="button" data-sktab="active" aria-pressed="${skTab === "active"}">Активные</button><button type="button" data-sktab="passive" aria-pressed="${skTab === "passive"}">Пассивные</button></div>`);
  const C = clsOf(S.cls);
  if(skTab === "active"){
    if(!C) return h + `<section class="pcard"><div class="empty">Класс не выбран<small>Класс даёт умения и меняет характеристики</small></div><button class="btn pri wide" type="button" data-cchange="1">Выбрать</button></section>`;
    h += `<p class="hint" style="margin:0">Умения класса «${C.name}». Каждый уровень усиливает эффект и сокращает перезарядку на 2%.</p>`;
    for(const base of C.skills){
      const lv = skillLv(base.id), cur = skillAt(base, lv), nxt = lv < SKILL_MAX ? skillAt(base, lv + 1) : null, cost = skillCost(lv);
      h += `<section class="pcard skcard"><div class="skhead"><div class="skic">${skillIcon(base, C.color)}</div>
        <div class="tx"><b>${base.name}</b><small style="color:${C.color}">${skillType(base)} · Ур. ${lv}/${SKILL_MAX}</small>${pips(lv, SKILL_MAX)}</div></div>
        <p class="sklore">${base.lore}</p>
        <div class="skeff">${skillText(cur)}</div>
        <div class="skmeta">Перезарядка: ${fmtN(cur.cd*(1 - stat().cdr))} сек</div>
        ${nxt ? `<div class="sknext"><small>На следующем уровне</small>${skillDiff(cur, nxt).map(t => `<span>${t}</span>`).join("")}</div>
          <button class="upbtn wide" type="button" data-sk="${base.id}" ${canPay(cost) ? "" : "disabled"}>Улучшить · ${costTxt(cost)}</button>` : `<div class="sknext"><small>Максимальный уровень</small></div>`}
      </section>`;
    }
  } else {
    const own = C ? PASSIVES.filter(p => p.cls === S.cls) : [], common = PASSIVES.filter(p => !p.cls);
    const row = p => {
      const lv = S.pas[p.id] || 0, cost = pasCost(p, lv), max = lv >= PAS_MAX, col = p.cls ? CLASSES[p.cls].color : "#F2C14B";
      return `<div class="pasrow ${lv ? "" : "locked"}"><div class="pasic" style="--c:${col}">${passiveIcon(p.id, col)}</div>
        <div class="tx"><b>${p.name}</b> <em>${lv ? "Ур. " + lv + "/" + PAS_MAX : "🔒 Не изучен"}</em>
        <small>${p.desc}</small>${lv ? `<small class="now">Сейчас: ${p.sign || "+"}${fmtN(p.per*lv)}${p.unit}</small>` : ""}${lv ? pips(lv, PAS_MAX) : ""}
        <button class="upbtn wide" type="button" data-pas="${p.id}" ${!max && canPay(cost) ? "" : "disabled"}>${max ? "Максимальный уровень" : (lv ? "Улучшить" : "Изучить") + " · " + costTxt(cost)}</button></div></div>`;
    };
    if(C) h += `<section class="pcard"><h3 style="color:${C.color}">Классовые: ${C.name}</h3><div class="paslist">${own.map(row).join("")}</div></section>`;
    else h += `<section class="pcard"><div class="empty">Классовые пассивные откроются после выбора класса</div></section>`;
    h += `<section class="pcard"><h3>Общие</h3><p class="hint" style="margin:-4px 0 10px">Изучение общего навыка: 2 ОН + 2 ядра. Классовые изучаются за 1 ОН.</p><div class="paslist">${common.map(row).join("")}</div></section>`;
  }
  h += `<button class="btn wide" type="button" data-reset="sk" ${S.ptsSk ? "" : "disabled"}>Сбросить навыки · ${RESET_COST_CORES} ядра</button>
    <p class="hint" style="text-align:center">Вернётся очков навыка: ${S.ptsSk}. Лом и ядра не возвращаются.</p>`;
  return h;
}

// ---- покупка ----
$("scrChar").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  const d = b.dataset;
  if(d.ctab){ cTab = d.ctab; Sfx.play("ui"); }
  else if(d.sktab){ skTab = d.sktab; Sfx.play("ui"); }
  else if(d.up){
    const u = UPGRADES.find(x => x.id === d.up), lv = S.up[u.id] || 0, cost = upCostScrap(u, lv);
    if(lv >= UP_MAX || ptsFree() < 1 || S.scrap < cost) return;
    S.scrap -= cost; S.up[u.id] = lv + 1; S.ptsUp++; Sfx.play("pick"); toast(u.name + ": ур. " + (lv + 1));
  }
  else if(d.sk){
    const lv = skillLv(d.sk), c = skillCost(lv);
    if(lv >= SKILL_MAX || !canPay(c)) return;
    S.scrap -= c.scrap; S.cores -= c.cores; S.skl[d.sk] = lv + 1; S.ptsSk += c.pts; Sfx.play("level");
    renderSkillButtons();
  }
  else if(d.pas){
    const p = PASSIVES.find(x => x.id === d.pas), lv = S.pas[p.id] || 0, c = pasCost(p, lv);
    if(lv >= PAS_MAX || !canPay(c)) return;
    S.scrap -= c.scrap; S.cores -= c.cores; S.pas[p.id] = lv + 1; S.ptsSk += c.pts; Sfx.play(lv ? "pick" : "level");
    toast((lv ? "Улучшено: " : "Изучено: ") + p.name);
  }
  else if(d.reset){
    if(S.cores < RESET_COST_CORES){ toast("Нужно " + RESET_COST_CORES + " ядра"); return; }
    S.cores -= RESET_COST_CORES;
    if(d.reset === "up"){ S.up = {}; S.ptsUp = 0; toast("Улучшения сброшены"); }
    else { S.skl = {}; S.pas = {}; S.ptsSk = 0; renderSkillButtons(); toast("Навыки сброшены"); }
  }
  else return;
  S.hp = Math.min(S.hp, stat().maxhp); save(); renderChar();
});
// ===================== ТАРГЕТ, ПАТИ, ПОДХИЛ =====================
let tgt = null;                 // {kind:"enemy", e} | {kind:"player", id}
let healCd = 0;
const HEAL_CD = 12, HEAL_RANGE = 350;
if(typeof NET !== "undefined") NET.party = null;

function lockedEnemy(){ return tgt && tgt.kind === "enemy" && !tgt.e.dead && enemies.includes(tgt.e) ? tgt.e : null; }
function tgtPlayer(){ return tgt && tgt.kind === "player" && typeof NET !== "undefined" ? NET.others.get(tgt.id) || null : null; }
const inParty = id => typeof NET !== "undefined" && NET.party && NET.party.members.some(m => m.id === id);
const partyLeader = () => typeof NET !== "undefined" && NET.party ? NET.party.leader : null;
const netSend = o => { if(typeof NET !== "undefined" && NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(o)); return true; } return false; };

// нажатие на робота или врага выбирает цель
function tryTarget(ev){
  const r = gameEl.getBoundingClientRect();
  const wx = (window.camX || 0) + ev.clientX - r.left, wy = (window.camY || 0) + ev.clientY - r.top;
  let best = null, bd = 40;
  for(const e of enemies){ if(e.dead) continue; const d = Math.hypot(e.x - wx, e.y - wy) - NPCS[e.type].r*0.5; if(d < bd){ bd = d; best = {kind:"enemy", e}; } }
  if(typeof NET !== "undefined") for(const o of NET.others.values()){ if(o.dead) continue; const d = Math.hypot(o.rx - wx, o.ry - wy) - 8; if(d < bd){ bd = d; best = {kind:"player", id:o.id}; } }
  if(!best) return false;
  tgt = best; renderTargetFrame(); Sfx.play("ui");
  if(Sfx.haptic) Sfx.haptic("light");
  return true;
}
function clearTarget(){ tgt = null; renderTargetFrame(); }
$("tfClose").addEventListener("click", clearTarget);

// ---- рамка цели ----
function renderTargetFrame(){
  const f = $("tframe");
  if(!tgt){ f.hidden = true; return; }
  f.hidden = false;
  const acts = $("tfActs"); acts.innerHTML = "";
  if(tgt.kind === "enemy"){
    const k = NPCS[tgt.e.type];
    $("tfName").textContent = k.name; $("tfName").style.color = "#E0694A";
    $("tfSub").textContent = "Враг · атака " + k.atk + (k.ranged ? " · дальний бой" : " · ближний бой");
    $("tfIc").innerHTML = `<svg viewBox="0 0 24 24" fill="#E0694A"><path d="M12 2a8 8 0 0 0-8 8c0 3 1.5 5 3 6v3h10v-3c1.5-1 3-3 3-6a8 8 0 0 0-8-8zM9 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>`;
    return;
  }
  const o = tgtPlayer(); if(!o){ clearTarget(); return; }
  const C = CLASSES[o.cls], F = FACTIONS[o.fac] || FACTIONS.aegis, mate = inParty(o.id);
  $("tfName").textContent = (o.gt ? "[" + o.gt + "] " : "") + (o.nick || "Пилот");
  $("tfName").style.color = mate ? "#7BC98A" : (C ? C.color : F.color);
  $("tfSub").textContent = (C ? C.name + " · " : "") + "ур. " + (+o.lvl || 1) + (mate ? " · в пати" : "");
  $("tfIc").innerHTML = `<svg viewBox="0 0 210 230">${robotSVG(o.fac || "aegis", {})}</svg>`;
  const btn = (act, text, dis) => `<button type="button" data-tf="${act}" ${dis ? "disabled" : ""}>${text}</button>`;
  let h = btn("info", "Инфо");
  if(mate) h += btn("heal", "Подхил", healCd > 0);
  else if(NET.on && (!NET.party || (partyLeader() === NET.id && NET.party.members.length < 4))) h += btn("invite", "В пати");
  h += btn("dm", "ЛС");
  acts.innerHTML = h;
}
function targetTick(dt){
  healCd = Math.max(0, healCd - dt);
  if(!tgt) return;
  let hp = 1, mhp = 1;
  if(tgt.kind === "enemy"){ if(!lockedEnemy()){ clearTarget(); return; } hp = tgt.e.hp; mhp = tgt.e.max; }
  else { const o = tgtPlayer(); if(!o){ clearTarget(); return; } hp = +o.hp || 0; mhp = +o.mhp || 1; }
  $("tfHp").style.width = Math.max(0, Math.min(100, hp/mhp*100)) + "%";
  $("tfHpTxt").textContent = Math.ceil(Math.max(0, hp)) + " / " + Math.ceil(mhp);
  const hb = $("tfActs").querySelector('[data-tf="heal"]');
  if(hb){ const dis = healCd > 0; if(hb.disabled !== dis) hb.disabled = dis; const t = dis ? "Подхил " + Math.ceil(healCd) : "Подхил"; if(hb.textContent !== t) hb.textContent = t; }
}
$("tfActs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tf]"); if(!b || b.disabled) return;
  const o = tgtPlayer(); if(!o) return;
  const a = b.dataset.tf;
  if(a === "info") playerInfoSheet(o);
  else if(a === "invite"){ if(!netSend({t:"pinv", to:o.id})) toast("Пати работает в игре через бота"); }
  else if(a === "dm"){ openChat(); openDm(o.nick); }
  else if(a === "heal"){
    if(Math.hypot(o.rx - p.x, o.ry - p.y) > HEAL_RANGE){ toast("Подойди ближе к союзнику"); return; }
    const amount = 20 + 5*S.level;
    if(netSend({t:"heal", to:o.id, amount})){
      healCd = HEAL_CD;
      CB.fx.push({type:"trail", x1:p.x, y1:p.y, x2:o.rx, y2:o.ry, life:.5, max:.5, c:"#7BC98A"});
      addText(o.rx, o.ry - 40, "+" + amount, "#7BC98A"); Sfx.play("pick");
    }
  }
});

function playerInfoSheet(o){
  const C = CLASSES[o.cls], eq = o.eq || {};
  openSheet(o.nick || "Пилот", (C ? C.name + " · " : "") + "ур. " + (+o.lvl || 1), () => {
    body().innerHTML = `<div class="pinfo"><div class="pinfo-av"><svg viewBox="0 0 210 230">${robotSVG(o.fac || "aegis", Object.fromEntries(Object.entries(eq).map(([k, g]) => [k, {id:"", g}])))}</svg></div>
      <div class="pinfo-tx">
        ${o.gt ? `<div><small>Гильдия</small><b data-notr>[${esc(o.gt)}] ${esc(o.gn || "")}</b></div>` : ""}
        <div><small>Боевая мощь</small><b style="color:#F2C14B">${(+o.bm || 0).toLocaleString("ru-RU")}</b></div>
        <div><small>Прочность</small><b>${Math.ceil(+o.hp || 0)} / ${Math.ceil(+o.mhp || 0)}</b></div>
        ${inParty(o.id) ? `<div><small>Статус</small><b style="color:#7BC98A">В твоей пати</b></div>` : ""}
      </div></div>
      <h3 style="margin:14px 0 8px;font:15px 'Russo One',sans-serif">Снаряжение</h3>
      <div class="pinfo-eq">${Object.keys(SLOT_NAME).map(s => `<div style="border-color:${eq[s] !== undefined ? gradeColor(eq[s]) : "var(--line)"}"><small>${SLOT_NAME[s]}</small><b style="color:${eq[s] !== undefined ? gradeColor(eq[s]) : "var(--muted)"}">${eq[s] !== undefined ? GRADES[eq[s]].name : "пусто"}</b></div>`).join("")}</div>`;
  });
}

// ---- пати ----
function onNetExtra(d){
  if(d.t === "pinv" && d.from){
    const box = $("pinvite");
    $("pinvText").textContent = String(d.from.nick || "Пилот").slice(0, 16) + " (ур. " + (+d.from.lvl || 1) + ") зовёт в пати";

}

});

// ===================== ЯЗЫКИ =====================
// Интерфейс пишется по-русски, а здесь фразы подменяются на выбранный язык:
// в тексте страницы, подсказках полей, уведомлениях и надписях на карте.
// Сообщения игроков, ники и названия гильдий помечены data-notr и не переводятся.
const LANG_IDX = {en:0, uk:1, es:2, tr:3, pt:4};
let LANG = "ru", trRe = null;
const trMemo = new Map();
const CYR = /[А-Яа-яЁёЇїІіЄєҐґ]/;
function buildTrRe(){
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const keys = Object.keys(I18N).sort((a, b) => b.length - a.length);
  const mk = lb => new RegExp(keys.map(k => (lb && /^[\p{L}\p{N}]/u.test(k) ? "(?<![\\p{L}\\p{N}])" : "") + esc(k) + (/[\p{L}\p{N}]$/u.test(k) ? "(?![\\p{L}\\p{N}])" : "")).join("|"), "gu");
  try{ trRe = mk(true); }catch(e){ trRe = mk(false); }   // старые iPhone без lookbehind
}
function T(s){
  if(LANG === "ru" || !s || typeof s !== "string" || !CYR.test(s)) return s;
  const hit = trMemo.get(s); if(hit !== undefined) return hit;
  const i = LANG_IDX[LANG], trim = s.trim();
  let out;
  if(I18N[trim]) out = s.replace(trim, I18N[trim][i]);
  else out = s.replace(trRe, m => I18N[m] ? I18N[m][i] : m);
  if(trMemo.size > 3000) trMemo.clear();
  trMemo.set(s, out); return out;
}

// ---- перевод страницы ----
const trOrig = new WeakMap(), trDone = new WeakMap();
const skip = el => !el || el.closest("[data-notr],script,style,textarea");
function trText(n){
  if(skip(n.parentElement)) return;
  const cur = n.data;
  if(trDone.get(n) === cur) return;
  trOrig.set(n, cur);
  const t = T(cur); trDone.set(n, t); if(t !== cur) n.data = t;
}
const TR_ATTRS = ["placeholder", "aria-label", "title"];
function trAttrs(el){
  if(!el || el.closest("[data-notr],script,style")) return;
  for(const a of TR_ATTRS){
    if(!el.hasAttribute(a)) continue;
    const v = el.getAttribute(a);
    if(el.getAttribute("data-t-" + a) !== v) el.setAttribute("data-o-" + a, v);
    const t = T(el.getAttribute("data-o-" + a) || v);
    el.setAttribute("data-t-" + a, t); if(t !== v) el.setAttribute(a, t);
  }
}
function trTree(root){
  if(root.nodeType === 3){ trText(root); return; }
  if(root.nodeType !== 1) return;
  trAttrs(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n; while((n = w.nextNode())){ if(n.nodeType === 3) trText(n); else trAttrs(n); }
}
new MutationObserver(list => {
  if(LANG === "ru" && !trAll.pending) return;
  for(const m of list){
    if(m.type === "characterData") trText(m.target);
    else if(m.type === "attributes") trAttrs(m.target);
    else m.addedNodes.forEach(trTree);
  }
}).observe(document.body, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:TR_ATTRS});

function trAll(){
  trMemo.clear();
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){
    if(trOrig.has(n) && trDone.get(n) === n.data) n.data = trOrig.get(n);   // вернуть русский оригинал
    trDone.delete(n); trText(n);
  }
  document.querySelectorAll("[data-o-placeholder],[data-o-aria-label],[data-o-title]").forEach(el => {
    for(const a of TR_ATTRS){ const o = el.getAttribute("data-o-" + a); if(o !== null){ el.setAttribute(a, o); el.removeAttribute("data-t-" + a); } }
  });
  document.querySelectorAll("[placeholder],[aria-label],[title]").forEach(trAttrs);
}

function setLang(l, chosen){
  if(!(l === "ru" || l in LANG_IDX)) l = "ru";
  LANG = l; S.settings.lang = l; if(chosen) S.settings.langChosen = true; save();
  document.documentElement.lang = l;
  trAll();
}

// первый вход из Telegram: язык берём из приложения игрока
(() => {
  buildTrRe();
  const TG = window.Telegram && window.Telegram.WebApp;
  const code = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && String(TG.initDataUnsafe.user.language_code || "").toLowerCase();
  let l = S.settings.lang || "ru";
  if(!S.settings.langChosen && code){
    const base = code.slice(0, 2);
    l = ["ru","be","kk"].includes(base) ? "ru" : base in LANG_IDX ? base : "en";
  }
  setLang(l, false);
})();
